<section id="campus-dental" x-data class="bg-section py-20 font-hacen lg:py-24">
    <div class="container">
        <div class="max-w-3xl">
            <p class="text-sm font-bold uppercase tracking-[0.35em] text-spu-red/70" x-text="$store.app.currentLang === 'ar' ? 'عيادات طب الأسنان' : 'Dental Clinics'"></p>
            <h1 class="mt-5 text-3xl font-bold leading-tight text-spu-blue md:text-4xl" x-text="$store.app.currentLang === 'ar' ? 'الخدمات وساعات العمل وعملية الحجز' : 'Services, clinic hours and booking process'"></h1>
        </div>

        <div class="mt-12 grid gap-8 lg:grid-cols-2">
            <article class="rounded-[30px] bg-white p-8 shadow-[0_20px_60px_rgba(20,30,70,0.08)]">
                <h2 class="text-2xl font-bold text-spu-blue" x-text="$store.app.currentLang === 'ar' ? 'الخدمات المتاحة' : 'Available Services'"></h2>
                <ul class="mt-6 space-y-3 text-[15px] leading-7 text-slate-600">
                    <template x-for="svc in [
                        { nameEn: 'General Dentistry & Check-ups', nameAr: 'طب الأسنان العام والفحوصات' },
                        { nameEn: 'Orthodontics & Alignment', nameAr: 'تقويم الأسنان والمحاذاة' },
                        { nameEn: 'Oral Surgery & Extractions', nameAr: 'جراحة الفم والخلع' },
                        { nameEn: 'Prosthodontics & Crowns', nameAr: 'التركيبات والتيجان' },
                        { nameEn: 'Pediatric Dentistry', nameAr: 'طب أسنان الأطفال' },
                        { nameEn: 'Preventive Care & Cleanings', nameAr: 'الرعاية الوقائية والتنظيف' },
                        { nameEn: 'Radiographic Imaging', nameAr: 'التصوير الشعاعي' }
                    ]" :key="svc.nameEn">
                        <li class="flex gap-3"><span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-spu-red"></span><span x-text="$store.app.currentLang === 'ar' ? svc.nameAr : svc.nameEn"></span></li>
                    </template>
                </ul>
            </article>

            <div class="grid gap-6">
                <article class="rounded-[30px] bg-spu-blue p-8 text-white shadow-[0_24px_70px_rgba(20,30,70,0.16)]">
                    <h2 class="text-2xl font-bold" x-text="$store.app.currentLang === 'ar' ? 'ساعات العيادة' : 'Clinic Hours'"></h2>
                    <div class="mt-6 space-y-4">
                        <div class="flex items-center justify-between rounded-[20px] border border-white/12 bg-white/8 px-5 py-4">
                            <span class="text-[15px] text-white/85" x-text="$store.app.currentLang === 'ar' ? 'الأحد — الخميس' : 'Sunday — Thursday'"></span>
                            <span class="text-[15px] font-bold text-white" x-text="$store.app.currentLang === 'ar' ? '٩ ص - ٥ م' : '9 AM – 5 PM'"></span>
                        </div>
                        <div class="flex items-center justify-between rounded-[20px] border border-white/12 bg-white/8 px-5 py-4">
                            <span class="text-[15px] text-white/85" x-text="$store.app.currentLang === 'ar' ? 'الجمعة والسبت' : 'Friday & Saturday'"></span>
                            <span class="text-[15px] font-bold text-white/60" x-text="$store.app.currentLang === 'ar' ? 'مغلق' : 'Closed'"></span>
                        </div>
                    </div>
                </article>

                <article class="rounded-[30px] bg-white p-8 shadow-[0_20px_60px_rgba(20,30,70,0.08)]">
                    <h2 class="text-2xl font-bold text-spu-blue" x-text="$store.app.currentLang === 'ar' ? 'الحجز' : 'Booking Process'"></h2>
                    <p class="mt-4 text-[15px] leading-7 text-slate-600" x-text="$store.app.currentLang === 'ar' ? 'احجز موعدك عبر البوابة الإلكترونية أو بالاتصال بعيادة الأسنان مباشرة. يُنصح بالحجز المسبق لتجنب الانتظار. أحضر بطاقتك الجامعية إن كنت طالباً.' : 'Book your appointment through the electronic portal or by calling the dental clinic directly. Advance booking is recommended to avoid wait times. Bring your student ID if applicable.'"></p>
                    <a href="#" class="mt-6 inline-flex items-center gap-3 rounded-full bg-spu-red px-8 py-4 text-sm font-bold uppercase tracking-[0.2em] text-white transition-transform duration-300 hover:-translate-y-1">
                        <span x-text="$store.app.currentLang === 'ar' ? 'احجز موعد أسنان' : 'Book Dental Visit'"></span>
                        <i class="fas fa-tooth text-xs"></i>
                    </a>
                </article>
            </div>
        </div>
    </div>
</section>
