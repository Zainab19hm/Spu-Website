<section id="campus-hospital" x-data class="bg-white py-20 font-hacen lg:py-24">
    <div class="container">
        <div class="max-w-3xl">
            <p class="text-sm font-bold uppercase tracking-[0.35em] text-spu-red/70" x-text="$store.app.currentLang === 'ar' ? 'المستشفى الجامعي' : 'University Hospital'"></p>
            <h1 class="mt-5 text-3xl font-bold leading-tight text-spu-blue md:text-4xl" x-text="$store.app.currentLang === 'ar' ? 'أقسام وخدمات وساعات العمل وحجز المواعيد' : 'Departments, medical services, working hours and appointments'"></h1>
        </div>

        <div class="mt-12 grid gap-8 lg:grid-cols-2">
            <article class="rounded-[30px] bg-spu-blue p-8 text-white shadow-[0_24px_70px_rgba(20,30,70,0.16)]">
                <h2 class="text-2xl font-bold" x-text="$store.app.currentLang === 'ar' ? 'الأقسام الطبية' : 'Departments'"></h2>
                <div class="mt-6 grid gap-4 sm:grid-cols-2">
                    <template x-for="dept in [
                        { nameEn: 'Internal Medicine', nameAr: 'الباطنية' },
                        { nameEn: 'Surgery', nameAr: 'الجراحة' },
                        { nameEn: 'Pediatrics', nameAr: 'طب الأطفال' },
                        { nameEn: 'OB/GYN', nameAr: 'التوليد والنسائية' },
                        { nameEn: 'Orthopedics', nameAr: 'العظمية' },
                        { nameEn: 'Emergency', nameAr: 'الطوارئ' },
                        { nameEn: 'Radiology', nameAr: 'الأشعة' },
                        { nameEn: 'Laboratory', nameAr: 'المخبر' }
                    ]" :key="dept.nameEn">
                        <div class="rounded-[18px] border border-white/12 bg-white/8 px-4 py-3 text-[15px] text-white/90" x-text="$store.app.currentLang === 'ar' ? dept.nameAr : dept.nameEn"></div>
                    </template>
                </div>
            </article>

            <div class="grid gap-6">
                <article class="rounded-[30px] bg-white p-8 shadow-[0_20px_60px_rgba(20,30,70,0.08)]">
                    <h2 class="text-2xl font-bold text-spu-blue" x-text="$store.app.currentLang === 'ar' ? 'ساعات العمل' : 'Working Hours'"></h2>
                    <div class="mt-6 space-y-4">
                        <div class="flex items-center justify-between rounded-[20px] bg-section px-5 py-4">
                            <span class="text-[15px] font-medium text-slate-700" x-text="$store.app.currentLang === 'ar' ? 'العيادات الخارجية' : 'Outpatient Clinics'"></span>
                            <span class="text-[15px] font-bold text-spu-blue" x-text="$store.app.currentLang === 'ar' ? '٨ ص - ٤ م' : '8 AM – 4 PM'"></span>
                        </div>
                        <div class="flex items-center justify-between rounded-[20px] bg-section px-5 py-4">
                            <span class="text-[15px] font-medium text-slate-700" x-text="$store.app.currentLang === 'ar' ? 'قسم الطوارئ' : 'Emergency'"></span>
                            <span class="text-[15px] font-bold text-spu-red" x-text="$store.app.currentLang === 'ar' ? '٢٤/٧' : '24/7'"></span>
                        </div>
                        <div class="flex items-center justify-between rounded-[20px] bg-section px-5 py-4">
                            <span class="text-[15px] font-medium text-slate-700" x-text="$store.app.currentLang === 'ar' ? 'المخبر والأشعة' : 'Lab & Radiology'"></span>
                            <span class="text-[15px] font-bold text-spu-blue" x-text="$store.app.currentLang === 'ar' ? '٨ ص - ٨ م' : '8 AM – 8 PM'"></span>
                        </div>
                    </div>
                </article>

                <article class="rounded-[30px] bg-white p-8 shadow-[0_20px_60px_rgba(20,30,70,0.08)]">
                    <h2 class="text-2xl font-bold text-spu-blue" x-text="$store.app.currentLang === 'ar' ? 'حجز موعد' : 'Book an Appointment'"></h2>
                    <p class="mt-4 text-[15px] leading-7 text-slate-600" x-text="$store.app.currentLang === 'ar' ? 'يمكن حجز المواعيد عبر البوابة الإلكترونية أو الاتصال المباشر بالاستقبال. على الطلاب إحضار بطاقتهم الجامعية ووثيقة التأمين الصحي عند الزيارة.' : 'Appointments can be booked via the electronic portal or by calling reception directly. Students should bring their ID card and health insurance document at each visit.'"></p>
                    <a href="#" class="mt-6 inline-flex items-center gap-3 rounded-full bg-spu-red px-8 py-4 text-sm font-bold uppercase tracking-[0.2em] text-white transition-transform duration-300 hover:-translate-y-1">
                        <span x-text="$store.app.currentLang === 'ar' ? 'احجز موعد' : 'Book Appointment'"></span>
                        <i class="fas fa-calendar-alt text-xs"></i>
                    </a>
                </article>
            </div>
        </div>
    </div>
</section>
