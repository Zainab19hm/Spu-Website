<!-- Admissions - Explore More navigation cards -->
<section id="admissions-navigation" class="relative rounded-md bg-section py-20 font-hacen lg:py-28"
         x-data="{
             activeSlide: 0,
             hasLink(card) {
                 return !!card?.slug;
             },
             get cards() {
                 return ($store.admissionsPage.resources.cards || []).filter((card) => !window.location.pathname.includes(card.slug));
             },
             get shouldSlide() {
                 return this.cards.length > 4;
             },
             get slides() {
                 const groups = [];
                 for (let index = 0; index < this.cards.length; index += 4) {
                     groups.push(this.cards.slice(index, index + 4));
                 }
                 return groups;
             },
             get maxSlide() {
                 return Math.max(this.slides.length - 1, 0);
             },
             nextSlide() {
                 this.activeSlide = this.activeSlide >= this.maxSlide ? 0 : this.activeSlide + 1;
             },
             previousSlide() {
                 this.activeSlide = this.activeSlide <= 0 ? this.maxSlide : this.activeSlide - 1;
             }
         }">
    <div class="container relative z-10">
        <div class="flex flex-col items-start gap-14 lg:flex-row lg:items-center lg:gap-20">

            <div class="w-full shrink-0 lg:w-[38%]">
                <h3 class="text-[26px] font-bold leading-tight text-spu-blue md:text-[32px]">
                    <template x-if="$store.app.currentLang === 'ar'">
                        <span>استكشف المزيد من <span class="text-spu-red">خيارات القبول</span></span>
                    </template>
                    <template x-if="$store.app.currentLang !== 'ar'">
                        <span>Explore More <span class="text-spu-red">Admissions</span> Options</span>
                    </template>
                </h3>

                <p class="mt-5 max-w-[480px] text-[16px] leading-8 text-slate-600"
                   x-text="$store.app.currentLang === 'ar'
                       ? 'تعرّف على الرسوم، المتطلبات، وكيفية التقديم للانضمام إلى أسرة الجامعة.'
                       : 'Learn about tuition, requirements, and how to apply to join the SPU family.'">
                </p>
            </div>

            <div class="w-full min-w-0 flex-1">
                <template x-if="!shouldSlide">
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <template x-for="(card, idx) in cards" :key="card.slug || card.titleEn">
                            <div>
                                <template x-if="hasLink(card)">
                                    <a :href="card.slug === 'transfer' ? '/admissions/transfer/' : `/admissions/${card.slug}.html`"
                                       class="group relative flex h-[118px] flex-col items-center justify-center overflow-hidden rounded-[2px] border border-slate-200/70 bg-white p-6 text-center transition-colors duration-300 hover:bg-spu-blue"
                                       :aria-label="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn">
                                        <h4 class="text-[17px] font-bold leading-tight transition-colors duration-300"
                                            x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn"></h4>
                                        <span class="mt-5 text-[8px] font-bold uppercase tracking-[0.22em] text-white opacity-0 transition-opacity duration-300 group-hover:opacity-100"
                                              x-text="$store.app.currentLang === 'ar' ? 'استكشف →' : 'Explore →'"></span>
                                    </a>
                                </template>
                                <template x-if="!hasLink(card)">
                                    <div class="relative flex h-[118px] items-center justify-center overflow-hidden rounded-[2px] border border-slate-200/70 bg-white p-6 text-center">
                                        <h4 class="text-[17px] font-bold leading-tight text-slate-950"
                                            x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn"></h4>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="shouldSlide">
                    <div>
                        <div class="overflow-hidden">
                            <div class="flex transition-transform duration-500 ease-out"
                                 :style="`transform: translateX(${$store.app.currentLang === 'ar' ? activeSlide * 100 : activeSlide * -100}%);`">
                                <template x-for="(slide, slideIndex) in slides" :key="slideIndex">
                                    <div class="grid w-full shrink-0 grid-cols-1 gap-4 sm:grid-cols-2">
                                        <template x-for="(card, itemIndex) in slide" :key="card.slug || card.titleEn">
                                            <div>
                                                <template x-if="hasLink(card)">
                                                    <a :href="card.slug === 'transfer' ? '/admissions/transfer/' : `/admissions/${card.slug}.html`"
                                                       class="group rounded-[6px] shadow shadow-md  relative flex h-[118px] flex-col items-center justify-center overflow-hidden  border border-slate-200/70 bg-white p-6 text-center transition-colors duration-300 hover:bg-spu-blue"
                                                       :aria-label="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn">
                                                        <h4 class="text-[17px] font-bold leading-tight transition-colors duration-300"
                                                            x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn"></h4>
                                                        <span class="mt-5 text-[8px] font-bold uppercase tracking-[0.22em] text-white opacity-0 transition-opacity duration-300 group-hover:opacity-100"
                                                              x-text="$store.app.currentLang === 'ar' ? 'استكشف →' : 'Explore →'"></span>
                                                    </a>
                                                </template>
                                                <template x-if="!hasLink(card)">
                                                    <div class="relative flex h-[118px] items-center justify-center overflow-hidden rounded-[2px] border border-slate-200/70 bg-white p-6 text-center">
                                                        <h4 class="text-[17px] font-bold leading-tight text-slate-950"
                                                            x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn"></h4>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="mt-6 flex items-center justify-between gap-4">
                            <div class="flex items-center gap-2">
                                <template x-for="(_, idx) in Array.from({ length: maxSlide + 1 })" :key="idx">
                                    <button type="button"
                                            class="h-1.5 rounded-full transition-all duration-300"
                                            :class="activeSlide === idx ? 'w-8 bg-spu-blue' : 'w-2 bg-spu-blue/20'"
                                            @click="activeSlide = idx"
                                            :aria-label="`Go to navigation card group ${idx + 1}`"></button>
                                </template>
                            </div>

                            <div class="flex items-center gap-3">
                                <button type="button"
                                        class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-white transition-colors hover:bg-slate-50"
                                        @click="previousSlide()"
                                        aria-label="Previous navigation card">
                                    <img src="/images/icon-chevron-left-outline.svg" alt="" class="h-3.5 w-3.5 rtl:rotate-180" aria-hidden="true">
                                </button>
                                <button type="button"
                                        class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-white transition-colors hover:bg-slate-50"
                                        @click="nextSlide()"
                                        aria-label="Next navigation card">
                                    <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-3.5 w-3.5 rtl:rotate-180" aria-hidden="true">
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

        </div>
    </div>
</section>
