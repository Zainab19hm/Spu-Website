<!-- Admissions — Explore More navigation cards -->
<section id="admissions-navigation" class="relative bg-section py-20 font-hacen lg:py-28" x-data>
    <div class="container relative z-10">
        <div class="flex flex-col items-start gap-14 lg:flex-row lg:items-center lg:gap-20">

            <!-- Left: title -->
            <div class="w-full shrink-0 lg:w-[38%]">
                <p class="text-sm font-bold uppercase tracking-[0.2em] text-spu-blue/40"
                   x-text="$store.app.currentLang === 'ar' ? 'القبول' : 'Admissions'"></p>

                <h3 class="mt-4 text-4xl font-bold leading-tight text-spu-blue lg:text-5xl">
                    <template x-if="$store.app.currentLang === 'ar'">
                        <span>استكشف المزيد من <span class="text-spu-red">خيارات القبول</span></span>
                    </template>
                    <template x-if="$store.app.currentLang !== 'ar'">
                        <span>Explore More <span class="text-spu-red">Admissions</span> Options</span>
                    </template>
                </h3>

                <p class="mt-4 max-w-[400px] text-base leading-relaxed text-slate-400"
                   x-text="$store.app.currentLang === 'ar'
                       ? 'تعرّف على الرسوم، المتطلبات، وكيفية التقديم للانضمام إلى أسرة الجامعة.'
                       : 'Learn about tuition, requirements, and how to apply to join the SPU family.'">
                </p>

                <div class="mt-6 h-[3px] w-16 rounded-full bg-spu-red/50"></div>
            </div>

            <!-- Right: 2-Row Horizontal Slider -->
            <div class="w-full flex-1 overflow-hidden" x-data="{ 
                scrollNext() { $refs.slider.scrollBy({ left: 300, behavior: 'smooth' }) },
                scrollPrev() { $refs.slider.scrollBy({ left: -300, behavior: 'smooth' }) }
            }">
                <div class="flex gap-4 overflow-x-auto pb-4 snap-x snap-mandatory no-scrollbar" 
                     x-ref="slider"
                     style="display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); grid-auto-flow: column; grid-auto-columns: calc(50% - 0.5rem);">
                    
                    <template x-for="(card, idx) in $store.admissionsPage.resources.cards.filter(c => !window.location.pathname.includes(c.slug))" :key="card.slug">
                        <a :href="`/admissions/${card.slug}.html`"
                           class="group relative flex flex-col justify-between overflow-hidden rounded-2xl bg-white p-7 shadow-[0_4px_24px_rgba(0,0,0,0.05)] transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_16px_48px_rgba(0,0,0,0.1)] snap-start h-full min-h-[220px]">

                            <!-- Top row: icon + arrow -->
                            <div class="flex items-start justify-between">
                                <!-- Icon circle -->
                                <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-spu-blue/5 transition-colors duration-300 group-hover:bg-spu-blue">
                                    <img :src="card.icon" alt="" class="h-5 w-5 transition duration-300 group-hover:brightness-0 group-hover:invert" aria-hidden="true">
                                </div>
                                <!-- Arrow -->
                                <div class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-50 text-slate-300 transition-all duration-300 group-hover:bg-spu-red group-hover:text-white">
                                    <img src="/images/icon-arrow-right-outline.svg" alt="" class="h-3 w-3" :class="$store.app.currentLang === 'ar' ? 'rotate-180' : ''" aria-hidden="true">
                                </div>
                            </div>

                            <!-- Title -->
                            <h4 class="mt-6 text-xl font-bold text-spu-blue"
                                x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn">
                            </h4>

                            <!-- Bottom accent line -->
                            <div class="mt-5 h-[2.5px] w-0 rounded-full bg-spu-red transition-all duration-500 group-hover:w-12"></div>
                        </a>
                    </template>
                </div>

                <!-- Navigation Arrows -->
                <div class="flex items-center gap-4 mt-6">
                    <button @click="scrollPrev()" 
                            class="flex h-12 w-12 items-center justify-center rounded-full border border-slate-200 text-spu-blue transition-all hover:bg-spu-blue hover:text-white disabled:opacity-30">
                        <img src="/images/icon-arrow-left-outline.svg" alt="" class="h-4 w-4" :class="$store.app.currentLang === 'ar' ? 'rotate-180' : ''" aria-hidden="true">
                    </button>
                    <button @click="scrollNext()" 
                            class="flex h-12 w-12 items-center justify-center rounded-full border border-slate-200 text-spu-blue transition-all hover:bg-spu-blue hover:text-white disabled:opacity-30">
                        <img src="/images/icon-arrow-right-outline.svg" alt="" class="h-4 w-4" :class="$store.app.currentLang === 'ar' ? 'rotate-180' : ''" aria-hidden="true">
                    </button>
                </div>
            </div>

        </div>
        <p class="mt-10 text-center text-xs font-bold uppercase tracking-[0.16em] text-spu-blue/45"
           x-text="$store.app.currentLang === 'ar' ? 'آخر مراجعة: أيار 2026' : 'Last reviewed: May 2026'"></p>
    </div>
</section>
