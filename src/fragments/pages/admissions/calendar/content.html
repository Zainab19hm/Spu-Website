<div class="admissions-design"
  x-data="{ page: $store.admissionsPage.calendarPage, get isAr() { return $store.app.currentLang === 'ar' } }">
  <section class="relative flex h-[370px] items-center justify-center overflow-hidden font-hacen lg:h-[400px]">
    <img :src="page.heroImage" :alt="$store.app.currentLang === 'ar' ? page.titleAr : page.titleEn" class="absolute inset-0 h-full w-full object-cover">
    <div class="absolute inset-0 bg-[linear-gradient(180deg,rgba(32,39,89,0.80)_0%,rgba(32,39,89,0.50)_50%,rgba(32,39,89,0)_100%)]"></div>
    <div class="container relative z-10 mx-auto px-6 text-center text-white">
      <nav class="mb-4 flex items-center justify-center gap-2 text-xs font-black text-white" aria-label="Breadcrumb">
        <a href="/" class="rounded bg-spu-blue/35 px-2 py-1 transition hover:bg-spu-blue/55" x-text="$store.app.currentLang === 'ar' ? page.breadcrumbHomeAr : page.breadcrumbHomeEn"></a>
        <span aria-hidden="true">›</span>
        <a href="/admissions.html" class="transition hover:text-white/80" x-text="$store.app.currentLang === 'ar' ? page.breadcrumbParentAr : page.breadcrumbParentEn"></a>
        <span aria-hidden="true">›</span>
        <span x-text="$store.app.currentLang === 'ar' ? page.breadcrumbCurrentAr : page.breadcrumbCurrentEn"></span>
      </nav>
      <h1 class="text-[32px] font-black leading-tight text-white md:text-[42px]" x-text="$store.app.currentLang === 'ar' ? page.titleAr : page.titleEn"></h1>
    </div>
  </section>

  <section class="admissions-calendar-page">
    <div class="admissions-shell">
      <div class="admissions-stat-cards" aria-label="Calendar highlights">
        <template x-for="card in page.statCards" :key="card.titleEn">
          <article class="admissions-stat-card">
            <h3 x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn"></h3>
            <span class="admissions-stat-card__icon" aria-hidden="true">
              <template x-if="card.icon === 'calendar'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2.1">
                  <path d="M5 4h14v17H5z"></path>
                  <path d="M8 2v4"></path>
                  <path d="M16 2v4"></path>
                  <path d="M5 9h14"></path>
                  <path d="M8 13h3v3H8z" fill="currentColor" stroke="none"></path>
                </svg></template>
              <template x-if="card.icon === 'download'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2.1">
                  <path d="M12 3v12"></path>
                  <path d="m7 10 5 5 5-5"></path>
                  <path d="M5 20h14"></path>
                </svg></template>
              <template x-if="card.icon === 'key'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2.1">
                  <path d="M5 4h14v17H5z"></path>
                  <path d="M8 2v4"></path>
                  <path d="M16 2v4"></path>
                  <path d="M5 9h14"></path>
                  <path d="m8 15 2 2 5-5"></path>
                </svg></template>
            </span>
            <p x-text="$store.app.currentLang === 'ar' ? card.descAr : card.descEn"></p>
          </article>
        </template>
      </div>

      <section class="admissions-deadlines" aria-labelledby="essential-deadlines-title">
        <h2 id="essential-deadlines-title" class="admissions-page-title"
          x-text="$store.app.currentLang === 'ar' ? 'المواعيد الأساسية' : 'Essential Deadlines'"></h2>
        <div class="admissions-deadline-grid">
          <template x-for="deadline in page.deadlines" :key="deadline.titleEn">
            <article class="admissions-deadline-card">
              <span class="admissions-deadline-card__type"
                x-text="$store.app.currentLang === 'ar' ? deadline.typeAr : deadline.typeEn"></span>
              <h3 x-text="$store.app.currentLang === 'ar' ? deadline.titleAr : deadline.titleEn"></h3>
              <p x-text="$store.app.currentLang === 'ar' ? deadline.dateAr : deadline.dateEn"></p>
            </article>
          </template>
        </div>
      </section>

      <section aria-labelledby="detailed-timeline-title">
        <h2 id="detailed-timeline-title" class="admissions-page-title"
          x-text="$store.app.currentLang === 'ar' ? 'الجدول الأكاديمي التفصيلي' : 'Detailed Academic Timeline'"></h2>
        <div class="admissions-calendar-timeline-card">
          <template x-for="semester in page.semesters" :key="semester.titleEn">
            <section class="admissions-semester">
              <h3 x-text="$store.app.currentLang === 'ar' ? semester.titleAr : semester.titleEn"></h3>
              <div class="admissions-event-list">
                <template x-for="event in semester.events" :key="event.titleEn + event.dateEn">
                  <article class="admissions-event-row">
                    <div class="admissions-event-date"
                      x-text="$store.app.currentLang === 'ar' ? event.dateAr : event.dateEn"></div>
                    <div>
                      <h4 x-text="$store.app.currentLang === 'ar' ? event.titleAr : event.titleEn"></h4>
                      <p x-text="$store.app.currentLang === 'ar' ? event.descAr : event.descEn"></p>
                    </div>
                  </article>
                </template>
              </div>
            </section>
          </template>
        </div>
      </section>

      <article class="admissions-download-card">
        <span class="admissions-download-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M6 2h9l5 5v20H6z"></path>
            <path d="M15 2v6h5"></path>
            <rect x="8" y="12" width="9" height="7" rx="1"></rect>
            <path d="M10 14h2.5a1.5 1.5 0 0 1 0 3H10v-3Z"></path>
          </svg></span>
        <div>
          <h3 x-text="$store.app.currentLang === 'ar' ? 'تحميل التقويم الرسمي' : 'Download Official Calendar'"></h3>
          <p
            x-text="$store.app.currentLang === 'ar' ? 'احصل على تقويم 2026-2027 الأكاديمي كاملاً بصيغة PDF. (PDF، 2.4 MB)' : 'Get the complete 2026-2027 Academic Calendar in PDF format. (PDF, 2.4 MB)'">
          </p>
        </div>
        <a class="admissions-download-button" href="#" download>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 3v12"></path>
            <path d="m7 10 5 5 5-5"></path>
            <path d="M5 20h14"></path>
          </svg>
          <span x-text="$store.app.currentLang === 'ar' ? 'تحميل PDF' : 'Download PDF'"></span>
        </a>
      </article>

      <article class="admissions-notice-card">
        <span class="admissions-notice-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8h.01"></path>
            <path d="M11 12h1v5h1"></path>
          </svg></span>
        <div>
          <h3 x-text="$store.app.currentLang === 'ar' ? 'تنبيه رسمي' : 'Official Notice'"></h3>
          <p
            x-text="$store.app.currentLang === 'ar' ? 'التواريخ في هذا التقويم الأكاديمي قابلة للتغيير. تحتفظ الجامعة بحق تعديل التقويم عند الضرورة، وسيتم إبلاغ أي تغييرات عبر البريد الجامعي ونشرها على الموقع الرسمي.' : 'Dates in this academic calendar are subject to change. The University reserves the right to modify the calendar as necessary. Official announcements regarding any changes will be communicated via university email and posted on the official website.'">
          </p>
        </div>
      </article>
    </div>
  </section>
</div>
