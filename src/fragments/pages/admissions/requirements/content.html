<div class="font-hacen" :dir="$store.app.currentLang === 'ar' ? 'rtl' : 'ltr'"
    x-data="{
        page: $store.admissionsPage.requirementsPage,
        activeTab: 'new',
        get isAr() { return $store.app.currentLang === 'ar' },
        get active() {
            return this.page.tabs.find((tab) => tab.id === this.activeTab) || this.page.tabs[0];
        },
        text(item, key) {
            return this.isAr ? item[key + 'Ar'] : item[key + 'En'];
        }
    }">
    <section class="bg-white">
        <div class="relative flex h-[370px] items-center justify-center overflow-hidden lg:h-[400px]">
            <img :src="page.heroImage" :alt="text(page, 'title')" class="absolute inset-0 h-full w-full object-cover">
            <div class="absolute inset-0 bg-[linear-gradient(180deg,rgba(32,39,89,0.80)_0%,rgba(32,39,89,0.50)_50%,rgba(32,39,89,0)_100%)]"></div>

            <div class="container relative z-10 mx-auto px-6 text-center text-white">
                <nav class="mb-4 flex items-center justify-center gap-2 text-xs font-black text-white" aria-label="Breadcrumb">
                    <a href="/" class="rounded bg-spu-blue/35 px-2 py-1 transition hover:bg-spu-blue/55"
                        x-text="text(page, 'breadcrumbHome')"></a>
                    <span aria-hidden="true" class="text-white/75">&gt;</span>
                    <a href="/admissions.html" class="transition hover:text-white/80"
                        x-text="text(page, 'breadcrumbParent')"></a>
                    <span aria-hidden="true" class="text-white/75">&gt;</span>
                    <span x-text="text(page, 'breadcrumbCurrent')"></span>
                </nav>

                <h1 class="text-[32px] font-black leading-tight text-white md:text-[42px]" x-text="text(page, 'title')"></h1>

                <div class="mt-7 flex flex-wrap items-center justify-center gap-3">
                    <a :href="page.applyUrl"
                        class="inline-flex h-10 min-w-[136px] items-center justify-center rounded-md bg-spu-red px-8 text-xs font-black uppercase tracking-wide text-white transition hover:bg-spu-blue"
                        x-text="text(page, 'applyLabel')"></a>
                    <a :href="page.requestInfoUrl"
                        class="inline-flex h-10 min-w-[136px] items-center justify-center rounded-md border border-white bg-white/5 px-8 text-xs font-black text-white transition hover:bg-white hover:text-spu-blue"
                        x-text="text(page, 'requestInfoLabel')"></a>
                </div>
            </div>
        </div>
    </section>

    <section class="bg-white pb-28 pt-11">
        <div class="container mx-auto px-6">
            <div class="mx-auto flex max-w-[760px] items-center justify-center border-b border-slate-200 text-center text-xs font-black tracking-wide text-slate-700">
                <template x-for="tab in page.tabs" :key="tab.id">
                    <button type="button" class="px-7 pb-4 transition hover:text-spu-red"
                        :class="activeTab === tab.id ? 'border-b-2 border-spu-red text-spu-red' : 'border-b-2 border-transparent'"
                        :aria-selected="activeTab === tab.id"
                        @click="activeTab = tab.id"
                        x-text="text(tab, 'label')"></button>
                </template>
            </div>

            <div class="mx-auto mt-8 max-w-[1010px] space-y-16">
                <section class="border-s-2 border-spu-red ps-8 md:ps-10">
                    <div class="mb-8 flex items-center gap-3">
                        <span class="inline-flex h-6 w-6 items-center justify-center text-spu-red" aria-hidden="true">
                            <svg viewBox="0 0 24 24" class="h-6 w-6 fill-current">
                                <path d="M12 2.5 14.3 5l3.4-.4 1.1 3.2 3 1.7-1.6 3 1.6 3-3 1.7-1.1 3.2-3.4-.4-2.3 2.5L9.7 20l-3.4.4-1.1-3.2-3-1.7 1.6-3-1.6-3 3-1.7 1.1-3.2 3.4.4L12 2.5Zm-1.1 12.9 5.2-5.2-1.4-1.4-3.8 3.8-1.6-1.6-1.4 1.4 3 3Z" />
                            </svg>
                        </span>
                        <h2 class="text-2xl font-black text-spu-blue md:text-[28px]" x-text="text(page, 'eligibilityTitle')"></h2>
                    </div>

                    <div class="space-y-7">
                        <template x-for="criterion in active.criteria" :key="criterion.titleEn">
                            <div class="flex gap-4">
                                <span class="mt-1 inline-flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2 border-spu-blue" aria-hidden="true">
                                    <svg viewBox="0 0 20 20" class="h-3 w-3 fill-none stroke-spu-blue stroke-[2.5]">
                                        <path d="m5 10 3 3 7-7" />
                                    </svg>
                                </span>
                                <div>
                                    <h3 class="text-base font-black text-slate-900" x-text="text(criterion, 'title')"></h3>
                                    <p class="mt-1 max-w-[650px] text-sm font-bold leading-6 text-slate-700" x-text="text(criterion, 'desc')"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                </section>

                <section class="border-s-2 border-slate-300 ps-8 md:ps-10">
                    <div class="mb-7 flex items-center gap-3">
                        <span class="inline-flex h-6 w-6 items-center justify-center text-spu-blue" aria-hidden="true">
                            <svg viewBox="0 0 24 24" class="h-6 w-6 fill-none stroke-current stroke-[1.8]">
                                <path d="M3 7.5h6l2 2h10v8.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5Z" />
                                <path d="M3 7.5V6a2 2 0 0 1 2-2h5l2 2h4" />
                            </svg>
                        </span>
                        <h2 class="text-2xl font-black text-spu-blue md:text-[28px]" x-text="text(page, 'documentsTitle')"></h2>
                    </div>

                    <div class="overflow-hidden rounded-lg border border-slate-200 bg-white">
                        <template x-for="(documentItem, index) in active.documents" :key="documentItem.nameEn">
                            <div class="flex items-center justify-between gap-4 px-4 py-4 text-sm text-black md:px-5"
                                :class="index < active.documents.length - 1 ? 'border-b border-slate-200' : ''">
                                <span x-text="text(documentItem, 'name')"></span>
                                <span class="rounded px-2 py-1 text-[10px] font-black"
                                    :class="documentItem.required ? 'bg-red-50 text-spu-red' : 'bg-slate-100 text-slate-700'"
                                    x-text="documentItem.required ? text(page, 'requiredLabel') : text(page, 'optionalLabel')"></span>
                            </div>
                        </template>
                    </div>
                </section>

                <section class="border-s-2 border-spu-red ps-8 md:ps-10">
                    <div class="rounded-lg border border-slate-200 bg-white px-5 py-5 md:px-6">
                        <h2 class="border-b border-slate-200 pb-3 text-2xl font-black text-spu-blue md:text-[28px]" x-text="text(page, 'readyTitle')"></h2>
                        <div class="mt-4 space-y-4 text-sm text-black">
                            <template x-for="item in active.checklist" :key="item.en">
                                <label class="flex items-center gap-3">
                                    <input type="checkbox" class="h-4 w-4 rounded border-slate-400 text-spu-red focus:ring-spu-red">
                                    <span x-text="isAr ? item.ar : item.en"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                </section>

                <section class="border-s-2 border-slate-300 ps-8 md:ps-10">
                    <div class="flex gap-5">
                        <span class="mt-1 inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-spu-red text-sm font-black text-white" aria-hidden="true">i</span>
                        <div>
                            <h2 class="mb-3 text-2xl font-black text-spu-blue md:text-[28px]" x-text="text(page, 'notesTitle')"></h2>
                            <p class="max-w-[900px] text-sm leading-6 text-black" x-text="isAr ? active.noteAr : active.noteEn"></p>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </section>
</div>
