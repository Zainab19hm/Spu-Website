<section id="admissions-how-to-apply" x-data class="bg-white py-20 font-hacen lg:py-24">
    <div class="container">
        <div class="max-w-3xl">
            <p class="text-sm font-bold uppercase tracking-[0.35em] text-spu-red/70"
                x-text="$store.app.currentLang === 'ar' ? 'كيف تتقدم' : 'How to Apply'"></p>
            <h1 class="mt-5 text-3xl font-bold leading-tight text-spu-blue md:text-4xl"
                x-text="$store.app.currentLang === 'ar' ? 'خطوات التقديم والمواعيد والوثائق المطلوبة' : 'Application Steps, Deadlines and Required Documents'">
            </h1>
        </div>

        <div class="mt-12 grid gap-6 lg:grid-cols-4">
            <template x-for="(step, idx) in [
                { num: '01', titleEn: 'Check Requirements', titleAr: 'راجع المتطلبات', summaryEn: 'Review the admission requirements for your chosen faculty and prepare all necessary documents before starting.', summaryAr: 'راجع متطلبات القبول للكلية المختارة وجهّز جميع الوثائق اللازمة قبل البدء.' },
                { num: '02', titleEn: 'Submit Application', titleAr: 'قدّم الطلب', summaryEn: 'Complete the online application form or visit the admissions office in person with all documents.', summaryAr: 'أكمل استمارة التقديم عبر الإنترنت أو توجّه إلى مكتب القبول شخصياً بجميع الوثائق.' },
                { num: '03', titleEn: 'Entrance Exam', titleAr: 'اختبار القبول', summaryEn: 'Some faculties require entrance exams. Check the schedule and appear on the designated date.', summaryAr: 'تتطلب بعض الكليات اختبارات قبول. راجع الجدول واحضر في الموعد المحدد.' },
                { num: '04', titleEn: 'Confirm Enrollment', titleAr: 'أكّد التسجيل', summaryEn: 'Upon acceptance, pay tuition fees and submit remaining documents to confirm your place.', summaryAr: 'عند القبول، ادفع الرسوم وقدّم الوثائق المتبقية لتثبيت مقعدك.' }
            ]" :key="step.num">
                <article
                    class="rounded-[28px] border border-slate-200/80 bg-white p-7 shadow-[0_20px_55px_rgba(20,30,70,0.07)]">
                    <span
                        class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-spu-blue text-sm font-bold tracking-[0.2em] text-white"
                        x-text="step.num"></span>
                    <h2 class="mt-5 text-xl font-bold text-spu-blue"
                        x-text="$store.app.currentLang === 'ar' ? step.titleAr : step.titleEn"></h2>
                    <p class="mt-4 text-[15px] leading-7 text-slate-600"
                        x-text="$store.app.currentLang === 'ar' ? step.summaryAr : step.summaryEn"></p>
                </article>
            </template>
        </div>

        <div class="mt-12 grid gap-8 lg:grid-cols-2">
            <article class="rounded-[30px] bg-spu-blue p-8 text-white shadow-[0_24px_70px_rgba(20,30,70,0.16)]">
                <h2 class="text-2xl font-bold"
                    x-text="$store.app.currentLang === 'ar' ? 'الوثائق المطلوبة' : 'Required Documents'"></h2>
                <ul class="mt-6 space-y-3 text-[15px] leading-7 text-white/85">
                    <li class="flex gap-3"><span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-spu-red"></span><span
                            x-text="$store.app.currentLang === 'ar' ? 'شهادة الثانوية العامة (أصل + نسخة)' : 'Secondary school certificate (original + copy)'"></span>
                    </li>
                    <li class="flex gap-3"><span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-spu-red"></span><span
                            x-text="$store.app.currentLang === 'ar' ? 'هوية شخصية أو جواز سفر' : 'National ID or passport'"></span>
                    </li>
                    <li class="flex gap-3"><span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-spu-red"></span><span
                            x-text="$store.app.currentLang === 'ar' ? 'شهادة ميلاد' : 'Birth certificate'"></span></li>
                    <li class="flex gap-3"><span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-spu-red"></span><span
                            x-text="$store.app.currentLang === 'ar' ? 'صور شخصية (6)' : 'Passport photos (6)'"></span>
                    </li>
                    <li class="flex gap-3"><span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-spu-red"></span><span
                            x-text="$store.app.currentLang === 'ar' ? 'وثيقة التسجيل العسكري (للذكور)' : 'Military service document (for males)'"></span>
                    </li>
                    <li class="flex gap-3"><span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-spu-red"></span><span
                            x-text="$store.app.currentLang === 'ar' ? 'شهادة حسن السيرة والسلوك' : 'Good conduct certificate'"></span>
                    </li>
                </ul>
            </article>

            <article class="rounded-[30px] bg-white p-8 shadow-[0_20px_60px_rgba(20,30,70,0.08)]">
                <h2 class="text-2xl font-bold text-spu-blue"
                    x-text="$store.app.currentLang === 'ar' ? 'المواعيد النهائية' : 'Deadlines'"></h2>
                <div class="mt-6 space-y-4">
                    <div class="flex items-center justify-between rounded-[20px] bg-section px-5 py-4">
                        <span class="text-[15px] font-medium text-slate-700"
                            x-text="$store.app.currentLang === 'ar' ? 'فتح باب التسجيل' : 'Application opens'"></span>
                        <span class="text-[15px] font-bold text-spu-blue"
                            x-text="$store.app.currentLang === 'ar' ? 'أيلول ٢٠٢٦' : 'September 2026'"></span>
                    </div>
                    <div class="flex items-center justify-between rounded-[20px] bg-section px-5 py-4">
                        <span class="text-[15px] font-medium text-slate-700"
                            x-text="$store.app.currentLang === 'ar' ? 'آخر أجل للتقديم' : 'Application deadline'"></span>
                        <span class="text-[15px] font-bold text-spu-red"
                            x-text="$store.app.currentLang === 'ar' ? 'تشرين الأول ٢٠٢٦' : 'October 2026'"></span>
                    </div>
                    <div class="flex items-center justify-between rounded-[20px] bg-section px-5 py-4">
                        <span class="text-[15px] font-medium text-slate-700"
                            x-text="$store.app.currentLang === 'ar' ? 'إعلان نتائج القبول' : 'Results announced'"></span>
                        <span class="text-[15px] font-bold text-spu-blue"
                            x-text="$store.app.currentLang === 'ar' ? 'تشرين الثاني ٢٠٢٦' : 'November 2026'"></span>
                    </div>
                    <div class="flex items-center justify-between rounded-[20px] bg-section px-5 py-4">
                        <span class="text-[15px] font-medium text-slate-700"
                            x-text="$store.app.currentLang === 'ar' ? 'بداية الدراسة' : 'Classes begin'"></span>
                        <span class="text-[15px] font-bold text-spu-blue"
                            x-text="$store.app.currentLang === 'ar' ? 'كانون الأول ٢٠٢٦' : 'December 2026'"></span>
                    </div>
                </div>
                <a href="/admissions/how-to-apply"
                    class="mt-8 inline-flex items-center gap-3 rounded-full bg-spu-red px-8 py-4 text-sm font-bold uppercase tracking-[0.2em] text-white transition-transform duration-300 hover:-translate-y-1">
                    <span x-text="$store.app.currentLang === 'ar' ? 'قدّم الآن' : 'Apply Now'"></span>
                    <i class="fas fa-arrow-right text-xs"></i>
                </a>
            </article>
        </div>
    </div>
</section>
