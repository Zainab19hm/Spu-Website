<div class="admissions-design" x-data="{ page: $store.admissionsPage.howToApplyPage, get isAr() { return $store.app.currentLang === 'ar' } }">
  <section class="relative flex h-[370px] items-center justify-center overflow-hidden font-hacen lg:h-[380px]">
    <img :src="page.heroImage" :alt="$store.app.currentLang === 'ar' ? page.titleAr : page.titleEn" class="absolute inset-0 h-full w-full object-cover">
    <div class="absolute inset-0 bg-[linear-gradient(180deg,rgba(32,39,89,0.80)_0%,rgba(32,39,89,0.50)_50%,rgba(32,39,89,0)_100%)]"></div>
    <div class="container relative z-10 mx-auto px-6 text-center text-white">
      <nav class="mb-4 flex items-center justify-center gap-2 text-xs font-black text-white" aria-label="Breadcrumb">
        <a href="/" class="rounded bg-spu-blue/35 px-2 py-1 transition hover:bg-spu-blue/55" x-text="$store.app.currentLang === 'ar' ? page.breadcrumbHomeAr : page.breadcrumbHomeEn"></a>
        <span aria-hidden="true">›</span>
        <a href="/admissions.html" class="transition hover:text-white/80" x-text="$store.app.currentLang === 'ar' ? page.breadcrumbParentAr : page.breadcrumbParentEn"></a>
        <span aria-hidden="true">›</span>
        <span x-text="$store.app.currentLang === 'ar' ? page.breadcrumbCurrentAr : page.breadcrumbCurrentEn"></span>
      </nav>
      <h1 class="text-[32px] font-black leading-tight text-white md:text-[42px]" x-text="$store.app.currentLang === 'ar' ? page.titleAr : page.titleEn"></h1>
    </div>
  </section>

  <section class="bg-white pb-4 pt-12">
    <div class="container mx-auto px-6">
      <div class="mx-auto max-w-3xl text-center">
        <h2 class="mb-4 text-[28px] font-black text-spu-blue md:text-[34px]" x-text="isAr ? page.heroTitleAr : page.heroTitleEn"></h2>
        <p class="text-base leading-relaxed text-slate-600 md:text-lg" x-text="isAr ? page.heroDescAr : page.heroDescEn"></p>
      </div>
    </div>
  </section>

  <section class="admissions-shell admissions-feature-cards" aria-label="Admissions journey highlights">
    <template x-for="card in page.featureCards" :key="card.titleEn">
      <article class="admissions-feature-card">
        <div>
          <h3 x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn"></h3>
        </div>
        <span class="admissions-feature-card__icon" aria-hidden="true">
          <template x-if="card.icon === 'steps'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M6 5v14"></path><path d="M18 5v14"></path><circle cx="6" cy="7" r="2"></circle><circle cx="18" cy="17" r="2"></circle><path d="M10 7h4"></path><path d="M10 17h4"></path></svg></template>
          <template x-if="card.icon === 'document'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v6h5"></path><path d="M10 13h6"></path><path d="M10 17h6"></path></svg></template>
          <template x-if="card.icon === 'apply'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M5 13a7 7 0 0 1 14 0"></path><path d="M3 13h4v5H5a2 2 0 0 1-2-2z"></path><path d="M21 13h-4v5h2a2 2 0 0 0 2-2z"></path><path d="M12 6v4"></path></svg></template>
        </span>
        <p x-text="$store.app.currentLang === 'ar' ? card.descAr : card.descEn"></p>
      </article>
    </template>
  </section>

  <section class="admissions-shell admissions-journey" aria-labelledby="step-by-step-title">
    <h2 id="step-by-step-title" class="admissions-page-title" x-text="isAr ? 'دليل خطوة بخطوة' : 'Step-by-Step Guide'"></h2>
    <div class="admissions-timeline">
      <template x-for="(step, idx) in page.steps" :key="step.number">
        <article class="admissions-timeline-step" :class="[`admissions-timeline-step--${idx + 1}`, idx === page.steps.length - 1 ? 'admissions-timeline-step--final' : '']">
          <span class="admissions-timeline-marker" x-text="step.number"></span>
          <div class="admissions-step-card">
            <h3 x-text="$store.app.currentLang === 'ar' ? step.titleAr : step.titleEn"></h3>
            <p x-text="$store.app.currentLang === 'ar' ? step.descAr : step.descEn"></p>
            <a class="admissions-step-card__button" :href="step.href" x-text="$store.app.currentLang === 'ar' ? step.ctaAr : step.ctaEn"></a>
          </div>
        </article>
      </template>
    </div>
  </section>
</div>
