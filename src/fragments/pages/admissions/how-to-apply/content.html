<div class="admissions-design" x-data="{
  featureCards: [
    { titleEn: 'Clear Steps', titleAr: 'خطوات واضحة', descEn: 'A straightforward, numbered process from application to enrollment.', descAr: 'عملية مرقمة وواضحة من التقديم حتى التسجيل.', icon: 'steps' },
    { titleEn: 'Required Documents', titleAr: 'الوثائق المطلوبة', descEn: 'Prepare your portfolio with our comprehensive checklist.', descAr: 'حضّر ملفك اعتماداً على قائمة الوثائق الشاملة.', icon: 'document' },
    { titleEn: 'Apply at Every Stage', titleAr: 'التقديم في كل مرحلة', descEn: 'Access the application portal immediately from any step in the journey.', descAr: 'ادخل إلى بوابة التقديم مباشرةً من أي خطوة في الرحلة.', icon: 'apply' }
  ],
  steps: [
    { number: '01', titleEn: 'Choose Faculty', titleAr: 'اختر الكلية', descEn: 'Explore our diverse range of faculties and programs to find the perfect fit for your career aspirations.', descAr: 'استكشف كلياتنا وبرامجنا المتنوعة لتجد الخيار الأنسب لطموحاتك المهنية.', ctaEn: 'Explore Programs', ctaAr: 'استكشف البرامج', href: '/facilities/' },
    { number: '02', titleEn: 'Review Requirements', titleAr: 'راجع المتطلبات', descEn: 'Ensure you meet the academic criteria and understand the specific prerequisites for your chosen degree program.', descAr: 'تأكد من استيفاء المعايير الأكاديمية وفهم المتطلبات الخاصة بالبرنامج الذي اخترته.', ctaEn: 'View Requirements', ctaAr: 'عرض المتطلبات', href: '/admissions/requirements/' },
    { number: '03', titleEn: 'Prepare Documents', titleAr: 'حضّر الوثائق', descEn: 'Gather necessary paperwork, including identification, transcripts, and certificates, to streamline your application.', descAr: 'اجمع الأوراق اللازمة، بما في ذلك الهوية وكشوف العلامات والشهادات، لتسهيل طلبك.', ctaEn: 'Checklist Below', ctaAr: 'قائمة الوثائق', href: '/admissions/documents/' },
    { number: '04', titleEn: 'Submit Application', titleAr: 'قدّم الطلب', descEn: 'Complete the online form and upload your prepared documents through our secure portal.', descAr: 'أكمل النموذج الإلكتروني وارفع وثائقك المحضّرة عبر بوابتنا الآمنة.', ctaEn: 'Apply Now', ctaAr: 'قدّم الآن', href: '/admissions/how-to-apply/' }
  ]
}">
  <section class="admissions-hero-banner">
    <div class="admissions-hero-banner__content">
      <nav class="admissions-breadcrumb" aria-label="Breadcrumb">
        <a href="/" x-text="$store.app.currentLang === 'ar' ? 'الرئيسية' : 'Home'"></a>
        <span class="admissions-breadcrumb__separator">›</span>
        <a href="/admissions/" x-text="$store.app.currentLang === 'ar' ? 'القبول' : 'Admission'"></a>
        <span class="admissions-breadcrumb__separator">›</span>
        <span x-text="$store.app.currentLang === 'ar' ? 'كيفية التقديم' : 'How to Apply'"></span>
      </nav>
    </div>
  </section>

  <section class="admissions-overlap-intro" aria-labelledby="admissions-journey-title">
    <h1 id="admissions-journey-title" x-text="$store.app.currentLang === 'ar' ? 'رحلة القبول' : 'Admissions Journey'"></h1>
    <p x-text="$store.app.currentLang === 'ar' ? 'تم تصميم طريقك للانضمام إلى الجامعة السورية الخاصة ليكون واضحاً وداعماً. نضمن عدم وجود طرق مسدودة، وفريق القبول لدينا هنا لإرشادك في كل خطوة نحو مستقبلك الأكاديمي.' : 'Your path to joining Syrian Private University is designed to be clear and supportive. We ensure no dead ends—our admissions team is here to guide you at every step toward your academic future.'"></p>
  </section>

  <section class="admissions-shell admissions-feature-cards" aria-label="Admissions journey highlights">
    <template x-for="card in featureCards" :key="card.titleEn">
      <article class="admissions-feature-card">
        <div>
          <h3 x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn"></h3>
        </div>
        <span class="admissions-feature-card__icon" aria-hidden="true">
          <template x-if="card.icon === 'steps'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M6 5v14"></path><path d="M18 5v14"></path><circle cx="6" cy="7" r="2"></circle><circle cx="18" cy="17" r="2"></circle><path d="M10 7h4"></path><path d="M10 17h4"></path></svg></template>
          <template x-if="card.icon === 'document'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v6h5"></path><path d="M10 13h6"></path><path d="M10 17h6"></path></svg></template>
          <template x-if="card.icon === 'apply'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M5 13a7 7 0 0 1 14 0"></path><path d="M3 13h4v5H5a2 2 0 0 1-2-2z"></path><path d="M21 13h-4v5h2a2 2 0 0 0 2-2z"></path><path d="M12 6v4"></path></svg></template>
        </span>
        <p x-text="$store.app.currentLang === 'ar' ? card.descAr : card.descEn"></p>
      </article>
    </template>
  </section>

  <section class="admissions-shell admissions-journey" aria-labelledby="step-by-step-title">
    <h2 id="step-by-step-title" class="admissions-page-title" x-text="$store.app.currentLang === 'ar' ? 'دليل خطوة بخطوة' : 'Step-by-Step Guide'"></h2>
    <div class="admissions-timeline">
      <template x-for="(step, idx) in steps" :key="step.number">
        <article class="admissions-timeline-step" :class="[`admissions-timeline-step--${idx + 1}`, idx === steps.length - 1 ? 'admissions-timeline-step--final' : '']">
          <span class="admissions-timeline-marker" x-text="step.number"></span>
          <div class="admissions-step-card">
            <h3 x-text="$store.app.currentLang === 'ar' ? step.titleAr : step.titleEn"></h3>
            <p x-text="$store.app.currentLang === 'ar' ? step.descAr : step.descEn"></p>
            <a class="admissions-step-card__button" :href="step.href" x-text="$store.app.currentLang === 'ar' ? step.ctaAr : step.ctaEn"></a>
          </div>
        </article>
      </template>
    </div>
  </section>
</div>
