<div class="font-hacen bg-slate-50 min-h-screen pb-24" x-data="{
        activeType: 'transfer',
        page: $store.admissionsPage.transferPage,
        get isAr() { return $store.app.currentLang === 'ar' },
        get activeData() { return this.page.types[this.activeType] },
        text(item, key) {
          const suffix = this.isAr ? 'Ar' : 'En';
          return item[`${key}${suffix}`] || item[`${key}En`] || '';
        }
      }">

  <section
    class="relative flex min-h-[360px] md:min-h-[460px] items-center justify-center overflow-hidden pt-28 pb-12 text-white">
    <div class="absolute inset-0">
      <img :src="page.image" alt="Syrian Private University Admissions" class="h-full w-full object-cover">
      <div class="absolute inset-0 bg-[#1e2652]/80"></div>
      <div class="absolute inset-x-0 bottom-0 h-32 bg-gradient-to-t from-slate-50 to-transparent"></div>
    </div>

    <div class="container relative z-10 text-center px-4 -mt-10">
      <nav class="mb-6 flex items-center justify-center gap-2 text-[13px] font-bold text-white/80"
        aria-label="Breadcrumb">
        <a href="/" class="transition hover:text-white" x-text="isAr ? 'الرئيسية' : 'Home'"></a>
        <img src="/images/icon-chevron-right-outline.svg" alt=""
          class="h-2.5 w-2.5 brightness-0 invert opacity-80 rtl:rotate-180" aria-hidden="true">
        <a href="/admissions/" class="transition hover:text-white" x-text="isAr ? 'القبول والتسجيل' : 'Admissions'"></a>
        <img src="/images/icon-chevron-right-outline.svg" alt=""
          class="h-2.5 w-2.5 brightness-0 invert opacity-80 rtl:rotate-180" aria-hidden="true">
        <span class="text-white" x-text="text(page, 'title')"></span>
      </nav>

      <h1 class="text-4xl md:text-5xl lg:text-6xl font-black leading-tight text-white mb-8 drop-shadow-lg"
        x-text="text(page, 'title')"></h1>

      <div class="flex flex-wrap items-center justify-center gap-4">
        <a href="/admissions/how-to-apply/"
          class="inline-flex min-w-[180px] items-center justify-center rounded-xl bg-[#bc2428] px-8 py-4 text-sm font-black text-white shadow-lg shadow-[#bc2428]/30 transition-all hover:bg-[#a01e22] hover:-translate-y-1">
          <span x-text="isAr ? 'قدّم الآن' : 'Apply Now'"></span>
        </a>
        <a href="/contact/"
          class="inline-flex min-w-[180px] items-center justify-center rounded-xl border border-white/40 bg-white/10 backdrop-blur-md px-8 py-4 text-sm font-black text-white transition-all hover:bg-white hover:text-[#1e2652] hover:-translate-y-1">
          <span x-text="isAr ? 'اطلب معلومات' : 'Request Info'"></span>
        </a>
      </div>
    </div>
  </section>

  <section class="relative z-20 -mt-8 md:-mt-16">
    <div class="container mx-auto px-4">

      <div
        class="mx-auto mb-16 flex w-fit max-w-full overflow-x-auto rounded-[1.25rem] border border-slate-200 bg-white p-1.5 shadow-[0_12px_30px_rgba(32,39,89,0.06)]">
        <template x-for="tab in page.tabs" :key="tab.id">
          <button type="button" @click="activeType = tab.id"
            class="whitespace-nowrap rounded-2xl px-8 py-3.5 text-[16px] font-bold transition-all duration-300 md:min-w-[200px]"
            :class="activeType === tab.id ? 'bg-[#bc2428] text-white shadow-md shadow-[#bc2428]/20' : 'text-slate-500 hover:bg-slate-50 hover:text-[#1e2652]'"
            x-text="text(tab, 'label')"></button>
        </template>
      </div>

      <div class="mx-auto max-w-[1060px]">

        <div class="mb-16 rounded-[2rem] bg-white border border-slate-100 p-8 md:p-12 shadow-sm reveal-up">
          <h2 class="mb-10 text-2xl md:text-3xl font-black text-[#1e2652] border-b border-slate-100 pb-6"
            x-text="text(activeData, 'policiesTitle')"></h2>

          <div class="grid gap-10 md:grid-cols-2 md:gap-14">
            <template x-for="policy in activeData.policies" :key="policy.titleEn">
              <article class="flex flex-col border-s-4 border-[#bc2428] ps-6 py-1">
                <div class="flex items-center gap-4 mb-4">
                  <div
                    class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-[#bc2428]/5 text-[#bc2428]"
                    x-html="policy.iconSvg"></div>
                  <h3 class="text-xl font-bold text-[#bc2428]" x-text="text(policy, 'title')"></h3>
                </div>
                <p class="text-[15px] leading-[1.8] text-slate-600 font-medium" x-text="text(policy, 'desc')"></p>
              </article>
            </template>
          </div>
        </div>

        <div class="mb-16 rounded-[2rem] bg-white border border-slate-100 p-8 md:p-12 shadow-sm reveal-up">
          <h2 class="mb-10 text-2xl md:text-3xl font-black text-[#1e2652] border-b border-slate-100 pb-6"
            x-text="text(activeData, 'documentsTitle')"></h2>

          <div class="overflow-hidden rounded-2xl border border-slate-100">
            <template x-for="documentItem in activeData.documents" :key="documentItem.titleEn">
              <div
                class="flex min-h-[64px] items-center justify-between gap-6 border-b border-slate-100 px-6 py-4 last:border-b-0 transition-colors hover:bg-slate-50">
                <div class="flex items-center gap-4">
                  <span class="flex h-2.5 w-2.5 shrink-0 rounded-full"
                    :class="documentItem.optional ? 'bg-slate-300' : 'bg-[#bc2428]'"></span>
                  <span class="text-[16px] font-bold text-[#1e2652]" x-text="text(documentItem, 'title')"></span>
                </div>
                <span class="shrink-0 rounded-full px-4 py-1.5 text-[11px] font-black tracking-wider uppercase border"
                  :class="documentItem.optional ? 'bg-slate-50 text-slate-500 border-slate-200' : 'bg-red-50 text-[#bc2428] border-red-100'"
                  x-text="text(documentItem, 'status')"></span>
              </div>
            </template>
          </div>
        </div>

        <template x-if="activeType === 'international'">
          <div class="mb-16 rounded-[2rem] bg-white border border-slate-100 p-8 md:p-12 shadow-sm reveal-up">
            <h2 class="mb-10 text-2xl md:text-3xl font-black text-[#1e2652] border-b border-slate-100 pb-6"
              x-text="text(activeData, 'notesTitle')"></h2>
            <div class="grid gap-8 md:grid-cols-3">
              <template x-for="note in activeData.notes" :key="note.titleEn">
                <article class="rounded-2xl border border-slate-100 bg-slate-50 p-6 shadow-sm">
                  <h3 class="mb-4 text-[18px] font-bold text-[#1e2652]" x-text="text(note, 'title')"></h3>
                  <p class="text-[15px] leading-[1.8] text-slate-600 font-medium" x-text="text(note, 'desc')"></p>
                </article>
              </template>
            </div>
          </div>
        </template>

        <div class="mb-20 reveal-up">
          <h2 class="mb-16 text-center text-3xl font-black text-[#1e2652] md:text-4xl"
            x-text="text(activeData, 'processTitle')"></h2>

          <div class="relative mx-auto max-w-[960px] px-4 md:px-0">
            <div class="absolute top-0 bottom-0 start-8 w-1 bg-slate-200 md:start-1/2 md:-translate-x-1/2 rounded-full">
            </div>

            <div class="space-y-12">
              <template x-for="(step, index) in activeData.steps" :key="step.titleEn">
                <div class="relative flex flex-col md:flex-row md:items-center">

                  <div
                    class="absolute start-8 h-8 w-8 -translate-x-1/2 rounded-full border-[6px] border-slate-50 bg-slate-300 md:start-1/2 shadow-sm transition-all duration-300 z-10"
                    :class="index === 0 ? '!bg-[#bc2428] !border-red-100' : ''"></div>

                  <div class="w-full ps-16 md:ps-0 md:w-[45%]"
                    :class="index % 2 === 0 ? 'md:ms-auto md:ps-12' : 'md:me-auto md:pe-12'">

                    <article
                      class="group rounded-3xl border border-slate-200 bg-white p-8 shadow-sm transition-all hover:shadow-lg hover:border-[#bc2428]/30">
                      <div class="flex items-center gap-4 mb-4">
                        <span
                          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-[#1e2652]/5 text-[15px] font-black text-[#1e2652] transition-colors group-hover:bg-[#1e2652] group-hover:text-white"
                          x-text="'0' + (index + 1)"></span>
                        <h3 class="text-[19px] font-bold text-[#1e2652]" x-text="text(step, 'title')"></h3>
                      </div>
                      <p class="text-[15px] leading-[1.75] text-slate-600 font-medium" x-text="text(step, 'desc')"></p>
                    </article>

                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>

        <aside class="rounded-[2rem] border border-[#bc2428]/20 bg-[#bc2428]/5 p-8 md:p-10 reveal-up">
          <div class="flex flex-col sm:flex-row items-start gap-6">
            <div
              class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-[#bc2428] text-xl font-bold text-white shadow-md shadow-[#bc2428]/30">
              i</div>
            <div>
              <h4 class="mb-3 text-[20px] font-black text-[#1e2652]" x-text="text(page.notes, 'title')"></h4>
              <p class="text-[15px] leading-[1.8] text-slate-700 font-medium" x-text="text(page.notes, 'desc')"></p>
            </div>
          </div>
        </aside>

      </div>
    </div>
  </section>
</div>
