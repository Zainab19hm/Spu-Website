        </a>
      </div>
    </div>
  </section>

          <button type="button"
                  @click="activeType = tab.id"
                  class="rounded-[13px] px-6 py-3.5 text-[15px] font-bold transition-all duration-300 md:min-w-[200px] md:text-[18px] cursor-pointer"
                  :class="activeType === tab.id ? 'bg-spu-red text-white shadow-md shadow-spu-red/10' : 'text-[#4b556b] hover:bg-slate-50'"
                  x-text="text(tab, 'label')"></button>
        </template>
      </div>

      <div class="mx-auto max-w-[1060px]">
        
        <!-- Policies Grid Section -->
        <div class="mb-20 bg-white rounded-3xl border border-slate-100 p-8 shadow-sm">
          <h2 class="mb-8 text-2xl font-bold leading-tight text-spu-blue md:text-3xl border-b border-slate-100 pb-5"
              x-text="text(activeData, 'policiesTitle')"></h2>
          
          <div class="grid gap-10 md:grid-cols-2 md:gap-12">
            <template x-for="policy in activeData.policies" :key="policy.titleEn">
              <article class="flex flex-col border-l-4 border-spu-red pl-6 py-1 rtl:border-l-0 rtl:border-r-4 rtl:pl-0 rtl:pr-6">
                <div class="flex items-center gap-3 mb-4">
                  <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-spu-red/5 shrink-0" x-html="policy.iconSvg"></div>
                  <h3 class="text-[18px] font-bold text-spu-red" x-text="text(policy, 'title')"></h3>
                </div>
                <p class="text-[14px] leading-[1.7] text-[#475569] font-medium" x-text="text(policy, 'desc')"></p>
              </article>
            </template>
          </div>
        </div>

                  <span class="flex h-2 w-2 rounded-full" :class="documentItem.optional ? 'bg-slate-400' : 'bg-spu-red'"></span>

              </div>
            </template>
          </div>
        </div>

        <!-- Application Process Timeline Section -->
        <div class="mb-20">
          <h2 class="mb-14 text-center text-2xl font-bold leading-tight text-spu-blue md:text-3xl"
              x-text="text(activeData, 'processTitle')"></h2>

          <!-- Vertical Alternating Timeline Container -->
          <div class="relative mx-auto max-w-[960px] px-4 md:px-0">
            <!-- Timeline Center Line -->
            <div class="absolute top-0 bottom-0 left-6 w-0.5 bg-slate-200 md:left-1/2 -translate-x-1/2"></div>
            
            <div class="space-y-12">
              <template x-for="(step, index) in activeData.steps" :key="step.titleEn">
                <!-- Timeline Step Node -->
                <div class="relative flex flex-col md:flex-row md:items-center">
                  
                  <!-- Circular Indicator Node -->
                  <div class="absolute left-6 h-6 w-6 -translate-x-1/2 rounded-full border-4 border-white bg-slate-200 md:left-1/2 shadow transition-all duration-300"
                       :class="index === 0 ? 'bg-spu-blue ring-4 ring-spu-blue/15' : ''"></div>
                  
                  <!-- Card Box -->
                  <div class="w-full pl-12 md:pl-0 md:w-[45%]"
                       :class="[
                         index % 2 === 0 ? 'md:ml-auto md:pl-10' : 'md:mr-auto md:pr-10',
                         isAr ? (index % 2 === 0 ? 'rtl:md:mr-auto rtl:md:ml-0 rtl:md:pr-10 rtl:md:pl-0' : 'rtl:md:ml-auto rtl:md:mr-0 rtl:md:pl-10 rtl:md:pr-0') : ''
                       ]">
                    <article class="rounded-2xl border border-slate-100 bg-white p-6 shadow-sm transition hover:shadow-md hover:border-slate-200/50">
                      <div class="flex items-center gap-3 mb-3">
                        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-spu-blue/5 text-[13px] font-bold text-spu-blue"
                              x-text="'0' + (index + 1)"></span>
                        <h3 class="text-[17px] font-bold text-spu-blue" x-text="text(step, 'title')"></h3>
                      </div>
                      <p class="text-[13px] leading-[1.65] text-[#64748b] font-medium" x-text="text(step, 'desc')"></p>
                    </article>
                  </div>
                  
                </div>
              </template>
            </div>
          </div>
        </div>

        <!-- Institutional Notes Section -->
        <aside class="rounded-2xl border border-spu-red/10 bg-spu-red/5 p-6 md:p-8">
          <div class="flex items-start gap-4">
            <div class="mt-1 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-spu-red text-[13px] font-bold text-white shadow-sm shadow-spu-red/20">i</div>
            <div>
              <h4 class="mb-3 text-[18px] font-bold text-spu-blue" x-text="text(page.notes, 'title')"></h4>
              <p class="text-[13px] leading-[1.7] text-slate-600 font-medium" x-text="text(page.notes, 'desc')"></p>
            </div>
          </div>
        </aside>

      </div>
    </div>
  </section>
</div>
