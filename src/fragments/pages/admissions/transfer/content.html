<div class="font-hacen bg-white" :dir="$store.app.currentLang === 'ar' ? 'rtl' : 'ltr'"
  x-data="{
    page: $store.admissionsPage.transferPage,
    activeTab: 'transfer',
    get isAr() { return $store.app.currentLang === 'ar' },
    get active() {
      return this.page.tabs.find((tab) => tab.id === this.activeTab) || this.page.tabs[0];
    },
    text(item, key) {
      return this.isAr ? item[key + 'Ar'] : item[key + 'En'];
    }
  }">
  <section class="bg-white">
    <div class="relative flex h-[370px] items-center justify-center overflow-hidden lg:h-[400px]">
      <img :src="page.heroImage" :alt="text(page, 'title')" class="absolute inset-0 h-full w-full object-cover">
      <div class="absolute inset-0 bg-[linear-gradient(180deg,rgba(32,39,89,0.80)_0%,rgba(32,39,89,0.50)_50%,rgba(32,39,89,0)_100%)]"></div>

      <div class="container relative z-10 mx-auto px-6 text-center text-white">
        <nav class="mb-4 flex items-center justify-center gap-2 text-xs font-black text-white" aria-label="Breadcrumb">
          <a href="/" class="rounded bg-spu-blue/35 px-2 py-1 transition hover:bg-spu-blue/55" x-text="text(page, 'breadcrumbHome')"></a>
          <span aria-hidden="true" class="text-white/75">&gt;</span>
          <a href="/admissions.html" class="transition hover:text-white/80" x-text="text(page, 'breadcrumbParent')"></a>
          <span aria-hidden="true" class="text-white/75">&gt;</span>
          <span x-text="text(page, 'breadcrumbCurrent')"></span>
        </nav>

        <h1 class="text-[32px] font-black leading-tight text-white md:text-[42px]" x-text="text(page, 'title')"></h1>

        <div class="mt-7 flex flex-wrap items-center justify-center gap-3">
          <a :href="page.applyUrl"
            class="inline-flex h-10 min-w-[136px] items-center justify-center rounded-md bg-spu-red px-8 text-xs font-black uppercase tracking-wide text-white transition hover:bg-spu-blue"
            x-text="text(page, 'applyLabel')"></a>
          <a :href="page.requestInfoUrl"
            class="inline-flex h-10 min-w-[136px] items-center justify-center rounded-md border border-white bg-white/5 px-8 text-xs font-black text-white transition hover:bg-white hover:text-spu-blue"
            x-text="text(page, 'requestInfoLabel')"></a>
        </div>
      </div>
    </div>
  </section>

  <section class="bg-white pb-28 pt-20">
    <div class="container mx-auto max-w-[1060px] px-6">
      <div class="mx-auto flex w-fit max-w-full items-center overflow-hidden rounded-xl border border-slate-200 bg-white p-1 shadow-[0_8px_24px_rgba(32,39,89,0.10)]">
        <template x-for="tab in page.tabs" :key="tab.id">
          <button type="button"
            class="min-w-[180px] rounded-lg px-5 py-4 text-base font-black transition"
            :class="activeTab === tab.id ? 'bg-spu-red text-white' : 'text-slate-600 hover:text-spu-red'"
            :aria-selected="activeTab === tab.id"
            @click="activeTab = tab.id"
            x-text="text(tab, 'label')"></button>
        </template>
      </div>

      <section class="mt-20">
        <h2 class="text-center text-[32px] font-black leading-tight text-spu-blue" x-text="text(active, 'policiesTitle')"></h2>
        <div class="mt-5 border-t border-slate-200"></div>

        <div class="mt-8 grid gap-12 md:grid-cols-2">
          <template x-for="policy in active.policies" :key="policy.titleEn">
            <article class="border-s-2 border-spu-red ps-5">
              <div class="mb-4 flex items-center gap-2 text-spu-red">
                <span class="inline-flex h-4 w-4 items-center justify-center" aria-hidden="true">
                  <template x-if="policy.icon === 'transfer'">
                    <svg viewBox="0 0 20 20" class="h-4 w-4 fill-none stroke-current stroke-2">
                      <path d="M4 6h10" />
                      <path d="m11 3 3 3-3 3" />
                      <path d="M16 14H6" />
                      <path d="m9 11-3 3 3 3" />
                    </svg>
                  </template>
                  <template x-if="policy.icon !== 'transfer'">
                    <svg viewBox="0 0 20 20" class="h-4 w-4 fill-none stroke-current stroke-2">
                      <path d="m4 10 3 3 9-9" />
                      <path d="m14 10 2 2-5 5" />
                    </svg>
                  </template>
                </span>
                <h3 class="text-lg font-black" x-text="text(policy, 'title')"></h3>
              </div>
              <p class="max-w-[390px] text-sm leading-6 text-black" x-text="text(policy, 'desc')"></p>
            </article>
          </template>
        </div>
      </section>

      <section class="mt-24 border-s-2 border-slate-300 ps-8">
        <h2 class="mb-8 text-center text-[32px] font-black leading-tight text-spu-blue" x-text="text(active, 'documentsTitle')"></h2>
        <div class="overflow-hidden rounded-lg border border-slate-200 bg-white">
          <template x-for="(documentItem, index) in active.documents" :key="documentItem.titleEn">
            <div class="flex items-center justify-between gap-4 px-4 py-4 text-sm text-black"
              :class="index < active.documents.length - 1 ? 'border-b border-slate-200' : ''">
              <span x-text="text(documentItem, 'title')"></span>
              <span class="rounded px-2 py-1 text-[10px] font-black"
                :class="documentItem.required ? 'bg-red-50 text-spu-red' : 'bg-slate-100 text-slate-700'"
                x-text="documentItem.required ? text(page, 'requiredLabel') : text(page, 'optionalLabel')"></span>
            </div>
          </template>
        </div>
      </section>

      <section class="mt-28">
        <h2 class="text-center text-[32px] font-black leading-tight text-spu-blue" x-text="text(active, 'processTitle')"></h2>

        <div class="relative mx-auto mt-16 min-h-[430px] max-w-[900px]">
          <div class="absolute bottom-0 left-1/2 top-0 hidden w-px -translate-x-1/2 bg-slate-300 md:block" aria-hidden="true"></div>

          <template x-for="(step, index) in active.steps" :key="step.titleEn">
            <div class="relative mb-14 grid gap-8 md:grid-cols-2 md:items-center">
              <div class="hidden md:block" :class="index % 2 === 0 ? 'order-1' : 'order-2'"></div>

              <span class="absolute left-1/2 top-10 z-10 hidden h-6 w-6 -translate-x-1/2 rounded-full border-4 border-white md:block"
                :class="index === 0 ? 'bg-spu-blue' : 'bg-slate-300'" aria-hidden="true"></span>

              <article class="rounded-lg border border-slate-200 bg-white px-8 py-8"
                :class="index % 2 === 0 ? 'md:order-2 md:ms-16' : 'md:order-1 md:me-16'">
                <h3 class="text-xl font-black text-spu-blue" x-text="text(step, 'title')"></h3>
                <p class="mt-4 text-xs leading-6 text-black" x-text="text(step, 'desc')"></p>
              </article>
            </div>
          </template>
        </div>
      </section>

      <section class="mt-20 border-s-4 border-spu-red ps-6">
        <div class="flex gap-5">
          <span class="mt-1 inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-spu-red text-sm font-black text-white" aria-hidden="true">i</span>
          <div>
            <h2 class="mb-3 text-xl font-black text-spu-blue" x-text="text(page, 'notesTitle')"></h2>
            <p class="max-w-[900px] text-sm leading-5 text-black" x-text="text(page, 'notesDesc')"></p>
          </div>
        </div>
      </section>
    </div>
  </section>
</div>
