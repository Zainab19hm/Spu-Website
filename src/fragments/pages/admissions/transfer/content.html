<style>
    .info-block {
        background: white;
        border: 1px solid #f1f5f9;
        border-radius: 3rem;
        padding: 4rem;
        position: relative;
    }
    .info-block::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 10px;
        height: 100%;
        background: #6f1616;
        border-radius: 3rem 0 0 3rem;
    }
    [dir="rtl"] .info-block::before {
        left: auto;
        right: 0;
        border-radius: 0 3rem 3rem 0;
    }
</style>

<div x-data="{ page: $store.admissionsPage.transferPage }">
    <!-- Hero Section -->
    <section class="relative py-24 overflow-hidden bg-spu-blue">
        <div class="container mx-auto px-6 relative z-10 text-center">
            <h1 class="reveal reveal-up text-4xl md:text-6xl font-black text-white mb-8"
                x-text="$store.app.currentLang === 'ar' ? page.titleAr : page.titleEn"></h1>
        </div>
    </section>

    <!-- Content Sections -->
    <section class="py-24 bg-slate-50">
        <div class="container mx-auto px-6 max-w-5xl space-y-12">
            <template x-for="(section, idx) in page.sections" :key="idx">
                <div class="reveal reveal-up" :class="`reveal-delay-${idx + 1}`">
                    <div class="info-block">
                        <h2 class="text-3xl font-black text-spu-blue mb-6"
                            x-text="$store.app.currentLang === 'ar' ? section.titleAr : section.titleEn"></h2>
                        <p class="text-xl text-slate-500 leading-relaxed"
                           x-text="$store.app.currentLang === 'ar' ? section.descAr : section.descEn"></p>
                    </div>
                </div>
            </template>
        </div>
    </section>
</div>
