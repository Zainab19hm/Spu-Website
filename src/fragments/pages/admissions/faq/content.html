<div class="admissions-design" x-data="{
  search: '',
  active: { 'application-process': 0, 'admission-requirements': -1, 'tuition-fees': -1, 'international-students': -1 },
  categories: $store.admissionsPage.faqPage.sections,
  get isAr() { return $store.app.currentLang === 'ar' },
  faqResults(category) {
    const term = this.search.trim().toLowerCase();
    if (!term) return category.items;
    return category.items.filter((entry) => (entry.qEn + ' ' + entry.qAr + ' ' + entry.aEn + ' ' + entry.aAr).toLowerCase().includes(term));
  }
}">
  <section class="relative flex h-[370px] items-center justify-center overflow-hidden font-hacen lg:h-[400px]">
    <img :src="$store.admissionsPage.faqPage.heroImage" :alt="$store.app.currentLang === 'ar' ? $store.admissionsPage.faqPage.titleAr : $store.admissionsPage.faqPage.titleEn" class="absolute inset-0 h-full w-full object-cover">
    <div class="absolute inset-0 bg-[linear-gradient(180deg,rgba(32,39,89,0.80)_0%,rgba(32,39,89,0.50)_50%,rgba(32,39,89,0)_100%)]"></div>
    <div class="container relative z-10 mx-auto px-6 text-center text-white">
      <nav class="mb-4 flex items-center justify-center gap-2 text-xs font-black text-white" aria-label="Breadcrumb">
        <a href="/" class="rounded bg-spu-blue/35 px-2 py-1 transition hover:bg-spu-blue/55" x-text="$store.app.currentLang === 'ar' ? $store.admissionsPage.faqPage.breadcrumbHomeAr : $store.admissionsPage.faqPage.breadcrumbHomeEn"></a>
        <span aria-hidden="true">›</span>
        <a href="/admissions.html" class="transition hover:text-white/80" x-text="$store.app.currentLang === 'ar' ? $store.admissionsPage.faqPage.breadcrumbParentAr : $store.admissionsPage.faqPage.breadcrumbParentEn"></a>
        <span aria-hidden="true">›</span>
        <span x-text="$store.app.currentLang === 'ar' ? $store.admissionsPage.faqPage.breadcrumbCurrentAr : $store.admissionsPage.faqPage.breadcrumbCurrentEn"></span>
      </nav>
      <h1 class="text-[32px] font-black leading-tight text-white md:text-[42px]" x-text="$store.app.currentLang === 'ar' ? $store.admissionsPage.faqPage.titleAr : $store.admissionsPage.faqPage.titleEn"></h1>
    </div>
  </section>

  <section class="admissions-search-band">
    <div class="admissions-shell">
      <label class="admissions-search">
        <span class="sr-only"
          x-text="$store.app.currentLang === 'ar' ? 'ابحث في أسئلة القبول' : 'Search admissions questions'"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input type="search" x-model="search"
          :placeholder="$store.app.currentLang === 'ar' ? 'ابحث في أسئلة القبول...' : 'Search admissions questions...'">
      </label>
    </div>
  </section>

  <section class="admissions-faq-content">
    <div class="admissions-shell">
      <template x-for="category in categories" :key="category.id">
        <section class="admissions-faq-section" x-show="faqResults(category).length">
          <div class="admissions-section-heading"
            :class="category.id === 'application-process' ? 'admissions-section-heading--small' : 'admissions-section-heading--large'">
            <span class="admissions-section-heading__icon" aria-hidden="true">
              <img :src="category.icon" alt="" class="h-6 w-6" />
            </span>
            <div class="admissions-section-heading__text">
              <h2 x-text="isAr ? category.titleAr : category.titleEn"></h2>
              <span class="admissions-heading-line"></span>
            </div>
          </div>

          <div class="admissions-accordion">
            <template x-for="(item, idx) in faqResults(category)" :key="category.id + '-' + item.qEn">
              <article class="admissions-accordion__item" :class="{ 'is-open': active[category.id] === idx }">
                <button type="button" class="admissions-accordion__button" :aria-expanded="active[category.id] === idx"
                  @click="active[category.id] = active[category.id] === idx ? -1 : idx">
                  <span class="admissions-accordion__question"
                    x-text="$store.app.currentLang === 'ar' ? item.qAr : item.qEn"></span>
                  <svg class="admissions-accordion__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.2" aria-hidden="true">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </button>
                <div class="admissions-accordion__answer" x-show="active[category.id] === idx" x-collapse>
                  <p x-text="$store.app.currentLang === 'ar' ? item.aAr : item.aEn"></p>
                </div>
              </article>
            </template>
          </div>
        </section>
      </template>
      <div class="admissions-empty-state" x-show="categories.every((category) => faqResults(category).length === 0)"
        x-text="$store.app.currentLang === 'ar' ? 'لم يتم العثور على نتائج مطابقة.' : 'No matching admissions questions were found.'">
      </div>
    </div>
  </section>
</div>
