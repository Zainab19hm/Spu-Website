<style>
    .faq-item {
        background: white;
        border: 1px solid #f1f5f9;
        border-radius: 2rem;
        margin-bottom: 1.5rem;
        overflow: hidden;
        transition: all 0.3s ease;
    }
    .faq-item:hover {
        border-color: #6f1616;
        box-shadow: 0 15px 30px rgba(111, 22, 22, 0.05);
    }
    .faq-trigger {
        width: 100%;
        padding: 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        text-align: start;
        cursor: pointer;
    }
    .faq-answer {
        padding: 0 2rem 2rem;
        color: #64748b;
        line-height: 1.8;
    }
    .faq-icon {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }
    .faq-item.active .faq-icon {
        background: #6f1616;
        color: white;
        transform: rotate(45deg);
    }
</style>

<div x-data="{ 
    page: $store.admissionsPage.faqPage,
    activeIndex: -1,
    search: ''
}">
    <!-- Hero Section -->
    <section class="relative py-24 overflow-hidden bg-spu-blue">
        <div class="container mx-auto px-6 relative z-10 text-center">
            <h1 class="reveal reveal-up text-4xl md:text-6xl font-black text-white mb-8"
                x-text="$store.app.currentLang === 'ar' ? page.titleAr : page.titleEn"></h1>
            
            <!-- Search Bar -->
            <div class="reveal reveal-up reveal-delay-1 max-w-2xl mx-auto relative">
                <input type="text" x-model="search"
                       class="w-full px-8 py-5 rounded-2xl bg-white/10 border border-white/20 text-white placeholder:text-white/40 focus:bg-white focus:text-spu-blue focus:outline-none transition-all"
                       :placeholder="$store.app.currentLang === 'ar' ? 'ابحث عن إجابة...' : 'Search for an answer...'">
                <div class="absolute inset-y-0 right-8 flex items-center text-white/40 pointer-events-none">
                    <img src="/images/icon-search-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
                </div>
            </div>
        </div>
    </section>

    <!-- FAQ List -->
    <section class="py-24 bg-white">
        <div class="container mx-auto px-6 max-w-4xl">
            <div class="space-y-4">
                <template x-for="(item, idx) in page.questions.filter(q => 
                    (item.qEn + item.qAr).toLowerCase().includes(search.toLowerCase())
                )" :key="idx">
                    <div class="reveal reveal-up" :class="`reveal-delay-${(idx % 5) + 1}`">
                        <div class="faq-item" :class="{ 'active border-spu-red shadow-lg': activeIndex === idx }">
                            <button class="faq-trigger" @click="activeIndex = activeIndex === idx ? -1 : idx">
                                <span class="text-xl font-bold text-spu-blue"
                                      x-text="$store.app.currentLang === 'ar' ? item.qAr : item.qEn"></span>
                                <div class="faq-icon text-slate-400">
                                    <img src="/images/icon-chevron-down-outline.svg" alt="" class="h-3.5 w-3.5" aria-hidden="true">
                                </div>
                            </button>
                            <div class="faq-answer" x-show="activeIndex === idx" x-collapse>
                                <p x-text="$store.app.currentLang === 'ar' ? item.aAr : item.aEn"></p>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Empty State -->
            <div x-show="page.questions.filter(q => (item.qEn + item.qAr).toLowerCase().includes(search.toLowerCase())).length === 0"
                 class="text-center py-20">
                <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center text-3xl text-slate-300 mx-auto mb-6">
                    <img src="/images/icon-search-outline.svg" alt="" class="h-8 w-8 opacity-60" aria-hidden="true">
                </div>
                <p class="text-slate-500 font-bold" 
                   x-text="$store.app.currentLang === 'ar' ? 'لم يتم العثور على نتائج للبحث.' : 'No results found for your search.'"></p>
            </div>
        </div>
    </section>
</div>
