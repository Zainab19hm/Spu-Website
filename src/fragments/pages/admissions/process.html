<!-- Statistics / Trust Bar — overlaps the hero -->
<section x-data class="relative z-10 -mt-14 font-hacen">
    <div class="container">
        <div class="relative overflow-hidden rounded-lg bg-spu-blue shadow-[0_20px_25px_-5px_rgba(0,0,0,0.1),0_8px_10px_-6px_rgba(0,0,0,0.1)]">
            <div class="grid grid-cols-2 md:grid-cols-4">
                <template x-for="(item, idx) in $store.admissionsPage.trustBar" :key="item.titleEn">
                    <div class="relative flex flex-col items-center gap-3 px-6 py-10 text-center">
                        <div x-show="idx > 0"
                             class="absolute left-0 top-1/2 hidden h-full w-px -translate-y-1/2 bg-white/10 md:block"
                             aria-hidden="true"></div>
                        <span class="text-2xl text-white"><i :class="item.icon"></i></span>
                        <h3 class="text-lg font-semibold leading-[31.2px] text-white md:text-xl"
                            x-text="$store.app.currentLang === 'ar' ? item.titleAr : item.titleEn"></h3>
                    </div>
                </template>
            </div>
        </div>
    </div>
</section>

<!-- The Admissions Journey — step cards -->
<section x-data class="bg-white py-20 font-hacen lg:py-28">
    <div class="container">
        <h2 class="text-center text-[50px] font-bold leading-normal text-[#091144]"
            x-text="$store.app.currentLang === 'ar' ? $store.admissionsPage.journey.titleAr : $store.admissionsPage.journey.titleEn">
        </h2>

        <div class="mx-auto mt-14 flex flex-wrap items-start justify-center gap-[33px]">
            <template x-for="step in $store.admissionsPage.journey.steps" :key="step.number">
                <div class="relative w-[235px]">
                    <div class="absolute left-1/2 top-0 z-10 flex h-[53px] w-[53px] -translate-x-1/2 items-center justify-center rounded-lg text-[27px] font-semibold"
                         :class="step.active
                             ? 'bg-spu-blue text-white'
                             : 'border border-[#c7c5d0] bg-[#f0edf2] text-spu-blue'">
                        <span x-text="step.number"></span>
                    </div>
                    <div class="mt-[25px] min-h-[199px] overflow-hidden rounded-lg border border-[#c7c5d0] bg-white px-6 pb-7 pt-10 text-center shadow-[0_1.125px_2.25px_0_rgba(0,0,0,0.05)]">
                        <h3 class="text-[22px] font-bold leading-[30px] text-[#091144]"
                            x-text="$store.app.currentLang === 'ar' ? step.titleAr : step.titleEn"></h3>
                        <p class="mt-4 text-[20px] leading-[24px] text-[#46464f]"
                           x-text="$store.app.currentLang === 'ar' ? step.summaryAr : step.summaryEn"></p>
                    </div>
                </div>
            </template>
        </div>
    </div>
</section>

<!-- ═══════════════════════════════════════════════════════════════
     Admissions Timeline — 12-col grid: image (5 cols) + phases (7 cols)
     ═══════════════════════════════════════════════════════════════ -->
<section x-data class="bg-section py-20 font-hacen lg:py-28">
    <div class="container">
        <div class="grid grid-cols-1 gap-8 lg:grid-cols-12 lg:gap-[32px]">

            <!-- ── Left column: editorial image with primary deadline ── -->
            <div class="relative h-[600px] overflow-hidden rounded-lg bg-[#e4e1e6] lg:col-span-5">
                <!-- Campus image — desaturated with overlay -->
                <div class="absolute inset-0 opacity-80 overflow-hidden">
                    <img :src="$store.admissionsPage.timeline.image"
                         alt=""
                         class="absolute inset-0 h-full w-full object-cover"
                         aria-hidden="true">
                    <!-- Desaturation layer -->
                    <div class="absolute inset-0 bg-white mix-blend-saturation"></div>
                </div>
                <!-- Color overlay for depth -->
                <div class="absolute inset-x-0 inset-y-0 bottom-[30px] mix-blend-overlay bg-gradient-to-t from-[rgba(32,39,89,0.7)] via-[rgba(32,39,89,0.3)] to-[rgba(32,39,89,0.1)]"></div>

                <!-- Bottom content block -->
                <div class="absolute bottom-0 left-0 right-0 flex flex-col gap-4 p-8">
                    <!-- Label -->
                    <p class="text-xs font-bold uppercase tracking-[1.2px] text-white"
                       x-text="$store.app.currentLang === 'ar' ? $store.admissionsPage.timeline.primaryDeadlineLabelAr : $store.admissionsPage.timeline.primaryDeadlineLabelEn"></p>
                    <!-- Large date -->
                    <p class="text-[48px] font-bold leading-[52.8px] tracking-[-0.96px] text-white"
                       x-text="$store.app.currentLang === 'ar' ? $store.admissionsPage.timeline.primaryDeadlineAr : $store.admissionsPage.timeline.primaryDeadlineEn"></p>
                    <!-- Description with red left accent -->
                    <div class="border-l-2 border-[#a23c37] py-1 pl-[18px]">
                        <p class="max-w-[397px] text-base leading-6 text-[#f0edf2]"
                           x-text="$store.app.currentLang === 'ar' ? $store.admissionsPage.timeline.primaryDeadlineDescAr : $store.admissionsPage.timeline.primaryDeadlineDescEn"></p>
                    </div>
                </div>
            </div>

            <!-- ── Right column: heading + timeline phases ── -->
            <div class="relative lg:col-span-7 lg:pl-8">
                <!-- Title block -->
                <div class="pt-2">
                    <h2 class="text-[50px] font-bold leading-[38.4px] text-spu-blue"
                        x-text="$store.app.currentLang === 'ar' ? $store.admissionsPage.timeline.titleAr : $store.admissionsPage.timeline.titleEn"></h2>
                    <p class="mt-5 max-w-[672px] text-[20px] leading-[28.8px] text-[#46464f]"
                       x-text="$store.app.currentLang === 'ar' ? $store.admissionsPage.timeline.summaryAr : $store.admissionsPage.timeline.summaryEn"></p>
                </div>

                <!-- Timeline phases -->
                <div class="relative mt-16 pl-[39px]">
                    <!-- Vertical connecting line -->
                    <div class="absolute left-[46px] top-[16px] bottom-[16px] w-px bg-[rgba(199,197,208,0.3)]" aria-hidden="true"></div>

                    <!-- Phase rows -->
                    <template x-for="(phase, idx) in $store.admissionsPage.timeline.phases" :key="phase.labelEn">
                        <div class="flex items-start gap-8"
                             :class="idx > 0 ? 'mt-[24px]' : ''">
                            <!-- Dot -->
                            <div class="relative z-10 mt-[4px] flex h-5 w-4 shrink-0 items-start">
                                <div class="h-4 w-4 rounded-full"
                                     :class="phase.active ? 'bg-spu-blue' : 'border-2 border-[#767680] bg-white'"></div>
                            </div>

                            <!-- Content row with bottom border -->
                            <div class="flex-1 pb-[25px]"
                                 :class="idx < $store.admissionsPage.timeline.phases.length - 1 ? 'border-b border-[rgba(199,197,208,0.5)]' : ''">
                                <div class="grid grid-cols-3 gap-1">
                                    <!-- Phase label -->
                                    <p class="text-[12px] font-bold uppercase leading-[12px] tracking-[1.2px] text-[#46464f]"
                                       x-text="$store.app.currentLang === 'ar' ? phase.labelAr : phase.labelEn"></p>
                                    <!-- Phase title -->
                                    <h3 class="text-[24px] font-bold leading-[31.2px] text-[#1b1b1f]"
                                        x-text="$store.app.currentLang === 'ar' ? phase.titleAr : phase.titleEn"></h3>
                                    <!-- Phase date -->
                                    <p class="text-[16px] leading-[24px]"
                                       :class="phase.active ? 'text-spu-red' : 'text-[#46464f]'"
                                       x-text="$store.app.currentLang === 'ar' ? phase.dateAr : phase.dateEn"></p>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

        </div>
    </div>
</section>
