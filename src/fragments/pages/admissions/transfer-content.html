<section id="admissions-transfer" x-data class="bg-section py-20 font-hacen lg:py-24">
    <div class="container">
        <div class="max-w-3xl">
            <p class="text-sm font-bold uppercase tracking-[0.35em] text-spu-red/70" x-text="$store.app.currentLang === 'ar' ? 'التحويل والطلبة الدوليون' : 'Transfer & International'"></p>
            <h1 class="mt-5 text-3xl font-bold leading-tight text-spu-blue md:text-4xl" x-text="$store.app.currentLang === 'ar' ? 'سياسة التحويل ومتطلبات اللغة والتأشيرات' : 'Transfer Policy, Language Requirements and Visa Guide'"></h1>

        <div class="mt-12 grid gap-8 lg:grid-cols-3">
            <article class="rounded-[30px] bg-white p-8 shadow-[0_20px_60px_rgba(20,30,70,0.08)]">

                    <li class="flex gap-3"><span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-spu-red"></span><span x-text="$store.app.currentLang === 'ar' ? 'الحد الأقصى للساعات المحولة هو ٥٠٪ من إجمالي ساعات التخرج' : 'Maximum 50% of total graduation credits may be transferred'"></span></li>

            <article class="rounded-[30px] bg-white p-8 shadow-[0_20px_60px_rgba(20,30,70,0.08)]">

                <ul class="mt-5 space-y-3 text-[15px] leading-7 text-slate-600">
                    <li class="flex gap-3"><span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-spu-red"></span><span x-text="$store.app.currentLang === 'ar' ? 'لغة الدراسة هي العربية لمعظم الكليات مع مقررات بالإنجليزية' : 'Arabic is the primary language with English-taught courses in some faculties'"></span></li>

                    <li class="flex gap-3"><span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-spu-red"></span><span x-text="$store.app.currentLang === 'ar' ? 'دورات تأهيل لغوي متاحة قبل بدء الدراسة' : 'Language preparatory courses available before studies begin'"></span></li>

                <ul class="mt-5 space-y-3 text-[15px] leading-7 text-white/85">
                    <li class="flex gap-3"><span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-spu-red"></span><span x-text="$store.app.currentLang === 'ar' ? 'خطاب القبول من الجامعة يُستخدم للحصول على تأشيرة الطالب' : 'University acceptance letter used to obtain student visa'"></span></li>
                    <li class="flex gap-3"><span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-spu-red"></span><span x-text="$store.app.currentLang === 'ar' ? 'يتولى الطالب إجراءات التأشيرة عبر السفارة السورية في بلده' : 'Students handle visa procedures through the Syrian embassy in their country'"></span></li>
                    <li class="flex gap-3"><span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-spu-red"></span><span x-text="$store.app.currentLang === 'ar' ? 'مكتب العلاقات الدولية يقدم الدعم في الإجراءات والإرشاد' : 'International Relations Office provides procedural support and guidance'"></span></li>
                    <li class="flex gap-3"><span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-spu-red"></span><span x-text="$store.app.currentLang === 'ar' ? 'يجب تجديد الإقامة سنوياً عبر دوائر الهجرة والجوازات' : 'Residency must be renewed annually through immigration authorities'"></span></li>
                </ul>
            </article>
        </div>
    </div>
</section>
