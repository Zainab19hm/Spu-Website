<style>
    .doc-category {
        background: white;
        border: 1px solid #f1f5f9;
        border-radius: 3rem;
        padding: 4rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .check-item {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 1.5rem;
        border-bottom: 1px solid #f8fafc;
        transition: all 0.2s ease;
    }
    .check-item:last-child { border-bottom: none; }
    .check-item:hover { background: #fdf2f2; }
    
    .check-circle {
        width: 24px;
        height: 24px;
        border: 2px solid #6f1616;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6f1616;
        font-size: 0.75rem;
        flex-shrink: 0;
    }
</style>

<div x-data="{ page: $store.admissionsPage.documentsPage }">
    <!-- Hero Section -->
    <section class="relative flex min-h-[365px] items-center justify-center overflow-hidden pt-28 font-hacen">
        <img :src="page.heroImage" :alt="$store.app.currentLang === 'ar' ? page.titleAr : page.titleEn" class="absolute inset-0 h-full w-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-b from-[rgba(7,10,28,0.12)] to-[rgba(32,39,89,0.72)]"></div>
        <div class="container relative z-10 mx-auto px-6 text-center text-white">
            <nav class="mb-6 flex items-center justify-center gap-3 text-xs font-bold text-white/85" aria-label="Breadcrumb">
                <a href="/" class="transition hover:text-white" x-text="$store.app.currentLang === 'ar' ? page.breadcrumbHomeAr : page.breadcrumbHomeEn"></a>
                <span aria-hidden="true">›</span>
                <a href="/admissions.html" class="transition hover:text-white" x-text="$store.app.currentLang === 'ar' ? page.breadcrumbParentAr : page.breadcrumbParentEn"></a>
                <span aria-hidden="true">›</span>
                <span x-text="$store.app.currentLang === 'ar' ? page.breadcrumbCurrentAr : page.breadcrumbCurrentEn"></span>
            </nav>
            <h1 class="text-4xl font-black leading-tight text-white md:text-5xl" x-text="$store.app.currentLang === 'ar' ? page.titleAr : page.titleEn"></h1>
        </div>
    </section>

    <!-- Documents List -->
    <section class="py-24 bg-slate-50">
        <div class="container mx-auto px-6 max-w-4xl">
            <template x-for="(cat, idx) in page.categories" :key="idx">
                <div class="reveal reveal-up">
                    <div class="doc-category">
                        <h2 class="text-3xl font-black text-spu-blue mb-10 pb-6 border-b-2 border-spu-red/10"
                            x-text="$store.app.currentLang === 'ar' ? cat.nameAr : cat.nameEn"></h2>
                        
                        <div class="space-y-2">
                            <template x-for="item in cat.items" :key="item.en">
                                <div class="check-item">
                                    <div class="check-circle">
                                        <img src="/images/icon-check-outline.svg" alt="" class="h-3 w-3 brightness-0 invert" aria-hidden="true">
                                    </div>
                                    <span class="text-xl font-bold text-slate-700"
                                          x-text="$store.app.currentLang === 'ar' ? item.ar : item.en"></span>
                                </div>
                            </template>
                        </div>

                        <div class="mt-12 text-center">
                            <a href="#" class="inline-flex items-center gap-3 px-8 py-4 bg-spu-blue text-white font-black rounded-2xl hover:bg-spu-red transition-all shadow-lg">
                                <img src="/images/icon-file-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
                                <span x-text="$store.app.currentLang === 'ar' ? 'تحميل القائمة كـ PDF' : 'Download Checklist as PDF'"></span>
                            </a>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </section>
</div>
