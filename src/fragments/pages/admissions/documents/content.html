<div class="font-hacen bg-white" :dir="$store.app.currentLang === 'ar' ? 'rtl' : 'ltr'"
    x-data="{
        page: $store.admissionsPage.documentsPage,
        get isAr() { return $store.app.currentLang === 'ar' },
        text(item, key) {
            return this.isAr ? item[key + 'Ar'] : item[key + 'En'];
        }
    }">
    <section class="bg-white">
        <div class="relative flex h-[300px] items-center justify-center overflow-hidden lg:h-[310px]">
            <img :src="page.heroImage" :alt="text(page, 'title')" class="absolute inset-0 h-full w-full object-cover">
            <div class="absolute inset-0 bg-[linear-gradient(180deg,rgba(32,39,89,0.80)_0%,rgba(32,39,89,0.50)_50%,rgba(32,39,89,0)_100%)]"></div>
            <div class="container relative z-10 mx-auto px-6 text-center text-white">
                <nav class="mb-4 flex items-center justify-center gap-2 text-xs font-black text-white" aria-label="Breadcrumb">
                    <a href="/" class="rounded bg-spu-blue/35 px-2 py-1 transition hover:bg-spu-blue/55" x-text="text(page, 'breadcrumbHome')"></a>
                    <span aria-hidden="true" class="text-white/75">&gt;</span>
                    <a href="/admissions.html" class="transition hover:text-white/80" x-text="text(page, 'breadcrumbParent')"></a>
                    <span aria-hidden="true" class="text-white/75">&gt;</span>
                    <span x-text="text(page, 'breadcrumbCurrent')"></span>
                </nav>
                <h1 class="text-[32px] font-black leading-tight text-white md:text-[42px]" x-text="text(page, 'title')"></h1>
            </div>
        </div>
    </section>

    <section class="bg-white py-20">
        <div class="container mx-auto max-w-[1010px] px-6">
            <template x-for="cat in page.categories" :key="cat.nameEn">
                <section class="mb-12 border-s-2 border-slate-300 ps-8 last:mb-0">
                    <h2 class="mb-8 text-2xl font-black text-spu-blue md:text-[28px]" x-text="text(cat, 'name')"></h2>
                    <div class="overflow-hidden rounded-lg border border-slate-200 bg-white">
                        <template x-for="(item, index) in cat.items" :key="item.en || item.titleEn">
                            <div class="flex items-center gap-4 px-4 py-4 text-sm text-black md:px-5"
                                :class="index < cat.items.length - 1 ? 'border-b border-slate-200' : ''">
                                <span class="inline-flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2 border-spu-red text-spu-red" aria-hidden="true">
                                    <svg viewBox="0 0 20 20" class="h-3 w-3 fill-none stroke-current stroke-[2.5]">
                                        <path d="m5 10 3 3 7-7" />
                                    </svg>
                                </span>
                                <span x-text="isAr ? (item.ar || item.titleAr) : (item.en || item.titleEn)"></span>
                            </div>
                        </template>
                    </div>
                </section>
            </template>
        </div>
    </section>
</div>
