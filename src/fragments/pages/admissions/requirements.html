<!-- Admissions Resources — premium bento grid -->
<section x-data class="bg-section py-20 font-hacen lg:py-28">
    <div class="container">

        <!-- Section header -->
        <div class="mx-auto max-w-[700px] text-center">
            <p class="text-sm font-bold uppercase tracking-[0.2em] text-spu-red/60"
               x-text="$store.app.currentLang === 'ar' ? 'موارد' : 'Resources'"></p>
            <h2 class="mt-3 text-4xl font-bold leading-tight text-spu-blue md:text-5xl"
                x-text="$store.app.currentLang === 'ar' ? $store.admissionsPage.resources.titleAr : $store.admissionsPage.resources.titleEn">
            </h2>
            <p class="mt-4 text-lg leading-relaxed text-slate-500"
               x-text="$store.app.currentLang === 'ar' ? $store.admissionsPage.resources.subtitleAr : $store.admissionsPage.resources.subtitleEn">
            </p>
        </div>

        <!-- Bento grid -->
        <div class="mx-auto mt-14 grid max-w-[1100px] grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
            <template x-for="(card, idx) in $store.admissionsPage.resources.cards" :key="card.titleEn">
                <a :href="`/admissions/${card.slug}.html`"
                   class="group relative flex flex-col overflow-hidden rounded-2xl p-7 transition-all duration-300 hover:-translate-y-1"
                   :class="card.active
                       ? 'bg-spu-blue text-white shadow-[0_20px_50px_rgba(32,39,89,0.25)] lg:row-span-1'
                       : 'bg-white text-spu-blue shadow-[0_4px_24px_rgba(0,0,0,0.06)] hover:shadow-[0_16px_48px_rgba(0,0,0,0.1)]'">

                    <!-- Icon -->
                    <div class="flex h-12 w-12 items-center justify-center rounded-xl transition-transform duration-300 group-hover:scale-110"
                         :class="card.active ? 'bg-white/15' : 'bg-spu-blue/5'">
                        <img :src="card.icon" alt="" class="h-5 w-5" :class="card.active ? 'brightness-0 invert' : ''" aria-hidden="true">
                    </div>

                    <!-- Title -->
                    <h3 class="mt-5 text-xl font-bold leading-snug"
                        x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn"></h3>

                    <!-- Description -->
                    <p class="mt-2 text-sm leading-relaxed"
                       :class="card.active ? 'text-white/70' : 'text-slate-400'"
                       x-text="$store.app.currentLang === 'ar' ? card.descAr : card.descEn"></p>

                    <!-- Link text (active card only) -->
                    <div x-show="card.linkEn" class="mt-auto pt-5">
                        <span class="text-xs font-bold uppercase tracking-[1px]"
                              :class="card.active ? 'text-white/80' : 'text-spu-red'"
                              x-text="$store.app.currentLang === 'ar' ? card.linkAr : card.linkEn"></span>
                    </div>

                    <!-- Hover arrow (non-active cards) -->
                    <div x-show="!card.linkEn"
                         class="mt-auto flex items-center gap-2 pt-5 text-sm font-bold opacity-0 transition-all duration-300 group-hover:opacity-100"
                         :class="card.active ? 'text-white/80' : 'text-spu-red'">
                        <span x-text="$store.app.currentLang === 'ar' ? 'اكتشف' : 'Explore'"></span>
                        <img src="/images/icon-arrow-right-outline.svg" alt="" class="h-3 w-3 transition-transform duration-300 group-hover:translate-x-1" :class="$store.app.currentLang === 'ar' ? 'rotate-180 group-hover:-translate-x-1' : ''" aria-hidden="true">
                    </div>

                    <!-- Decorative corner accent (active card) -->
                    <div x-show="card.active"
                         class="pointer-events-none absolute -bottom-8 -right-8 h-32 w-32 rounded-full bg-white/5"
                         aria-hidden="true"></div>
                </a>
            </template>
        </div>
    </div>
</section>
