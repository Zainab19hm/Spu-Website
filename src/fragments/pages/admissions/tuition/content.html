<div class="font-hacen bg-white" :dir="$store.app.currentLang === 'ar' ? 'rtl' : 'ltr'"
    x-data="{
        page: $store.admissionsPage.tuitionPage,
        selectedFaculty: '',
        selectedType: '',
        get isAr() { return $store.app.currentLang === 'ar' },
        text(item, key) {
            return this.isAr ? item[key + 'Ar'] : item[key + 'En'];
        },
        get facultyOptions() {
            return [...new Set(this.page.feeRows.map((row) => row.facultyEn))];
        },
        get typeOptions() {
            return [...new Set(this.page.feeRows.map((row) => row.typeEn))];
        },
        get filteredRows() {
            return this.page.feeRows.filter((row) => {
                const facultyMatch = !this.selectedFaculty || row.facultyEn === this.selectedFaculty;
                const typeMatch = !this.selectedType || row.typeEn === this.selectedType;
                return facultyMatch && typeMatch;
            });
        }
    }">
    <section class="bg-white">
        <div class="relative flex h-[370px] items-center justify-center overflow-hidden lg:h-[400px]">
            <img :src="page.heroImage" :alt="text(page, 'title')" class="absolute inset-0 h-full w-full object-cover">
            <div class="absolute inset-0 bg-[linear-gradient(180deg,rgba(32,39,89,0.80)_0%,rgba(32,39,89,0.50)_50%,rgba(32,39,89,0)_100%)]"></div>

            <div class="container relative z-10 mx-auto px-6 text-center text-white">
                <nav class="mb-4 flex items-center justify-center gap-2 text-xs font-black text-white" aria-label="Breadcrumb">
                    <a href="/" class="rounded bg-spu-blue/35 px-2 py-1 transition hover:bg-spu-blue/55"
                        x-text="text(page, 'breadcrumbHome')"></a>
                    <span aria-hidden="true" class="text-white/75">&gt;</span>
                    <a href="/admissions.html" class="transition hover:text-white/80"
                        x-text="text(page, 'breadcrumbParent')"></a>
                    <span aria-hidden="true" class="text-white/75">&gt;</span>
                    <span x-text="text(page, 'breadcrumbCurrent')"></span>
                </nav>

                <h1 class="text-[32px] font-black leading-tight text-white md:text-[42px]"
                    x-text="text(page, 'title')"></h1>
            </div>
        </div>
    </section>

    <section class="bg-white pb-24 pt-12">
        <div class="container mx-auto max-w-[1060px] px-6">
            <div class="flex flex-col gap-5 md:flex-row">
                <label class="relative block w-full md:w-[220px]">
                    <span class="sr-only" x-text="text(page.filters, 'facultyLabel')"></span>
                    <select x-model="selectedFaculty"
                        class="h-12 w-full appearance-none rounded-lg border border-slate-200 bg-white px-5 pe-10 text-sm font-black text-slate-600 shadow-[0_8px_22px_rgba(32,39,89,0.08)] outline-none transition focus:border-spu-blue">
                        <option value="" x-text="text(page.filters, 'facultyLabel')"></option>
                        <template x-for="faculty in facultyOptions" :key="faculty">
                            <option :value="faculty" x-text="faculty"></option>
                        </template>
                    </select>
                    <span class="pointer-events-none absolute inset-y-0 end-4 flex items-center text-spu-blue" aria-hidden="true">
                        <svg viewBox="0 0 20 20" class="h-4 w-4 fill-none stroke-current stroke-2">
                            <path d="m5 7 5 5 5-5" />
                        </svg>
                    </span>
                </label>

                <label class="relative block w-full md:w-[220px]">
                    <span class="sr-only" x-text="text(page.filters, 'studentTypeLabel')"></span>
                    <select x-model="selectedType"
                        class="h-12 w-full appearance-none rounded-lg border border-slate-200 bg-white px-5 pe-10 text-sm font-black text-slate-600 shadow-[0_8px_22px_rgba(32,39,89,0.08)] outline-none transition focus:border-spu-blue">
                        <option value="" x-text="text(page.filters, 'studentTypeLabel')"></option>
                        <template x-for="type in typeOptions" :key="type">
                            <option :value="type" x-text="type"></option>
                        </template>
                    </select>
                    <span class="pointer-events-none absolute inset-y-0 end-4 flex items-center text-spu-blue" aria-hidden="true">
                        <svg viewBox="0 0 20 20" class="h-4 w-4 fill-none stroke-current stroke-2">
                            <path d="m5 7 5 5 5-5" />
                        </svg>
                    </span>
                </label>
            </div>

            <section class="mt-16">
                <h2 class="mb-9 text-[26px] font-black leading-tight text-spu-blue" x-text="text(page, 'overviewTitle')"></h2>
                <div class="overflow-x-auto rounded-md border border-slate-200 bg-white">
                    <table class="min-w-[880px] w-full border-collapse text-start">
                        <thead class="bg-spu-blue text-white">
                            <tr>
                                <template x-for="header in page.tableHeaders" :key="header.key">
                                    <th class="px-4 py-4 text-start text-sm font-black" x-text="text(header, 'label')"></th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="row in filteredRows" :key="row.facultyEn + row.typeEn + row.tuitionFeeEn">
                                <tr class="border-b border-slate-100 last:border-b-0">
                                    <td class="px-4 py-4 text-sm text-slate-900" x-text="text(row, 'faculty')"></td>
                                    <td class="px-4 py-4 text-sm text-slate-900" x-text="text(row, 'type')"></td>
                                    <td class="px-4 py-4 text-sm font-black text-spu-blue" x-text="text(row, 'tuitionFee')"></td>
                                    <td class="px-4 py-4 text-sm font-black text-spu-blue" x-text="text(row, 'registrationFee')"></td>
                                    <td class="px-4 py-4 text-sm text-slate-900" x-text="text(row, 'additionalFees')"></td>
                                    <td class="px-4 py-4 text-sm text-slate-700" x-text="text(row, 'notes')"></td>
                                </tr>
                            </template>
                            <tr x-show="filteredRows.length === 0">
                                <td class="px-4 py-6 text-center text-sm text-slate-500" colspan="6"
                                    x-text="text(page, 'emptyState')"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="mt-16">
                <h2 class="mb-8 text-[26px] font-black leading-tight text-spu-blue" x-text="text(page, 'paymentTitle')"></h2>
                <div class="grid gap-10 md:grid-cols-2">
                    <template x-for="method in page.methods" :key="method.titleEn">
                        <article class="border-s-4 border-spu-blue ps-6">
                            <div class="mb-4 flex items-center gap-5">
                                <span class="inline-flex h-5 w-5 items-center justify-center text-spu-blue" aria-hidden="true">
                                    <template x-if="method.icon === 'bank'">
                                        <svg viewBox="0 0 24 24" class="h-5 w-5 fill-none stroke-current stroke-2">
                                            <path d="M4 10h16" />
                                            <path d="M5 20h14" />
                                            <path d="M6 10v8" />
                                            <path d="M10 10v8" />
                                            <path d="M14 10v8" />
                                            <path d="M18 10v8" />
                                            <path d="m12 4 8 4H4l8-4Z" />
                                        </svg>
                                    </template>
                                    <template x-if="method.icon === 'card'">
                                        <svg viewBox="0 0 24 24" class="h-5 w-5 fill-none stroke-current stroke-2">
                                            <rect x="3" y="6" width="18" height="12" rx="1.5" />
                                            <path d="M3 10h18" />
                                        </svg>
                                    </template>
                                </span>
                                <h3 class="text-xl font-black text-spu-blue" x-text="text(method, 'title')"></h3>
                            </div>
                            <p class="max-w-[420px] text-sm leading-6 text-slate-700" x-text="text(method, 'desc')"></p>

                            <div class="mt-5 space-y-1 ps-5 text-sm leading-6 text-slate-700" x-show="method.details">
                                <template x-for="detail in method.details" :key="detail.labelEn">
                                    <p>
                                        <span x-text="text(detail, 'label')"></span><span>: </span><span x-text="text(detail, 'value')"></span>
                                    </p>
                                </template>
                            </div>

                            <a x-show="method.ctaUrl" :href="method.ctaUrl"
                                class="mt-6 inline-flex h-10 items-center justify-center bg-slate-200 px-5 text-sm font-medium text-slate-700 transition hover:bg-spu-blue hover:text-white"
                                x-text="method.ctaEn ? text(method, 'cta') : ''"></a>
                        </article>
                    </template>
                </div>
            </section>

            <section class="mt-16 border-s-4 border-spu-red ps-6">
                <div class="mb-4 flex items-center gap-3">
                    <span class="inline-flex h-5 w-5 items-center justify-center rounded-full border border-spu-red text-xs font-black text-spu-red" aria-hidden="true">i</span>
                    <h2 class="text-[26px] font-black leading-tight text-spu-blue" x-text="text(page, 'notesTitle')"></h2>
                </div>
                <div class="space-y-3 text-sm leading-6 text-slate-700">
                    <template x-for="note in page.notes" :key="note.en">
                        <p x-text="isAr ? note.ar : note.en"></p>
                    </template>
                </div>
            </section>
        </div>
    </section>
</div>
