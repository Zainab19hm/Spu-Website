<section
    class="relative min-h-[65vh] md:min-h-[75vh] lg:min-h-[85vh] flex items-center justify-center overflow-hidden font-hacen mx-auto">
    <div class="absolute inset-0 z-0">
        <img :src="$store.dentalClinicPage.hero.image"
            class="w-full h-full object-cover transform scale-[1.05] transition-transform duration-[10000ms] hover:scale-100"
            alt="Dental Clinic Hero">
        <div class="absolute inset-0 bg-gradient-to-t from-spu-blue/90 via-spu-blue/60 to-spu-blue/0"></div>
    </div>

    <div class="container relative z-10 pb-12 pt-40 mx-auto text-center ">
        <div class="w-[70%] text-center mx-auto" data-reveal="left">
            <nav
                class="flex flex-wrap justify-center items-center gap-2 text-white/70 text-sm md:text-base font-medium mb-6">
                <a :href="siteRoutes.home" class="hover:text-white transition-colors"
                    x-text="$store.app.currentLang === 'ar' ? $store.dentalClinicPage.hero.breadcrumbHomeAr : $store.dentalClinicPage.hero.breadcrumbHomeEn"></a>
                <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2.5 w-2.5 rtl:rotate-180" aria-hidden="true">
                <a :href="siteRoutes.studentLife" class="hover:text-white transition-colors"
                    x-text="$store.app.currentLang === 'ar' ? $store.dentalClinicPage.hero.breadcrumbCampusAr : $store.dentalClinicPage.hero.breadcrumbCampusEn"></a>
                <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2.5 w-2.5 rtl:rotate-180" aria-hidden="true">
                <span class="text-white font-semibold"
                    x-text="$store.app.currentLang === 'ar' ? $store.dentalClinicPage.hero.breadcrumbCurrentAr : $store.dentalClinicPage.hero.breadcrumbCurrentEn"></span>
            </nav>

            <h1 class="text-4xl sm:text-2xl md:text-[50px]  font-bold text-white mb-6 tracking-tight leading-[1.05]"
                x-text="$store.app.currentLang === 'ar' ? $store.dentalClinicPage.hero.titleAr : $store.dentalClinicPage.hero.titleEn">
            </h1>
            <p class="mx-auto text-base sm:text-lg md:text-[20px] text-white/90 mb-10 leading-relaxed "
                x-text="$store.app.currentLang === 'ar' ? $store.dentalClinicPage.hero.summaryAr : $store.dentalClinicPage.hero.summaryEn">
            </p>

            <a :href="$store.dentalClinicPage.hero.ctaUrl" target="_blank" rel="noreferrer noopener"
                class="inline-flex items-center justify-center gap-3 px-10 py-4 bg-spu-red text-white rounded-full font-semibold shadow-2xl shadow-spu-red/20 hover:bg-white hover:text-spu-blue transition-all duration-300">
                <span
                    x-text="$store.app.currentLang === 'ar' ? $store.dentalClinicPage.hero.ctaAr : $store.dentalClinicPage.hero.ctaEn"></span>
                <img src="/images/icon-map-outline.svg" alt="" class="h-5 w-5 brightness-0 invert" aria-hidden="true">
            </a>
        </div>
    </div>

</section>
