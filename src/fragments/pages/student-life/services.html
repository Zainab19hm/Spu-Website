<!-- Campus Services — scroll-reveal alternating sections with timeline -->
<section id="services" x-data="{
    initReveal() {
        this.$nextTick(() => {
            this.$root.querySelectorAll('[data-reveal]').forEach(el => {
                const obs = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            obs.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.15, rootMargin: '0px' });
                obs.observe(el);
            });
        });
    }
}" x-init="initReveal()" class="pt-24 pb-8 font-hacen">
    <span id="health" class="invisible absolute -mt-24"></span>
    <span id="activities" class="invisible absolute -mt-24"></span>
    <span id="career" class="invisible absolute -mt-24"></span>

    <style>
        [data-reveal] { opacity: 0; transform: translateY(48px); transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
        [data-reveal].is-visible { opacity: 1; transform: translateY(0); }
        [data-reveal="left"] { transform: translateX(-60px) translateY(0); }
        [data-reveal="left"].is-visible { transform: translateX(0) translateY(0); }
        [data-reveal="right"] { transform: translateX(60px) translateY(0); }
        [data-reveal="right"].is-visible { transform: translateX(0) translateY(0); }
        @media (prefers-reduced-motion: reduce) {
            [data-reveal] { opacity: 1 !important; transform: none !important; transition: none !important; }
        }
    </style>

    <!-- Section header -->
    <div class="container mb-8">
        <div class="mx-auto max-w-[640px] text-center">
            <p class="text-sm font-bold uppercase tracking-[0.2em] text-spu-red/60"
               x-text="$store.app.currentLang === 'ar' ? 'خدماتنا' : 'OUR SERVICES'"></p>
            <h2 class="mt-3 text-4xl font-bold leading-tight tracking-tight text-spu-blue md:text-5xl"
                x-text="$store.app.currentLang === 'ar' ? 'كل ما تحتاجه في مكان واحد' : 'Everything You Need in One Place'"></h2>
        </div>
    </div>

    <div class="relative">
        <!-- Center vertical line (desktop) -->
        <div class="absolute left-1/2 top-0 bottom-0 hidden w-px -translate-x-1/2 bg-gradient-to-b from-spu-blue/20 via-slate-200/60 to-transparent lg:block" aria-hidden="true"></div>

        <template x-for="(service, idx) in $store.studentLifePage.services" :key="service.titleEn">
            <div class="relative" :class="idx % 2 !== 0 ? 'bg-section' : ''">
                <!-- Timeline dot -->
                <div class="absolute left-1/2 top-1/2 z-10 hidden h-[18px] w-[18px] -translate-x-1/2 -translate-y-1/2 rounded-full border-[3px] border-white shadow-md lg:block"
                     :class="idx === 0 ? 'bg-spu-blue' : 'bg-slate-300'"
                     aria-hidden="true"></div>

                <div class="container py-16 lg:py-24">
                    <div class="flex flex-col items-center gap-10 lg:gap-20"
                         :class="service.imagePosition === 'right' ? 'lg:flex-row' : 'lg:flex-row-reverse'">

                        <!-- Text column -->
                        <div class="flex-1 min-w-0"
                             :data-reveal="service.imagePosition === 'right' ? 'left' : 'right'">
                            <div class="max-w-[530px]"
                                 :class="service.imagePosition === 'left' ? 'lg:ms-auto' : ''">
                                <!-- Number -->
                                <p class="text-7xl font-bold tracking-tight text-spu-blue/[0.06]"
                                   x-text="service.number"></p>
                                <!-- Title -->
                                <h3 class="-mt-2 text-[32px] font-bold leading-tight tracking-tight text-spu-blue"
                                    x-text="$store.app.currentLang === 'ar' ? service.titleAr : service.titleEn"></h3>
                                <!-- Description -->
                                <p class="mt-4 max-w-[500px] text-lg leading-relaxed text-slate-500"
                                   :class="service.imagePosition === 'left' ? 'lg:ms-auto' : ''"
                                   x-text="$store.app.currentLang === 'ar' ? service.summaryAr : service.summaryEn"></p>
                                <!-- Link -->
                                <a href="#" class="group mt-8 inline-flex items-center gap-2.5 rounded-full border border-spu-blue/10 bg-spu-blue/[0.03] px-6 py-3 text-base font-bold text-spu-red transition-all duration-300 hover:border-spu-red/20 hover:bg-spu-red/[0.04] hover:shadow-[0_4px_16px_rgba(111,22,22,0.08)]">
                                    <span x-text="$store.app.currentLang === 'ar' ? service.linkAr : service.linkEn"></span>
                                    <i class="fas fa-arrow-right text-sm transition-transform duration-300 group-hover:translate-x-1 rtl:rotate-180 rtl:group-hover:-translate-x-1"></i>
                                </a>
                            </div>
                        </div>

                        <!-- Image column -->
                        <div class="w-full shrink-0 lg:w-[500px]"
                             :data-reveal="service.imagePosition === 'right' ? 'right' : 'left'">
                            <div class="relative overflow-hidden rounded-3xl shadow-[0_12px_40px_rgba(0,0,0,0.1)] transition-all duration-700 hover:shadow-[0_20px_60px_rgba(0,0,0,0.14)]">
                                <img :src="service.image"
                                     :alt="$store.app.currentLang === 'ar' ? service.titleAr : service.titleEn"
                                     class="h-[360px] w-full object-cover transition-transform duration-700 hover:scale-[1.03]">
                                <!-- Subtle gradient overlay -->
                                <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-spu-blue/10 to-transparent"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
</section>
