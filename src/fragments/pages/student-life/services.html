<!-- Campus Services vertical timeline -->
<section id="services" x-data class="pt-24 pb-8 font-hacen">
    <span id="health" class="invisible absolute -mt-24"></span>
    <span id="activities" class="invisible absolute -mt-24"></span>

    <div class="relative">
        <!-- Center vertical line (visible on lg+) -->
        <div class="absolute left-1/2 top-0 bottom-0 hidden w-px -translate-x-1/2 bg-slate-300/60 lg:block" aria-hidden="true"></div>

        <template x-for="(service, idx) in $store.studentLifePage.services" :key="service.titleEn">
            <div class="relative" :class="idx % 2 !== 0 ? 'bg-section' : ''">
                <!-- Timeline dot (visible on lg+) -->
                <div class="absolute left-1/2 top-1/2 z-10 hidden h-[23px] w-[23px] -translate-x-1/2 -translate-y-1/2 rounded-full border-[3px] lg:block"
                     :class="idx === 0 ? 'border-spu-blue bg-spu-blue' : 'border-slate-400 bg-white'"
                     aria-hidden="true"></div>

                <div class="container py-12 lg:py-16">
                    <div class="flex flex-col items-center gap-10 lg:gap-[259px]"
                         :class="service.imagePosition === 'right' ? 'lg:flex-row' : 'lg:flex-row-reverse'">

                        <!-- Text column -->
                        <div class="flex-1 min-w-0">
                            <div class="max-w-[530px]" :class="service.imagePosition === 'right' ? '' : 'lg:ml-auto'">
                                <p class="text-5xl font-bold tracking-tight text-spu-blue/20"
                                   x-text="service.number"></p>
                                <h3 class="mt-2 text-[32px] font-bold leading-tight tracking-tight text-[#091144]"
                                    x-text="$store.app.currentLang === 'ar' ? service.titleAr : service.titleEn"></h3>
                                <p class="mt-4 max-w-[550px] text-[22px] leading-6 text-[#46464f]"
                                   x-text="$store.app.currentLang === 'ar' ? service.summaryAr : service.summaryEn"></p>
                                <a href="#" class="mt-6 inline-flex items-center gap-1 text-base font-semibold text-spu-red transition hover:opacity-80">
                                    <span x-text="$store.app.currentLang === 'ar' ? service.linkAr : service.linkEn"></span>
                                    <i class="fas fa-arrow-right text-sm" :class="$store.app.currentLang === 'ar' ? 'rotate-180' : ''"></i>
                                </a>
                            </div>
                        </div>

                        <!-- Image column -->
                        <div class="w-full shrink-0 lg:w-[505px]">
                            <div class="overflow-hidden border border-slate-300 shadow-sm">
                                <img :src="service.image"
                                     :alt="$store.app.currentLang === 'ar' ? service.titleAr : service.titleEn"
                                     class="h-[337px] w-full object-cover">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
</section>
