<section class="bg-white py-16 font-hacen md:py-20" x-data>
  <div class="container ">
    <h2 class="text-center text-3xl font-bold text-spu-blue md:text-4xl"
        x-text="$store.app.currentLang === 'ar' ? $store.studentLifePage.careerDevelopment.services.titleAr : $store.studentLifePage.careerDevelopment.services.titleEn"></h2>

    <div class="mt-10 grid gap-7 md:grid-cols-2 lg:grid-cols-3">
      <template x-for="card in $store.studentLifePage.careerDevelopment.services.items" :key="card.id">
        <article :id="card.id"
                 class="min-h-[174px] rounded-md border border-slate-200 bg-white p-6 shadow-[0_10px_24px_rgba(15,23,42,0.08)] transition duration-200 hover:-translate-y-1 hover:shadow-[0_18px_34px_rgba(15,23,42,0.12)]">
          <div class="flex items-start justify-between gap-4">
            <h3 class="text-base font-bold text-spu-blue"
                x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn"></h3>
            <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[#f3f6fb]">
              <img :src="card.icon" alt="" class="h-4 w-4 opacity-85" aria-hidden="true">
            </span>
          </div>
          <p class="mt-3 text-xs leading-5 text-slate-600"
             x-text="$store.app.currentLang === 'ar' ? card.summaryAr : card.summaryEn"></p>
          <a :href="card.href"
             class="mt-5 inline-flex items-center gap-2 text-xs font-bold text-spu-blue transition hover:text-spu-red">
            <span x-text="$store.app.currentLang === 'ar' ? card.linkAr : card.linkEn"></span>
            <img src="/images/icon-arrow-right-outline.svg" alt="" class="h-2.5 w-2.5 rtl:rotate-180" aria-hidden="true">
          </a>
        </article>
      </template>
    </div>
  </div>
</section>
