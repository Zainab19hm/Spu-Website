<section class="relative bg-white font-hacen pt-8"
         x-data="{
           get page() { return $store.careersPage },
           get isAr() { return $store.app.currentLang === 'ar' },
           slug: document.querySelector('main[data-page-content]')?.dataset?.slug || '',
           get job() { return this.slug ? this.page.jobs.find(j => j.slug === this.slug) : this.page.currentJob() }
         }">
  <div class="relative h-auto w-full overflow-hidden pt-16">
    <!-- Content -->
    <div class="container relative z-10">
      <div class="mx-auto grid max-w-[1100px] grid-cols-1 gap-6 lg:grid-cols-[1fr_320px]">

        <!-- Left: main job info -->
        <div class="text-center lg:text-left"
             :class="isAr ? 'lg:text-right' : 'lg:text-left'">

          <!-- Breadcrumb -->
          <nav class="animate-fade-in flex flex-wrap items-center justify-start gap-2 text-[11px] font-semibold text-slate-500"
               aria-label="Breadcrumb">
            <a href="/" class="transition hover:text-spu-blue" x-text="page.localized('labels', 'homeLabel')"></a>
            <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2.5 w-2.5 rtl:rotate-180" aria-hidden="true">
            <a href="/campus-life/" class="transition hover:text-spu-blue" x-text="isAr ? 'الحياة الجامعية' : 'Campus Life'"></a>
            <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2.5 w-2.5 rtl:rotate-180" aria-hidden="true">
            <a href="/campus-life/career-development/" class="transition hover:text-spu-blue" x-text="isAr ? 'التطوير المهني' : 'Career Development'"></a>
            <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2.5 w-2.5 rtl:rotate-180" aria-hidden="true">
            <span class="text-spu-blue" x-text="isAr ? job?.titleAr : job?.titleEn"></span>
          </nav>

          <!-- Content card -->
          <div class="mt-6 animate-fade-in-up rounded-lg border border-slate-200 bg-white p-6 shadow-[0_10px_24px_rgba(15,23,42,0.06)] md:mt-8 md:p-8"
               style="animation-delay: 120ms;">

            <!-- Job type badge -->
            <span class="inline-flex items-center rounded-[4px] bg-spu-red px-3 py-1.5 text-[10px] font-bold uppercase tracking-wider text-white shadow-sm"
                  x-show="job"
                  x-text="page.labelForType(job?.type)">
            </span>

            <!-- Title -->
            <h1 class="mt-4 text-3xl font-bold leading-[1.15] text-spu-blue md:text-4xl lg:text-[42px]"
                x-text="isAr ? job?.titleAr : job?.titleEn">
            </h1>

            <!-- Subtitle -->
            <p class=" mt-4 max-w-[600px] text-[15px] leading-relaxed text-slate-600 md:text-base"
               
               x-text="isAr ? job?.shortDescriptionAr : job?.shortDescriptionEn">
            </p>

            <!-- Apply button -->
            <div class="mt-7">
              <button type="button"
                      disabled
                      class="animate-fade-in-up inline-flex h-11 cursor-not-allowed items-center justify-center rounded-md bg-slate-100 px-6 text-[12px] font-bold uppercase tracking-wider text-slate-500 transition disabled:opacity-80"
                      style="animation-delay: 240ms;"
                      :title="page.localized('labels', 'applyDisabled')"
                      x-text="page.localized('labels', 'applyNow')">
              </button>
            </div>

            <!-- Disabled note -->
            <p class="animate-fade-in mt-3 text-[11px] font-medium text-slate-500"
               style="animation-delay: 320ms;"
               x-text="page.localized('labels', 'applyDisabled')">
            </p>
          </div>
        </div>

        <!-- Right: share + similar jobs -->
        <div class="flex flex-col gap-4 lg:pt-12"
             :class="isAr ? 'lg:text-right' : 'lg:text-left'"
             x-show="job"
             x-cloak>

          <!-- Share -->
          <div class="animate-fade-in-up rounded-lg border border-slate-200 bg-white p-5 shadow-[0_10px_24px_rgba(15,23,42,0.06)]"
               style="animation-delay: 200ms;">
            <h3 class="text-[12px] font-bold uppercase tracking-wider text-spu-blue"
                x-text="isAr ? 'مشاركة الوظيفة' : 'Share This Job'"></h3>

            <div class="mt-4 flex flex-wrap gap-2">
              <a :href="`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(page.shareUrl())}`"
                 target="_blank"
                 rel="noopener noreferrer"
                 class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 text-spu-blue transition hover:border-spu-blue hover:bg-spu-blue hover:text-white"
                 aria-label="Facebook">
                <img src="/images/icon-facebook-outline.svg" alt="" class="h-3.5 w-3.5" aria-hidden="true">
              </a>
              <a :href="`https://t.me/share/url?url=${encodeURIComponent(page.shareUrl())}&text=${encodeURIComponent(page.shareText())}`"
                 target="_blank"
                 rel="noopener noreferrer"
                 class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 text-spu-blue transition hover:border-spu-blue hover:bg-spu-blue hover:text-white"
                 aria-label="Telegram">
                <img src="/images/icon-telegram-outline.svg" alt="" class="h-3.5 w-3.5" aria-hidden="true">
              </a>
              <a :href="`https://api.whatsapp.com/send?text=${encodeURIComponent(page.shareText() + ' ' + page.shareUrl())}`"
                 target="_blank"
                 rel="noopener noreferrer"
                 class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 text-spu-blue transition hover:border-spu-blue hover:bg-spu-blue hover:text-white"
                 aria-label="WhatsApp">
                <svg class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                </svg>
              </a>
              <button type="button"
                      class="flex h-9 items-center gap-2 rounded-full border border-slate-200 px-3 text-[11px] font-bold text-spu-blue transition hover:border-spu-blue hover:bg-spu-blue hover:text-white"
                      @click="page.copyLink()">
                <span x-text="page.copiedLink ? page.localized('labels', 'copied') : page.localized('labels', 'copyLink')"></span>
              </button>
            </div>
          </div>

          <!-- Similar jobs -->
          <div class="animate-fade-in-up rounded-lg border border-slate-200 bg-white p-5 shadow-[0_10px_24px_rgba(15,23,42,0.06)]"
               style="animation-delay: 280ms;"
               x-show="page.relatedJobs().length > 0">
            <h3 class="text-[12px] font-bold uppercase tracking-wider text-spu-blue"
                x-text="isAr ? 'وظائف مشابهة' : 'Similar Jobs'"></h3>
            <ul class="mt-3 space-y-2">
              <template x-for="related in page.relatedJobs()" :key="related.id">
                <li>
                  <a :href="page.jobHref(related.slug)"
                     class="group block text-sm font-bold text-spu-blue transition hover:text-spu-red">
                    <span x-text="isAr ? related.titleAr : related.titleEn"></span>
                    <span class="mt-0.5 block text-[10px] font-medium text-slate-500"
                          x-text="page.labelForCategory(related.category)"></span>
                  </a>
                </li>
              </template>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.8s ease-out forwards;
      opacity: 0;
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
      opacity: 0;
    }

    [dir="rtl"] .animate-fade-in-up {
      animation-name: fadeInUp;
    }
  </style>
</section>
