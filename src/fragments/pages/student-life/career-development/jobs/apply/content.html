<section class="bg-white py-12 font-hacen md:py-16"
         x-data="{
           get isAr() { return $store.app.currentLang === 'ar' },
           init() {
             $store.dynamicForm.open('job-application');
           }
         }">

    <div class="container mx-auto ">
        <div class="mx-auto ">

            <!-- Job info card -->
            <div class="mb-8 rounded-2xl border border-spu-blue/10 bg-spu-blue/[0.03] p-6">
                <div class="flex items-start gap-4">
                    <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-spu-blue/10">
                        <svg class="h-6 w-6 text-spu-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-spu-blue"
                            x-text="isAr ? 'معلومات التقديم' : 'Application Information'"></h2>
                        <p class="mt-1 text-sm text-spu-blue/60"
                           x-text="isAr ? 'يرجى ملء جميع الحقول المطلوبة بدقة. ستتمكن من مراجعة بياناتك قبل الإرسال النهائي.' : 'Please fill in all required fields accurately. You will be able to review your data before final submission.'"></p>
                    </div>
                </div>
            </div>

            <!-- Dynamic form -->
            <div class="rounded-2xl bg-gray-50 p-6 sm:p-8">
                <include src="src/fragments/components/dynamic-form.html"></include>
            </div>

        </div>
    </div>
</section>
