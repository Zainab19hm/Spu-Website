<section class="relative min-h-[58vh] md:min-h-[68vh] flex items-center justify-center overflow-hidden font-hacen mx-auto">

        <div class="absolute inset-0 bg-gradient-to-t from-spu-blue/90 via-spu-blue/60 to-spu-blue/0"></div>
  </div>
  <div class="container relative z-10 pb-12 pt-40 mx-auto text-center">

    </nav>
    <h1 class="text-4xl md:text-[54px] font-bold text-white mb-6" x-text="$store.app.currentLang === 'ar' ? $store.healthInsurancePage.hero.titleAr : $store.healthInsurancePage.hero.titleEn"></h1>
