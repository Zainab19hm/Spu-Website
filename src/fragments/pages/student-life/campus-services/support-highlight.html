<section class="bg-white pb-16 font-hacen md:pb-20" x-data>
  <div class="container">
    <article class="grid overflow-hidden rounded-lg bg-spu-blue text-white shadow-[0_16px_36px_rgba(15,23,42,0.16)] lg:grid-cols-2">
      <img :src="$store.studentLifePage.campusServices.support.image"
           :alt="$store.app.currentLang === 'ar' ? $store.studentLifePage.campusServices.support.imageAltAr : $store.studentLifePage.campusServices.support.imageAltEn"
           class="h-64 w-full object-cover lg:h-full">
      <div class="flex flex-col justify-center p-7 md:p-9">
        <h3 class="mt-3 text-3xl font-bold md:text-3xl"
            x-text="$store.app.currentLang === 'ar' ? $store.studentLifePage.campusServices.support.titleAr : $store.studentLifePage.campusServices.support.titleEn"></h3>
        <p class="mt-4  text-xl leading-7 text-white/90"
           x-text="$store.app.currentLang === 'ar' ? $store.studentLifePage.campusServices.support.summaryAr : $store.studentLifePage.campusServices.support.summaryEn"></p>
        <div class="mt-6 grid gap-4 text-xs font-semibold sm:grid-cols-2">
          <template x-for="badge in $store.studentLifePage.campusServices.support.badges" :key="badge.labelEn">
            <span class="inline-flex items-center gap-2">
              <img :src="badge.icon" alt="" class="h-4 w-4 brightness-0 invert" aria-hidden="true">
              <span x-text="$store.app.currentLang === 'ar' ? badge.labelAr : badge.labelEn"></span>
            </span>
          </template>
        </div>
      </div>
    </article>
    <p class="mt-8 text-center text-xs font-bold uppercase tracking-[0.16em] text-spu-blue/45"
       x-text="$store.app.currentLang === 'ar' ? 'آخر مراجعة: أيار 2026' : 'Last reviewed: May 2026'"></p>
  </div>
</section>
