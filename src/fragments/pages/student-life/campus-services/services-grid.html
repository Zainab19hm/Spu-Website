<section class="bg-white py-14 font-hacen md:py-16" x-data>
  <div class="container">
    <h2 class="text-center text-3xl font-bold text-spu-blue md:text-4xl"
        x-text="$store.app.currentLang === 'ar' ? $store.studentLifePage.campusServices.services.titleAr : $store.studentLifePage.campusServices.services.titleEn"></h2>

    <div class="mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-6">
      <template x-for="card in $store.studentLifePage.campusServices.services.items" :key="card.id">
        <article class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-[0_8px_20px_rgba(15,23,42,0.08)] transition duration-200 hover:-translate-y-1 hover:shadow-[0_14px_30px_rgba(15,23,42,0.12)]" :class="card.wide ? 'lg:col-span-3' : 'lg:col-span-2'">
          <img :src="card.image"
               :alt="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn"
               class="h-40 w-full object-cover">
          <div class="p-4">
            <h3 class="text-base font-bold text-spu-blue"
                x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn"></h3>
            <div class="mt-3 rounded-md bg-[#f3f7fe] p-3 text-xs leading-5 text-slate-700">
              <p class="flex items-center gap-2 font-semibold text-spu-blue">
                <img src="/images/icon-file-outline.svg" alt="" class="h-3 w-3" aria-hidden="true">
                <span x-text="$store.app.currentLang === 'ar' ? $store.studentLifePage.campusServices.services.accessLabelAr : $store.studentLifePage.campusServices.services.accessLabelEn"></span>
              </p>
              <p class="mt-1" x-text="$store.app.currentLang === 'ar' ? card.accessAr : card.accessEn"></p>
            </div>
            <a :href="card.href" class="mt-4 inline-flex items-center gap-2 text-xs font-bold text-spu-blue transition hover:text-spu-red">
              <span x-text="$store.app.currentLang === 'ar' ? $store.studentLifePage.campusServices.services.detailsLabelAr : $store.studentLifePage.campusServices.services.detailsLabelEn"></span>
              <img src="/images/icon-arrow-right-outline.svg" alt="" class="h-2.5 w-2.5 rtl:rotate-180" aria-hidden="true">
            </a>
          </div>
        </article>
      </template>
    </div>
  </div>
</section>
