<!-- Digital Portals — quick access cards -->
<section x-data class="py-20 font-hacen lg:py-28">
    <div class="container">
        <!-- Section header -->
        <div class="mx-auto max-w-[640px] text-center">
            <p class="text-sm font-bold uppercase tracking-[0.2em] text-spu-red/60"
               x-text="$store.app.currentLang === 'ar' ? 'الوصول الرقمي' : 'DIGITAL ACCESS'"></p>
            <h2 class="mt-3 text-4xl font-bold leading-tight tracking-tight text-spu-blue md:text-5xl"
                x-text="$store.app.currentLang === 'ar' ? 'بوابات الخدمات الرقمية' : 'Digital Service Portals'"></h2>
        </div>

        <!-- Portal cards -->
        <div class="mx-auto mt-14 grid max-w-[1000px] grid-cols-1 gap-6 md:grid-cols-3">
            <template x-for="portal in $store.studentLifePage.portals" :key="portal.titleEn">
                <a :href="portal.protected ? '#' : portal.url"
                   @click="if (portal.protected) { $event.preventDefault(); $store.auth.requestProtectedAccess(portal.url); }"
                   class="group relative flex flex-col items-center overflow-hidden rounded-2xl border border-slate-100 bg-white p-8 text-center shadow-[0_4px_20px_rgba(0,0,0,0.04)] transition-all duration-400 hover:-translate-y-2 hover:border-spu-blue/10 hover:shadow-[0_20px_50px_rgba(32,39,89,0.1)]">
                    <!-- Top accent -->
                    <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-spu-blue to-spu-red opacity-0 transition-opacity duration-300 group-hover:opacity-100" aria-hidden="true"></div>

                    <!-- Icon -->
                    <div class="mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-spu-blue/5 text-spu-blue transition-all duration-300 group-hover:bg-spu-blue group-hover:text-white group-hover:shadow-[0_8px_24px_rgba(32,39,89,0.2)]">
                        <i :class="portal.icon" class="text-2xl"></i>
                    </div>

                    <!-- Title -->
                    <h3 class="text-lg font-bold text-spu-blue"
                        x-text="$store.app.currentLang === 'ar' ? portal.titleAr : portal.titleEn"></h3>

                    <!-- Summary -->
                    <p class="mt-2 text-sm leading-relaxed text-slate-500"
                       x-text="$store.app.currentLang === 'ar' ? portal.summaryAr : portal.summaryEn"></p>

                    <!-- Arrow indicator -->
                    <div class="mt-5 flex h-10 w-10 items-center justify-center rounded-full bg-slate-50 text-spu-blue transition-all duration-300 group-hover:bg-spu-red group-hover:text-white">
                        <i class="fas fa-arrow-right text-sm rtl:rotate-180"></i>
                    </div>
                </a>
            </template>
        </div>
    </div>
</section>
