<!-- Campus Gallery — masonry-style image showcase -->
<section x-data="{ activeImage: null }" class="bg-section py-20 font-hacen lg:py-28">
    <div class="container">
        <!-- Section header -->
        <div class="mx-auto max-w-[640px] text-center">
            <p class="text-sm font-bold uppercase tracking-[0.2em] text-spu-red/60"
               x-text="$store.app.currentLang === 'ar' ? $store.studentLifePage.gallery.eyebrowAr : $store.studentLifePage.gallery.eyebrowEn"></p>
            <h2 class="mt-3 text-4xl font-bold leading-tight tracking-tight text-spu-blue md:text-5xl"
                x-text="$store.app.currentLang === 'ar' ? $store.studentLifePage.gallery.titleAr : $store.studentLifePage.gallery.titleEn"></h2>
            <p class="mt-5 text-base leading-relaxed text-slate-500"
               x-text="$store.app.currentLang === 'ar' ? $store.studentLifePage.gallery.summaryAr : $store.studentLifePage.gallery.summaryEn"></p>
        </div>

        <!-- Gallery grid -->
        <div class="mx-auto mt-14 grid max-w-[1200px] grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <template x-for="(img, idx) in $store.studentLifePage.gallery.images" :key="img.src">
                <div class="group relative cursor-pointer overflow-hidden rounded-2xl shadow-[0_4px_16px_rgba(0,0,0,0.06)] transition-all duration-500 hover:-translate-y-1 hover:shadow-[0_16px_48px_rgba(0,0,0,0.12)]"
                     :class="idx === 0 ? 'sm:col-span-2 sm:row-span-2' : ''"
                     @click="activeImage = img">
                    <img :src="img.src"
                         :alt="$store.app.currentLang === 'ar' ? img.altAr : img.altEn"
                         class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-105"
                         :class="idx === 0 ? 'min-h-[300px] sm:min-h-[480px]' : 'h-[240px]'">
                    <!-- Hover overlay -->
                    <div class="absolute inset-0 flex items-end bg-gradient-to-t from-spu-blue/60 via-transparent to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100">
                        <div class="p-6">
                            <p class="text-sm font-bold text-white"
                               x-text="$store.app.currentLang === 'ar' ? img.altAr : img.altEn"></p>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Lightbox modal -->
    <div x-show="activeImage"
         x-transition:enter="transition duration-300 ease-out"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition duration-200 ease-in"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="activeImage = null"
         @keydown.escape.window="activeImage = null"
         class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm"
         style="display: none;"
         role="dialog"
         aria-modal="true">
        <button type="button"
                @click="activeImage = null"
                class="absolute right-6 top-6 flex h-10 w-10 items-center justify-center rounded-full bg-white/10 text-white transition hover:bg-white/20"
                aria-label="Close">
            <img src="/images/icon-close-outline.svg" alt="" class="h-5 w-5" aria-hidden="true">
        </button>
        <img x-show="activeImage"
             :src="activeImage?.src"
             :alt="$store.app.currentLang === 'ar' ? activeImage?.altAr : activeImage?.altEn"
             class="max-h-[85vh] max-w-full rounded-2xl object-contain shadow-2xl"
             @click.stop>
    </div>
</section>
