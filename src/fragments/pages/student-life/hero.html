<!-- Campus Life Hero with full-bleed image -->
<section x-data class="relative min-h-[615px] overflow-hidden font-hacen">
    <!-- Background image -->
    <div class="absolute inset-0">
        <img :src="$store.studentLifePage.hero.image" alt="" class="h-full w-full object-cover" aria-hidden="true">
        <div class="absolute inset-0 bg-spu-blue/50 mix-blend-multiply"></div>
        <div class="absolute inset-x-0 bottom-0 h-[45%] bg-gradient-to-t from-[#fbf8fd] via-[rgba(251,248,253,0)] to-transparent opacity-70"></div>
    </div>

    <!-- Centered content -->
    <div class="container relative z-10 flex min-h-[615px] items-center justify-center text-center">
        <div class="mx-auto max-w-[800px]">
            <h1 class="text-5xl font-bold tracking-tight text-white"
                x-text="$store.app.currentLang === 'ar' ? $store.studentLifePage.hero.titleAr : $store.studentLifePage.hero.titleEn">
            </h1>
            <p class="mx-auto mt-5 max-w-[640px] text-lg font-bold leading-relaxed text-white"
               x-text="$store.app.currentLang === 'ar' ? $store.studentLifePage.hero.summaryAr : $store.studentLifePage.hero.summaryEn">
            </p>

            <!-- Quick-link pills -->
            <div class="mt-10 flex flex-wrap items-center justify-center gap-2">
                <template x-for="link in $store.studentLifePage.hero.quickLinks" :key="link.labelEn">
                    <a :href="link.href"
                       class="rounded-xl border border-white/20 bg-white/10 px-[17px] py-2 text-sm font-bold leading-5 text-white backdrop-blur-sm transition hover:bg-white/20"
                       x-text="$store.app.currentLang === 'ar' ? link.labelAr : link.labelEn">
                    </a>
                </template>
            </div>
        </div>
    </div>
</section>

<!-- Overlapping introduction card -->
<section x-data class="relative z-10 -mt-16 font-hacen">
    <div class="container">
        <div class="mx-auto max-w-[896px] rounded bg-spu-blue p-8 text-center text-white shadow-sm backdrop-blur-md">
            <h2 class="text-[32px] font-bold leading-tight tracking-tight"
                x-text="$store.app.currentLang === 'ar' ? $store.studentLifePage.intro.titleAr : $store.studentLifePage.intro.titleEn"></h2>
            <p class="mx-auto mt-3 max-w-[672px] text-base leading-6 text-white/90"
               x-text="$store.app.currentLang === 'ar' ? $store.studentLifePage.intro.summaryAr : $store.studentLifePage.intro.summaryEn"></p>
        </div>
    </div>
</section>
