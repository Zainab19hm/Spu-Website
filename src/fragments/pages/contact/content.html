<section x-data class="bg-white py-16 font-hacen lg:py-24">
    <div class="container">
        <div class="grid gap-16 lg:grid-cols-2">
            
            <!-- Left: Contact Form -->
            <div class="space-y-8">
                <h2 class="text-3xl font-bold text-spu-blue" 
                    x-text="$store.app.currentLang === 'ar' ? $store.contactPage.form.titleAr : $store.contactPage.form.titleEn"></h2>
                
                <form class="grid gap-6">
                    <div class="grid gap-6 md:grid-cols-2">
                        <div class="space-y-2">
                            <label class="text-sm font-medium text-slate-600" x-text="$store.app.currentLang === 'ar' ? $store.contactPage.form.fields.name.labelAr : $store.contactPage.form.fields.name.labelEn"></label>
                            <input type="text" class="w-full rounded-lg border border-slate-200 bg-white px-4 py-3 outline-none transition-all focus:border-spu-red/50 focus:ring-4 focus:ring-spu-red/5">
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-medium text-slate-600" x-text="$store.app.currentLang === 'ar' ? $store.contactPage.form.fields.email.labelAr : $store.contactPage.form.fields.email.labelEn"></label>
                            <input type="email" class="w-full rounded-lg border border-slate-200 bg-white px-4 py-3 outline-none transition-all focus:border-spu-red/50 focus:ring-4 focus:ring-spu-red/5">
                        </div>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-600" x-text="$store.app.currentLang === 'ar' ? $store.contactPage.form.fields.subject.labelAr : $store.contactPage.form.fields.subject.labelEn"></label>
                        <input type="text" class="w-full rounded-lg border border-slate-200 bg-white px-4 py-3 outline-none transition-all focus:border-spu-red/50 focus:ring-4 focus:ring-spu-red/5">
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-600" x-text="$store.app.currentLang === 'ar' ? $store.contactPage.form.fields.message.labelAr : $store.contactPage.form.fields.message.labelEn"></label>
                        <textarea rows="6" class="w-full rounded-lg border border-slate-200 bg-white px-4 py-3 outline-none transition-all focus:border-spu-red/50 focus:ring-4 focus:ring-spu-red/5"></textarea>
                    </div>
                    
                    <div>
                        <button type="submit" class="bg-spu-red px-8 py-3 font-bold text-white transition-all hover:bg-spu-red/90 hover:shadow-lg active:scale-95"
                                x-text="$store.app.currentLang === 'ar' ? $store.contactPage.form.submitAr : $store.contactPage.form.submitEn"></button>
                    </div>
                </form>
            </div>

            <!-- Right: Contact Info -->
                <div class="space-y-4">
                    <p class="text-spu-red font-bold uppercase tracking-widest text-xs"
                       x-text="$store.date.getFormattedDate($store.app.currentLang)"></p>
                    <h2 class="text-3xl font-bold text-spu-blue" 
                        x-text="$store.app.currentLang === 'ar' ? $store.contactPage.info.titleAr : $store.contactPage.info.titleEn"></h2>
                </div>
                
                <div class="grid gap-10 sm:grid-cols-2">
                    <!-- Call Us -->
                    <div class="flex gap-4">
                        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-spu-blue text-white">
                            <i class="fas fa-phone-alt text-sm"></i>
                        </div>
                        <div class="space-y-1">
                            <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400" 
                               x-text="$store.app.currentLang === 'ar' ? $store.contactPage.info.callUs.labelAr : $store.contactPage.info.callUs.labelEn"></p>
                            <p class="text-sm font-bold text-spu-blue" x-text="$store.contactPage.info.callUs.value"></p>
                        </div>
                    </div>

                    <!-- Address -->
                    <div class="flex gap-4">
                        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-spu-blue text-white">
                            <i class="fas fa-map-marker-alt text-sm"></i>
                        </div>
                        <div class="space-y-1">
                            <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400" 
                               x-text="$store.app.currentLang === 'ar' ? $store.contactPage.info.address.labelAr : $store.contactPage.info.address.labelEn"></p>
                            <p class="text-[13px] font-medium leading-relaxed text-slate-600" 
                               x-text="$store.app.currentLang === 'ar' ? $store.contactPage.info.address.valueAr : $store.contactPage.info.address.valueEn"></p>
                        </div>
                    </div>

                    <!-- Email Us -->
                    <div class="flex gap-4">
                        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-spu-blue text-white">
                            <i class="fas fa-envelope text-sm"></i>
                        </div>
                        <div class="space-y-1">
                            <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400" 
                               x-text="$store.app.currentLang === 'ar' ? $store.contactPage.info.emailUs.labelAr : $store.contactPage.info.emailUs.labelEn"></p>
                            <p class="text-sm font-bold text-spu-blue" x-text="$store.contactPage.info.emailUs.value"></p>
                        </div>
                    </div>

                    <!-- Office Hours -->
                    <div class="flex gap-4">
                        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-spu-blue text-white">
                            <i class="fas fa-clock text-sm"></i>
                        </div>
                        <div class="space-y-1">
                            <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400" 
                               x-text="$store.app.currentLang === 'ar' ? $store.contactPage.info.officeHours.labelAr : $store.contactPage.info.officeHours.labelEn"></p>
                            <p class="text-[13px] font-medium leading-relaxed text-slate-600" 
                               x-text="$store.app.currentLang === 'ar' ? $store.contactPage.info.officeHours.valueAr : $store.contactPage.info.officeHours.valueEn"></p>
                        </div>
                    </div>
                </div>

                <!-- Divider -->
                <div class="h-px w-full bg-slate-100"></div>

                <!-- Socials -->
                <div class="space-y-4">
                    <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400" 
                       x-text="$store.app.currentLang === 'ar' ? $store.contactPage.socialsTitleAr : $store.contactPage.socialsTitleEn"></p>
                    <div class="flex gap-3">
                        <template x-for="social in $store.contactPage.socials">
                            <a :href="social.url" class="flex h-10 w-10 items-center justify-center rounded-full bg-[#1e2756] text-white transition-all hover:bg-spu-red">
                                <i :class="social.icon"></i>
                            </a>
                        </template>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
