<section x-cloak
         x-data="{ get page() { return $store.servicesPage.library }, get isAr() { return $store.app.currentLang === 'ar' } }"
         class="relative flex min-h-[365px] items-center justify-center overflow-hidden pt-28 font-hacen">
  <img :src="page.hero.heroImage"
       :alt="isAr ? page.hero.titleAr : page.hero.titleEn"
       class="absolute inset-0 h-full w-full object-cover">
  <div class="absolute inset-0 bg-gradient-to-b from-[rgba(7,10,28,0.12)] to-[rgba(32,39,89,0.72)]"></div>
  <div class="container relative z-10 mx-auto py-5 text-center text-white">
    <nav class="mb-6 flex flex-wrap items-center justify-center gap-3 text-xs font-bold text-white/85" aria-label="Breadcrumb">
      <a href="/" class="transition hover:text-white"
         x-text="isAr ? 'الرئيسية' : 'Home'"></a>
      <span aria-hidden="true">›</span>
      <a href="/e-services/" class="transition hover:text-white"
         x-text="isAr ? 'الخدمات الإلكترونية' : 'E-Services'"></a>
      <span aria-hidden="true">›</span>
      <span x-text="isAr ? page.hero.titleAr : page.hero.titleEn"></span>
    </nav>
    <p class="mb-3 text-xs font-black uppercase tracking-widest text-white/70"
       x-text="isAr ? page.hero.eyebrowAr : page.hero.eyebrowEn"></p>
    <h1 class="text-4xl font-black leading-tight text-white md:text-5xl"
        x-text="isAr ? page.hero.titleAr : page.hero.titleEn"></h1>
    <p class="mx-auto mt-5 max-w-[640px] text-base leading-relaxed text-white/90"
       x-text="isAr ? page.hero.summaryAr : page.hero.summaryEn"></p>
  </div>
</section>

<section x-cloak class="bg-white py-20 font-hacen"
         x-data="{ get page() { return $store.servicesPage.library }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container mx-auto max-w-5xl px-6">
    <h2 class="mb-8 text-center text-3xl font-black text-spu-blue md:text-4xl"
        x-text="isAr ? page.intro.titleAr : page.intro.titleEn"></h2>
    <p class="mx-auto max-w-3xl text-center text-lg leading-relaxed text-slate-700"
       x-text="isAr ? page.intro.paragraphAr : page.intro.paragraphEn"></p>
  </div>
</section>

<section x-cloak class="bg-section py-20 font-hacen"
         x-data="{ get page() { return $store.servicesPage.library }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container mx-auto max-w-6xl px-6">
    <div class="grid gap-8 md:grid-cols-2">
      <template x-for="section in page.sections" :key="section.titleEn">
        <div class="rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
          <div class="mb-5 flex h-12 w-12 items-center justify-center rounded-xl bg-spu-blue/5">
            <template x-if="section.icon === 'book'">
              <svg class="h-6 w-6 text-spu-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M4 19.5A2.5 2.5 0 016.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"></path>
              </svg>
            </template>
            <template x-if="section.icon === 'database'">
              <svg class="h-6 w-6 text-spu-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
              </svg>
            </template>
            <template x-if="section.icon === 'journal'">
              <svg class="h-6 w-6 text-spu-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
            </template>
            <template x-if="section.icon === 'headphones'">
              <svg class="h-6 w-6 text-spu-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M3 18v-6a9 9 0 0118 0v6"></path>
                <path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"></path>
              </svg>
            </template>
          </div>
          <h3 class="mb-3 text-lg font-black text-spu-blue"
              x-text="isAr ? section.titleAr : section.titleEn"></h3>
          <p class="text-sm leading-relaxed text-slate-600"
             x-text="isAr ? section.bodyAr : section.bodyEn"></p>
        </div>
      </template>
    </div>
  </div>
</section>

<section x-cloak class="bg-white py-16 font-hacen"
         x-data="{ get page() { return $store.servicesPage.library }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container mx-auto max-w-4xl px-6">
    <h2 class="mb-10 text-center text-2xl font-black text-spu-blue"
        x-text="isAr ? 'قواعد بيانات ومكتبات خارجية' : 'External Databases & Libraries'"></h2>
    <div class="grid gap-4 md:grid-cols-2">
      <template x-for="link in page.externalLinks" :key="link.titleEn">
        <a :href="link.url" target="_blank" rel="noopener noreferrer"
           class="flex items-center gap-4 rounded-lg border border-slate-200 bg-white p-5 shadow-sm transition hover:border-spu-blue/20 hover:shadow-md">
          <span class="text-sm font-bold text-spu-blue"
                x-text="isAr ? link.titleAr : link.titleEn"></span>
          <svg class="ml-auto h-4 w-4 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </a>
      </template>
    </div>
  </div>
</section>

<section x-cloak class="bg-spu-blue py-14 font-hacen"
         x-data="{ get page() { return $store.servicesPage.library }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container mx-auto max-w-4xl px-6 text-center">
    <h2 class="mb-6 text-2xl font-black text-white"
        x-text="isAr ? page.contact.titleAr : page.contact.titleEn"></h2>
    <div class="flex flex-wrap justify-center gap-8 text-white/90">
      <div class="flex items-center gap-2">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        <span class="text-sm font-bold" x-text="page.contact.email"></span>
      </div>
      <div class="flex items-center gap-2">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"></path>
        </svg>
        <span class="text-sm font-bold" x-text="page.contact.phone"></span>
      </div>
      <div class="flex items-center gap-2">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <span class="text-sm font-bold" x-text="isAr ? page.contact.locationAr : page.contact.locationEn"></span>
      </div>
    </div>
  </div>
</section>
