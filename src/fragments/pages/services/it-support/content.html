<section x-cloak
         x-data="{ get page() { return $store.servicesPage.itSupport }, get isAr() { return $store.app.currentLang === 'ar' } }"
         class="relative flex min-h-[365px] items-center justify-center overflow-hidden pt-28 font-hacen">
  <img :src="page.hero.heroImage"
       :alt="isAr ? page.hero.titleAr : page.hero.titleEn"
       class="absolute inset-0 h-full w-full object-cover">
  <div class="absolute inset-0 bg-gradient-to-b from-[rgba(7,10,28,0.12)] to-[rgba(32,39,89,0.72)]"></div>
  <div class="container relative z-10 mx-auto py-5 text-center text-white">
    <nav class="mb-6 flex flex-wrap items-center justify-center gap-3 text-xs font-bold text-white/85" aria-label="Breadcrumb">
      <a href="/" class="transition hover:text-white"
         x-text="isAr ? 'الرئيسية' : 'Home'"></a>
      <span aria-hidden="true">›</span>
      <a href="/e-services/" class="transition hover:text-white"
         x-text="isAr ? 'الخدمات الإلكترونية' : 'E-Services'"></a>
      <span aria-hidden="true">›</span>
      <span x-text="isAr ? page.hero.titleAr : page.hero.titleEn"></span>
    </nav>
    <p class="mb-3 text-xs font-black uppercase tracking-widest text-white/70"
       x-text="isAr ? page.hero.eyebrowAr : page.hero.eyebrowEn"></p>
    <h1 class="text-4xl font-black leading-tight text-white md:text-5xl"
        x-text="isAr ? page.hero.titleAr : page.hero.titleEn"></h1>
    <p class="mx-auto mt-5 max-w-[640px] text-base leading-relaxed text-white/90"
       x-text="isAr ? page.hero.summaryAr : page.hero.summaryEn"></p>
  </div>
</section>

<section x-cloak class="bg-white py-20 font-hacen"
         x-data="{ get page() { return $store.servicesPage.itSupport }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container mx-auto max-w-4xl px-6 text-center">
    <h2 class="mb-6 text-3xl font-black text-spu-blue md:text-4xl"
        x-text="isAr ? page.intro.titleAr : page.intro.titleEn"></h2>
    <p class="mx-auto max-w-3xl text-lg leading-relaxed text-slate-700"
       x-text="isAr ? page.intro.paragraphAr : page.intro.paragraphEn"></p>
  </div>
</section>

<section x-cloak class="bg-section py-20 font-hacen"
         x-data="{ get page() { return $store.servicesPage.itSupport }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container mx-auto max-w-6xl px-6">
    <div class="grid gap-8 md:grid-cols-2">
      <template x-for="card in page.serviceCards" :key="card.titleEn">
        <div class="rounded-xl border border-slate-200 bg-white p-8 shadow-sm transition hover:shadow-md">
          <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-xl bg-spu-blue/5">
            <template x-if="card.icon === 'wifi'">
              <svg class="h-7 w-7 text-spu-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path d="M5 12.55a11 11 0 0114 0"></path>
                <path d="M8 15.95a7 7 0 018 0"></path>
                <path d="M11 19.35a3 3 0 012 0"></path>
                <circle cx="12" cy="21" r="1"></circle>
              </svg>
            </template>
            <template x-if="card.icon === 'user'">
              <svg class="h-7 w-7 text-spu-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </template>
            <template x-if="card.icon === 'monitor'">
              <svg class="h-7 w-7 text-spu-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
            </template>
            <template x-if="card.icon === 'headphones'">
              <svg class="h-7 w-7 text-spu-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path d="M3 18v-6a9 9 0 0118 0v6"></path>
                <path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"></path>
              </svg>
            </template>
          </div>
          <h3 class="mb-3 text-lg font-black text-spu-blue"
              x-text="isAr ? card.titleAr : card.titleEn"></h3>
          <p class="text-sm leading-relaxed text-slate-600"
             x-text="isAr ? card.bodyAr : card.bodyEn"></p>
        </div>
      </template>
    </div>
  </div>
</section>

<section x-cloak class="bg-white py-16 font-hacen"
         x-data="{ get page() { return $store.servicesPage.itSupport }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container mx-auto max-w-4xl px-6">
    <h2 class="mb-10 text-center text-2xl font-black text-spu-blue"
        x-text="isAr ? 'قنوات الاتصال' : 'Contact Channels'"></h2>
    <div class="grid gap-6 md:grid-cols-3">
      <template x-for="channel in page.channels" :key="channel.titleEn">
        <div class="rounded-lg border border-slate-200 bg-white p-6 text-center shadow-sm">
          <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-spu-blue/5">
            <template x-if="channel.icon === 'mail'">
              <svg class="h-6 w-6 text-spu-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </template>
            <template x-if="channel.icon === 'phone'">
              <svg class="h-6 w-6 text-spu-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"></path>
              </svg>
            </template>
            <template x-if="channel.icon === 'map-pin'">
              <svg class="h-6 w-6 text-spu-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </template>
          </div>
          <h3 class="mb-2 text-sm font-bold text-spu-blue"
              x-text="isAr ? channel.titleAr : channel.titleEn"></h3>
          <p class="text-sm font-semibold text-slate-700"
             x-text="channel.icon === 'map-pin' ? (isAr ? channel.valueAr : channel.valueEn) : channel.value"></p>
        </div>
      </template>
    </div>
  </div>
</section>

<section x-cloak class="bg-section py-14 font-hacen"
         x-data="{ get page() { return $store.servicesPage.itSupport }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container mx-auto max-w-3xl px-6 text-center">
    <h2 class="mb-4 text-2xl font-black text-spu-blue"
        x-text="isAr ? page.hours.titleAr : page.hours.titleEn"></h2>
    <p class="text-base font-bold text-slate-600"
       x-text="isAr ? page.hours.weekdayAr : page.hours.weekdayEn"></p>
  </div>
</section>
