<section id="appeals-forms" class="bg-white py-16 font-hacen">
    <div class="container">
        <div class="grid gap-6 lg:grid-cols-2">
            <article class="rounded-[8px] border border-spu-blue/10 bg-white p-6 shadow-[0_12px_34px_rgba(32,39,89,0.08)]">
                <p class="text-xs font-bold uppercase tracking-[0.16em] text-spu-blue/50"
                   x-text="$store.app.currentLang === 'ar' ? 'النماذج' : 'Forms'"></p>
                <h2 class="mt-3 text-[24px] font-bold text-spu-blue"
                    x-text="$store.app.currentLang === 'ar' ? 'الاعتراضات والنماذج' : 'Appeals & Forms'"></h2>
                <p class="mt-3 text-sm leading-6 text-spu-blue/65"
                   x-text="$store.app.currentLang === 'ar' ? 'يمكن للطلاب متابعة النماذج الرسمية وطلبات الاعتراض عبر بوابة الخدمات الإلكترونية.' : 'Students can follow official forms and appeal requests through the e-services gateway.'"></p>
            </article>

            <article id="privacy" class="rounded-[8px] border border-spu-blue/10 bg-white p-6 shadow-[0_12px_34px_rgba(32,39,89,0.08)]">
                <span id="cookies" class="sr-only"></span>
                <p class="text-xs font-bold uppercase tracking-[0.16em] text-spu-blue/50"
                   x-text="$store.app.currentLang === 'ar' ? 'الحوكمة' : 'Governance'"></p>
                <h2 class="mt-3 text-[24px] font-bold text-spu-blue"
                    x-text="$store.app.currentLang === 'ar' ? 'الخصوصية وإمكانية الوصول' : 'Privacy & Accessibility'"></h2>
                <p class="mt-3 text-sm leading-6 text-spu-blue/65"
                   x-text="$store.app.currentLang === 'ar' ? 'تظهر روابط الخصوصية وملفات الارتباط وإمكانية الوصول في تذييل الموقع وفق المتطلبات.' : 'Privacy, cookie, and accessibility links are exposed in the global footer according to the requirements.'"></p>
            </article>
        </div>
    </div>
</section>
