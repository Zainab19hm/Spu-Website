<section id="tour" x-data="{ 
    isLoading: true,
    isAutoRotating: true,
    isFullscreen: false,
    currentSceneIndex: 0,
    showHint: true,
    threeCtx: null,
    
    get isAr() { return $store.app.currentLang === 'ar' },
    get scenes() { return $store.virtualTourPage.tour.scenes },
    get currentScene() { return this.scenes[this.currentSceneIndex] },
    get sceneTitle() { return this.isAr ? this.currentScene.titleAr : this.currentScene.titleEn },
    get sceneSubtitle() { return this.isAr ? this.currentScene.subtitleAr : this.currentScene.subtitleEn },
    
    goToScene(index) {
        if (this.threeCtx && index !== this.currentSceneIndex) {
            this.threeCtx.navigateToScene(index);
        }
    },
    
    toggleFullscreen() {
        this.isFullscreen = !this.isFullscreen;
        const el = this.$refs.tourContainer;
        if (this.isFullscreen) {
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    }
}" x-init="
    $nextTick(() => {
        if (!window.THREE) {
            console.warn('Three.js not loaded');
            isLoading = false;
            return;
        }

        const THREE = window.THREE;
        const canvas = $refs.tourCanvas;
        const container = $refs.tourContainer;
        const hotspotContainer = $refs.hotspotContainer;
        let width = container.clientWidth;
        let height = container.clientHeight;

        // Config
        const R = 80;
        const H = 120;
        const HALF_PI = Math.PI / 2;
        
        // Three.js setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 50, 200);

        const camera = new THREE.PerspectiveCamera(70, width / height, 0.1, 1000);
        camera.position.set(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ 
            canvas: canvas, 
            antialias: true,
            alpha: false
        });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Cylinder (inner surface)
        const cylGeo = new THREE.CylinderGeometry(R, R, H, 80, 1, true, -HALF_PI, Math.PI);
        const cylMat = new THREE.MeshBasicMaterial({ 
            side: THREE.BackSide,
            transparent: true,
            opacity: 0
        });
        const cylinder = new THREE.Mesh(cylGeo, cylMat);
        scene.add(cylinder);

        // Particles
        const pCount = 300;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount; i++) {
            const a = (Math.random() - 0.5) * Math.PI;
            const d = R * 0.4 + Math.random() * R * 0.5;
            pPos[i*3] = Math.cos(a) * d;
            pPos[i*3+1] = (Math.random() - 0.5) * H * 0.7;
            pPos[i*3+2] = Math.sin(a) * d;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, transparent: true, opacity: 0.25 });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // Camera control state
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        let targetLook = { x: 0, y: 0 };
        let currentLook = { x: 0, y: 0 };
        const minX = -0.35, maxX = 0.35;
        const minY = -HALF_PI + 0.25, maxY = HALF_PI - 0.25;
        
        function onDown(e) {
            isDragging = true;
            isAutoRotating = false;
            showHint = false;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            prevMouse = { x: cx, y: cy };
        }
        function onMove(e) {
            if (!isDragging) return;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            targetLook.y -= (cx - prevMouse.x) * 0.004;
            targetLook.x -= (cy - prevMouse.y) * 0.004;
            targetLook.x = Math.max(minX, Math.min(maxX, targetLook.x));
            targetLook.y = Math.max(minY, Math.min(maxY, targetLook.y));
            prevMouse = { x: cx, y: cy };
        }
        function onUp() { isDragging = false; }
        
        canvas.addEventListener('mousedown', onDown);
        canvas.addEventListener('mousemove', onMove);
        canvas.addEventListener('mouseup', onUp);
        canvas.addEventListener('mouseleave', onUp);
        canvas.addEventListener('touchstart', onDown, { passive: true });
        canvas.addEventListener('touchmove', onMove, { passive: true });
        canvas.addEventListener('touchend', onUp);
        
        // Zoom with scroll
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.fov += e.deltaY * 0.025;
            camera.fov = Math.max(50, Math.min(110, camera.fov));
            camera.updateProjectionMatrix();
        }, { passive: false });

        // Texture loading
        const texLoader = new THREE.TextureLoader();
        let curTex = null;
        let hotspotEls = [];
        let isTransitioning = false;

        function clearHotspots() {
            hotspotEls.forEach(h => h.el.remove());
            hotspotEls = [];
        }

        function createHotspots(sceneData) {
            clearHotspots();
            if (!sceneData.hotspots) return;
            sceneData.hotspots.forEach((h) => {
                const el = document.createElement('div');
                el.className = 'absolute z-20 flex flex-col items-center';
                el.style.pointerEvents = 'auto';
                el.style.transition = 'opacity 0.3s ease';
                el.innerHTML = `
                    <div class="hs-ring relative flex h-5 w-5 items-center justify-center rounded-full bg-spu-red shadow-lg ring-2 ring-white/60 cursor-pointer transition hover:scale-125">
                        <svg class="h-3 w-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                    </div>
                    <span class="hs-label mt-1 whitespace-nowrap rounded-md bg-spu-blue/90 px-2 py-0.5 text-[10px] font-bold text-white shadow-lg opacity-0 transition-opacity duration-200">${isAr ? h.labelAr : h.labelEn}</span>
               
    <div class="container">
        <div class="text-center">
            <p class="text-[11px] font-bold uppercase tracking-[0.16em] text-spu-blue/55"
               x-text="isAr ? $store.virtualTourPage.tour.eyebrowAr : $store.virtualTourPage.tour.eyebrowEn"></p>
            <h2 class="mt-2 text-[24px] font-bold leading-tight text-spu-blue md:text-[30px]"
                x-text="isAr ? $store.virtualTourPage.tour.titleAr : $store.virtualTourPage.tour.titleEn"></h2>
            <p class="mx-auto mt-3 w-full text-sm leading-6 text-spu-blue/60 md:w-[48%]"
                x-text="isAr ? $store.virtualTourPage.tour.summaryAr : $store.virtualTourPage.tour.summaryEn"></p>
        </div>

        <div x-ref="tourContainer" 
             class="relative mt-8 overflow-hidden rounded-[8px] border border-spu-blue/10 bg-[#1a1a2e] shadow-[0_18px_60px_rgba(32,39,89,0.16)] transition-all duration-300"
             style="height: 440px;"
             :class="isFullscreen ? 'fixed inset-0 z-50 rounded-none border-none !h-screen' : ''">
            
            <canvas x-ref="tourCanvas" class="absolute inset-0 block h-full w-full cursor-grab active:cursor-grabbing"></canvas>
            <div x-ref="hotspotContainer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
            
            <!-- Loading -->
            <div x-show="isLoading" 
                 x-transition.opacity.duration.300ms
                 class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-spu-blue/90 backdrop-blur-sm"
                 style="display: none;">
                <div class="h-10 w-10 animate-spin rounded-full border-2 border-white/20 border-t-white"></div>
                <p class="mt-3 text-xs font-bold text-white"
                   x-text="isAr ? $store.virtualTourPage.tour.loadingLabelAr : $store.virtualTourPage.tour.loadingLabelEn"></p>
            </div>
            
            <!-- Drag Hint -->
            <div x-show="showHint && !isLoading" 
                 x-transition.opacity.duration.700ms
                 class="absolute inset-0 z-20 flex items-center justify-center pointer-events-none"
                 style="display: none;">
                <div class="rounded-full bg-black/50 px-6 py-3 text-center backdrop-blur-sm">
                    <div class="flex items-center gap-2 text-white/90">
                        <svg class="h-5 w-5 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
                        </svg>
                        <span class="text-sm font-bold" x-text="isAr ? $store.virtualTourPage.tour.dragHintAr : $store.virtualTourPage.tour.dragHintEn"></span>
                    </div>
                    <p class="mt-1 text-[10px] text-white/60" x-text="isAr ? $store.virtualTourPage.tour.clickHintAr : $store.virtualTourPage.tour.clickHintEn"></p>
                </div>
            </div>
            
            <!-- Scene Info -->
            <div class="absolute bottom-0 left-0 right-0 z-20 bg-gradient-to-t from-black/80 via-black/40 to-transparent px-5 pb-16 pt-10 md:px-6 md:pb-20 md:pt-14 pointer-events-none">
                <h3 class="text-[16px] font-bold text-white md:text-[20px]" x-text="sceneTitle"></h3>
                <p class="mt-1 text-[12px] text-white/70 md:text-[13px]" x-text="sceneSubtitle"></p>
            </div>
            
            <!-- Top Controls -->
            <div class="absolute right-3 top-3 z-20 flex items-center gap-2 rtl:left-3 rtl:right-auto">
                <button type="button"
                        @click="isAutoRotating = !isAutoRotating; showHint = false;"
                        class="grid h-8 w-8 place-items-center rounded-[4px] bg-black/40 text-white backdrop-blur-sm transition hover:bg-black/60"
                        :class="isAutoRotating ? 'text-spu-red' : 'text-white'"
                        :title="isAr ? $store.virtualTourPage.tour.autoRotateLabelAr : $store.virtualTourPage.tour.autoRotateLabelEn">
                    <svg x-show="isAutoRotating" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <svg x-show="!isAutoRotating" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </button>
                <button type="button"
                        @click="toggleFullscreen()"
                        class="grid h-8 w-8 place-items-center rounded-[4px] bg-black/40 text-white backdrop-blur-sm transition hover:bg-black/60"
                        :title="isAr ? $store.virtualTourPage.tour.fullscreenLabelAr : $store.virtualTourPage.tour.fullscreenLabelEn">
                    <svg x-show="!isFullscreen" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                    </svg>
                    <svg x-show="isFullscreen" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <!-- Scene Thumbnails -->
            <div class="absolute bottom-5 left-1/2 z-20 flex -translate-x-1/2 items-center gap-2 rounded-full bg-black/40 px-3 py-2 backdrop-blur-sm">
                <template x-for="(scene, idx) in scenes" :key="scene.id">
                    <button type="button"
                            @click="goToScene(idx)"
                            class="relative overflow-hidden rounded-[4px] transition"
                            :class="currentSceneIndex === idx ? 'ring-2 ring-spu-red opacity-100' : 'opacity-50 hover:opacity-90'"
                            style="height: 32px; width: 48px;">
                        <img :src="scene.thumbnail" 
                             :alt="isAr ? scene.titleAr : scene.titleEn"
                             class="h-full w-full object-cover">
                    </button>
                </template>
            </div>
            
            <!-- 360 Badge -->
            <div class="absolute left-3 top-3 z-20 rounded-full bg-black/40 px-3 py-1 backdrop-blur-sm">
                <span class="text-[10px] font-bold text-white/90 tracking-wider"
                      x-text="isAr ? $store.virtualTourPage.tour.experienceLabelAr : $store.virtualTourPage.tour.experienceLabelEn"></span>
            </div>
        </div>
    </div>
</section>
