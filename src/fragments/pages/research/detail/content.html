<article class="bg-slate-50 py-10 font-hacen md:py-14"
         x-data="{ get page() { return $store.researchDetailPage }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container mx-auto max-w-[1120px] px-4 sm:px-6">
    <div class="grid gap-8 lg:grid-cols-[minmax(0,7fr)_minmax(280px,3fr)] lg:items-start">

      <section class="space-y-6">
        <div class="rounded-[8px] border border-slate-200 bg-white p-6 shadow-[0_8px_24px_rgba(15,23,42,0.04)] md:p-8">
          <h2 class="text-[13px] font-bold uppercase tracking-[0.12em] text-spu-red">Summary</h2>
          <div class="mt-4 space-y-4">
            <template x-for="paragraph in (isAr ? page.current?.paragraphsAr : page.current?.paragraphsEn)" :key="paragraph">
              <p class="text-[15px] leading-8 text-slate-700" x-text="paragraph"></p>
            </template>
          </div>

          <div class="mt-6 border-l-4 border-spu-red bg-slate-50 px-5 py-4 text-[14px] font-bold leading-7 text-spu-blue rtl:border-l-0 rtl:border-r-4">
            <span x-text="page.currentText('keyStatement')"></span>
          </div>
        </div>

        <div class="rounded-[8px] border border-slate-200 bg-white p-6 shadow-[0_8px_24px_rgba(15,23,42,0.04)]">
          <h2 class="text-[13px] font-bold uppercase tracking-[0.12em] text-spu-red"
              x-text="page.localized('labels', 'keywords')"></h2>
          <div class="mt-4 flex flex-wrap gap-2">
            <template x-for="kw in (isAr ? page.current?.keywordsAr : page.current?.keywordsEn)" :key="kw">
              <span class="inline-flex rounded-full border border-spu-blue/15 bg-spu-blue/5 px-3.5 py-1.5 text-xs font-semibold text-spu-blue"
                    x-text="kw"></span>
            </template>
          </div>
        </div>

        <div class="flex flex-wrap gap-3">
          <a :href="page.current?.scholarUrl || '#'"
             target="_blank" rel="noopener noreferrer"
             class="inline-flex h-12 items-center gap-2.5 rounded-[6px] bg-spu-red px-6 text-xs font-bold uppercase tracking-[0.08em] text-white transition hover:bg-spu-red/90 hover:shadow-lg">
            <img src="/images/icon-book-outline.svg" alt="" class="h-4 w-4 brightness-0 invert" aria-hidden="true">
            <span x-text="page.localized('labels', 'viewOnScholar')"></span>
          </a>
          <a :href="page.current?.scopusUrl || '#'"
             target="_blank" rel="noopener noreferrer"
             class="inline-flex h-12 items-center gap-2.5 rounded-[6px] border border-spu-blue/20 bg-white px-6 text-xs font-bold uppercase tracking-[0.08em] text-spu-blue transition hover:border-spu-blue hover:bg-spu-blue/5">
            <img src="/images/icon-search-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
            <span>Search on Scopus</span>
          </a>
        </div>
      </section>

      <aside class="rounded-[8px] border border-slate-200 bg-white p-6 shadow-[0_8px_24px_rgba(15,23,42,0.04)] lg:sticky lg:top-28">
        <h2 class="text-[13px] font-bold uppercase tracking-[0.12em] text-spu-red">Publication Info</h2>

        <dl class="mt-5 divide-y divide-slate-100">
          <div class="py-3 first:pt-0">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400" x-text="page.localized('labels', 'category')"></dt>
            <dd class="mt-1 text-sm font-bold text-spu-blue" x-text="isAr ? page.current?.categoryAr : page.current?.categoryEn"></dd>
          </div>
          <div class="py-3">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400">By</dt>
            <dd class="mt-1">
              <a :href="page.current?.authorHref || '#'" class="text-sm font-bold text-spu-blue transition hover:text-spu-red hover:underline"
                 x-text="isAr ? page.current?.authorAr : page.current?.authorEn"></a>
            </dd>
          </div>
          <div class="py-3">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Time</dt>
            <dd class="mt-1 text-sm font-bold text-spu-blue" x-text="page.current?.year"></dd>
          </div>
          <div class="py-3">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400" x-text="page.localized('labels', 'faculty')"></dt>
            <dd class="mt-1">
              <a :href="page.current?.facultyHref || '#'" class="text-sm font-bold text-spu-blue transition hover:text-spu-red hover:underline"
                 x-text="isAr ? page.current?.facultyAr : page.current?.facultyEn"></a>
            </dd>
          </div>
          <div class="py-3">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400" x-text="page.localized('labels', 'rate')"></dt>
            <dd class="mt-1 flex flex-wrap items-center gap-2">
              <span class="inline-flex rounded-full bg-amber-50 px-3 py-1 text-[11px] font-bold uppercase tracking-wider text-amber-700"
                    x-text="isAr ? page.current?.rateAr : page.current?.rateEn"></span>
              <template x-if="page.current?.isOpenAccess">
                <span class="inline-flex rounded-full bg-emerald-50 px-3 py-1 text-[11px] font-bold uppercase tracking-wider text-emerald-700"
                      x-text="page.localized('labels', 'openAccess')"></span>
              </template>
            </dd>
          </div>
          <div class="py-3">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400" x-text="page.localized('labels', 'link')"></dt>
            <dd class="mt-1">
              <a :href="`https://doi.org/${page.current?.doi}`" target="_blank" rel="noopener noreferrer"
                 class="break-all text-sm font-bold text-spu-blue transition hover:text-spu-red hover:underline"
                 x-text="page.current?.doi"></a>
            </dd>
          </div>
          <div class="py-3">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400" x-text="page.localized('labels', 'type')"></dt>
            <dd class="mt-1 text-sm font-bold text-spu-blue" x-text="isAr ? page.current?.typeAr : page.current?.typeEn"></dd>
          </div>
          <div class="py-3 last:pb-0">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400" x-text="page.localized('labels', 'themes')"></dt>
            <dd class="mt-2 flex flex-wrap gap-1.5">
              <template x-for="theme in (page.current?.resolvedThemes || [])" :key="theme.slug">
                <span class="inline-flex rounded-full border border-spu-blue/15 bg-spu-blue/5 px-2.5 py-1 text-[10px] font-semibold text-spu-blue"
                      x-text="isAr ? theme.labelAr : theme.labelEn"></span>
              </template>
            </dd>
          </div>
        </dl>
      </aside>
    </div>
  </div>
</article>

<article class="bg-white py-10 font-hacen md:py-14"
         x-data="{ get page() { return $store.researchDetailPage }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container mx-auto max-w-[1100px] px-4 sm:px-6">
    <div class="mx-auto" x-show="page.relatedPublications().length > 0">
      <h3 class="mb-6 text-lg font-bold text-spu-blue"
          x-text="page.localized('labels', 'related')"></h3>
      <div class="grid gap-6 md:grid-cols-3">
        <template x-for="pub in page.relatedPublications()" :key="pub.id">
          <a :href="pub.href" class="group block overflow-hidden rounded-[8px] border border-spu-blue/10 bg-white shadow-sm transition-all hover:-translate-y-1 hover:shadow-md">
            <img :src="pub.image" :alt="isAr ? pub.titleAr : pub.titleEn" class="h-[140px] w-full object-cover">
            <div class="p-4">
              <p class="mb-1 text-[10px] font-bold uppercase tracking-wider text-spu-red" x-text="pub.year"></p>
              <h4 class="text-sm font-bold leading-snug text-spu-blue transition-colors group-hover:text-spu-red"
                  x-text="isAr ? pub.titleAr : pub.titleEn"></h4>
            </div>
          </a>
        </template>
      </div>
    </div>

    <footer class="mx-auto mt-9 flex max-w-[900px] flex-col gap-4 border-t border-slate-100 pt-6 sm:flex-row sm:items-center sm:justify-between">
      <a :href="page.previousPublication()?.href"
         class="inline-flex items-center gap-2 text-[12px] font-bold text-spu-blue transition hover:text-spu-red">
        <img src="/images/icon-arrow-left-outline.svg" alt="" class="h-3.5 w-3.5 rtl:rotate-180" aria-hidden="true">
        <span x-text="page.localized('labels', 'previous')"></span>
      </a>

      <div class="flex items-center justify-center gap-3">
        <span class="text-[11px] font-bold uppercase tracking-[0.12em] text-slate-400"
              x-text="page.localized('labels', 'share')"></span>
        <a href="https://www.facebook.com/SPUpage.sy/?ref=bookmarks" class="flex h-8 w-8 items-center justify-center rounded-full border border-slate-200 transition hover:border-spu-blue" aria-label="Facebook">
          <img src="/images/icon-facebook-outline.svg" alt="" class="h-3.5 w-3.5" aria-hidden="true">
        </a>
        <a href="https://telegram.me/SPUchannel" class="flex h-8 w-8 items-center justify-center rounded-full border border-slate-200 transition hover:border-spu-blue" aria-label="Telegram">
          <img src="/images/icon-telegram-outline.svg" alt="" class="h-3.5 w-3.5" aria-hidden="true">
        </a>
      </div>

      <a :href="page.nextPublication()?.href"
         class="inline-flex items-center justify-end gap-2 text-[12px] font-bold text-spu-blue transition hover:text-spu-red">
        <span x-text="page.localized('labels', 'next')"></span>
        <img src="/images/icon-arrow-right-outline.svg" alt="" class="h-3.5 w-3.5 rtl:rotate-180" aria-hidden="true">
      </a>
    </footer>
  </div>
</article>
