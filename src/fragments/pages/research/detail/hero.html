<section class="bg-white pt-28 pb-10 font-hacen md:pt-32 md:pb-14"
         x-data="{ get page() { return $store.researchDetailPage }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container mx-auto max-w-[960px] px-4 sm:px-6">

    <!-- Breadcrumb -->
    <nav class="mb-6 flex flex-wrap items-center justify-center gap-2 text-[11px] font-semibold text-slate-500"
         aria-label="Breadcrumb">
      <a href="/" class="transition hover:text-spu-blue" x-text="page.localized('labels', 'home')"></a>
      <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2.5 w-2.5 rtl:rotate-180" aria-hidden="true">
      <a href="/research.html" class="transition hover:text-spu-blue" x-text="page.localized('labels', 'research')"></a>
      <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2.5 w-2.5 rtl:rotate-180" aria-hidden="true">
      <span class="text-spu-blue" x-text="isAr ? page.current?.typeAr : page.current?.typeEn"></span>
    </nav>

    <!-- Centered Image -->
    <figure class="mx-auto max-w-[780px] overflow-hidden rounded-[6px]">
      <img :src="page.current?.heroImage || page.current?.image"
           :alt="page.currentText('title')"
           class="h-[220px] w-full object-cover md:h-[360px]">
    </figure>

    <!-- Title -->
    <h1 class="mx-auto mt-8 max-w-[820px] text-center text-2xl font-bold leading-snug text-spu-blue md:text-[32px] md:leading-tight"
        x-text="page.currentText('title')"></h1>

  </div>
</section>
