<section x-data class="bg-white font-hacen" :dir="$store.app.currentLang === 'ar' ? 'rtl' : 'ltr'">
    <div class="relative h-[50vh] min-h-[350px] overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-spu-blue to-[#3a4280]"></div>
        <div class="absolute inset-0 opacity-20">
            <svg class="h-full w-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                <defs>
                    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
                        <path d="M 10 0 L 0 0 0 10" fill="none" stroke="white" stroke-width="0.5"/>
                    </pattern>
                </defs>
                <rect width="100" height="100" fill="url(#grid)"/>
            </svg>
        </div>
        <div class="container relative z-10 flex h-full items-center justify-center">
            <div class="text-center">
                <p class="text-[12px] font-bold uppercase tracking-[0.16em] text-white/70"
                   x-text="$store.app.currentLang === 'ar' ? 'مجال بحثي' : 'Research Theme'">
                </p>
                <h1 class="mt-3 text-[32px] font-bold text-white md:text-[40px]"
                    x-text="$store.app.currentLang === 'ar'
                        ? ($store.researchPage.themes.items.find(t => t.slug === $store.app.currentSlug)?.nameAr || '')
                        : ($store.researchPage.themes.items.find(t => t.slug === $store.app.currentSlug)?.nameEn || '')">
                </h1>
                <div class="mx-auto mt-6 flex items-center justify-center gap-8 text-[13px] text-white/80">
                    <span>
                        <span class="font-bold text-white" x-text="$store.researchPage.themes.items.find(t => t.slug === $store.app.currentSlug)?.publicationCount || 0"></span>
                        <span x-text="$store.app.currentLang === 'ar' ? 'منشور' : 'Publications'"></span>
                    </span>
                    <span class="text-white/40">|</span>
                    <span>
                        <span class="font-bold text-white" x-text="$store.researchPage.themes.items.find(t => t.slug === $store.app.currentSlug)?.projectCount || 0"></span>
                        <span x-text="$store.app.currentLang === 'ar' ? 'مشروع' : 'Projects'"></span>
                    </span>
                </div>
            </div>
        </div>
    </div>
</section>
