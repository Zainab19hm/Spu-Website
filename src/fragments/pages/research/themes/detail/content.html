<section x-data class="bg-white pt-[60px] pb-[80px] font-hacen" :dir="$store.app.currentLang === 'ar' ? 'rtl' : 'ltr'">
    <div class="container" x-data="{ theme: $store.researchPage.themes.items.find(t => t.slug === $store.app.currentSlug) }">
        <div class="mx-auto max-w-[1100px]">
            <div class="mb-12">
                <p class="text-[16px] leading-[1.8] text-[#50525c]"
                   x-text="$store.app.currentLang === 'ar' ? theme?.descriptionAr : theme?.descriptionEn"></p>
            </div>

            <div class="border-t border-[#e5e7eb] pt-10">
                <h2 class="text-[20px] font-bold text-spu-blue"
                    x-text="$store.app.currentLang === 'ar' ? 'المنشورات في هذا المجال' : 'Publications in this Theme'"></h2>

                <div class="mt-8 grid gap-[30px] lg:grid-cols-2">
                    <template x-for="pub in $store.researchPage.publications.items.filter(p => p.themes?.includes($store.app.currentSlug))" :key="pub.id">
                        <a :href="'/research/publications/' + pub.slug + '/'"
                           class="group block overflow-hidden rounded-[10px] border border-[#d5d9e2] bg-white shadow-[0_4px_10px_rgba(0,0,0,0.12)] transition-all hover:-translate-y-1 hover:shadow-[0_8px_24px_rgba(32,39,89,0.12)]">
                            <img :src="pub.image"
                                 :alt="$store.app.currentLang === 'ar' ? pub.titleAr : pub.titleEn"
                                 class="h-[140px] w-full object-cover">

                            <div class="p-5">
                                <div class="flex flex-wrap gap-2">
                                    <span class="rounded-[4px] bg-spu-blue/10 px-2 py-1 text-[9px] font-bold text-spu-blue"
                                          x-text="pub.typeEn"></span>
                                    <span class="rounded-[4px] bg-spu-blue/10 px-2 py-1 text-[9px] font-bold text-spu-blue"
                                          x-text="pub.year"></span>
                                </div>
                                <h3 class="mt-3 text-[16px] font-bold leading-snug text-spu-blue group-hover:text-spu-red"
                                    x-text="$store.app.currentLang === 'ar' ? pub.titleAr : pub.titleEn"></h3>
                                <p class="mt-2 text-[13px] text-[#6f7280]"
                                   x-text="'By ' + ($store.app.currentLang === 'ar' ? pub.authorAr : pub.authorEn)"></p>
                            </div>
                        </a>
                    </template>
                </div>
            </div>
        </div>
    </div>
</section>
