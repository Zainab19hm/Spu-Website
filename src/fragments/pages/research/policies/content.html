<section class="bg-white py-12 font-hacen md:py-16"
         x-data="{ get page() { return $store.policiesPage }, get isAr() { return $store.app.currentLang === 'ar' } }">

    <div class="container mx-auto px-6">
        <h1 class="sr-only" x-text="isAr ? page.hero.titleAr : page.hero.titleEn"></h1>
        <div class="mx-auto max-w-[1200px]">
            <h2 class="mb-6 text-center text-xl font-bold text-spu-blue" x-text="isAr ? 'السياسات والأخلاقيات البحثية' : 'Research Policies & Ethics'"></h2>
            <div class="grid gap-8 md:grid-cols-2">
                <template x-for="section in page.policies.sections" :key="section.id">
                    <div class="rounded-xl border border-spu-blue/10 bg-white p-6 shadow-sm">
                        <div class="mb-4 flex items-start gap-4">
                            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-spu-blue/[0.06]">
                                <svg class="h-6 w-6 text-spu-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                                </svg>
                            </div>
                            <div class="flex-1">
                                <h3 class="mb-2 text-lg font-bold text-spu-blue"
                                    x-text="isAr ? section.titleAr : section.titleEn"></h3>
                                <p class="text-sm text-spu-blue/70"
                                   x-text="isAr ? section.descriptionAr : section.descriptionEn"></p>
                            </div>
                        </div>

                        <div class="border-t border-spu-blue/10 pt-4">
                            <h4 class="mb-3 text-xs font-bold uppercase tracking-wider text-spu-blue/50"
                                x-text="isAr ? 'المستندات المتاحة' : 'Available Documents'"></h4>
                            <div class="flex flex-col gap-2">
                                <template x-for="doc in section.documents" :key="doc.titleEn">
                                    <a :href="doc.url" target="_blank" rel="noopener"
                                       class="group flex items-center justify-between rounded-lg border border-spu-blue/10 bg-spu-blue/[0.02] px-4 py-3 transition hover:border-spu-blue/30 hover:bg-spu-blue/[0.06]">
                                        <span class="text-sm font-semibold text-spu-blue"
                                              x-text="isAr ? doc.titleAr : doc.titleEn"></span>
                                        <div class="flex items-center gap-2">
                                            <span class="text-[10px] font-bold uppercase tracking-wider text-spu-red/70"
                                                  x-text="isAr ? doc.fileTypeAr : doc.fileTypeEn"></span>
                                            <svg class="h-4 w-4 text-spu-blue/40 transition group-hover:text-spu-red"
                                                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                                            </svg>
                                        </div>
                                    </a>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <div class="mx-auto mt-12 max-w-[700px] rounded-xl border border-spu-blue/20 bg-spu-blue/[0.02] p-8">
            <h2 class="mb-2 text-center text-lg font-bold text-spu-blue"
                x-text="isAr ? page.policies.contactSection.titleAr : page.policies.contactSection.titleEn"></h2>
            <p class="mb-6 text-center text-sm text-spu-blue/70"
               x-text="isAr ? page.policies.contactSection.descriptionAr : page.policies.contactSection.descriptionEn"></p>

            <div class="flex flex-col items-center gap-3 text-sm text-spu-blue">
                <a :href="'mailto:' + page.policies.contactSection.email"
                   class="flex items-center gap-2 font-semibold hover:text-spu-red">
                    <img src="/images/icon-envelope-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
                    <span x-text="page.policies.contactSection.email"></span>
                </a>
                <div class="flex items-center gap-2">
                    <img src="/images/icon-phone-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
                    <span x-text="page.policies.contactSection.phone"></span>
                </div>
                <div class="flex items-center gap-2">
                    <img src="/images/icon-map-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
                    <span x-text="isAr ? page.policies.contactSection.locationAr : page.policies.contactSection.locationEn"></span>
                </div>
            </div>
        </div>
    </div>
</section>
