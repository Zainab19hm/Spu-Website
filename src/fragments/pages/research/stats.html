<section x-data class="bg-spu-blue py-[27px] font-hacen" :dir="$store.app.currentLang === 'ar' ? 'rtl' : 'ltr'">
    <div class="container">
        <div class="mx-auto grid max-w-[1080px] grid-cols-2 gap-y-7 md:grid-cols-4">
            <template x-for="(stat, idx) in $store.researchPage.stats" :key="stat.labelEn">
                <div class="relative flex min-h-[48px] flex-col items-center justify-center px-4 text-center"
                     :class="idx < 3 ? 'md:border-e md:border-white/60' : ''">
                    <span class="text-[24px] font-bold leading-none tracking-tight text-white md:text-[25px]"
                          x-text="$store.app.currentLang === 'ar' ? stat.valueAr : stat.value">
                    </span>
                    <span class="mt-3 text-[10px] font-medium uppercase tracking-[0.08em] text-white"
                          x-text="$store.app.currentLang === 'ar' ? stat.labelAr : stat.labelEn">
                    </span>
                </div>
            </template>
        </div>
    </div>
</section>
