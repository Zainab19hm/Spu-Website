<section class="bg-white py-12 font-hacen md:py-16"
         x-data="{ get page() { return $store.conferencesPage }, get isAr() { return $store.app.currentLang === 'ar' }, activeTab: 'overview' }">

    <div class="container mx-auto px-6">
        <!-- Event not found -->
        <div x-show="!page.registerEvent"
             class="mx-auto max-w-[600px] text-center py-20">
            <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-gray-100">
                <svg class="h-10 w-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-spu-blue"
                x-text="isAr ? 'الفعالية غير موجودة' : 'Event Not Found'"></h2>
            <p class="mt-2 text-sm text-spu-blue/60"
               x-text="isAr ? 'لم يتم العثور على الفعالية المطلوبة.' : 'The requested event could not be found.'"></p>
            <a href="/research/conferences/"
               class="mt-6 inline-flex items-center gap-2 rounded-lg bg-spu-red px-6 py-3 text-sm font-bold text-white transition hover:bg-spu-blue">
                <span x-text="isAr ? 'العودة للمؤتمرات' : 'Back to Conferences'"></span>
            </a>
        </div>

        <!-- Registration form -->
        <div x-show="page.registerEvent" class="mx-auto max-w-[1200px]">
            <div class="grid gap-8 lg:grid-cols-[minmax(0,1fr)_400px]">

                <!-- Left: Event details + program -->
                <div x-show="page.registerEvent">
                    <!-- Event header card -->
                    <div class="overflow-hidden rounded-2xl border border-spu-blue/10 bg-white shadow-sm">
                        <div class="relative">
                            <img :src="page.registerEvent?.image"
                                 :alt="isAr ? page.registerEvent?.titleAr : page.registerEvent?.titleEn"
                                 class="h-[260px] w-full object-cover">
                            <div class="absolute left-0 top-0 bg-spu-red px-3 py-1.5 text-xs font-bold text-white">
                                <span x-text="isAr ? page.registerEvent?.eventTypeAr : page.registerEvent?.eventTypeEn"></span>
                            </div>
                        </div>
                        <div class="p-6">
                            <h2 class="mb-3 text-2xl font-bold text-spu-blue"
                                x-text="isAr ? page.registerEvent?.titleAr : page.registerEvent?.titleEn"></h2>
                            <div class="mb-4 flex flex-wrap items-center gap-4 text-sm text-spu-blue/60">
                                <div class="flex items-center gap-1.5">
                                    <img src="/images/icon-calendar-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
                                    <span x-text="isAr ? page.registerEvent?.dateAr : page.registerEvent?.dateEn"></span>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <img src="/images/icon-map-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
                                    <span x-text="isAr ? page.registerEvent?.locationAr : page.registerEvent?.locationEn"></span>
                                </div>
                            </div>
                            <p class="text-sm leading-relaxed text-spu-blue/70"
                               x-text="isAr ? page.registerEvent?.descriptionAr : page.registerEvent?.descriptionEn"></p>

                            <!-- Quick info pills -->
                            <div class="mt-5 flex flex-wrap gap-2">
                                <span x-show="page.registerEvent?.registrationDeadlineEn"
                                      class="inline-flex items-center gap-1.5 rounded-full bg-spu-red/10 px-3 py-1 text-[11px] font-bold text-spu-red">
                                    <svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                    <span x-text="isAr ? 'التسجيل حتى: ' + page.registerEvent?.registrationDeadlineAr : 'Registration by: ' + page.registerEvent?.registrationDeadlineEn"></span>
                                </span>
                                <span x-show="page.registerEvent?.feesEn"
                                      class="inline-flex items-center gap-1.5 rounded-full bg-green-50 px-3 py-1 text-[11px] font-bold text-green-700">
                                    <svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                    <span x-text="isAr ? page.registerEvent?.feesAr : page.registerEvent?.feesEn"></span>
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Tabs navigation -->
                    <div class="mt-6 flex gap-1 rounded-xl bg-gray-100 p-1">
                        <button @click="activeTab = 'overview'"
                                class="flex-1 rounded-lg px-4 py-2.5 text-xs font-bold transition-all"
                                :class="activeTab === 'overview' ? 'bg-white text-spu-blue shadow-sm' : 'text-gray-500 hover:text-gray-700'"
                                x-text="isAr ? 'نظرة عامة' : 'Overview'"></button>
                        <button @click="activeTab = 'program'"
                                class="flex-1 rounded-lg px-4 py-2.5 text-xs font-bold transition-all"
                                :class="activeTab === 'program' ? 'bg-white text-spu-blue shadow-sm' : 'text-gray-500 hover:text-gray-700'"
                                x-text="isAr ? 'البرنامج' : 'Program'"></button>
                        <button @click="activeTab = 'speakers'"
                                class="flex-1 rounded-lg px-4 py-2.5 text-xs font-bold transition-all"
                                :class="activeTab === 'speakers' ? 'bg-white text-spu-blue shadow-sm' : 'text-gray-500 hover:text-gray-700'"
                                x-text="isAr ? 'المتحدثون' : 'Speakers'"></button>
                        <button @click="activeTab = 'topics'"
                                class="flex-1 rounded-lg px-4 py-2.5 text-xs font-bold transition-all"
                                :class="activeTab === 'topics' ? 'bg-white text-spu-blue shadow-sm' : 'text-gray-500 hover:text-gray-700'"
                                x-text="isAr ? 'المواضيع' : 'Topics'"></button>
                    </div>

                    <!-- Tab: Overview -->
                    <div x-show="activeTab === 'overview'" class="mt-6 space-y-6">
                        <!-- Highlights -->
                        <div x-show="page.registerEvent?.highlightsEn" class="rounded-2xl border border-spu-blue/10 bg-white p-6">
                            <h3 class="mb-4 flex items-center gap-2 text-base font-bold text-spu-blue">
                                <svg class="h-5 w-5 text-spu-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                <span x-text="isAr ? 'أبرز الفعاليات' : 'Event Highlights'"></span>
                            </h3>
                            <div class="grid gap-3 sm:grid-cols-2">
                                <template x-for="(item, idx) in (isAr ? page.registerEvent?.highlightsAr : page.registerEvent?.highlightsEn) || []" :key="idx">
                                    <div class="flex items-center gap-3 rounded-lg bg-spu-blue/[0.03] px-4 py-3">
                                        <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-spu-red/10 text-spu-red">
                                            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                        </div>
                                        <span class="text-sm font-semibold text-spu-blue" x-text="item"></span>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Quick links -->
                        <div class="rounded-2xl border border-spu-blue/10 bg-white p-6">
                            <h3 class="mb-4 flex items-center gap-2 text-base font-bold text-spu-blue">
                                <svg class="h-5 w-5 text-spu-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                                <span x-text="isAr ? 'روابط مفيدة' : 'Useful Links'"></span>
                            </h3>
                            <div class="space-y-2">
                                <a href="#" class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-spu-blue transition hover:bg-spu-blue/5">
                                    <svg class="h-4 w-4 text-spu-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                    <span x-text="isAr ? 'تحميل البرامج' : 'Download Brochure'"></span>
                                </a>
                                <a href="#" class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-spu-blue transition hover:bg-spu-blue/5">
                                    <svg class="h-4 w-4 text-spu-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                                    <span x-text="isAr ? 'دعوة للنشر' : 'Call for Papers'"></span>
                                </a>
                                <a href="#" class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold text-spu-blue transition hover:bg-spu-blue/5">
                                    <svg class="h-4 w-4 text-spu-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                    <span x-text="isAr ? 'الأسئلة الشائعة' : 'FAQ'"></span>
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Tab: Program -->
                    <div x-show="activeTab === 'program'" class="mt-6">
                        <div class="rounded-2xl border border-spu-blue/10 bg-white p-6">
                            <h3 class="mb-5 flex items-center gap-2 text-base font-bold text-spu-blue">
                                <svg class="h-5 w-5 text-spu-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                <span x-text="isAr ? 'برنامج المؤتمر' : 'Conference Program'"></span>
                            </h3>

                            <div class="space-y-6">
                                <template x-for="(day, dayIdx) in page.registerEvent?.program || []" :key="dayIdx">
                                    <div>
                                        <div class="mb-3 flex items-center gap-3">
                                            <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-spu-red text-xs font-bold text-white"
                                                 x-text="dayIdx + 1"></div>
                                            <h4 class="text-sm font-bold text-spu-blue"
                                                x-text="isAr ? day.dayAr : day.dayEn"></h4>
                                        </div>
                                        <div class="ms-4 border-s-2 border-spu-blue/10 ps-6 space-y-3">
                                            <template x-for="(item, idx) in day.items || []" :key="idx">
                                                <div class="relative flex gap-4">
                                                    <div class="absolute -start-[31px] top-1.5 h-2.5 w-2.5 rounded-full border-2 border-spu-blue/20 bg-white"></div>
                                                    <div class="shrink-0 w-[110px] text-[11px] font-bold text-spu-red"
                                                         x-text="isAr ? item.timeAr : item.timeEn"></div>
                                                    <div class="text-sm font-semibold text-spu-blue"
                                                         x-text="isAr ? item.titleAr : item.titleEn"></div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- Tab: Speakers -->
                    <div x-show="activeTab === 'speakers'" class="mt-6">
                        <div class="rounded-2xl border border-spu-blue/10 bg-white p-6">
                            <h3 class="mb-5 flex items-center gap-2 text-base font-bold text-spu-blue">
                                <svg class="h-5 w-5 text-spu-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                                <span x-text="isAr ? 'المتحدثون الرئيسيون' : 'Keynote Speakers'"></span>
                            </h3>

                            <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                                <template x-for="(speaker, idx) in (isAr ? page.registerEvent?.speakersAr : page.registerEvent?.speakersEn) || []" :key="idx">
                                    <div class="rounded-xl border border-spu-blue/10 bg-spu-blue/[0.02] p-5 text-center transition hover:shadow-md">
                                        <div class="mx-auto mb-3 flex h-16 w-16 items-center justify-center rounded-full bg-spu-blue/10">
                                            <svg class="h-8 w-8 text-spu-blue/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                        </div>
                                        <h4 class="text-sm font-bold text-spu-blue" x-text="isAr ? speaker.nameAr : speaker.nameEn"></h4>
                                        <p class="mt-1 text-[11px] text-spu-blue/60" x-text="isAr ? speaker.titleAr : speaker.titleEn"></p>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- Tab: Topics -->
                    <div x-show="activeTab === 'topics'" class="mt-6">
                        <div class="rounded-2xl border border-spu-blue/10 bg-white p-6">
                            <h3 class="mb-5 flex items-center gap-2 text-base font-bold text-spu-blue">
                                <svg class="h-5 w-5 text-spu-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
                                <span x-text="isAr ? 'المواضيع والمحاور' : 'Topics & Tracks'"></span>
                            </h3>

                            <div class="grid gap-3 sm:grid-cols-2">
                                <template x-for="(topic, idx) in (isAr ? page.registerEvent?.topicsAr : page.registerEvent?.topicsEn) || []" :key="idx">
                                    <div class="flex items-center gap-3 rounded-lg border border-spu-blue/10 bg-spu-blue/[0.02] px-4 py-3">
                                        <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-spu-red/10 text-xs font-bold text-spu-red"
                                             x-text="idx + 1"></div>
                                        <span class="text-sm font-semibold text-spu-blue" x-text="topic"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right: Dynamic form -->
                <div x-show="page.registerEvent"
                     class="rounded-2xl bg-gray-50 p-6 sm:p-8 lg:sticky lg:top-24 lg:self-start">
                    <h3 class="mb-6 pb-4 border-b border-gray-200 text-lg font-bold text-gray-900"
                        x-text="isAr ? $store.dynamicForm.schema?.titleAr : $store.dynamicForm.schema?.titleEn"></h3>
                    <include src="src/fragments/components/dynamic-form.html"></include>
                </div>
            </div>
        </div>
    </div>
</section>
