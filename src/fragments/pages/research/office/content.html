<section class="bg-white py-12 font-hacen md:py-16"
         x-data="{ get page() { return $store.officePage }, get isAr() { return $store.app.currentLang === 'ar' } }">

    <div class="container mx-auto px-6">
        <div class="mx-auto mb-12 max-w-[1200px]">
            <h2 class="mb-8 text-center text-lg font-bold text-spu-blue"
                x-text="isAr ? page.office.leadership.titleAr : page.office.leadership.titleEn"></h2>

            <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-4">
                <template x-for="leader in page.office.leadership.items" :key="leader.nameEn">
                    <div class="group text-center">
                        <div class="mx-auto mb-4 h-[120px] w-[120px] overflow-hidden rounded-full border-4 border-spu-blue/10 shadow-lg transition group-hover:border-spu-red">
                            <img :src="leader.image"
                                 :alt="isAr ? leader.nameAr : leader.nameEn"
                                 class="h-full w-full object-cover">
                        </div>
                        <h3 class="text-base font-bold text-spu-blue"
                            x-text="isAr ? leader.nameAr : leader.nameEn"></h3>
                        <p class="mb-2 text-sm text-spu-red"
                           x-text="isAr ? leader.roleAr : leader.roleEn"></p>
                        <a :href="'mailto:' + leader.email"
                           class="inline-flex items-center gap-1 text-xs text-spu-blue/60 hover:text-spu-red">
                            <img src="/images/icon-envelope-outline.svg" alt="" class="h-3 w-3">
                            <span x-text="leader.email"></span>
                        </a>
                    </div>
                </template>
            </div>
        </div>

        <div class="mx-auto mb-12 max-w-[1200px]">
            <h2 class="mb-2 text-center text-lg font-bold text-spu-red"
                x-text="isAr ? page.office.services.titleAr : page.office.services.titleEn"></h2>
            <p class="mb-8 text-center text-sm text-spu-blue/60"
               x-text="isAr ? 'كيف نساعدك في رحلتك البحثية' : 'How we support your research journey'"></p>

            <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
                <template x-for="service in page.office.services.items" :key="service.titleEn">
                    <div class="rounded-xl border border-spu-blue/10 bg-white p-6 shadow-sm transition hover:shadow-lg">
                        <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-spu-blue/[0.06]">
                            <svg class="h-6 w-6 text-spu-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                            </svg>
                        </div>
                        <h3 class="mb-2 text-base font-bold text-spu-blue"
                            x-text="isAr ? service.titleAr : service.titleEn"></h3>
                        <p class="text-sm text-spu-blue/70"
                           x-text="isAr ? service.descriptionAr : service.descriptionEn"></p>
                    </div>
                </template>
            </div>
        </div>

        <div class="mx-auto mb-12 max-w-[900px]">
            <h2 class="mb-8 text-center text-lg font-bold text-spu-blue"
                x-text="isAr ? page.office.statistics.titleAr : page.office.statistics.titleEn"></h2>

            <div class="grid grid-cols-2 gap-6 md:grid-cols-4">
                <template x-for="stat in page.office.statistics.items" :key="stat.labelEn">
                    <div class="rounded-xl border border-spu-blue/10 bg-spu-blue/[0.02] p-6 text-center">
                        <span class="block text-3xl font-extrabold text-spu-red" x-text="isAr ? stat.valueAr : stat.value"></span>
                        <span class="mt-1 block text-xs font-semibold text-spu-blue/70"
                              x-text="isAr ? stat.labelAr : stat.labelEn"></span>
                    </div>
                </template>
            </div>
        </div>

        <div class="mx-auto max-w-[600px] rounded-xl border border-spu-blue/20 bg-spu-blue/[0.02] p-8">
            <h2 class="mb-4 text-center text-lg font-bold text-spu-blue"
                x-text="isAr ? page.office.contact.titleAr : page.office.contact.titleEn"></h2>

            <div class="text-center">
                <p class="mb-1 text-sm font-bold text-spu-blue" x-text="isAr ? page.office.contact.addressAr : page.office.contact.addressEn"></p>
                <p class="mb-4 text-sm text-spu-blue/60" x-text="isAr ? page.office.contact.addressDetailAr : page.office.contact.addressDetailEn"></p>

                <div class="flex flex-col items-center gap-2 text-sm text-spu-blue">
                    <a :href="'mailto:' + page.office.contact.email"
                       class="flex items-center gap-2 font-semibold hover:text-spu-red">
                        <img src="/images/icon-envelope-outline.svg" alt="" class="h-4 w-4">
                        <span x-text="page.office.contact.email"></span>
                    </a>
                    <div class="flex items-center gap-2">
                        <img src="/images/icon-phone-outline.svg" alt="" class="h-4 w-4">
                        <span x-text="page.office.contact.phone"></span>
                    </div>
                    <div class="flex items-center gap-2 text-spu-blue/60">
                        <img src="/images/icon-calendar-outline.svg" alt="" class="h-4 w-4">
                        <span x-text="isAr ? page.office.contact.hoursAr : page.office.contact.hoursEn"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
