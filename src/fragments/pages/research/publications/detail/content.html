<section x-data="{
            get isAr() { return $store.app.currentLang === 'ar' },
            get pub() { return $store.researchPage.publications.items.find(p => p.slug === $store.app.currentSlug) },
            themeLabel(slug) {
              const theme = $store.researchPage.themes.items.find(t => t.slug === slug);
              return this.isAr ? (theme?.nameAr || slug) : (theme?.nameEn || slug);
            },
            themeHref(slug) { return '/research/themes/' + slug + '/'; },
            scholarUrl() { return this.pub?.scholarUrl || ('https://scholar.google.com/scholar?q=' + encodeURIComponent(this.pub?.titleEn || '')); },
            scopusUrl() { return this.pub?.scopusUrl || ('https://www.scopus.com/results/results.uri?sort=plf-f&src=s&st1=' + encodeURIComponent(this.pub?.titleEn || '')); },
            quartile() { return this.pub?.quartile || 'To be verified'; }
         }"
         class="bg-slate-50 py-10 font-hacen md:py-14"
         :dir="isAr ? 'rtl' : 'ltr'">
  <div class="container mx-auto max-w-[1120px] px-4 sm:px-6" x-show="pub">
    <div class="grid gap-8 lg:grid-cols-[minmax(0,7fr)_minmax(280px,3fr)] lg:items-start">
      <section class="space-y-6">
        <div class="rounded-[8px] border border-slate-200 bg-white p-6 shadow-[0_8px_24px_rgba(15,23,42,0.04)] md:p-8">
          <h2 class="text-[13px] font-bold uppercase tracking-[0.12em] text-spu-red">Summary</h2>
          <p class="mt-4 text-[15px] leading-8 text-slate-700"
             x-text="isAr ? pub?.summaryAr : pub?.summaryEn"></p>
        </div>

        <div class="rounded-[8px] border border-slate-200 bg-white p-6 shadow-[0_8px_24px_rgba(15,23,42,0.04)]">
          <h2 class="text-[13px] font-bold uppercase tracking-[0.12em] text-spu-red">Keywords</h2>
          <div class="mt-4 flex flex-wrap gap-2">
            <template x-for="keyword in (isAr ? pub?.keywordsAr : pub?.keywordsEn)" :key="keyword">
              <span class="inline-flex rounded-full border border-spu-blue/15 bg-spu-blue/5 px-3.5 py-1.5 text-xs font-semibold text-spu-blue"
                    x-text="keyword"></span>
            </template>
          </div>
        </div>

        <div class="flex flex-wrap gap-3">
          <a :href="scholarUrl()"
             target="_blank" rel="noopener"
             class="inline-flex h-12 items-center gap-2.5 rounded-[6px] bg-spu-red px-6 text-xs font-bold uppercase tracking-[0.08em] text-white transition hover:bg-spu-red/90 hover:shadow-lg">
            <img src="/images/icon-book-outline.svg" alt="" class="h-4 w-4 brightness-0 invert" aria-hidden="true">
            <span>View on Google Scholar</span>
          </a>
          <a :href="scopusUrl()"
             target="_blank" rel="noopener"
             class="inline-flex h-12 items-center gap-2.5 rounded-[6px] border border-spu-blue/20 bg-white px-6 text-xs font-bold uppercase tracking-[0.08em] text-spu-blue transition hover:border-spu-blue hover:bg-spu-blue/5">
            <img src="/images/icon-search-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
            <span>Search on Scopus</span>
          </a>
        </div>
      </section>

      <aside class="rounded-[8px] border border-slate-200 bg-white p-6 shadow-[0_8px_24px_rgba(15,23,42,0.04)] lg:sticky lg:top-28">
        <h2 class="text-[13px] font-bold uppercase tracking-[0.12em] text-spu-red">Publication Info</h2>

        <dl class="mt-5 divide-y divide-slate-100">
          <div class="py-3 first:pt-0">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Category</dt>
            <dd class="mt-1 text-sm font-bold text-spu-blue" x-text="isAr ? pub?.typeAr : pub?.typeEn"></dd>
          </div>
          <div class="py-3">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400">By</dt>
            <dd class="mt-1 text-sm font-bold text-spu-blue" x-text="isAr ? pub?.authorAr : pub?.authorEn"></dd>
          </div>
          <div class="py-3">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Time</dt>
            <dd class="mt-1 text-sm font-bold text-spu-blue" x-text="pub?.year"></dd>
          </div>
          <div class="py-3">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Faculty</dt>
            <dd class="mt-1 text-sm font-bold text-spu-blue" x-text="isAr ? pub?.facultyAr : pub?.facultyEn"></dd>
          </div>
          <div class="py-3">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Quartile</dt>
            <dd class="mt-1 flex flex-wrap items-center gap-2">
              <span class="inline-flex rounded-full bg-amber-50 px-3 py-1 text-[11px] font-bold uppercase tracking-wider text-amber-700"
                    x-text="quartile()"></span>
              <template x-if="pub?.isOpenAccess">
                <span class="inline-flex rounded-full bg-emerald-50 px-3 py-1 text-[11px] font-bold uppercase tracking-wider text-emerald-700">Open Access</span>
              </template>
            </dd>
          </div>
          <div class="py-3">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Link</dt>
            <dd class="mt-1">
              <a :href="'https://doi.org/' + pub?.doi" target="_blank" rel="noopener"
                 class="break-all text-sm font-bold text-spu-blue transition hover:text-spu-red hover:underline"
                 x-text="pub?.doi"></a>
            </dd>
          </div>
          <div class="py-3">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Type</dt>
            <dd class="mt-1 text-sm font-bold text-spu-blue" x-text="isAr ? pub?.typeAr : pub?.typeEn"></dd>
          </div>
          <div class="py-3 last:pb-0">
            <dt class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Research Theme</dt>
            <dd class="mt-2 flex flex-wrap gap-1.5">
              <template x-for="theme in (pub?.themes || [])" :key="theme">
                <a :href="themeHref(theme)"
                   class="inline-flex rounded-full border border-spu-blue/15 bg-spu-blue/5 px-2.5 py-1 text-[10px] font-semibold text-spu-blue transition hover:border-spu-blue/40 hover:bg-spu-blue/10"
                   x-text="themeLabel(theme)"></a>
              </template>
            </dd>
          </div>
        </dl>
      </aside>
    </div>
  </div>
</section>
