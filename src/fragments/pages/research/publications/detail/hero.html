<section x-data="{ get isAr() { return $store.app.currentLang === 'ar' }, get pub() { return $store.researchPage.publications.items.find(p => p.slug === $store.app.currentSlug) } }"
         class="bg-white pt-28 pb-10 font-hacen md:pt-32 md:pb-14"
         :dir="isAr ? 'rtl' : 'ltr'">
  <div class="container mx-auto">
    <nav class="mb-6 flex flex-wrap items-center justify-center gap-2 text-[11px] font-semibold text-slate-500"
         aria-label="Breadcrumb">
      <a href="/" class="transition hover:text-spu-blue">Home</a>
      <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2.5 w-2.5 rtl:rotate-180" aria-hidden="true">
      <a href="/research.html" class="transition hover:text-spu-blue">Research</a>
      <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2.5 w-2.5 rtl:rotate-180" aria-hidden="true">
      <a href="/research/publications/" class="transition hover:text-spu-blue">Publications</a>
    </nav>

    <figure class="mx-auto container overflow-hidden rounded-[8px]">
      <img :src="pub?.image || '/images/uni-main-place.JPG'"
           :alt="isAr ? pub?.titleAr : pub?.titleEn"
           class="h-[220px] mx-auto w-[80%] object-top md:h-[400px]">
    </figure>

    <h1 class="mx-auto mt-8 max-w-[820px] text-center text-2xl font-bold leading-snug text-spu-blue md:text-[32px] md:leading-tight"
        x-text="isAr ? pub?.titleAr : pub?.titleEn"></h1>
  </div>
</section>
