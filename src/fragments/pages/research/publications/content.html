<section x-data="{
            get isAr() { return $store.app.currentLang === 'ar' },
            get page() { return $store.researchPage.publications },
            searchQuery: '',
            selectedFaculty: '',
            selectedType: '',
            selectedYear: '',
            currentPage: 1,
            perPage: 6,
            get filteredPubs() {
                const items = this.page?.items || [];
                let results = items;
                if (this.selectedFaculty) {
                    results = results.filter(p => p.facultySlug === this.selectedFaculty);
                }
                if (this.selectedType) {
                    results = results.filter(p => (p.typeSlug || '') === this.selectedType);
                }
                if (this.selectedYear) {
                    results = results.filter(p => p.year === this.selectedYear);
                }
                if (this.searchQuery.length >= 2) {
                    const q = this.searchQuery.toLowerCase();
                    results = results.filter(p => {
                        const title = (this.isAr ? p.titleAr : p.titleEn || '').toLowerCase();
                        const author = (this.isAr ? p.authorAr : p.authorEn || '').toLowerCase();
                        const keywords = (this.isAr ? p.keywordsAr : p.keywordsEn || []).join(' ').toLowerCase();
                        const summary = (this.isAr ? p.summaryAr : p.summaryEn || '').toLowerCase();
                        return title.includes(q) || author.includes(q) || keywords.includes(q) || summary.includes(q);
                    });
                }
                return results;
            },
            get totalPages() { return Math.max(1, Math.ceil(this.filteredPubs.length / this.perPage)); },
            get pagedPubs() {
                const start = (this.currentPage - 1) * this.perPage;
                return this.filteredPubs.slice(start, start + this.perPage);
            },
            get pageNumbers() {
                const pages = [];
                for (let i = 1; i <= this.totalPages; i++) pages.push(i);
                return pages;
            },
            resetFilters() {
                this.searchQuery = '';
                this.selectedFaculty = '';
                this.selectedType = '';
                this.selectedYear = '';
                this.currentPage = 1;
            },
            facultySlug(val) {
                const map = { 'medicine':'medicine','dentistry':'dentistry','pharmacy':'pharmacy','artificial-intelligence':'ai','petroleum':'petroleum','construction':'construction','business':'business' };
                return map[val] || val;
            },
            typeSlug(val) {
                const map = { 'research-article':'research-article','conference-paper':'conference-paper','journal-paper':'journal-paper','thesis':'thesis','book-chapter':'book-chapter' };
                return map[val] || val;
            }
         }" class="bg-white pt-[60px] pb-[80px] font-hacen" :dir="isAr ? 'rtl' : 'ltr'">
    <div class="container">
        <div class="mx-auto grid max-w-[1210px] grid-cols-1 gap-6 md:grid-cols-[220px_220px_220px_1fr]">
            <label class="relative block">
                <span class="sr-only" x-text="isAr ? page.filters.facultyLabelAr : page.filters.facultyLabelEn"></span>
                <select x-model="selectedFaculty" @change="currentPage = 1"
                        class="h-[49px] w-full appearance-none rounded-[8px] border border-[#dde2ea] bg-white px-5 text-[15px] font-bold text-[#344054] shadow-[0_8px_18px_rgba(16,24,40,0.08)] outline-none transition focus:border-spu-blue">
                    <template x-for="option in page.filters.faculties" :key="option.value">
                        <option :value="option.value"
                                x-text="isAr ? option.labelAr : option.labelEn"></option>
                    </template>
                </select>
                <img src="/images/icon-chevron-down-outline.svg" alt="" class="pointer-events-none absolute right-5 top-1/2 h-3 w-3 -translate-y-1/2 rtl:left-5 rtl:right-auto" aria-hidden="true">
            </label>

            <label class="relative block">
                <span class="sr-only" x-text="isAr ? page.filters.typeLabelAr : page.filters.typeLabelEn"></span>
                <select x-model="selectedType" @change="currentPage = 1"
                        class="h-[49px] w-full appearance-none rounded-[8px] border border-[#dde2ea] bg-white px-5 text-[15px] font-bold text-[#344054] shadow-[0_8px_18px_rgba(16,24,40,0.08)] outline-none transition focus:border-spu-blue">
                    <template x-for="option in page.filters.publicationTypes" :key="option.value">
                        <option :value="option.value"
                                x-text="isAr ? option.labelAr : option.labelEn"></option>
                    </template>
                </select>
                <img src="/images/icon-chevron-down-outline.svg" alt="" class="pointer-events-none absolute right-5 top-1/2 h-3 w-3 -translate-y-1/2 rtl:left-5 rtl:right-auto" aria-hidden="true">
            </label>

            <label class="relative block">
                <span class="sr-only" x-text="isAr ? page.filters.yearLabelAr : page.filters.yearLabelEn"></span>
                <select x-model="selectedYear" @change="currentPage = 1"
                        class="h-[49px] w-full appearance-none rounded-[8px] border border-[#dde2ea] bg-white px-5 text-[15px] font-bold text-[#344054] shadow-[0_8px_18px_rgba(16,24,40,0.08)] outline-none transition focus:border-spu-blue">
                    <template x-for="option in page.filters.years" :key="option.value">
                        <option :value="option.value"
                                x-text="isAr ? option.labelAr : option.labelEn"></option>
                    </template>
                </select>
                <img src="/images/icon-chevron-down-outline.svg" alt="" class="pointer-events-none absolute right-5 top-1/2 h-3 w-3 -translate-y-1/2 rtl:left-5 rtl:right-auto" aria-hidden="true">
            </label>

            <label class="relative block">
                <span class="sr-only">Search</span>
                <img src="/images/icon-search-outline.svg" alt="" class="pointer-events-none absolute left-5 top-1/2 h-4 w-4 -translate-y-1/2 opacity-70 rtl:left-auto rtl:right-5" aria-hidden="true">
                <input type="search"
                       x-model="searchQuery" @input="currentPage = 1"
                       class="h-[49px] w-full rounded-[8px] border border-[#dde2ea] bg-white ps-12 pe-5 text-[13px] font-medium text-[#344054] shadow-[0_8px_18px_rgba(16,24,40,0.08)] outline-none transition placeholder:text-[#5b6473] focus:border-spu-blue"
                       :placeholder="isAr ? page.filters.searchPlaceholderAr : page.filters.searchPlaceholderEn">
            </label>
        </div>

        <p class="mx-auto mt-4 max-w-[1210px] text-sm text-[#6f7280]">
            <span x-text="filteredPubs.length"></span>
            <span x-text="isAr ? ' نتيجة' : ' results'"></span>
        </p>

        <div class="mx-auto mt-[48px] grid max-w-[1168px] grid-cols-1 gap-x-[38px] gap-y-[38px] lg:grid-cols-2">
            <template x-for="pub in pagedPubs" :key="pub.id">
                <a :href="'/research/publications/' + pub.slug + '/'"
                   class="group block overflow-hidden rounded-[10px] border border-[#d5d9e2] bg-white shadow-[0_4px_10px_rgba(0,0,0,0.16)] transition-all hover:-translate-y-1 hover:shadow-[0_8px_24px_rgba(32,39,89,0.12)]">
                    <img :src="pub.image"
                         :alt="$store.app.currentLang === 'ar' ? pub.titleAr : pub.titleEn"
                         class="h-[169px] w-full object-cover transition-transform duration-500 group-hover:scale-105">

                    <div class="px-[18px] pb-[20px] pt-[20px]">
                        <div class="flex flex-wrap gap-[7px]">
                            <span class="rounded-[5px] border border-[#c8ceda] px-[12px] py-[5px] text-[9px] font-bold text-spu-blue"
                                  x-text="$store.app.currentLang === 'ar' ? pub.typeAr : pub.typeEn"></span>
                            <span class="rounded-[5px] border border-[#c8ceda] px-[12px] py-[5px] text-[9px] font-bold text-spu-blue"
                                  x-text="$store.app.currentLang === 'ar' ? pub.facultyAr : pub.facultyEn"></span>
                            <span class="rounded-[5px] border border-[#c8ceda] px-[12px] py-[5px] text-[9px] font-bold text-spu-blue"
                                  x-text="$store.app.currentLang === 'ar' ? pub.authorAr : pub.authorEn"></span>
                            <span class="rounded-[5px] border border-[#c8ceda] px-[12px] py-[5px] text-[9px] font-bold text-spu-blue"
                                  x-text="pub.year"></span>
                            <span x-show="pub.isOpenAccess"
                                  class="rounded-[5px] bg-green-100 px-[12px] py-[5px] text-[9px] font-bold text-green-700"
                                  x-text="$store.app.currentLang === 'ar' ? $store.researchPage.publications.cardLabels.openAccessAr : $store.researchPage.publications.cardLabels.openAccessEn"></span>
                        </div>

                        <h2 class="mt-[14px] text-[22px] font-bold leading-tight text-spu-blue group-hover:text-spu-red transition-colors"
                            x-text="$store.app.currentLang === 'ar' ? pub.titleAr : pub.titleEn"></h2>
                        <p class="mt-[10px] max-w-[500px] text-[16px] leading-[1.75] text-[#263650]"
                           x-text="$store.app.currentLang === 'ar' ? pub.summaryAr : pub.summaryEn"></p>

                        <div class="mt-[20px] flex flex-wrap gap-[8px]">
                            <span class="inline-flex h-[27px] min-w-[87px] items-center justify-center rounded-[6px] bg-spu-blue px-4 text-[8px] font-bold text-white transition group-hover:bg-[#171d47]"
                                  x-text="$store.app.currentLang === 'ar' ? $store.researchPage.publications.cardLabels.viewPublicationAr : $store.researchPage.publications.cardLabels.viewPublicationEn"></span>
                        </div>
                    </div>
                </a>
            </template>
        </div>

        <nav class="mt-[46px] flex items-center justify-center gap-[13px]" aria-label="Pagination" x-show="totalPages > 1">
            <a href="javascript:void(0)"
               @click.prevent="currentPage = Math.max(1, currentPage - 1)"
               :class="currentPage === 1 ? 'opacity-40 pointer-events-none' : ''"
               class="flex h-[36px] w-[36px] items-center justify-center rounded-[7px] border border-[#c8ceda] bg-white text-spu-blue transition hover:border-spu-blue">
                <span class="sr-only" x-text="isAr ? page.pagination.previousLabelAr : page.pagination.previousLabelEn"></span>
                <span aria-hidden="true">‹</span>
            </a>

            <template x-for="p in pageNumbers" :key="p">
                <a href="javascript:void(0)"
                   @click.prevent="currentPage = p"
                   class="flex h-[36px] w-[36px] items-center justify-center rounded-[7px] border text-[14px] font-bold transition"
                   :class="p === currentPage ? 'border-spu-red bg-spu-red text-white' : 'border-[#c8ceda] bg-white text-spu-blue hover:border-spu-blue'"
                   x-text="p"></a>
            </template>

            <a href="javascript:void(0)"
               @click.prevent="currentPage = Math.min(totalPages, currentPage + 1)"
               :class="currentPage === totalPages ? 'opacity-40 pointer-events-none' : ''"
               class="flex h-[36px] w-[36px] items-center justify-center rounded-[7px] border border-[#c8ceda] bg-white text-spu-blue transition hover:border-spu-blue">
                <span class="sr-only" x-text="isAr ? page.pagination.nextLabelAr : page.pagination.nextLabelEn"></span>
                <span aria-hidden="true">›</span>
            </a>
        </nav>

        <div class="mt-6 text-center" x-show="filteredPubs.length === 0">
            <div class="mx-auto max-w-[400px] rounded-xl bg-spu-blue/5 py-12 px-6">
                <h3 class="mb-2 text-lg font-bold text-spu-blue" x-text="isAr ? 'لا توجد نتائج' : 'No Results Found'"></h3>
                <p class="text-sm text-spu-blue/60 mb-4" x-text="isAr ? 'جرب تغيير كلمات البحث أو الفلاتر' : 'Try changing your search terms or filters'"></p>
                <button @click="resetFilters()" class="mt-2 rounded-[6px] bg-spu-blue px-4 py-2 text-xs font-bold text-white transition hover:bg-spu-red">
                    <span x-text="isAr ? 'مسح الفلاتر' : 'Clear Filters'"></span>
                </button>
            </div>
        </div>
    </div>
</section>
