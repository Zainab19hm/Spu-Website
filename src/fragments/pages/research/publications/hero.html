<section x-data class="bg-white font-hacen" :dir="$store.app.currentLang === 'ar' ? 'rtl' : 'ltr'">
    <div class="relative h-[60vh] min-h-[400px] overflow-hidden">
        <img :src="$store.researchPage.publications.hero.backgroundImage"
             alt="SPU Campus"
             class="absolute inset-0 h-full w-full object-cover"
             aria-hidden="true">
        <div class="absolute inset-0 bg-spu-blue/60"></div>
        <div class="container relative z-10 flex h-full items-center justify-center">
            <div class="text-center" :class="$store.app.currentLang === 'ar' ? 'text-right' : 'text-left'">
                <p class="text-[12px] font-bold uppercase tracking-[0.16em] text-white/80"
                   x-text="$store.app.currentLang === 'ar' ? $store.researchPage.publications.hero.eyebrowAr : $store.researchPage.publications.hero.eyebrowEn">
                </p>
                <h1 class="mt-3 text-[32px] font-bold text-white md:text-[42px]"
                    x-text="$store.app.currentLang === 'ar' ? $store.researchPage.publications.hero.titleAr : $store.researchPage.publications.hero.titleEn">
                </h1>
                <p class="mx-auto mt-4 max-w-[600px] text-[14px] leading-[1.6] text-white/90"
                   x-text="$store.app.currentLang === 'ar' ? $store.researchPage.publications.hero.summaryAr : $store.researchPage.publications.hero.summaryEn">
                </p>
                <nav class="mt-6 flex items-center justify-center gap-2 text-[12px] text-white/70"
                     aria-label="Breadcrumb">
                    <template x-for="(crumb, index) in $store.researchPage.publications.hero.breadcrumbs" :key="index">
                        <span class="flex items-center gap-2">
                            <a :href="crumb.url"
                               class="hover:text-white"
                               x-text="$store.app.currentLang === 'ar' ? crumb.labelAr : crumb.labelEn"></a>
                            <span x-show="index < $store.researchPage.publications.hero.breadcrumbs.length - 1">/</span>
                        </span>
                    </template>
                </nav>
            </div>
        </div>
    </div>
</section>
