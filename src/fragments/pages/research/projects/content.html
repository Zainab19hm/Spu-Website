<section x-data="{
            get isAr() { return $store.app.currentLang === 'ar' },
            get page() { return $store.researchPage.projects },
            searchQuery: '',
            selectedStatus: '',
            selectedFaculty: '',
            selectedTheme: '',
            get filteredProjects() {
                const items = this.page?.items || [];
                let results = items;
                if (this.selectedStatus) {
                    results = results.filter(p => p.status === this.selectedStatus);
                }
                if (this.selectedFaculty) {
                    results = results.filter(p => p.facultySlug === this.selectedFaculty);
                }
                if (this.selectedTheme) {
                    results = results.filter(p => p.themeSlug === this.selectedTheme);
                }
                if (this.searchQuery.length >= 2) {
                    const q = this.searchQuery.toLowerCase();
                    results = results.filter(p => {
                        const title = (this.isAr ? p.titleAr : p.titleEn || '').toLowerCase();
                        const summary = (this.isAr ? p.summaryAr : p.summaryEn || '').toLowerCase();
                        const faculty = (this.isAr ? p.facultyAr : p.facultyEn || '').toLowerCase();
                        const theme = (this.isAr ? p.themeAr : p.themeEn || '').toLowerCase();
                        return title.includes(q) || summary.includes(q) || faculty.includes(q) || theme.includes(q);
                    });
                }
                return results;
            },
            resetFilters() {
                this.searchQuery = '';
                this.selectedStatus = '';
                this.selectedFaculty = '';
                this.selectedTheme = '';
            }
         }" class="bg-white pt-[60px] pb-[80px] font-hacen" :dir="isAr ? 'rtl' : 'ltr'">
    <div class="container">
        <div class="mx-auto grid max-w-[1210px] grid-cols-1 gap-6 md:grid-cols-[180px_180px_180px_1fr]">
            <label class="relative block">
                <span class="sr-only" x-text="isAr ? page.filters.statusLabelAr : page.filters.statusLabelEn"></span>
                <select x-model="selectedStatus"
                        class="h-[49px] w-full appearance-none rounded-[8px] border border-[#dde2ea] bg-white px-5 text-[15px] font-bold text-[#344054] shadow-[0_8px_18px_rgba(16,24,40,0.08)] outline-none transition focus:border-spu-blue">
                    <option value="" x-text="isAr ? 'الحالة' : 'Status'"></option>
                    <template x-for="status in page.filters.statuses" :key="status.value">
                        <option :value="status.value"
                                x-text="isAr ? status.labelAr : status.labelEn"></option>
                    </template>
                </select>
                <img src="/images/icon-chevron-down-outline.svg" alt="" class="pointer-events-none absolute right-5 top-1/2 h-3 w-3 -translate-y-1/2 rtl:left-5 rtl:right-auto" aria-hidden="true">
            </label>

            <label class="relative block">
                <span class="sr-only" x-text="isAr ? page.filters.facultyLabelAr : page.filters.facultyLabelEn"></span>
                <select x-model="selectedFaculty"
                        class="h-[49px] w-full appearance-none rounded-[8px] border border-[#dde2ea] bg-white px-5 text-[15px] font-bold text-[#344054] shadow-[0_8px_18px_rgba(16,24,40,0.08)] outline-none transition focus:border-spu-blue">
                    <template x-for="option in page.filters.faculties" :key="option.value">
                        <option :value="option.value"
                                x-text="isAr ? option.labelAr : option.labelEn"></option>
                    </template>
                </select>
                <img src="/images/icon-chevron-down-outline.svg" alt="" class="pointer-events-none absolute right-5 top-1/2 h-3 w-3 -translate-y-1/2 rtl:left-5 rtl:right-auto" aria-hidden="true">
            </label>

            <label class="relative block">
                <span class="sr-only" x-text="isAr ? page.filters.themeLabelAr : page.filters.themeLabelEn"></span>
                <select x-model="selectedTheme"
                        class="h-[49px] w-full appearance-none rounded-[8px] border border-[#dde2ea] bg-white px-5 text-[15px] font-bold text-[#344054] shadow-[0_8px_18px_rgba(16,24,40,0.08)] outline-none transition focus:border-spu-blue">
                    <template x-for="option in page.filters.themes" :key="option.value">
                        <option :value="option.value"
                                x-text="isAr ? option.labelAr : option.labelEn"></option>
                    </template>
                </select>
                <img src="/images/icon-chevron-down-outline.svg" alt="" class="pointer-events-none absolute right-5 top-1/2 h-3 w-3 -translate-y-1/2 rtl:left-5 rtl:right-auto" aria-hidden="true">
            </label>

            <label class="relative block">
                <span class="sr-only">Search</span>
                <img src="/images/icon-search-outline.svg" alt="" class="pointer-events-none absolute left-5 top-1/2 h-4 w-4 -translate-y-1/2 opacity-70 rtl:left-auto rtl:right-5" aria-hidden="true">
                <input type="search"
                       x-model="searchQuery"
                       class="h-[49px] w-full rounded-[8px] border border-[#dde2ea] bg-white ps-12 pe-5 text-[13px] font-medium text-[#344054] shadow-[0_8px_18px_rgba(16,24,40,0.08)] outline-none transition placeholder:text-[#5b6473] focus:border-spu-blue"
                       :placeholder="isAr ? page.filters.searchPlaceholderAr : page.filters.searchPlaceholderEn">
            </label>
        </div>

        <p class="mx-auto mt-4 max-w-[1210px] text-sm text-[#6f7280]">
            <span x-text="filteredProjects.length"></span>
            <span x-text="isAr ? ' نتيجة' : ' results'"></span>
        </p>

        <div class="mx-auto mt-[48px] grid max-w-[1168px] grid-cols-1 gap-x-[38px] gap-y-[38px] lg:grid-cols-2">
            <template x-for="project in filteredProjects" :key="project.id">
                <a :href="'/research/projects/' + project.slug + '/'"
                   class="group block overflow-hidden rounded-[10px] border border-[#d5d9e2] bg-white shadow-[0_4px_10px_rgba(0,0,0,0.16)] transition-all hover:-translate-y-1 hover:shadow-[0_8px_24px_rgba(32,39,89,0.12)]">
                    <div class="relative h-[180px] overflow-hidden">
                        <img :src="project.image"
                             :alt="isAr ? project.titleAr : project.titleEn"
                             class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
                        <div class="absolute left-4 top-4">
                            <span class="rounded-[6px] px-3 py-1 text-[10px] font-bold"
                                  :class="project.status === 'ongoing' ? 'bg-green-500 text-white' : project.status === 'completed' ? 'bg-spu-blue text-white' : 'bg-yellow-500 text-white'"
                                  x-text="isAr
                                      ? (project.status === 'ongoing' ? 'جاري' : project.status === 'completed' ? 'مكتمل' : 'معلق')
                                      : (project.status === 'ongoing' ? 'Ongoing' : project.status === 'completed' ? 'Completed' : 'Paused')">
                            </span>
                        </div>
                    </div>

                    <div class="px-[18px] pb-[20px] pt-[20px]">
                        <div class="flex flex-wrap gap-[7px]">
                            <span class="rounded-[5px] border border-[#c8ceda] px-[12px] py-[5px] text-[9px] font-bold text-spu-blue"
                                  x-text="isAr ? project.facultyAr : project.facultyEn"></span>
                            <span class="rounded-[5px] border border-[#c8ceda] px-[12px] py-[5px] text-[9px] font-bold text-spu-blue"
                                  x-text="isAr ? 'منذ ' + project.startYear : 'Since ' + project.startYear"></span>
                        </div>

                        <h2 class="mt-[14px] text-[20px] font-bold leading-tight text-spu-blue group-hover:text-spu-red transition-colors"
                            x-text="isAr ? project.titleAr : project.titleEn"></h2>
                        <p class="mt-[10px] max-w-[500px] text-[15px] leading-[1.75] text-[#263650]"
                           x-text="isAr ? project.summaryAr : project.summaryEn"></p>

                        <div class="mt-4 flex items-center gap-4 text-[12px] text-[#6f7280]">
                            <span class="flex items-center gap-1">
                                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                                </svg>
                                <span x-text="isAr ? project.themeAr : project.themeEn"></span>
                            </span>
                        </div>

                        <div class="mt-[16px] flex items-center gap-3">
                            <span class="inline-flex h-[27px] min-w-[100px] items-center justify-center rounded-[6px] bg-spu-blue px-4 text-[8px] font-bold text-white transition group-hover:bg-[#171d47]"
                                  x-text="isAr ? 'عرض المشروع' : 'View Project'"></span>
                        </div>
                    </div>
                </a>
            </template>
        </div>

        <div class="mt-12 text-center" x-show="filteredProjects.length === 0">
            <div class="mx-auto max-w-[400px] rounded-xl bg-spu-blue/5 py-12 px-6">
                <h3 class="mb-2 text-lg font-bold text-spu-blue" x-text="isAr ? 'لا توجد نتائج' : 'No Results Found'"></h3>
                <p class="text-sm text-spu-blue/60 mb-4" x-text="isAr ? 'جرب تغيير كلمات البحث أو الفلاتر' : 'Try changing your search terms or filters'"></p>
                <button @click="resetFilters()" class="mt-2 rounded-[6px] bg-spu-blue px-4 py-2 text-xs font-bold text-white transition hover:bg-spu-red">
                    <span x-text="isAr ? 'مسح الفلاتر' : 'Clear Filters'"></span>
                </button>
            </div>
        </div>
    </div>
</section>
