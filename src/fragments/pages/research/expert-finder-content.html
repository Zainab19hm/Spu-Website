<section id="research-expert-finder" x-data="{ query: '' }" class="bg-white py-20 font-hacen lg:py-24">
    <div class="container">
        <div class="max-w-3xl">
            <p class="text-sm font-bold uppercase tracking-[0.35em] text-spu-red/70" x-text="$store.app.currentLang === 'ar' ? 'دليل الخبراء' : 'Expert Finder'"></p>
            <h1 class="mt-5 text-3xl font-bold leading-tight text-spu-blue md:text-4xl" x-text="$store.app.currentLang === 'ar' ? 'ابحث عن عضو هيئة تدريسية حسب التخصص أو الكلية' : 'Search academic staff by specialty or faculty'"></h1>
        </div>

        <div class="mt-8 max-w-xl">
            <div class="relative">
                <input type="text" x-model="query" :placeholder="$store.app.currentLang === 'ar' ? 'ابحث بالاسم أو التخصص...' : 'Search by name or specialty...'" class="w-full rounded-full border border-slate-200 bg-section px-6 py-4 pr-12 text-[15px] text-slate-700 outline-none focus:border-spu-blue">
                <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>
        </div>

        <div class="mt-10 grid gap-6 md:grid-cols-2 xl:grid-cols-3">
            <template x-for="expert in [
                { nameEn: 'Dr. Ahmad Khalil', nameAr: 'د. أحمد خليل', deptEn: 'Surgery', deptAr: 'الجراحة', facEn: 'Medicine', facAr: 'الطب', interestsEn: 'Simulation, Clinical Education', interestsAr: 'المحاكاة، التعليم السريري' },
                { nameEn: 'Dr. Layla Haddad', nameAr: 'د. ليلى حداد', deptEn: 'Pharmaceutics', deptAr: 'الصيدلانيات', facEn: 'Pharmacy', facAr: 'الصيدلة', interestsEn: 'Drug Safety, Therapeutics', interestsAr: 'السلامة الدوائية، العلاجيات' },
                { nameEn: 'Dr. Omar Saeed', nameAr: 'د. عمر سعيد', deptEn: 'AI Systems', deptAr: 'الأنظمة الذكية', facEn: 'AI Engineering', facAr: 'هندسة الذكاء الاصطناعي', interestsEn: 'Machine Learning, Automation', interestsAr: 'تعلم الآلة، الأتمتة' },
                { nameEn: 'Dr. Rami Youssef', nameAr: 'د. رامي يوسف', deptEn: 'Petroleum Engineering', deptAr: 'هندسة البترول', facEn: 'Petroleum Eng.', facAr: 'هندسة البترول', interestsEn: 'Reservoir Modeling, Energy Systems', interestsAr: 'نمذجة المكامن، أنظمة الطاقة' },
                { nameEn: 'Dr. Hiba Nasser', nameAr: 'د. هبة ناصر', deptEn: 'Orthodontics', deptAr: 'تقويم الأسنان', facEn: 'Dentistry', facAr: 'طب الأسنان', interestsEn: 'Digital Dentistry, Preventive Care', interestsAr: 'طب الأسنان الرقمي، الرعاية الوقائية' },
                { nameEn: 'Dr. Samir Darwish', nameAr: 'د. سمير درويش', deptEn: 'Structural Engineering', deptAr: 'الهندسة الإنشائية', facEn: 'Construction Eng.', facAr: 'هندسة البناء', interestsEn: 'Sustainable Materials, Resilience', interestsAr: 'المواد المستدامة، المرونة' }
            ].filter(e => !query || (($store.app.currentLang === 'ar' ? e.nameAr + e.interestsAr : e.nameEn + e.interestsEn).toLowerCase().includes(query.toLowerCase())))" :key="expert.nameEn">
                <article class="rounded-[28px] border border-slate-200/80 bg-white p-7 shadow-[0_20px_55px_rgba(20,30,70,0.07)]">
                    <div class="flex items-center gap-4">
                        <div class="flex h-14 w-14 items-center justify-center rounded-full bg-spu-blue text-xl font-bold text-white" x-text="($store.app.currentLang === 'ar' ? expert.nameAr : expert.nameEn).charAt(0)"></div>
                        <div>
                            <h3 class="text-lg font-bold text-spu-blue" x-text="$store.app.currentLang === 'ar' ? expert.nameAr : expert.nameEn"></h3>
                            <p class="text-sm text-slate-500" x-text="$store.app.currentLang === 'ar' ? expert.deptAr + ' — ' + expert.facAr : expert.deptEn + ' — ' + expert.facEn"></p>
                        </div>
                    </div>
                    <p class="mt-4 text-[15px] leading-7 text-slate-600">
                        <span class="font-medium text-spu-blue" x-text="$store.app.currentLang === 'ar' ? 'الاهتمامات البحثية: ' : 'Research interests: '"></span>
                        <span x-text="$store.app.currentLang === 'ar' ? expert.interestsAr : expert.interestsEn"></span>
                    </p>
                </article>
            </template>
        </div>
    </div>
</section>
