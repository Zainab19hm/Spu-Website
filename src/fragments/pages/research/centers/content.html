<section x-data="{
            get isAr() { return $store.app.currentLang === 'ar' },
            get page() { return $store.researchPage.centers },
            get centers() { return this.page?.items || [] },
            get labs() { return this.page?.laboratories?.items || [] },
            getIntro(key) { return this.isAr ? (this.page?.intro?.[key + 'Ar'] || this.page?.intro?.[key + 'En'] || '') : (this.page?.intro?.[key + 'En'] || this.page?.intro?.[key + 'Ar'] || ''); }
         }" class="bg-white pt-[60px] pb-[80px] font-hacen" :dir="isAr ? 'rtl' : 'ltr'">

    <!-- Intro Section -->
    <div class="container">
        <div class="mx-auto grid max-w-[1070px] gap-14 lg:grid-cols-[1fr_1px_0.82fr] lg:items-center">
            <div>
                <div class="h-[2px] w-[185px] bg-spu-red"></div>
                <h2 class="mt-8 max-w-[470px] text-[30px] font-bold leading-[1.35] text-spu-blue"
                    x-text="isAr ? page.intro.titleAr : page.intro.titleEn"></h2>
                <p class="mt-7 whitespace-pre-line text-[17px] leading-[1.55] text-[#33405d]"
                   x-text="isAr ? page.intro.summaryAr : page.intro.summaryEn"></p>
            </div>
            <div class="hidden h-[184px] bg-[#b9bfcc] lg:block"></div>
            <div class="grid gap-10">
                <template x-for="item in page.intro.highlights" :key="item.titleEn">
                    <article class="grid grid-cols-[28px_1fr] gap-6">
                        <img :src="item.icon" alt="" class="mt-1 h-[20px] w-[20px]" aria-hidden="true">
                        <div>
                            <h3 class="text-[14px] font-bold text-spu-blue"
                                x-text="isAr ? item.titleAr : item.titleEn"></h3>
                            <p class="mt-2 text-[10px] leading-relaxed text-[#556070]"
                               x-text="isAr ? item.summaryAr : item.summaryEn"></p>
                        </div>
                    </article>
                </template>
            </div>
        </div>
    </div>

    <!-- Research Centers Grid -->
    <div class="container mx-auto mt-[80px] px-6">
        <div class="mx-auto max-w-[1090px]">
            <h2 class="mb-[48px] text-[32px] font-bold text-spu-blue"
                x-text="isAr ? 'مراكز البحث' : 'Research Centers'"></h2>
            <div class="grid grid-cols-1 gap-[38px] md:grid-cols-2 lg:grid-cols-3">
                <template x-for="center in centers" :key="center.id">
                    <a :href="'/research/centers/' + center.slug + '/'"
                       class="group block overflow-hidden rounded-[10px] border border-[#d5d9e2] bg-white shadow-[0_4px_10px_rgba(0,0,0,0.12)] transition-all hover:-translate-y-1 hover:shadow-[0_8px_24px_rgba(32,39,89,0.12)]">
                        <div class="relative h-[180px] overflow-hidden">
                            <img :src="center.image"
                                 :alt="isAr ? center.nameAr : center.nameEn"
                                 class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
                            <span class="absolute left-4 top-4 rounded-[4px] bg-white/90 px-3 py-1 text-[10px] font-bold text-spu-blue backdrop-blur-sm rtl:left-auto rtl:right-4"
                                  x-text="isAr ? center.facultyAr : center.facultyEn"></span>
                        </div>
                        <div class="p-5">
                            <h3 class="text-[18px] font-bold leading-tight text-spu-blue group-hover:text-spu-red transition-colors"
                                x-text="isAr ? center.nameAr : center.nameEn"></h3>
                            <p class="mt-3 text-[13px] leading-[1.7] text-[#33405d] line-clamp-3"
                               x-text="isAr ? center.missionAr : center.missionEn"></p>

                            <div class="mt-4 grid grid-cols-2 gap-3">
                                <div class="rounded-[6px] bg-spu-blue/[0.04] p-3 text-center">
                                    <span class="block text-[20px] font-bold text-spu-blue" x-text="center.labs || 0"></span>
                                    <span class="text-[10px] text-[#6f7280]" x-text="isAr ? 'مختبر' : 'Labs'"></span>
                                </div>
                                <div class="rounded-[6px] bg-spu-blue/[0.04] p-3 text-center">
                                    <span class="block text-[20px] font-bold text-spu-blue" x-text="center.researchers || 0"></span>
                                    <span class="text-[10px] text-[#6f7280]" x-text="isAr ? 'باحث' : 'Researchers'"></span>
                                </div>
                                <div class="rounded-[6px] bg-spu-blue/[0.04] p-3 text-center">
                                    <span class="block text-[20px] font-bold text-spu-blue" x-text="center.projects || 0"></span>
                                    <span class="text-[10px] text-[#6f7280]" x-text="isAr ? 'مشروع' : 'Projects'"></span>
                                </div>
                                <div class="rounded-[6px] bg-spu-blue/[0.04] p-3 text-center">
                                    <span class="block text-[20px] font-bold text-spu-blue" x-text="center.publications || 0"></span>
                                    <span class="text-[10px] text-[#6f7280]" x-text="isAr ? 'منشور' : 'Publications'"></span>
                                </div>
                            </div>

                            <div class="mt-4 flex items-center gap-2 text-[12px] text-[#6f7280]">
                                <svg class="h-4 w-4 shrink-0 text-spu-blue/60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                                <span x-text="isAr ? center.directorNameAr : center.directorNameEn"></span>
                            </div>

                            <div class="mt-5 flex items-center gap-3">
                                <span class="inline-flex h-[32px] items-center justify-center rounded-[6px] bg-spu-blue px-4 text-[11px] font-bold text-white transition group-hover:bg-[#171d47]"
                                      x-text="isAr ? 'عرض المركز' : 'View Center'"></span>
                                <span class="text-spu-red transition-all group-hover:translate-x-1 rtl:group-hover:-translate-x-1">→</span>
                            </div>
                        </div>
                    </a>
                </template>
            </div>
        </div>
    </div>

    <!-- Laboratories Section -->
    <div id="research-laboratories" class="mx-auto mt-[80px] max-w-[1090px] px-6">
        <div class="mb-[48px] flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <h2 class="text-[32px] font-bold leading-tight text-spu-blue"
                x-text="isAr ? page.laboratories.titleAr : page.laboratories.titleEn"></h2>
        </div>
        <div class="grid grid-cols-1 gap-[38px] md:grid-cols-2 lg:grid-cols-3">
            <template x-for="lab in labs" :key="lab.id">
                <article class="overflow-hidden rounded-[10px] border border-[#d4d8e2] bg-white shadow-[0_4px_10px_rgba(0,0,0,0.08)] transition-all hover:-translate-y-1 hover:shadow-[0_8px_24px_rgba(32,39,89,0.12)]">
                    <div class="relative h-[170px] overflow-hidden">
                        <img :src="lab.image"
                             :alt="isAr ? lab.titleAr : lab.titleEn"
                             class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
                        <span class="absolute left-4 top-4 rounded-[4px] bg-white/90 px-3 py-1.5 text-[10px] font-semibold text-spu-blue backdrop-blur-sm rtl:left-auto rtl:right-4"
                              x-text="isAr ? lab.facultyAr : lab.facultyEn"></span>
                    </div>
                    <div class="p-5">
                        <h3 class="text-[18px] font-bold leading-[1.35] text-spu-blue"
                            x-text="isAr ? lab.titleAr : lab.titleEn"></h3>
                        <p class="mt-3 text-[13px] leading-[1.7] text-[#33405d] line-clamp-3"
                           x-text="isAr ? lab.summaryAr : lab.summaryEn"></p>

                        <div class="mt-4 space-y-2 text-[13px] text-[#33405d]">
                            <div class="flex items-center gap-2">
                                <span class="text-spu-red">♙</span>
                                <span x-text="isAr ? lab.directorAr : lab.directorEn"></span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-spu-red">▣</span>
                                <span x-text="isAr ? lab.projectsAr : lab.projectsEn"></span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-spu-red">▤</span>
                                <span x-text="isAr ? lab.publicationsAr : lab.publicationsEn"></span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-spu-red">✉</span>
                                <span x-text="isAr ? lab.contactAr : lab.contactEn"></span>
                            </div>
                        </div>

                        <a :href="lab.ctaUrl"
                           class="mt-5 inline-flex h-[36px] w-full items-center justify-center rounded-[8px] bg-spu-blue text-[11px] font-bold text-white transition hover:bg-[#171d47]"
                           x-text="isAr ? lab.ctaAr : lab.ctaEn"></a>
                    </div>
                </article>
            </template>
        </div>
    </div>
</section>
