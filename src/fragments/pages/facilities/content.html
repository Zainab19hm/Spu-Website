<section id="overview" class="mt-[279px] bg-white" x-data="{ 
        activeTab: 'overview',
        // دالة ديناميكية لجلب اللون وتنسيقه ليعمل في CSS
        get facultyColor() { 
            const color = $store.facilitiesPage.currentFacility?.color || '1e2652';
            return color.startsWith('#') ? color : '#' + color;
        }
    }">

    <div class="container">
        <div class="flex flex-col lg:flex-row gap-16 items-start">

            <div class="w-full lg:w-[27%] relative top-5">
                <div class="relative w-full aspect-square">
                    <div class="absolute top-3  w-[281.904541015625px] h-[293.6371154785156px] rounded-[8px] overflow-hidden reveal-left"
                        x-init="observeElement($el)"
                        :style="$store.app,currentLang === 'ar' ? 'right:0px' : 'left:0px'">
                        <img :src="$store.facilitiesPage.currentFacility?.image_1" class="w-full h-full object-cover"
                            alt="Faculty Header">
                    </div>

                    <div class="absolute top-[155px] w-[281.904541015625px] h-[293.6371154785156px] rounded-[8px]   overflow-hidden  border-[10px] border-white z-10 reveal-right"
                        x-init="observeElement($el)"
                        :style=" $store.app.currentLang === 'ar' ? 'right :122px' : 'left:122px'  ">
                        <img :src="$store.facilitiesPage.currentFacility?.image_2" class="w-full h-full object-cover"
                            alt="Faculty Dean">
                    </div>
                </div>
            </div>

            <div class="w-full lg:w-[73%] rounded-[8px] border-1 border-[#CBD5E1] px-[23px] py-[67px]">

                <div class="flex flex-wrap gap-4  mb-5 md:mb-12">
                    <template x-for="tab in $store.facilitiesPage.currentFacility?.tabs" :key="tab.id">
                        <button @click="activeTab = tab.id"
                            class="w-[206.25px] h-[61.500003814697266px] rounded-[8px] font-bold transition-all duration-500 border-2 text-sm md:text-base shadow-sm"
                            :style="activeTab === tab.id 
                                ? `background-color: ${facultyColor}; color: white; border-color: ${facultyColor};` 
                                : `background-color: transparent; color: ${facultyColor}; border-color: #f1f5f9;`"
                            x-text="$store.app.currentLang === 'ar' ? tab.labelAr : tab.labelEn">
                        </button>
                    </template>
                </div>

                <div class="reveal-up " x-init="observeElement($el)">

                    <h2 class="text-[40px]  font-bold mb-8 transition-colors duration-500 "
                        :style="`color: ${facultyColor}`"
                        x-text="$store.app.currentLang === 'ar' ? $store.facilitiesPage.currentFacility?.nameAr : $store.facilitiesPage.currentFacility?.nameEn">
                    </h2>

                    <div class="min-h-[150px]">
                        <template x-for="tab in $store.facilitiesPage.currentFacility?.tabs" :key="tab.id">
                            <div x-show="activeTab === tab.id" x-transition:enter="transition ease-out duration-300"
                                x-transition:enter-start="opacity-0 translate-y-4"
                                x-transition:enter-end="opacity-100 translate-y-0">
                                <p class="text-2xl text-[#1B1B1F] leading-relaxed "
                                    x-text="$store.app.currentLang === 'ar' ? tab.contentAr : tab.contentEn">
                                </p>
                            </div>
                        </template>
                    </div>

                    <!-- <div class="mt-12 pt-8 border-t border-slate-100 flex items-center justify-between">
                        <a href="/facilities" class="inline-flex items-center gap-4 font-black group transition-all"
                            :style="`color: ${facultyColor}`">
                            <span class="text-sm uppercase tracking-widest"
                                x-text="$store.app.currentLang === 'ar' ? 'الرؤية الاستراتيجية الكاملة' : 'Full Strategic Vision'"></span>
                            <i
                                class="fas fa-arrow-right transition-transform group-hover:translate-x-3 rtl:rotate-180"></i>
                        </a>

                        <img :src="$store.facilitiesPage.currentFacility?.logo"
                            class="h-14 opacity-10 grayscale hover:opacity-30 transition-opacity" alt="Faculty Icon">
                    </div> -->
                </div>
            </div>

        </div>
    </div>
</section>
