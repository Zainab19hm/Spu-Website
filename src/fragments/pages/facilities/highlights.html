<section id="highlights" class="py-32 bg-section relative font-hacen overflow-hidden" x-data
    x-show="$store.facultiesPage.currentFaculty?.highlights">
    <div class="container relative z-10">
        <div class="flex flex-col lg:flex-row items-center justify-between gap-12 pt-16">

            <div class="lg:w-1/2 text-center lg:text-left">
                <h3 class="text-4xl lg:text-5xl font-bold text-spu-blue leading-tight"
                    x-text="$store.app.currentLang === 'ar' ? $store.facultiesPage.currentFaculty?.highlights?.sectionTitleAr : $store.facultiesPage.currentFaculty?.highlights?.sectionTitleEn">
                </h3>
                <p class="mt-4 text-lg text-gray-600"
                    x-text="$store.app.currentLang === 'ar' ? $store.facultiesPage.currentFaculty?.highlights?.sectionPAr : $store.facultiesPage.currentFaculty?.highlights?.sectionPEn">
                </p>
            </div>

            <div class="lg:w-1/2 grid grid-cols-2 gap-6">
                <template x-for="item in $store.facultiesPage.currentFaculty?.highlights?.items" :key="item.id">
                    <div
                        class="group relative flex flex-col items-center justify-center h-44 px-6 rounded-md bg-white shadow-md transition-all duration-300 hover:bg-spu-blue hover:-translate-y-1 overflow-hidden">

                        <div class="text-center transition-all duration-500 group-hover:opacity-0 group-hover:scale-50">
                            <h4 class="text-[20px] font-bold text-spu-blue group-hover:text-white"
                                x-text="$store.app.currentLang === 'ar' ? item.titleAr : item.titleEn">
                            </h4>
                        </div>

                        <a :href="item.link"
                            class="absolute inset-0 flex items-center justify-center bg-spu-blue opacity-0 group-hover:opacity-100 transition-all duration-300 text-white font-bold text-lg">
                            <span x-text="$store.app.currentLang === 'ar' ? 'عرض التفاصيل' : 'View Details'"></span>
                        </a>

                    </div>
                </template>
            </div>

        </div>
    </div>
</section>
