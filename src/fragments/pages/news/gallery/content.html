<section class="bg-white py-14 font-hacen md:py-16"
         x-data="{ get page() { return $store.mediaGalleryPage }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container ">
    <div class="flex flex-wrap items-center justify-center gap-2 ">
      <template x-for="category in page.categories" :key="category.id">
        <button type="button"
                class="rounded-[5px] border px-4 py-2 text-[11px] font-bold transition"
                :class="page.activeCategory === category.id ? 'border-spu-red bg-spu-red text-white' : 'border-slate-200 bg-white text-spu-blue hover:border-spu-blue'"
                @click="page.setCategory(category.id)"
                x-text="isAr ? category.labelAr : category.labelEn"></button>
      </template>
    </div>

    <template x-if="page.featuredItem()">
      <a :href="'#' + page.featuredItem().id"
         :id="page.featuredItem().id"
         class="group relative mt-8 block min-h-[400px] overflow-hidden rounded-[8px] bg-spu-blue shadow-md">
        <img :src="page.featuredItem().image"
             :alt="isAr ? page.featuredItem().titleAr : page.featuredItem().titleEn"
             loading="lazy"
             class="absolute inset-0 h-full w-full object-cover transition duration-500 group-hover:scale-[1.03]">
        <div class="absolute inset-0 bg-gradient-to-t from-spu-blue/95 via-spu-blue/42 to-transparent"></div>
        <span class="absolute left-5 top-5 rounded-[3px] bg-spu-red px-2.5 py-1 text-[10px] font-bold text-white rtl:left-auto rtl:right-5"
              x-text="isAr ? page.featuredItem().categoryAr : page.featuredItem().categoryEn"></span>
        <div class="absolute inset-x-0 bottom-0 p-8 text-white">
          <h2 class="max-w-[720px] text-[24px] font-bold leading-tight md:text-[30px]"
              x-text="isAr ? page.featuredItem().titleAr : page.featuredItem().titleEn"></h2>
          <p class="mt-3 flex items-center gap-2 text-[12px] font-semibold text-white/82">
            <img src="/images/icon-calendar-outline.svg" alt="" class="h-3.5 w-3.5" aria-hidden="true">
            <span x-text="isAr ? page.featuredItem().dateAr : page.featuredItem().dateEn"></span>
          </p>
        </div>
      </a>
    </template>

    <div class="mt-8 flex justify-center">
      <button type="button"
              class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-5 py-2 text-[11px] font-bold text-spu-blue">
        <span x-text="page.localized('labels', 'latest')"></span>
        <img src="/images/icon-chevron-down-outline.svg" alt="" class="h-3 w-3" aria-hidden="true">
      </button>
    </div>

    <div class="mt-7 grid grid-cols-1 gap-16 md:grid-cols-2">
      <template x-for="item in page.gridItems()" :key="item.id">
        <a :href="'#' + item.id"
           :id="item.id"
           class="group relative block min-h-[350px] overflow-hidden rounded-[10px] bg-spu-blue shadow-sm">
          <img :src="item.image"
               :alt="isAr ? item.titleAr : item.titleEn"
               loading="lazy"
               class="absolute inset-0 h-full w-full object-cover transition duration-500 group-hover:scale-[1.04]">
          <div class="absolute inset-0 bg-gradient-to-t from-spu-blue/95 via-spu-blue/35 to-transparent"></div>
          <span class="absolute left-4 top-4 rounded-[3px] bg-white px-2.5 py-1 text-[10px] font-bold text-spu-blue rtl:left-auto rtl:right-4"
                x-text="isAr ? item.categoryAr : item.categoryEn"></span>
          <div class="absolute inset-x-0 bottom-0 p-6 text-white">
            <h2 class="text-[18px] font-bold leading-tight"
                x-text="isAr ? item.titleAr : item.titleEn"></h2>
            <p class="mt-2 flex items-center gap-2 text-[11px] font-semibold text-white/80">
              <img src="/images/icon-calendar-outline.svg" alt="" class="h-3 w-3" aria-hidden="true">
              <span x-text="isAr ? item.dateAr : item.dateEn"></span>
            </p>
          </div>
        </a>
      </template>
    </div>

    <div class="mt-10 flex items-center justify-center gap-2">
      <button type="button"
              class="flex h-8 w-8 items-center justify-center rounded-[4px] border border-slate-200 text-spu-blue transition hover:border-spu-blue"
              :aria-label="page.localized('labels', 'previous')"
              @click="page.goToPage(page.currentPage - 1)">
        <img src="/images/icon-chevron-left-outline.svg" alt="" class="h-3 w-3 rtl:rotate-180" aria-hidden="true">
      </button>

      <template x-for="pageNumber in Array.from({ length: page.totalPages() }, (_, index) => index + 1)" :key="pageNumber">
        <button type="button"
                class="h-8 min-w-8 rounded-[4px] border px-3 text-[12px] font-bold transition"
                :class="page.currentPage === pageNumber ? 'border-spu-red bg-spu-red text-white' : 'border-slate-200 bg-white text-spu-blue hover:border-spu-blue'"
                @click="page.goToPage(pageNumber)"
                x-text="pageNumber"></button>
      </template>

      <button type="button"
              class="flex h-8 w-8 items-center justify-center rounded-[4px] border border-slate-200 text-spu-blue transition hover:border-spu-blue"
              :aria-label="page.localized('labels', 'next')"
              @click="page.goToPage(page.currentPage + 1)">
        <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-3 w-3 rtl:rotate-180" aria-hidden="true">
      </button>
    </div>
  </div>
</section>
