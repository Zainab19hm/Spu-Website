<section id="news-announcements" x-data class="bg-white py-20 font-hacen lg:py-24">
    <div class="container">
        <div class="max-w-3xl">
            <p class="text-sm font-bold uppercase tracking-[0.35em] text-spu-red/70" x-text="$store.app.currentLang === 'ar' ? 'الإعلانات الرسمية' : 'Official Announcements'"></p>
            <h1 class="mt-5 text-3xl font-bold leading-tight text-spu-blue md:text-4xl" x-text="$store.app.currentLang === 'ar' ? 'إعلانات رسمية صادرة عن إدارة الجامعة' : 'Official announcements from university administration'"></h1>
        </div>

        <div class="mt-12 grid gap-6" x-data="{ announcements: [
            { dateEn: '30 Apr 2026', dateAr: '٣٠ نيسان ٢٠٢٦', titleEn: 'Registration opens for the 2026–2027 academic year', titleAr: 'يفتح باب التسجيل للعام الأكاديمي ٢٠٢٦-٢٠٢٧', bodyEn: 'The admissions office announces the start of registration for all faculties. Students should prepare required documents and apply through the electronic portal or in person.', bodyAr: 'يعلن مكتب القبول عن بدء التسجيل في جميع الكليات. على الطلاب تجهيز الوثائق المطلوبة والتقديم عبر البوابة الإلكترونية أو شخصياً.' },
            { dateEn: '25 Apr 2026', dateAr: '٢٥ نيسان ٢٠٢٦', titleEn: 'SPU expands research infrastructure with new AI laboratory', titleAr: 'توسّع SPU بنيتها البحثية بمختبر جديد للذكاء الاصطناعي', bodyEn: 'A new artificial intelligence research laboratory has been established within the Faculty of AI Engineering, supporting applied research in machine learning and automation.', bodyAr: 'تم تأسيس مختبر جديد لأبحاث الذكاء الاصطناعي ضمن كلية هندسة الذكاء الاصطناعي، لدعم الأبحاث التطبيقية في تعلم الآلة والأتمتة.' },
            { dateEn: '18 Apr 2026', dateAr: '١٨ نيسان ٢٠٢٦', titleEn: 'Dental clinics expand operating hours starting May', titleAr: 'عيادات الأسنان توسّع ساعات العمل بدءاً من أيار', bodyEn: 'Dental clinics will operate extended hours from 9 AM to 7 PM Sunday through Thursday, effective May 2026, to accommodate increased student and public demand.', bodyAr: 'ستعمل عيادات الأسنان بساعات موسعة من ٩ صباحاً حتى ٧ مساءً من الأحد إلى الخميس، اعتباراً من أيار ٢٠٢٦، لتلبية الطلب المتزايد من الطلاب والجمهور.' },
            { dateEn: '10 Apr 2026', dateAr: '١٠ نيسان ٢٠٢٦', titleEn: 'Holiday notice: University closed for Easter break', titleAr: 'إعلان عطلة: الجامعة مغلقة لعيد الفصح', bodyEn: 'All university operations will pause from April 10 through April 14 for the Easter holiday. Classes and administrative services resume on April 15.', bodyAr: 'تتوقف جميع العمليات الجامعية من ١٠ حتى ١٤ نيسان لعطلة عيد الفصح. تستأنف الدراسة والخدمات الإدارية في ١٥ نيسان.' },
            { dateEn: '1 Apr 2026', dateAr: '١ نيسان ٢٠٢٦', titleEn: 'Student health insurance renewal deadline approaching', titleAr: 'اقتراب موعد تجديد التأمين الصحي الطلابي', bodyEn: 'All students must renew their health insurance by May 1, 2026. Late renewals will incur a surcharge. Visit Student Affairs or the electronic portal for instructions.', bodyAr: 'يجب على جميع الطلاب تجديد تأمينهم الصحي قبل ١ أيار ٢٠٢٦. التجديد المتأخر يترتب عليه رسوم إضافية. راجع شؤون الطلاب أو البوابة الإلكترونية للتعليمات.' }
        ] }">
            <template x-for="(ann, idx) in announcements" :key="idx">
                <article class="rounded-[28px] border border-slate-200/80 bg-white p-7 shadow-[0_18px_50px_rgba(20,30,70,0.08)]">
                    <div class="flex items-center justify-between gap-4">
                        <p class="text-xs font-bold uppercase tracking-[0.24em] text-spu-red/70" x-text="$store.app.currentLang === 'ar' ? ann.dateAr : ann.dateEn"></p>
                        <p class="text-xs font-medium uppercase tracking-[0.18em] text-slate-400" x-text="ann.dateEn"></p>
                    </div>
                    <h2 class="mt-5 text-xl font-bold text-spu-blue" x-text="$store.app.currentLang === 'ar' ? ann.titleAr : ann.titleEn"></h2>
                    <p class="mt-4 text-[15px] leading-7 text-slate-600" x-text="$store.app.currentLang === 'ar' ? ann.bodyAr : ann.bodyEn"></p>
                </article>
            </template>
        </div>
    </div>
</section>
