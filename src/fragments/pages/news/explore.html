<section x-data class="bg-slate-50 py-24 font-hacen bg-section">
    <div class="container">
        <h2 class="text-3xl font-bold text-spu-blue text-center mb-16"
            x-text="$store.app.currentLang === 'ar' ? 'استكشف المزيد' : 'Explore More'"></h2>

        <div class="grid md:grid-cols-2 gap-8 max-w-5xl mx-auto">
            <template x-for="item in $store.newsPage.explore" :key="item.id">
                <a :href="item.link" :id="item.id"
                   class="group relative overflow-hidden rounded-[32px] p-12 transition-all duration-500 flex flex-col items-center text-center gap-6
                   
                        hover:translate-y-[-8px] bg-white text-spu-blue border border-slate-100 shadow-sm hover:bg-[#1e2a5e] hover:text-white hover:shadow-2xl">
                    
                    <div class="w-16 h-16 flex items-center justify-center rounded-2xl bg-white/10 group-hover:bg-white/20 transition-colors">
                        <template x-if="item.icon === 'image'">
                            <img src="/images/icon-file-outline.svg" alt="" class="w-8 h-8" aria-hidden="true">
                        </template>
                        <template x-if="item.icon === 'newspaper'">
                            <img src="/images/icon-book-outline.svg" alt="" class="w-8 h-8" aria-hidden="true">
                        </template>
                        <template x-if="item.icon === 'calendar'">
                            <img src="/images/icon-calendar-outline.svg" alt="" class="w-8 h-8" aria-hidden="true">
                        </template>
                    </div>

                    <div>
                        <h3 class="text-3xl font-bold mb-3" x-text="$store.app.currentLang === 'ar' ? item.titleAr : item.titleEn"></h3>
                        <p class="text-sm opacity-60 flex items-center justify-center gap-2 uppercase tracking-widest font-bold">
                            <span x-text="$store.app.currentLang === 'ar' ? 'انقر للزيارة' : 'Visit Room'"></span>
                            <span class="text-lg">→</span>
                        </p>
                    </div>
                </a>
            </template>
        </div>
    </div>
</section>
