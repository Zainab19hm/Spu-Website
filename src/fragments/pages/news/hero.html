<section x-data class="relative h-screen flex items-center justify-center overflow-hidden py-24">
    <!-- Background Image with Overlay -->
    <div class="absolute inset-0 z-0 ">
        <img :src="$store.newsPage.hero.image" alt="News Hero" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-spu-blue/40"></div>
    </div>

    <div class="container relative top-26 z-10 text-center text-white">
        <div class="">
            <h1 class="text-[48px] font-bold uppercase tracking-[0.4em] text-spu-gold mb-6" 
                x-text="$store.app.currentLang === 'ar' ? $store.newsPage.hero.eyebrowAr : $store.newsPage.hero.eyebrowEn"></h1>
            
            <p class="text-[30px] font-bold leading-tight mb-8"
                x-text="$store.app.currentLang === 'ar' ? $store.newsPage.hero.titleAr : $store.newsPage.hero.titleEn"></p>

            <!-- Navigation Links -->
            <div class="mt-12 space-y-4">
                <!-- First Row: 3 items -->
                <div class="flex flex-wrap items-center justify-center gap-4">
                    <template x-for="link in $store.newsPage.hero.links.slice(0, 3)" :key="link.id">
                        <a :href="'#' + link.id" 
                           class="px-10 py-3 rounded-xl border border-white/20 bg-white/5 backdrop-blur-md text-sm font-bold transition-all hover:bg-white/20 hover:border-white/40"
                           x-text="$store.app.currentLang === 'ar' ? link.labelAr : link.labelEn">
                        </a>
                    </template>
                </div>
                <!-- Second Row: 2 items -->
                <div class="flex flex-wrap items-center justify-center gap-4">
                    <template x-for="link in $store.newsPage.hero.links.slice(3, 5)" :key="link.id">
                        <a :href="'#' + link.id" 
                           class="px-10 py-3 rounded-xl border border-white/20 bg-white/5 backdrop-blur-md text-sm font-bold transition-all hover:bg-white/20 hover:border-white/40"
                           x-text="$store.app.currentLang === 'ar' ? link.labelAr : link.labelEn">
                        </a>
                    </template>
                </div>
            </div>
        </div>
    </div>
</section>
