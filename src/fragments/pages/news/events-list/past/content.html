<section class="bg-white py-10 font-hacen"
         x-data="{ get page() { return $store.eventsPage }, get isAr() { return $store.app.currentLang === 'ar' } }">

  <!-- Event not found -->
  <div x-show="!page.pastEvent"
       class="container mx-auto ">
    <div class="mx-auto text-center py-20">
      <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-gray-100">
        <svg class="h-10 w-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <h2 class="text-xl font-bold text-spu-blue"
          x-text="isAr ? 'الفعالية غير موجودة' : 'Event Not Found'"></h2>
      <p class="mt-2 text-sm text-spu-blue/60"
         x-text="isAr ? 'لم يتم العثور على الفعالية المطلوبة.' : 'The requested event could not be found.'"></p>
      <a href="/news/events-list/"
         class="mt-6 inline-flex items-center gap-2 rounded-lg bg-spu-red px-6 py-3 text-sm font-bold text-white transition hover:bg-spu-blue">
        <span x-text="isAr ? 'العودة للفعاليات' : 'Back to Events'"></span>
      </a>
    </div>
  </div>

  <!-- Full width image -->
  <div x-show="page.pastEvent" class="relative h-[250px] container overflow-hidden md:h-[400px]">
    <img :src="page.pastEvent?.image"
         :alt="isAr ? page.pastEvent?.titleAr : page.pastEvent?.titleEn"
         class="h-full w-full object-cover">
    <div class="absolute  top-0 bg-spu-red px-4 py-2 text-xs font-bold text-white">
      <span x-text="isAr ? page.pastEvent?.categoryAr : page.pastEvent?.categoryEn"></span>
    </div>
  </div>

  <!-- Content: left details + right sidebar -->
  <div x-show="page.pastEvent" class="container mx-auto px-6">
    <div class="mx-auto container">
      <div class="grid gap-8 lg:grid-cols-[minmax(0,1fr)_320px]">

        <!-- Left: Main content -->
        <div>
          <div class="mb-6 flex flex-wrap mt-5 items-center gap-4 text-sm text-spu-blue/60">
            <div class="flex items-center gap-1.5">
              <img src="/images/icon-calendar-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
              <span x-text="isAr ? page.pastEvent?.dateAr : page.pastEvent?.dateEn"></span>
            </div>
            <div class="flex items-center gap-1.5">
              <img src="/images/icon-history-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
              <span x-text="isAr ? page.pastEvent?.timeAr : page.pastEvent?.timeEn"></span>
            </div>
            <div class="flex items-center gap-1.5">
              <img src="/images/icon-map-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
              <span x-text="isAr ? page.pastEvent?.locationAr : page.pastEvent?.locationEn"></span>
            </div>
            <div class="flex items-center gap-1.5">
              <img src="/images/icon-users-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
              <span x-text="isAr ? page.pastEvent?.participantsAr : page.pastEvent?.participantsEn"></span>
            </div>
          </div>

          <!-- Description -->
          <div class="mb-8">
            <h2 class="mb-4 flex items-center gap-2 text-lg font-bold text-spu-blue">
              <svg class="h-5 w-5 text-spu-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <span x-text="isAr ? 'نظرة عامة على الفعالية' : 'Event Overview'"></span>
            </h2>
            <p class="text-[14px] leading-relaxed text-[#4d5568]"
               x-text="isAr ? page.pastEvent?.descriptionAr : page.pastEvent?.descriptionEn"></p>
          </div>

          <!-- Highlights -->
          <div x-show="page.pastEvent?.highlightsEn" class="mb-8">
            <h2 class="mb-4 flex items-center gap-2 text-lg font-bold text-spu-blue">
              <svg class="h-5 w-5 text-spu-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
              <span x-text="isAr ? 'أبرز الأنشطة' : 'Event Highlights'"></span>
            </h2>
            <div class="space-y-3">
              <template x-for="(item, idx) in (isAr ? page.pastEvent?.highlightsAr : page.pastEvent?.highlightsEn) || []" :key="idx">
                <div class="flex items-start gap-3 rounded-lg bg-spu-blue/[0.03] px-4 py-3">
                  <div class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-spu-red/10 text-spu-red mt-0.5">
                    <svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                  </div>
                  <span class="text-[13px] font-semibold text-spu-blue" x-text="item"></span>
                </div>
              </template>
            </div>
          </div>

          <!-- Speakers -->
          <div x-show="page.pastEvent?.speakers?.length" class="mb-8">
            <h2 class="mb-4 flex items-center gap-2 text-lg font-bold text-spu-blue">
              <svg class="h-5 w-5 text-spu-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <span x-text="isAr ? 'المتحدثون' : 'Speakers'"></span>
            </h2>
            <div class="grid gap-4 sm:grid-cols-2">
              <template x-for="(speaker, idx) in page.pastEvent?.speakers || []" :key="idx">
                <div class="flex items-center gap-4 rounded-xl border border-spu-blue/10 bg-spu-blue/[0.02] p-4">
                  <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-spu-blue/10">
                    <svg class="h-6 w-6 text-spu-blue/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                  </div>
                  <div>
                    <h4 class="text-[13px] font-bold text-spu-blue" x-text="isAr ? speaker.nameAr : speaker.nameEn"></h4>
                    <p class="text-[11px] text-spu-blue/60" x-text="isAr ? speaker.titleAr : speaker.titleEn"></p>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- Results -->
          <div x-show="page.pastEvent?.resultsEn">
            <h2 class="mb-4 flex items-center gap-2 text-lg font-bold text-spu-blue">
              <svg class="h-5 w-5 text-spu-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
              <span x-text="isAr ? 'النتائج والإنجازات' : 'Results & Achievements'"></span>
            </h2>
            <div class="rounded-xl border border-green-200 bg-green-50 p-5">
              <p class="text-[13px] leading-relaxed text-green-900"
                 x-text="isAr ? page.pastEvent?.resultsAr : page.pastEvent?.resultsEn"></p>
            </div>
          </div>
        </div>

        <!-- Right: Sidebar -->
        <div class="lg:sticky mt-5 lg:top-24 lg:self-start">
          <!-- Event info card -->
          <div class="rounded-2xl border border-spu-blue/10 bg-white p-6 shadow-sm">
            <h3 class="mb-4 pb-3 border-b border-gray-100 text-sm font-bold text-spu-blue"
                x-text="isAr ? 'معلومات الفعالية' : 'Event Information'"></h3>

            <div class="space-y-4">
              <div class="flex items-start gap-3">
                <img src="/images/icon-calendar-outline.svg" alt="" class="h-4 w-4 mt-0.5 opacity-50">
                <div>
                  <p class="text-[11px] font-semibold text-[#626b82]" x-text="isAr ? 'التاريخ' : 'Date'"></p>
                  <p class="text-[13px] font-bold text-spu-blue" x-text="isAr ? page.pastEvent?.dateAr : page.pastEvent?.dateEn"></p>
                </div>
              </div>
              <div class="flex items-start gap-3">
                <img src="/images/icon-history-outline.svg" alt="" class="h-4 w-4 mt-0.5 opacity-50">
                <div>
                  <p class="text-[11px] font-semibold text-[#626b82]" x-text="isAr ? 'الوقت' : 'Time'"></p>
                  <p class="text-[13px] font-bold text-spu-blue" x-text="isAr ? page.pastEvent?.timeAr : page.pastEvent?.timeEn"></p>
                </div>
              </div>
              <div class="flex items-start gap-3">
                <img src="/images/icon-map-outline.svg" alt="" class="h-4 w-4 mt-0.5 opacity-50">
                <div>
                  <p class="text-[11px] font-semibold text-[#626b82]" x-text="isAr ? 'المكان' : 'Location'"></p>
                  <p class="text-[13px] font-bold text-spu-blue" x-text="isAr ? page.pastEvent?.locationAr : page.pastEvent?.locationEn"></p>
                </div>
              </div>
              <div class="flex items-start gap-3">
                <img src="/images/icon-users-outline.svg" alt="" class="h-4 w-4 mt-0.5 opacity-50">
                <div>
                  <p class="text-[11px] font-semibold text-[#626b82]" x-text="isAr ? 'المشاركون' : 'Participants'"></p>
                  <p class="text-[13px] font-bold text-spu-blue" x-text="isAr ? page.pastEvent?.participantsAr : page.pastEvent?.participantsEn"></p>
                </div>
              </div>
              <div class="flex items-start gap-3">
                <img src="/images/icon-award-outline.svg" alt="" class="h-4 w-4 mt-0.5 opacity-50">
                <div>
                  <p class="text-[11px] font-semibold text-[#626b82]" x-text="isAr ? 'الفئة' : 'Category'"></p>
                  <p class="text-[13px] font-bold text-spu-blue" x-text="isAr ? page.pastEvent?.categoryAr : page.pastEvent?.categoryEn"></p>
                </div>
              </div>
            </div>
          </div>

          <!-- Gallery -->
          <div x-show="page.pastEvent?.gallery?.length" class="mt-6 rounded-2xl border border-spu-blue/10 bg-white p-6 shadow-sm">
            <h3 class="mb-4 pb-3 border-b border-gray-100 text-sm font-bold text-spu-blue"
                x-text="isAr ? 'معرض الصور' : 'Photo Gallery'"></h3>
            <div class="grid grid-cols-2 gap-2">
              <template x-for="(img, idx) in page.pastEvent?.gallery || []" :key="idx">
                <a :href="img" target="_blank" class="overflow-hidden rounded-lg">
                  <img :src="img" alt="" class="h-20 w-full object-cover transition hover:scale-105">
                </a>
              </template>
            </div>
          </div>

          <!-- Back link -->
          <a href="/news/events-list/"
             class="mt-6 flex items-center justify-center gap-2 rounded-xl border border-spu-blue/10 bg-spu-blue/[0.03] py-3 text-[13px] font-bold text-spu-blue transition hover:bg-spu-blue hover:text-white">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            <span x-text="isAr ? 'العودة للفعاليات' : 'Back to Events'"></span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
