<section class="bg-white py-14 font-hacen md:py-16"
         x-data="{ get page() { return $store.newsListingPage }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container max-w-[1180px]">
    <div class="flex flex-wrap items-center justify-start gap-2">
      <template x-for="category in page.categories" :key="category.id">
        <button type="button"
                class="rounded-[5px] border px-4 py-2 text-[11px] font-bold transition"
                :class="page.activeCategory === category.id ? 'border-spu-red bg-spu-red text-white' : 'border-slate-200 bg-white text-spu-blue hover:border-spu-blue'"
                @click="page.setCategory(category.id)"
                x-text="isAr ? category.labelAr : category.labelEn"></button>
      </template>
    </div>

    <div class="mt-8 grid grid-cols-1 gap-7 md:grid-cols-2 xl:grid-cols-3">
      <template x-for="article in page.visibleArticles()" :key="article.id">
        <article :id="article.id"
                 class="overflow-hidden rounded-[6px] border border-slate-200 bg-white shadow-sm transition duration-300 hover:-translate-y-0.5 hover:shadow-md">
          <a :href="article.href" class="block">
            <div class="relative aspect-[1.58] overflow-hidden bg-slate-100">
              <img :src="article.image"
                   :alt="isAr ? article.titleAr : article.titleEn"
                   loading="lazy"
                   class="h-full w-full object-cover transition duration-500 hover:scale-[1.03]">
              <span class="absolute left-3 top-3 rounded-[3px] bg-white px-2.5 py-1 text-[10px] font-bold text-spu-blue shadow-sm rtl:left-auto rtl:right-3"
                    x-text="isAr ? article.categoryAr : article.categoryEn"></span>
            </div>
          </a>

          <div class="p-6">
            <a :href="article.href" class="block">
              <h2 class="text-[16px] font-bold leading-[21px] text-spu-blue"
                  x-text="isAr ? article.titleAr : article.titleEn"></h2>
            </a>
            <p class="mt-2 text-[11px] font-bold text-spu-red" x-text="article.date"></p>
            <p class="mt-4 min-h-[68px] text-[13px] font-medium leading-[22px] text-slate-600"
               x-text="isAr ? article.summaryAr : article.summaryEn"></p>

            <a :href="article.href"
               class="mt-5 inline-flex items-center gap-2 text-[12px] font-bold text-spu-red transition hover:text-spu-blue">
              <span x-text="page.localized('labels', 'readMore')"></span>
              <img src="/images/icon-arrow-right-outline.svg" alt="" class="h-3 w-3 rtl:rotate-180" aria-hidden="true">
            </a>
          </div>
        </article>
      </template>
    </div>

    <div class="mt-10 flex items-center justify-center gap-2">
      <button type="button"
              class="flex h-8 w-8 items-center justify-center rounded-[4px] border border-slate-200 text-spu-blue transition hover:border-spu-blue"
              :aria-label="page.localized('labels', 'previous')"
              @click="page.goToPage(page.currentPage - 1)">
        <img src="/images/icon-chevron-left-outline.svg" alt="" class="h-3 w-3 rtl:rotate-180" aria-hidden="true">
      </button>

      <template x-for="pageNumber in Array.from({ length: page.totalPages() }, (_, index) => index + 1)" :key="pageNumber">
        <button type="button"
                class="h-8 min-w-8 rounded-[4px] border px-3 text-[12px] font-bold transition"
                :class="page.currentPage === pageNumber ? 'border-spu-red bg-spu-red text-white' : 'border-slate-200 bg-white text-spu-blue hover:border-spu-blue'"
                @click="page.goToPage(pageNumber)"
                x-text="pageNumber"></button>
      </template>

      <button type="button"
              class="flex h-8 w-8 items-center justify-center rounded-[4px] border border-slate-200 text-spu-blue transition hover:border-spu-blue"
              :aria-label="page.localized('labels', 'next')"
              @click="page.goToPage(page.currentPage + 1)">
        <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-3 w-3 rtl:rotate-180" aria-hidden="true">
      </button>
    </div>
  </div>
</section>
