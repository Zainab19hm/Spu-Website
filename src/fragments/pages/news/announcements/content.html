<section class="bg-white py-9 font-hacen md:py-11"
         x-data="{ get page() { return $store.announcementsPage }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container">
    <article class="mb-9 border-l-2 border-spu-red bg-white py-3 pl-5 pr-4 rtl:border-l-0 rtl:border-r-2 rtl:pl-4 rtl:pr-5">
      <div class="mb-2 flex flex-wrap items-center gap-3 text-[11px] font-semibold text-[#667085]">
        <span class="bg-spu-red px-2.5 py-1 text-[9px] font-bold uppercase tracking-wide text-white"
              x-text="page.text(page.featured, 'category')"></span>
        <span x-text="page.featured.displayDateEn"></span>
      </div>
      <h2 class="text-[18px] font-bold leading-tight text-spu-blue md:text-[22px]"
          x-text="page.text(page.featured, 'title')"></h2>
      <p class="mt-3 max-w-[850px] text-[13px] leading-[1.8] text-[#4d5568]"
         x-text="page.text(page.featured, 'body')"></p>
      <a :href="page.featured.attachment"
         download
         class="mt-4 inline-flex items-center gap-2 text-[12px] font-bold text-spu-red transition hover:text-spu-blue">
        <span x-text="page.localized('labels', 'readFull')"></span>
        <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2.5 w-2.5 rtl:rotate-180" aria-hidden="true">
      </a>
    </article>

    <div class="mb-6 border-t border-[#e7e9ef] pt-6">
      <div class="flex flex-wrap gap-3">
        <template x-for="category in page.categories" :key="category.id">
          <button type="button"
                  @click="page.setCategory(category.id)"
                  class="min-w-[92px] rounded-[4px] border px-4 py-2 text-[11px] font-bold transition"
                  :class="page.activeCategory === category.id ? 'border-spu-red bg-spu-red text-white' : 'border-[#e3e6ef] bg-white text-spu-blue hover:border-spu-red/50'"
                  x-text="isAr ? category.labelAr : category.labelEn"></button>
        </template>
      </div>
    </div>

    <div class="divide-y divide-[#e7e9ef] border-b border-[#e7e9ef]">
      <template x-for="item in page.visibleItems()" :key="item.id">
        <article class="grid gap-4 py-6 md:grid-cols-[72px_1fr] md:gap-7">
          <div class="flex items-center gap-2 md:block md:text-center">
            <span class="block text-[10px] font-bold uppercase tracking-wide text-spu-red"
                  x-text="page.dateParts(item.date).month"></span>
            <span class="block text-[25px] font-bold leading-none text-spu-blue"
                  x-text="page.dateParts(item.date).day"></span>
            <span class="block text-[9px] font-semibold text-[#767d91]"
                  x-text="page.dateParts(item.date).year"></span>
          </div>

          <div>
            <p class="mb-2 text-[10px] font-bold uppercase tracking-wide text-[#7a8196]"
               x-text="page.text(item, 'category')"></p>
            <h3 class="text-[18px] font-bold leading-tight text-spu-blue md:text-[22px]"
                x-text="page.text(item, 'title')"></h3>
            <p class="mt-3 max-w-[840px] text-[12px] leading-[1.75] text-[#4d5568]"
               x-text="page.text(item, 'body')"></p>
            <template x-if="item.attachment">
              <a :href="item.attachment"
                 download
                 class="mt-4 inline-flex items-center gap-2 text-[12px] font-bold text-spu-red transition hover:text-spu-blue">
                <span x-text="page.localized('labels', 'download')"></span>
                <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2.5 w-2.5 rtl:rotate-180" aria-hidden="true">
              </a>
            </template>
          </div>
        </article>
      </template>
    </div>

    <nav class="mt-10 flex items-center justify-center gap-2" aria-label="Announcement pagination">
      <button type="button"
              @click="page.goToPage(page.currentPage - 1)"
              class="flex h-8 w-8 items-center justify-center rounded-[4px] border border-[#dce0ea] bg-white text-[12px] font-bold text-spu-blue transition hover:border-spu-red disabled:cursor-not-allowed disabled:opacity-40"
              :disabled="page.currentPage === 1"
              :aria-label="page.localized('labels', 'previous')">
        <img src="/images/icon-chevron-left-outline.svg" alt="" class="h-3 w-3 rtl:rotate-180" aria-hidden="true">
      </button>

      <template x-for="pageNumber in page.totalPages()" :key="pageNumber">
        <button type="button"
                @click="page.goToPage(pageNumber)"
                class="flex h-8 w-8 items-center justify-center rounded-[4px] border text-[12px] font-bold transition"
                :class="page.currentPage === pageNumber ? 'border-spu-red bg-spu-red text-white' : 'border-[#dce0ea] bg-white text-spu-blue hover:border-spu-red'"
                x-text="pageNumber"></button>
      </template>

      <button type="button"
              @click="page.goToPage(page.currentPage + 1)"
              class="flex h-8 w-8 items-center justify-center rounded-[4px] border border-[#dce0ea] bg-white text-[12px] font-bold text-spu-blue transition hover:border-spu-red disabled:cursor-not-allowed disabled:opacity-40"
              :disabled="page.currentPage === page.totalPages()"
              :aria-label="page.localized('labels', 'next')">
        <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-3 w-3 rtl:rotate-180" aria-hidden="true">
      </button>
    </nav>
  </div>
</section>
