<section x-data class="bg-white py-16 font-hacen">
    <div class="container">
        <article class="flex flex-col lg:flex-row items-center gap-12 group">
            <!-- Image Container -->
            <div class="w-full lg:w-1/2 overflow-hidden rounded-2xl aspect-video">
                <img :src="$store.newsPage.featured.image" :alt="$store.app.currentLang === 'ar' ? $store.newsPage.featured.titleAr : $store.newsPage.featured.titleEn" 
                     class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
            </div>

            <!-- Content Container -->
            <div class="w-full lg:w-1/2">
                <div class="flex items-center gap-3 text-sm font-bold tracking-widest text-spu-red uppercase mb-6">
                    <span x-text="$store.app.currentLang === 'ar' ? $store.newsPage.featured.categoryAr : $store.newsPage.featured.categoryEn"></span>
                    <span class="w-4 h-[1px] bg-slate-300"></span>
                    <span class="text-slate-400" x-text="$store.newsPage.featured.date"></span>
                </div>

                <h2 class="text-3xl lg:text-4xl font-bold text-spu-blue leading-tight mb-6"
                    x-text="$store.app.currentLang === 'ar' ? $store.newsPage.featured.titleAr : $store.newsPage.featured.titleEn"></h2>
                
                <p class="text-lg text-slate-600 leading-relaxed mb-8"
                   x-text="$store.app.currentLang === 'ar' ? $store.newsPage.featured.summaryAr : $store.newsPage.featured.summaryEn"></p>

                <a :href="$store.newsPage.featured.link" class="inline-flex items-center gap-2 text-spu-blue font-bold group/link">
                    <span x-text="$store.app.currentLang === 'ar' ? 'اقرأ المزيد' : 'Read More'"></span>
                    <img src="/images/icon-arrow-right-outline.svg" alt="" class="w-5 h-5 transition-transform group-hover/link:translate-x-1 rtl:group-hover/link:-translate-x-1" aria-hidden="true">
                </a>
            </div>
        </article>
    </div>
</section>
