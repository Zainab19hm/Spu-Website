<section x-data class="bg-white py-24 font-hacen">
    <div class="container">
        <!-- Main Title and Global Button -->
        <div class="flex items-center justify-between mb-12">
            <h2 class="text-5xl font-bold text-[#202759]" x-text="$store.app.currentLang === 'ar' ? 'الإعلانات' : 'Announcements'"></h2>
            <a href="/news/announcements/" class="px-8 py-2 border border-slate-300 rounded text-sm font-bold text-[#202759] hover:bg-slate-50 transition-colors"
               x-text="$store.app.currentLang === 'ar' ? 'عرض كافة الإعلانات' : 'View All Announcements'"></a>
        </div>

        <div class="grid lg:grid-cols-12 gap-8 items-stretch">
            
            <!-- Left: Upcoming Events Sidebar -->
            <div id="events" class="lg:col-span-4">
                <div class="bg-[#1e2a5e] rounded-[12px] p-10 text-white h-full flex flex-col">
                    <div class="flex items-center justify-between mb-12 pb-6 border-b border-white/20">
                        <h3 class="text-3xl font-bold" x-text="$store.app.currentLang === 'ar' ? 'الفعاليات القادمة' : 'Upcoming Events'"></h3>
                        <img src="/images/icon-calendar-outline.svg" alt="" class="w-7 h-7 brightness-0 invert" aria-hidden="true">
                    </div>

                    <!-- Timeline -->
                    <div class="space-y-12 flex-grow relative pb-10">
                        <div class="absolute left-[7px] rtl:left-auto rtl:right-[7px] top-2 bottom-12 w-[2px] bg-white/20"></div>
                        
                        <template x-for="event in $store.newsPage.events" :key="event.id">
                            <div class="relative pl-10 rtl:pl-0 rtl:pr-10">
                                <!-- Timeline Dot -->
                                <div class="absolute left-0 rtl:left-auto rtl:right-0 top-1.5 w-4 h-4 rounded-full border-2 border-white bg-[#1e2a5e] z-10"></div>
                                
                                <p class="text-[12px] font-bold uppercase tracking-widest text-white/60 mb-2" 
                                   x-text="$store.app.currentLang === 'ar' ? event.dateAr : event.dateEn"></p>
                                <h4 class="text-xl font-bold mb-2" x-text="$store.app.currentLang === 'ar' ? event.titleAr : event.titleEn"></h4>
                                <p class="text-[13px] text-white/50 uppercase tracking-wide" x-text="$store.app.currentLang === 'ar' ? event.infoAr : event.infoEn"></p>
                            </div>
                        </template>
                    </div>

                    <a href="#" class="mt-auto block w-full py-4 border border-white rounded-lg text-center text-sm font-bold hover:bg-white/10 transition-colors"
                       x-text="$store.app.currentLang === 'ar' ? 'عرض تفاصيل كافة الفعاليات' : 'View All Events Details'"></a>
                </div>
            </div>

            <!-- Right: Announcements List -->
            <div id="announcements" class="lg:col-span-8">
                <div class="bg-white border border-slate-200 rounded-[12px] overflow-hidden h-full">
                    <template x-for="(ann, index) in $store.newsPage.announcements" :key="ann.id">
                        <article class="p-10 flex gap-8 group" :class="index !== $store.newsPage.announcements.length - 1 ? 'border-b border-slate-100' : ''">
                            <!-- Icon -->
                            <div class="flex-shrink-0 pt-1">
                                <template x-if="ann.type === 'megaphone'">
                                    <img src="/images/icon-envelope-outline.svg" alt="" class="w-7 h-7" aria-hidden="true">
                                </template>
                                <template x-if="ann.type === 'info'">
                                    <img src="/images/icon-file-outline.svg" alt="" class="w-7 h-7" aria-hidden="true">
                                </template>
                            </div>

                            <!-- Content -->
                            <div class="flex-grow">
                                <div class="flex items-start justify-between gap-6 mb-3">
                                    <h3 class="text-2xl font-bold text-[#202759] leading-tight" 
                                        x-text="$store.app.currentLang === 'ar' ? ann.titleAr : ann.titleEn"></h3>
                                    
                                    <!-- Tag -->
                                    <span class="px-4 py-1.5 rounded-md text-[11px] font-bold text-white uppercase tracking-widest whitespace-nowrap"
                                          :class="{
                                              'bg-[#6f1616]': ann.statusEn === 'Deadline' || ann.statusEn === 'Important',
                                              'bg-[#202759]': ann.statusEn === 'New'
                                          }"
                                          x-text="$store.app.currentLang === 'ar' ? ann.statusAr : ann.statusEn"></span>
                                </div>
                                <p class="text-[17px] text-slate-600 mb-6 leading-relaxed max-w-[90%]" 
                                   x-text="$store.app.currentLang === 'ar' ? ann.summaryAr : ann.summaryEn"></p>
                                
                                <a :href="ann.link" class="inline-flex items-center gap-2 text-[15px] font-bold text-[#202759] group/link">
                                    <span x-text="ann.type === 'info' 
                                        ? ($store.app.currentLang === 'ar' ? 'اقرأ السياسة' : 'Read Policy')
                                        : ($store.app.currentLang === 'ar' ? 'عرض الجدول' : 'View Schedule')"></span>
                                    <span class="transition-transform group-hover/link:translate-x-1 rtl:group-hover/link:-translate-x-1">→</span>
                                </a>
                            </div>
                        </article>
                    </template>
                </div>
            </div>

        </div>
    </div>
</section>
