<style>
    /* Progressive Timeline Core */
    .spu-history-track {
        position: relative;
        max-width: 1200px;
        margin: 0 auto;
    }

    /* Central Spine */
    .spu-history-track::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 2px;
        background: rgba(32, 39, 89, 0.08);
        transform: translateX(-50%);
        z-index: 1;
    }

    /* Dynamic Progress Fill */
    .spu-progress-fill {
        position: absolute;
        left: 50%;
        top: 0;
        width: 2px;
        background: linear-gradient(to bottom, #6f1616, #202759);
        transform: translateX(-50%);
        z-index: 2;
        transition: height 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Timeline Item Layout */
    .timeline-item {
        position: relative;
        margin-bottom: 6rem;
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 3;
    }

    .timeline-item:last-child {
        margin-bottom: 0;
    }

    /* Year Node */
    .year-node {
        position: absolute;
        left: 50%;
        top: 2rem;
        transform: translate(-50%, -50%);
        width: 56px;
        height: 56px;
        background: white;
        border: 2px solid rgba(32, 39, 89, 0.1);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transition: all 0.5s ease;
    }

    .timeline-item.active .year-node {
        border-color: #6f1616;
        box-shadow: 0 0 0 8px rgba(111, 22, 22, 0.05);
        transform: translate(-50%, -50%) scale(1.1);
    }

    .year-node span {
        font-weight: 900;
        color: #202759;
        font-size: 0.9rem;
        transition: color 0.3s ease;
    }

    .timeline-item.active .year-node span {
        color: #6f1616;
    }

    /* Content Card */
    .history-card-v2 {
        width: 42%;
        background: white;
        padding: 3rem;
        border-radius: 2.5rem;
        border: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
        transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        position: relative;
    }

    .timeline-item:nth-child(odd) .history-card-v2 {
        margin-right: auto;
        margin-left: 0;
    }

    .timeline-item:nth-child(even) .history-card-v2 {
        margin-left: auto;
        margin-right: 0;
    }

    .timeline-item.active .history-card-v2 {
        border-color: rgba(111, 22, 22, 0.2);
        box-shadow: 0 20px 60px rgba(111, 22, 22, 0.08);
    }

    /* Watermark Effect */
    .card-watermark {
        position: absolute;
        top: 1.5rem;
        right: 2rem;
        font-size: 5rem;
        font-weight: 900;
        color: rgba(32, 39, 89, 0.03);
        line-height: 1;
        user-select: none;
        pointer-events: none;
    }

    [dir="rtl"] .card-watermark {
        right: auto;
        left: 2rem;
    }

    /* Mobile Adaptations */
    @media (max-width: 1024px) {
        .spu-history-track::before, .spu-progress-fill {
            left: 28px;
            transform: none;
        }

        [dir="rtl"] .spu-history-track::before,
        [dir="rtl"] .spu-progress-fill {
            left: auto;
            right: 28px;
        }
        
        .year-node {
            left: 28px;
            transform: translateY(-50%);
        }

        [dir="rtl"] .year-node {
            left: auto;
            right: 28px;
        }

        .timeline-item.active .year-node {
            transform: translateY(-50%) scale(1.1);
        }

        .history-card-v2 {
            width: calc(100% - 80px);
            margin-left: 80px !important;
            padding: 2rem;
        }

        [dir="rtl"] .history-card-v2 {
            margin-left: 0 !important;
            margin-right: 80px !important;
        }

        .timeline-item:nth-child(even) .history-card-v2 {
            margin-right: 0;
        }
    }
</style>

<section id="history-section" x-cloak
         class="relative py-32 overflow-hidden bg-white font-hacen"
         x-data="{ 
            scrollProgress: 0,
            init() {
                const updateProgress = () => {
                    const rect = this.$refs.track.getBoundingClientRect();
                    const windowHeight = window.innerHeight;
                    const trackHeight = rect.height;
                    const scrollPos = windowHeight / 2 - rect.top;
                    
                    let progress = (scrollPos / trackHeight) * 100;
                    this.scrollProgress = Math.min(Math.max(progress, 0), 100);
                };
                window.addEventListener('scroll', updateProgress);
                setTimeout(updateProgress, 100);
            }
         }">
    
    <!-- Immersive Header -->
    <div class="container relative z-10 mx-auto px-6 mb-24 text-center">
        <div class="reveal reveal-up inline-flex items-center gap-3 mb-6">
            <span class="h-px w-10 bg-spu-red"></span>
            <span class="text-spu-red font-black tracking-widest text-sm uppercase"
                x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.history.eyebrowAr : $store.aboutPage.history.eyebrowEn"></span>
            <span class="h-px w-10 bg-spu-red"></span>
        </div>
        
        <h2 class="reveal reveal-up reveal-delay-1 text-5xl md:text-7xl font-black text-spu-blue tracking-tighter leading-tight"
            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.history.titleAr : $store.aboutPage.history.titleEn"></h2>
        
        <p class="reveal reveal-up reveal-delay-2 mt-8 text-xl text-slate-500 max-w-3xl mx-auto leading-relaxed"
            x-html="$store.app.currentLang === 'ar' ? $store.aboutPage.history.summaryAr : $store.aboutPage.history.summaryEn"></p>
    </div>

    <!-- Timeline Track -->
    <div class="container mx-auto px-6">
        <div class="spu-history-track" x-ref="track">
            <!-- Dynamic Progress Fill -->
            <div class="spu-progress-fill" :style="`height: ${scrollProgress}%`"></div>

            <template x-for="(point, index) in $store.aboutPage.historyPoints" :key="index">
                <div class="timeline-item reveal" 
                     :class="[
                        index % 2 === 0 ? 'reveal-left' : 'reveal-right',
                        (scrollProgress >= (index / $store.aboutPage.historyPoints.length) * 100) ? 'active' : ''
                     ]">
                    
                    <!-- Year Badge Node -->
                    <div class="year-node">
                        <span x-text="point.year"></span>
                    </div>

                    <!-- Content Card -->
                    <div class="history-card-v2 group">
                        <!-- Floating Year Watermark -->
                        <div class="card-watermark" x-text="point.year"></div>

                        <div class="relative z-10">
                            <!-- Visual Accent -->
                            <div class="w-12 h-1 bg-spu-red mb-6 rounded-full transform origin-left transition-transform duration-500 group-hover:scale-x-150"></div>
                            
                            <h3 class="text-2xl md:text-3xl font-black text-spu-blue mb-4 leading-tight"
                                x-text="$store.app.currentLang === 'ar' ? point.titleAr : point.titleEn"></h3>
                            
                            <p class="text-slate-500 text-lg leading-relaxed"
                                x-text="$store.app.currentLang === 'ar' ? point.descAr : point.descEn"></p>
                        </div>

                        <!-- Interactive Bottom Bar -->
                        <div class="absolute bottom-0 left-0 right-0 h-1 bg-slate-100 overflow-hidden rounded-b-full">
                            <div class="h-full bg-spu-red transform -translate-x-full transition-transform duration-700 group-hover:translate-x-0"></div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Decorative Elements -->
    <div class="absolute top-0 right-0 w-1/3 h-1/3 bg-radial from-spu-blue/5 to-transparent -z-10 blur-3xl"></div>
    <div class="absolute bottom-0 left-0 w-1/4 h-1/4 bg-radial from-spu-red/5 to-transparent -z-10 blur-3xl"></div>
</section>
