<style>
    .history-vision-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        gap: 3rem;
        align-items: center;
    }

    .history-vision-image {
        aspect-ratio: 1.18 / 1;
        overflow: hidden;
        border-radius: 4px;
        background: #f8fafc;
    }

    .history-quote {
        border-inline-start: 2px solid #6f1616;
        padding-inline-start: 1.25rem;
    }

    .history-timeline {
        position: relative;
        display: grid;
        max-width: 640px;
        margin: 0 auto;
        gap: 3.5rem;
    }

    .history-timeline::before {
        content: '';
        position: absolute;
        top: 1.25rem;
        bottom: 1.25rem;
        left: 50%;
        width: 1px;
        transform: translateX(-50%);
        background: rgba(111, 22, 22, 0.28);
    }

    .history-timeline-item {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        column-gap: 5rem;
        min-height: 128px;
    }

    .history-timeline-dot {
        position: absolute;
        left: 50%;
        top: 2.45rem;
        width: 10px;
        height: 10px;
        transform: translate(-50%, -50%);
        border-radius: 999px;
        background: #bc2428;
        box-shadow: 0 0 0 6px #f7fbff;
    }

    .history-timeline-content {
        max-width: 260px;
    }

    .history-timeline-item:nth-child(odd) .history-timeline-content {
        grid-column: 1;
        justify-self: end;
        text-align: end;
    }

    .history-timeline-item:nth-child(even) .history-timeline-content {
        grid-column: 2;
        justify-self: start;
    }

    .history-row {
        display: grid;
        grid-template-columns: minmax(180px, 0.32fr) minmax(0, 0.68fr);
        gap: 4rem;
        padding: 4rem 0;
        border-bottom: 1px solid rgba(32, 39, 89, 0.12);
    }

    .history-row:last-child {
        border-bottom: 0;
    }

    .history-legacy {
        border-inline-start: 6px solid #202759;
        padding-inline-start: 3rem;
    }

    @media (max-width: 1024px) {
        .history-vision-grid,
        .history-row {
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .history-row {
            padding: 3rem 0;
        }
    }

    @media (max-width: 768px) {
        .history-timeline {
            gap: 2.5rem;
            margin-inline-start: 0;
        }

        .history-timeline::before {
            left: 8px;
            transform: none;
        }

        [dir="rtl"] .history-timeline::before {
            right: 8px;
            left: auto;
        }

        .history-timeline-item {
            display: block;
            min-height: 0;
            padding-inline-start: 2.5rem;
        }

        [dir="rtl"] .history-timeline-item {
            padding-inline-start: 0;
            padding-inline-end: 2.5rem;
        }

        .history-timeline-dot {
            left: 8px;
        }

        [dir="rtl"] .history-timeline-dot {
            right: 8px;
            left: auto;
            transform: translate(50%, -50%);
        }

        .history-timeline-content,
        .history-timeline-item:nth-child(odd) .history-timeline-content,
        .history-timeline-item:nth-child(even) .history-timeline-content {
            max-width: none;
            text-align: start;
        }

        .history-legacy {
            padding-inline-start: 1.5rem;
        }
    }
</style>

<section x-cloak class="relative flex min-h-[365px] items-center justify-center overflow-hidden pt-28 font-hacen">
    <img :src="$store.aboutPage.history.heroImage"
         :alt="$store.app.currentLang === 'ar' ? $store.aboutPage.history.titleAr : $store.aboutPage.history.titleEn"
         class="absolute inset-0 h-full w-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-b from-[rgba(7,10,28,0.12)] to-[rgba(32,39,89,0.72)]"></div>

    <div class="container relative z-10 mx-auto px-6 text-center text-white">
        <nav class="mb-6 flex items-center justify-center gap-3 text-xs font-bold text-white/85" aria-label="Breadcrumb">
            <a href="/" class="transition hover:text-white"
               x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.history.breadcrumbHomeAr : $store.aboutPage.history.breadcrumbHomeEn"></a>
            <span aria-hidden="true">›</span>
            <a href="/about.html" class="transition hover:text-white"
               x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.history.breadcrumbParentAr : $store.aboutPage.history.breadcrumbParentEn"></a>
            <span aria-hidden="true">›</span>
            <span x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.history.breadcrumbCurrentAr : $store.aboutPage.history.breadcrumbCurrentEn"></span>
        </nav>

        <h1 class="text-4xl font-black leading-tight text-white md:text-5xl"
            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.history.titleAr : $store.aboutPage.history.titleEn"></h1>
    </div>
</section>

<section id="history-section" x-cloak class="bg-white py-24 font-hacen">
    <div class="container mx-auto ">
        <h2 class="reveal reveal-up mb-16 text-center text-4xl font-black text-spu-blue md:text-5xl"
            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.history.foundingTitleAr : $store.aboutPage.history.foundingTitleEn"></h2>

        <div class="history-vision-grid">
            <div class="history-vision-image reveal reveal-left">
                <img :src="$store.aboutPage.history.foundingImage"
                     :alt="$store.app.currentLang === 'ar' ? $store.aboutPage.history.foundingTitleAr : $store.aboutPage.history.foundingTitleEn"
                     class="h-full w-full object-cover">
            </div>

            <div class="reveal reveal-right">
                <blockquote class="history-quote mb-12 text-2xl font-black leading-relaxed text-slate-950"
                            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.history.quoteAr : $store.aboutPage.history.quoteEn"></blockquote>

                <div class="grid gap-6 text-base leading-relaxed text-slate-700">
                    <template x-for="paragraph in ($store.app.currentLang === 'ar' ? $store.aboutPage.history.foundingBodyAr : $store.aboutPage.history.foundingBodyEn)" :key="paragraph">
                        <p x-text="paragraph"></p>
                    </template>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="bg-section py-24 font-hacen">
    <div class="container mx-auto px-6">
        <h2 class="reveal reveal-up mb-16 text-center text-4xl font-black text-spu-blue md:text-5xl"
            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.history.timelineTitleAr : $store.aboutPage.history.timelineTitleEn"></h2>

        <div class="history-timeline">
            <template x-for="(point, index) in $store.aboutPage.historyPoints" :key="point.year">
                <article class="history-timeline-item reveal"
                         :class="index % 2 === 0 ? 'reveal-left' : 'reveal-right'">
                    <span class="history-timeline-dot" aria-hidden="true"></span>
                    <div class="history-timeline-content">
                        <p class="mb-3 text-4xl font-black leading-none text-spu-blue/35" translate="no" x-text="point.year"></p>
                        <h3 class="text-xl font-black leading-tight text-spu-blue"
                            x-text="$store.app.currentLang === 'ar' ? point.titleAr : point.titleEn"></h3>
                        <p class="mt-5 text-sm leading-relaxed text-slate-700"
                           x-text="$store.app.currentLang === 'ar' ? point.descAr : point.descEn"></p>
                    </div>
                </article>
            </template>
        </div>
    </div>
</section>

<section class="bg-white py-16 font-hacen">
    <div class="container mx-auto max-w-6xl px-6">
        <template x-for="(item, index) in $store.aboutPage.historyNarratives" :key="item.titleEn">
            <article class="history-row reveal reveal-up" :class="`reveal-delay-${(index % 3) + 1}`">
                <div>
                    <h3 class="text-xl font-black text-spu-blue"
                        x-text="$store.app.currentLang === 'ar' ? item.titleAr : item.titleEn"></h3>
                    <p class="mt-2 text-xs font-black uppercase tracking-widest text-spu-red"
                       x-text="$store.app.currentLang === 'ar' ? item.eyebrowAr : item.eyebrowEn"></p>
                </div>

                <p class="max-w-3xl text-lg leading-relaxed text-slate-700"
                   x-text="$store.app.currentLang === 'ar' ? item.bodyAr : item.bodyEn"></p>
            </article>
        </template>
    </div>
</section>

<section class="py-20 font-hacen">
    <div class="container mx-auto px-6">
        <div class="history-legacy reveal reveal-up mx-auto max-w-4xl">
            <h2 class="text-3xl font-black text-spu-blue"
                x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.history.legacyTitleAr : $store.aboutPage.history.legacyTitleEn"></h2>
            <p class="mt-6 max-w-3xl text-lg leading-relaxed text-slate-700"
               x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.history.legacyBodyAr : $store.aboutPage.history.legacyBodyEn"></p>
        </div>
    </div>
</section>
