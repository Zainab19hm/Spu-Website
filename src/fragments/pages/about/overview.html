<section id="about-dynamic-section" x-data class="relative overflow-x-visible bg-white py-24 font-hacen">
    <div class="container relative z-10 mt-14">

        <div class="flex flex-col items-start justify-between gap-10 text-start lg:flex-row">
            <h2 class="mb-5 w-full min-w-0 text-5xl font-black tracking-tighter text-spu-blue md:text-7xl uppercase">
                <template x-if="$store.app.currentLang === 'en'">
                    <span>ABOUT SP<span class="text-spu-red">U</span></span>
                </template>
                <template x-if="$store.app.currentLang === 'ar'">
                    <span>عن الجامعة</span>
                </template>
            </h2>
        </div>

        <div class="grid grid-cols-1 gap-4 overflow-visible lg:grid-cols-12">

            <div class="relative z-20 flex flex-col justify-center gap-6 overflow-visible lg:col-span-5 reveal-left" x-init="observeElement($el)">
                <div class="relative mx-auto w-full  overflow-visible">
                    <div class="relative z-10 h-[411px] w-full max-w-[448px] overflow-hidden shadow-xl">
                        <img :src="$store.aboutPage.hero.image1" class="h-full w-full object-cover" alt="">
                        <div class="overlay absolute inset-0 bg-spu-blue/40"></div>
                    </div>

                    <div class="relative z-10 mt-6 h-[411px] w-full max-w-[448px] overflow-hidden shadow-xl">
                        <img :src="$store.aboutPage.hero.image2" class="h-full w-full object-cover" alt="">
                        <div class="overlay absolute inset-0 bg-spu-blue/40"></div>
                    </div>

                    <div
                        class="pointer-events-none absolute top-[67px] left-[20%] right-[20%] z-40 h-[700px] w-[211px] border-[5px] border-white/60"
                        aria-hidden="true">
                    </div>
                </div>

                <!-- Nudged from the 5/12|7/12 seam into the image column: LTR = left, RTL = right (so subtitles stay clear). -->
                <div
                    :dir="$store.app.currentLang === 'ar' ? 'rtl' : 'ltr'"
                    class="absolute top-1/2 left-1/2 z-50 hidden h-[276px] w-[min(100%-1rem,24.75rem)] -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-sm border-[6px] border-white bg-spu-blue p-10 text-center text-white shadow-2xl md:flex lg:left-[calc(100%-6.5rem)] lg:rtl:left-[6.5rem] xl:left-[calc(100%-7.5rem)] xl:rtl:left-[7.5rem]">
                    <p class="text-2xl font-bold leading-tight"
                        x-text="$store.app.currentLang === 'ar' ? 'قيم جوهرية تلتزم بها الجامعة' : 'A core value upheld by the university'">
                    </p>
                </div>
            </div>

            <div class="relative z-10 flex flex-col justify-center lg:col-span-7 reveal-right" x-init="observeElement($el)">
                <!-- Bold Intro Statement -->
                <div class="mb-12 lg:ps-12">
                    <p class="text-[30px] font-bold text-[#1B1B1F] leading-[100%] w-full"
                        x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.hero.titleAr : $store.aboutPage.hero.titleEn">
                    </p>
                </div>

                <!-- Vision & Mission Cards -->
                <div class="space-y-0 lg:ps-12">
                    <template x-for="(item, index) in $store.aboutPage.story.items" :key="item.id">
                        <div class="py-12 px-10 group transition-all duration-500 "
                            :class="index % 2 === 0 ? 'bg-section' : 'bg-white'">
                            <h3 class="text-2xl font-bold text-spu-blue mb-4 flex items-center gap-3">
                                <span x-text="$store.app.currentLang === 'ar' ? item.titleAr : item.titleEn"></span>
                            </h3>
                            <p class="text-[17px] text-slate-600 leading-relaxed max-w-2xl"
                                x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.story[item.keyAr] : $store.aboutPage.story[item.keyEn]">
                            </p>
                        </div>
                    </template>
                </div>

                <div class="grid grid-cols-2 gap-6 bg-section pt-4 lg:ps-12">
                    <div class="flex items-start gap-3">
                        <img src="/images/icon-check-circle-outline.svg" class="w-5 h-5 text-spu-red mt-1" alt="Check">
                        <div>
                            <h4 class="font-bold text-spu-blue"
                                x-text="$store.app.currentLang === 'ar' ? 'اعتماد دولي' : 'Global Accreditation'"></h4>
                            <p class="text-sm text-slate-500"
                                x-text="$store.app.currentLang === 'ar' ? 'شهادات معترف بها عالمياً' : 'Degrees recognized globally'">
                            </p>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <img src="/images/icon-check-circle-outline.svg" class="w-5 h-5 text-spu-red mt-1" alt="Check">
                        <div>
                            <h4 class="font-bold text-spu-blue"
                                x-text="$store.app.currentLang === 'ar' ? 'جاهزية مهنية' : 'Career Readiness'"></h4>
                            <p class="text-sm text-slate-500"
                                x-text="$store.app.currentLang === 'ar' ? 'تأهيل كامل لسوق العمل' : 'Prepared for job market'">
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <!-- /container -->

    <!-- ! Stats Section: Full width dark bar -->
    <div x-data="{ hasCounted: false }"
        x-init="const obs = new IntersectionObserver(e => { if(e[0].isIntersecting && !hasCounted) { $store.aboutPage.startCounting(); hasCounted = true; } }, {threshold: 0.5}); obs.observe($el);"
        class="bg-spu-blue text-white shadow-2xl relative">

        <div class="container">
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-0 relative z-10">
                <template x-for="(stat, index) in $store.aboutPage.quickStats" :key="stat.id">
                    <div class="text-center group py-8">
                        <img :src="stat.icon"
                            class="w-8 h-8 mb-6 mx-auto brightness-0 invert transition-all duration-300"
                            alt="Stat Icon">
                        <div class="text-6xl font-black mb-3 flex items-center justify-center tracking-tighter">
                            <span translate="no" x-text="stat.current"></span>
                            <span class="text-spu-red" x-show="stat.id === 'papers'">+</span>
                        </div>
                        <p class="text-xs font-bold uppercase tracking-[0.2em] text-[#799DD6] transition-colors"
                            x-text="$store.app.currentLang === 'ar' ? stat.labelAr : stat.labelEn"></p>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- overview section -->
    <div class="container relative z-10">
        <div class="mt-32 relative group overflow-hidden">
            <div class="flex flex-col items-center justify-between gap-24 lg:flex-row lg:gap-20">

                <div class="relative w-full lg:w-1/2 reveal-left" x-init="observeElement($el)">

                    <div class="relative h-[400px] md:h-[500px] rounded-3xl overflow-hidden">
                        <img :src="$store.aboutPage.hero.image"
                            class="w-full h-full object-cover transition-transform duration-1000"
                            alt="University Life">
                        <div
                            class="absolute inset-0 bg-gradient-to-t from-spu-blue/60 via-transparent to-transparent">
                        </div>
                    </div>
                </div>

                <div class="w-full text-start lg:w-1/2 reveal-right" x-init="observeElement($el)">

                    <div class="mb-6 inline-flex items-center gap-3">
                        <div class="h-[2px] w-12 bg-spu-red"></div>
                        <img src="/images/icon-award-outline.svg" class="w-5 h-5 text-spu-red" alt="Award">
                        <span class="text-spu-red font-black tracking-widest text-sm uppercase"
                            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.hero.badgeAr : $store.aboutPage.hero.badgeEn"></span>
                    </div>

                    <h3 class="text-3xl md:text-4xl font-bold text-spu-blue mb-8 leading-tight"
                        x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.hero.titleAr : $store.aboutPage.hero.titleEn">
                    </h3>

                    <div class="space-y-6">
                        <p class="border-s-4 border-spu-blue/10 ps-6 text-xl leading-relaxed text-slate-600"
                            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.hero.quoteAr : $store.aboutPage.hero.quoteEn">
                        </p>
                        <p class="text-lg text-slate-500 leading-relaxed"
                            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.hero.descriptionAr : $store.aboutPage.hero.descriptionEn">
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
