<main class="bg-slate-50 min-h-screen pb-24 font-hacen">

    <style>
        .vision-subpage-hero {
            min-height: 365px;
            position: relative;
        }

        .vision-subpage-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(7, 10, 28, 0.12) 0%, rgba(32, 39, 89, 0.72) 100%);
        }

        .vision-subpage-hero h1 {
            text-shadow: 0 6px 22px rgba(0,0,0,0.45);
        }
    </style>

    <section x-cloak
        class="vision-subpage-hero relative flex items-center justify-center overflow-hidden pt-28 font-hacen">
        <img :src="$store.aboutPage.visionMission.heroImage"
            :alt="$store.app.currentLang === 'ar' ? $store.aboutPage.visionMission.titleAr : $store.aboutPage.visionMission.titleEn"
            class="absolute inset-0 h-full w-full object-cover">

        <div class="container relative z-10 mx-auto py-5 text-center text-white">
            <nav class="mb-6 flex items-center justify-center gap-3 text-xs font-bold text-white/85"
                aria-label="Breadcrumb">
                <a href="/" class="transition hover:text-white"
                    x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.visionMission.breadcrumbHomeAr : $store.aboutPage.visionMission.breadcrumbHomeEn"></a>
                <span aria-hidden="true">›</span>
                <a href="/about.html" class="transition hover:text-white"
                    x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.visionMission.breadcrumbParentAr : $store.aboutPage.visionMission.breadcrumbParentEn"></a>
                <span aria-hidden="true">›</span>
                <span
                    x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.visionMission.titleAr : $store.aboutPage.visionMission.titleEn"></span>
            </nav>

            <h1 class="text-4xl font-black leading-tight text-white md:text-5xl"
                x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.visionMission.titleAr : $store.aboutPage.visionMission.titleEn">
            </h1>
        </div>
    </section>

    <section class="bg-white py-20 font-hacen">
        <div class="container mx-auto ">
            <p class="max-w-3xl mx-auto text-center text-slate-700 mb-12"
                x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.visionMission.summaryAr : $store.aboutPage.visionMission.summaryEn">
            </p>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <template x-for="(card, idx) in $store.aboutPage.visionMission.cards" :key="idx">
                    <div class="bg-white rounded-2xl p-8 border border-slate-100 shadow-sm text-center reveal-up">
                        <div class="w-14 h-14 mx-auto mb-6">
                            <img :src="card.icon" alt="" class="w-full h-full object-contain mx-auto">
                        </div>
                        <h3 class="text-xl font-black text-spu-blue mb-3"
                            x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn"></h3>
                        <p class="text-slate-700" x-text="$store.app.currentLang === 'ar' ? card.bodyAr : card.bodyEn">
                        </p>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <section class="bg-section py-24 font-hacen">
        <div class="container mx-auto ">
            <h2 class="reveal reveal-up mb-12 text-center text-4xl font-black text-spu-blue md:text-5xl"
                x-text="$store.app.currentLang === 'ar' ? 'الأعمدة الاستراتيجية' : 'Strategic Pillars'"></h2>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <template x-for="(p, i) in $store.aboutPage.visionMission.pillars" :key="i">
                    <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm reveal-up">
                        <h3 class="text-lg font-black text-spu-blue mb-3"
                            x-text="$store.app.currentLang === 'ar' ? p.titleAr : p.titleEn"></h3>
                        <p class="text-slate-700" x-text="$store.app.currentLang === 'ar' ? p.summaryAr : p.summaryEn">
                        </p>
                    </div>
                </template>
            </div>
        </div>
    </section>

   

</main>
