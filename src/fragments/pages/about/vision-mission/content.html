<style>
    .vm-hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
        gap: 4rem;
        align-items: center;
    }

    .vm-card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1.5rem;
    }

    .vm-card {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 2.5rem;
        background: #ffffff;
        padding: 2.5rem;
        transition: transform 0.5s ease, box-shadow 0.5s ease, border-color 0.5s ease;
    }

    .vm-card:hover {
        transform: translateY(-10px);
        border-color: rgba(111, 22, 22, 0.2);
        box-shadow: 0 28px 70px -30px rgba(32, 39, 89, 0.25);
    }

    .vm-card::before {
        content: '';
        position: absolute;
        inset-inline-end: -56px;
        top: -56px;
        width: 140px;
        height: 140px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(111, 22, 22, 0.09), transparent 68%);
    }

    .vm-icon {
        display: inline-flex;
        width: 72px;
        height: 72px;
        align-items: center;
        justify-content: center;
        border-radius: 1.5rem;
        background: rgba(32, 39, 89, 0.06);
        color: #202759;
        font-size: 1.65rem;
        transition: background 0.4s ease, color 0.4s ease, transform 0.4s ease;
    }

    .vm-card:hover .vm-icon {
        background: #6f1616;
        color: #ffffff;
        transform: rotate(-8deg) scale(1.05);
    }

    .vm-pillar-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
    }

    .vm-pillar {
        border-radius: 1.75rem;
        background: rgba(255, 255, 255, 0.9);
        padding: 1.5rem;
        border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .vm-timeline {
        position: relative;
        display: grid;
        gap: 1rem;
    }

    .vm-timeline::before {
        content: '';
        position: absolute;
        inset-inline-start: 23px;
        top: 24px;
        bottom: 24px;
        width: 2px;
        background: linear-gradient(to bottom, #202759, #6f1616);
        opacity: 0.18;
    }

    .vm-timeline-item {
        position: relative;
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        gap: 1rem;
        align-items: center;
    }

    .vm-timeline-dot {
        position: relative;
        z-index: 1;
        display: flex;
        width: 48px;
        height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        background: #ffffff;
        border: 1px solid rgba(111, 22, 22, 0.22);
        color: #6f1616;
        font-size: 0.75rem;
        font-weight: 900;
    }

    @media (max-width: 1024px) {
        .vm-hero-grid,
        .vm-card-grid,
        .vm-pillar-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<section id="vision-mission-section" x-cloak class="relative overflow-hidden bg-white py-32 font-hacen">
    <div class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_top_left,rgba(32,39,89,0.06),transparent_35%),radial-gradient(circle_at_bottom_right,rgba(111,22,22,0.06),transparent_30%)]"></div>

    <div class="container relative z-10 mx-auto px-6">
        <div class="vm-hero-grid">
            <div>
                <div class="reveal reveal-up mb-6 inline-flex items-center gap-3">
                    <span class="h-px w-10 bg-spu-red"></span>
                    <span class="text-sm font-black uppercase tracking-widest text-spu-red"
                        x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.visionMission.eyebrowAr : $store.aboutPage.visionMission.eyebrowEn"></span>
                </div>

                <h1 class="reveal reveal-up reveal-delay-1 text-5xl font-black leading-tight tracking-tighter text-spu-blue md:text-7xl"
                    x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.visionMission.titleAr : $store.aboutPage.visionMission.titleEn"></h1>

                <p class="reveal reveal-up reveal-delay-2 mt-8 max-w-3xl text-xl leading-relaxed text-slate-500"
                    x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.visionMission.summaryAr : $store.aboutPage.visionMission.summaryEn"></p>
            </div>

            <div class="reveal reveal-right rounded-[2.5rem] bg-spu-blue p-8 text-white shadow-2xl shadow-spu-blue/20">
                <div class="mb-8 flex items-center gap-4">
                    <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-white/10">
                        <i class="fa-solid fa-compass text-2xl text-white"></i>
                    </div>
                    <div>
                        <p class="text-xs font-black uppercase tracking-widest text-white/50">SPU</p>
                        <h2 class="text-2xl font-black"
                            x-text="$store.app.currentLang === 'ar' ? 'معالم مؤسسية' : 'Institutional Milestones'"></h2>
                    </div>
                </div>

                <div class="vm-timeline">
                    <template x-for="item in $store.aboutPage.visionMission.timeline" :key="item.year">
                        <div class="vm-timeline-item">
                            <div class="vm-timeline-dot" x-text="item.year"></div>
                            <p class="text-lg font-bold text-white/85"
                                x-text="$store.app.currentLang === 'ar' ? item.labelAr : item.labelEn"></p>
                        </div>
                    </template>
                </div>

                <p class="mt-8 rounded-2xl bg-white/10 p-5 text-sm leading-relaxed text-white/70"
                    x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.visionMission.sourceNoteAr : $store.aboutPage.visionMission.sourceNoteEn"></p>
            </div>
        </div>

        <div class="vm-card-grid mt-20">
            <template x-for="(card, index) in $store.aboutPage.visionMission.cards" :key="card.titleEn">
                <article class="vm-card reveal reveal-up" :class="`reveal-delay-${index + 1}`">
                    <div class="relative z-10">
                        <div class="vm-icon">
                            <i class="fa-solid" :class="card.icon"></i>
                        </div>
                        <h2 class="mt-8 text-3xl font-black text-spu-blue"
                            x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn"></h2>
                        <p class="mt-5 text-lg leading-relaxed text-slate-500"
                            x-text="$store.app.currentLang === 'ar' ? card.bodyAr : card.bodyEn"></p>
                    </div>
                </article>
            </template>
        </div>
    </div>
</section>

<section class="relative overflow-hidden bg-section py-24 font-hacen">
    <div class="container mx-auto px-6">
        <div class="mb-12 flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
            <div>
                <p class="text-sm font-black uppercase tracking-widest text-spu-red"
                    x-text="$store.app.currentLang === 'ar' ? 'ركائز العمل' : 'Operating Pillars'"></p>
                <h2 class="mt-4 text-4xl font-black text-spu-blue md:text-5xl"
                    x-text="$store.app.currentLang === 'ar' ? 'كيف تتحول الرؤية إلى تجربة جامعية' : 'How the vision becomes a campus experience'"></h2>
            </div>
            <a href="/about.html" class="inline-flex items-center gap-3 rounded-2xl bg-spu-blue px-8 py-4 font-black text-white shadow-xl transition-all hover:bg-spu-red">
                <i class="fa-solid fa-arrow-left rtl:rotate-180"></i>
                <span x-text="$store.app.currentLang === 'ar' ? 'العودة إلى نظرة عامة' : 'Back to Overview'"></span>
            </a>
        </div>

        <div class="vm-pillar-grid">
            <template x-for="(pillar, index) in $store.aboutPage.visionMission.pillars" :key="pillar.titleEn">
                <article class="vm-pillar reveal reveal-up" :class="`reveal-delay-${(index % 4) + 1}`">
                    <div class="mb-5 flex h-11 w-11 items-center justify-center rounded-xl bg-spu-red/10 text-sm font-black text-spu-red"
                        x-text="String(index + 1).padStart(2, '0')"></div>
                    <h3 class="text-xl font-black text-spu-blue"
                        x-text="$store.app.currentLang === 'ar' ? pillar.titleAr : pillar.titleEn"></h3>
                    <p class="mt-4 text-sm leading-relaxed text-slate-500"
                        x-text="$store.app.currentLang === 'ar' ? pillar.summaryAr : pillar.summaryEn"></p>
                </article>
            </template>
        </div>
    </div>
</section>
