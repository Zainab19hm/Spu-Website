<section x-cloak class="relative flex min-h-[365px] items-center justify-center overflow-hidden pt-28 font-hacen">
    <img :src="$store.aboutPage.organizationalStructure.heroImage"
         :alt="$store.app.currentLang === 'ar' ? $store.aboutPage.organizationalStructure.titleAr : $store.aboutPage.organizationalStructure.titleEn"
         class="absolute inset-0 h-full w-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-b from-[rgba(7,10,28,0.12)] to-[rgba(32,39,89,0.72)]"></div>
    <div class="container relative z-10 mx-auto px-6 text-center text-white">
        <nav class="mb-6 flex items-center justify-center gap-3 text-xs font-bold text-white/85" aria-label="Breadcrumb">
            <a href="/" class="transition hover:text-white"
               x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.organizationalStructure.breadcrumbHomeAr : $store.aboutPage.organizationalStructure.breadcrumbHomeEn"></a>
            <span aria-hidden="true">›</span>
            <a href="/about.html" class="transition hover:text-white"
               x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.organizationalStructure.breadcrumbParentAr : $store.aboutPage.organizationalStructure.breadcrumbParentEn"></a>
            <span aria-hidden="true">›</span>
            <span x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.organizationalStructure.breadcrumbCurrentAr : $store.aboutPage.organizationalStructure.breadcrumbCurrentEn"></span>
        </nav>
        <p class="mb-3 text-xs font-black uppercase tracking-widest text-white/70"
           x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.organizationalStructure.badgeAr : $store.aboutPage.organizationalStructure.badgeEn"></p>
        <h1 class="text-4xl font-black leading-tight text-white md:text-5xl"
            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.organizationalStructure.titleAr : $store.aboutPage.organizationalStructure.titleEn"></h1>
    </div>
</section>

<section x-cloak class="bg-white py-20 font-hacen">
    <div class="container mx-auto max-w-5xl px-6">
        <div class="grid gap-6 text-base leading-relaxed text-slate-700">
            <template x-for="paragraph in ($store.app.currentLang === 'ar' ? $store.aboutPage.organizationalStructure.introAr : $store.aboutPage.organizationalStructure.introEn)" :key="paragraph">
                <p x-text="paragraph" class="text-lg leading-relaxed"></p>
            </template>
        </div>
    </div>
</section>

<section x-cloak class="bg-section py-20 font-hacen">
    <div class="container mx-auto max-w-5xl px-6">
        <div class="grid gap-8 md:grid-cols-2">
            <template x-for="item in $store.aboutPage.organizationalStructure.levels" :key="item.titleEn">
                <div class="rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
                    <h3 class="mb-4 text-xl font-black text-spu-blue"
                        x-text="$store.app.currentLang === 'ar' ? item.titleAr : item.titleEn"></h3>
                    <p class="text-sm leading-relaxed text-slate-600"
                       x-text="$store.app.currentLang === 'ar' ? item.bodyAr : item.bodyEn"></p>
                </div>
            </template>
        </div>
    </div>
</section>
