<section x-cloak class="relative flex min-h-[365px] items-center justify-center overflow-hidden pt-28 font-hacen">
    <img :src="$store.aboutPage.whySpu.heroImage"
         :alt="$store.app.currentLang === 'ar' ? $store.aboutPage.whySpu.titleAr : $store.aboutPage.whySpu.titleEn"
         class="absolute inset-0 h-full w-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-b from-[rgba(7,10,28,0.12)] to-[rgba(32,39,89,0.72)]"></div>
    <div class="container relative z-10 mx-auto px-6 text-center text-white">
        <nav class="mb-6 flex items-center justify-center gap-3 text-xs font-bold text-white/85" aria-label="Breadcrumb">
            <a href="/" class="transition hover:text-white"
               x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.whySpu.breadcrumbHomeAr : $store.aboutPage.whySpu.breadcrumbHomeEn"></a>
            <span aria-hidden="true">›</span>
            <a href="/about.html" class="transition hover:text-white"
               x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.whySpu.breadcrumbParentAr : $store.aboutPage.whySpu.breadcrumbParentEn"></a>
            <span aria-hidden="true">›</span>
            <span x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.whySpu.breadcrumbCurrentAr : $store.aboutPage.whySpu.breadcrumbCurrentEn"></span>
        </nav>
        <p class="mb-3 text-xs font-black uppercase tracking-widest text-white/70"
           x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.whySpu.badgeAr : $store.aboutPage.whySpu.badgeEn"></p>
        <h1 class="text-4xl font-black leading-tight text-white md:text-5xl"
            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.whySpu.titleAr : $store.aboutPage.whySpu.titleEn"></h1>
    </div>
</section>

<section x-cloak class="bg-white py-16 font-hacen">
    <div class="container mx-auto max-w-3xl px-6 text-center">
        <p class="text-lg leading-relaxed text-slate-700"
           x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.whySpu.introAr : $store.aboutPage.whySpu.introEn"></p>
    </div>
</section>

<section x-cloak class="bg-section py-20 font-hacen">
    <div class="container mx-auto max-w-6xl px-6">
        <div class="grid gap-8 md:grid-cols-2 lg:grid-cols-3">
            <template x-for="item in $store.aboutPage.whySpu.advantages" :key="item.titleEn">
                <div class="rounded-lg border border-slate-200 bg-white p-8 shadow-sm transition hover:shadow-md">
                    <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-xl bg-spu-blue/5">
                        <img :src="item.icon" alt="" class="h-7 w-7">
                    </div>
                    <h3 class="mb-3 text-lg font-black text-spu-blue"
                        x-text="$store.app.currentLang === 'ar' ? item.titleAr : item.titleEn"></h3>
                    <p class="text-sm leading-relaxed text-slate-600"
                       x-text="$store.app.currentLang === 'ar' ? item.summaryAr : item.summaryEn"></p>
                </div>
            </template>
        </div>
    </div>
</section>

<section x-cloak class="bg-spu-blue py-16 font-hacen">
    <div class="container mx-auto px-6">
        <h2 class="mb-12 text-center text-3xl font-black text-white md:text-4xl"
            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.whySpu.statsTitleAr : $store.aboutPage.whySpu.statsTitleEn"></h2>
        <div class="mx-auto grid max-w-4xl grid-cols-2 gap-8 md:grid-cols-4">
            <template x-for="stat in $store.aboutPage.whySpu.stats" :key="stat.labelEn">
                <div class="text-center">
                    <p class="text-3xl font-black text-white" x-text="stat.value"></p>
                    <p class="mt-2 text-sm font-bold text-white/70"
                       x-text="$store.app.currentLang === 'ar' ? stat.labelAr : stat.labelEn"></p>
                </div>
            </template>
        </div>
    </div>
</section>
