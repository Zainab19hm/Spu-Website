<style>
    /* Leadership Design System */
    .leadership-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 3rem;
    }

    .president-spotlight {
        max-width: 900px;
        margin: 0 auto 6rem;
    }

    /* Executive Card Styling */
    .member-card {
        background: white;
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 2.5rem;
        padding: 2.5rem;
        text-align: center;
        transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        position: relative;
        overflow: hidden;
    }

    .member-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 25px 50px -12px rgba(32, 39, 89, 0.08);
        border-color: rgba(111, 22, 22, 0.2);
    }

    .member-photo-container {
        position: relative;
        width: 180px;
        height: 180px;
        margin: 0 auto 2rem;
        border-radius: 2rem;
        overflow: hidden;
        border: 4px solid white;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        transition: all 0.5s ease;
    }

    .member-card:hover .member-photo-container {
        border-radius: 3rem;
        box-shadow: 0 15px 35px rgba(111, 22, 22, 0.1);
    }

    .president-card .member-photo-container {
        width: 240px;
        height: 240px;
    }

    .leadership-icon-container {
        width: 120px;
        height: 120px;
        margin: 0 auto 2rem;
        border-radius: 2rem;
        background: rgba(32, 39, 89, 0.05);
        color: #202759;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.25rem;
        transition: all 0.5s ease;
    }

    .member-card:hover .leadership-icon-container {
        background: #6f1616;
        color: white;
        transform: rotate(-8deg) scale(1.05);
    }

    /* Professional Background pattern for cards */
    .card-bg-pattern {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 100px;
        background: linear-gradient(135deg, rgba(32, 39, 89, 0.03) 0%, rgba(111, 22, 22, 0.03) 100%);
        z-index: 0;
    }

    /* Bio quote styling for President */
    .president-quote {
        position: relative;
        padding: 2rem;
        background: rgba(32, 39, 89, 0.02);
        border-radius: 2rem;
        margin-top: 2rem;
        border-left: 4px solid #6f1616;
    }

    [dir="rtl"] .president-quote {
        border-left: none;
        border-right: 4px solid #6f1616;
    }

    .quote-icon {
        position: absolute;
        top: -10px;
        left: 20px;
        font-size: 3rem;
        color: rgba(111, 22, 22, 0.1);
        font-family: serif;
    }

    @media (max-width: 768px) {
        .leadership-grid { grid-template-columns: 1fr; }
        .president-card .member-photo-container { width: 180px; height: 180px; }
        .member-card { padding: 1.5rem; }
    }
</style>

<section id="leadership-section" x-cloak
         class="relative py-32 overflow-hidden bg-white font-hacen">
    
    <!-- Header Section -->
    <div class="container relative z-10 mx-auto px-6 mb-24 text-center">
        <div class="reveal reveal-up inline-flex items-center gap-3 mb-6">
            <span class="h-px w-10 bg-spu-red"></span>
            <span class="text-spu-red font-black tracking-widest text-sm uppercase"
                x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.leadership.eyebrowAr : $store.aboutPage.leadership.eyebrowEn"></span>
            <span class="h-px w-10 bg-spu-red"></span>
        </div>
        
        <h2 class="reveal reveal-up reveal-delay-1 text-5xl md:text-7xl font-black text-spu-blue tracking-tighter leading-tight"
            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.leadership.nameAr : $store.aboutPage.leadership.nameEn"></h2>
        
        <p class="reveal reveal-up reveal-delay-2 mt-8 text-xl text-slate-500 max-w-3xl mx-auto leading-relaxed"
            x-html="$store.app.currentLang === 'ar' ? $store.aboutPage.leadership.roleAr : $store.aboutPage.leadership.roleEn"></p>
    </div>

    <!-- Content Area -->
    <div class="container mx-auto px-6 relative z-10">
        
        <!-- President Spotlight -->
        <template x-for="member in $store.aboutPage.leadershipMembers.filter(m => m.type === 'president')" :key="member.nameEn">
            <div class="president-spotlight reveal reveal-up reveal-delay-3">
                <div class="member-card president-card">
                    <div class="card-bg-pattern"></div>
                    
                    <div class="relative z-10 flex flex-col md:flex-row items-center gap-8 md:gap-16">
                        <div class="member-photo-container shrink-0">
                            <img :src="member.image" :alt="member.nameEn" class="w-full h-full object-cover">
                        </div>
                        
                        <div class="text-center md:text-start">
                            <span class="inline-block px-4 py-1 bg-spu-red/10 text-spu-red text-xs font-black uppercase tracking-widest rounded-full mb-4"
                                  x-text="$store.app.currentLang === 'ar' ? member.roleAr : member.roleEn"></span>
                            
                            <h3 class="text-3xl md:text-4xl font-black text-spu-blue mb-4"
                                x-text="$store.app.currentLang === 'ar' ? member.nameAr : member.nameEn"></h3>

                            <p class="text-slate-500 leading-relaxed"
                               x-text="$store.app.currentLang === 'ar' ? member.bioAr : member.bioEn"></p>
                            
                            <div class="president-quote">
                                <span class="quote-icon">"</span>
                                <p class="text-slate-600 text-lg leading-relaxed "
                                   x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.leadership.quoteAr : $store.aboutPage.leadership.quoteEn"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Executive Council Grid -->
        <div class="mb-16">
            <div class="reveal reveal-up mb-12 flex items-center gap-4">
                <h4 class="text-2xl font-black text-spu-blue" 
                    x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.leadership.councilTitleAr : $store.aboutPage.leadership.councilTitleEn"></h4>
                <div class="h-px grow bg-slate-100"></div>
            </div>

            <div class="reveal reveal-up mb-10 rounded-3xl border border-amber-200 bg-amber-50 px-6 py-5 text-sm leading-relaxed text-amber-950">
                <p x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.leadership.noteAr : $store.aboutPage.leadership.noteEn"></p>
            </div>

            <div class="leadership-grid">
                <template x-for="(member, index) in $store.aboutPage.leadershipMembers.filter(m => m.type !== 'president')" :key="member.nameEn">
                    <div class="reveal reveal-up" :class="`reveal-delay-${(index % 3) + 1}`">
                        <div class="member-card h-full flex flex-col">
                            <div class="card-bg-pattern"></div>
                            
                            <div class="relative z-10 flex flex-col h-full">
                                <div class="leadership-icon-container">
                                    <i class="fa-solid" :class="member.icon"></i>
                                </div>
                                
                                <span class="text-spu-red text-xs font-black uppercase tracking-widest mb-3"
                                      x-text="$store.app.currentLang === 'ar' ? member.roleAr : member.roleEn"></span>
                                
                                <h3 class="text-xl font-bold text-spu-blue mb-4"
                                    x-text="$store.app.currentLang === 'ar' ? member.nameAr : member.nameEn"></h3>

                                <p class="mb-6 text-sm leading-relaxed text-slate-500"
                                   x-text="$store.app.currentLang === 'ar' ? member.bioAr : member.bioEn"></p>
                                
                                <div class="mt-auto pt-6 border-t border-slate-50 flex justify-center">
                                    <span class="inline-flex items-center gap-2 rounded-full bg-slate-50 px-4 py-2 text-xs font-black uppercase tracking-widest text-spu-blue">
                                        <i class="fa-solid fa-circle-nodes text-spu-red"></i>
                                        <span x-text="$store.app.currentLang === 'ar' ? 'حوكمة' : 'Governance'"></span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Back Link -->
        <div class="reveal reveal-up reveal-delay-5 mt-20 text-center">
            <a href="/about.html" 
               class="inline-flex items-center gap-3 px-10 py-4 bg-spu-blue text-white font-black rounded-2xl hover:bg-spu-red transition-all shadow-xl hover:shadow-spu-red/20 group">
                <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform rtl:rotate-180"></i>
                <span x-text="$store.app.currentLang === 'ar' ? 'العودة إلى نظرة عامة' : 'Back to Overview'"></span>
            </a>
        </div>
    </div>

    <!-- Decorative Elements -->
    <div class="absolute top-0 left-0 w-1/3 h-1/3 bg-radial from-spu-red/5 to-transparent -z-10 blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-1/4 h-1/4 bg-radial from-spu-blue/5 to-transparent -z-10 blur-3xl"></div>
</section>
