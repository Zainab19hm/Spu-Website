<style>
    /* Partnership Design System */
    .partnership-hero {
        min-height: 365px;
    }

    .partnership-hero::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(7, 10, 28, 0.1) 0%, rgba(32, 39, 89, 0.74) 100%);
    }

    .core-domains-section {
        padding: 6rem 0;
        background: #fff;
    }

    .core-domains-title {
        text-align: center;
        font-size: 2.25rem;
        font-weight: 900;
        color: #202759;
        margin-bottom: 4rem;
    }

    .partner-goals-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3rem 4rem;
        max-width: 1000px;
        margin: 0 auto;
    }

    .partner-goal-card {
        display: flex;
        gap: 1.5rem;
    }

    .partner-goal-icon {
        flex-shrink: 0;
        color: #6f1616;
    }

    .partner-goal-icon svg {
        width: 32px;
        height: 32px;
        stroke: currentColor;
        stroke-width: 1.5;
        fill: none;
    }

    .partner-goal-content h3 {
        font-size: 1.25rem;
        font-weight: 900;
        color: #202759;
        margin-bottom: 0.75rem;
    }

    .partner-goal-content p {
        font-size: 0.85rem;
        color: #666;
        line-height: 1.6;
    }

    .filter-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4rem;
        flex-wrap: wrap;
        gap: 1.5rem;
    }

    .filter-buttons {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .filter-btn {
        padding: 0.6rem 1.5rem;
        border: 1px solid rgba(32, 39, 89, 0.12);
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 800;
        color: #202759;
        background: #fff;
        transition: all 0.3s ease;
    }

    .filter-btn.active, .filter-btn:hover {
        background: #6f1616;
        color: #fff;
        border-color: #6f1616;
    }

    .search-input-wrapper {
        position: relative;
        width: 300px;
    }

    .search-input {
        width: 100%;
        padding: 0.6rem 1rem 0.6rem 2.5rem;
        border: 1px solid rgba(32, 39, 89, 0.12);
        border-radius: 6px;
        font-size: 0.85rem;
        color: #202759;
        background: #faf9fb;
        outline: none;
        transition: border-color 0.3s;
    }
    
    .search-input:focus {
        border-color: #6f1616;
    }

    .rtl .search-input {
        padding: 0.6rem 2.5rem 0.6rem 1rem;
    }

    .search-icon {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        color: #999;
    }

    .rtl .search-icon {
        left: auto;
        right: 0.75rem;
    }

    .partner-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 2rem;
        margin-bottom: 4rem;
    }

    .partner-card {
        background: #fff;
        border: 1px solid rgba(32, 39, 89, 0.12);
        box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .partner-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 45px rgba(32, 39, 89, 0.08);
    }

    .partner-logo-box {
        padding: 3rem 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid rgba(32, 39, 89, 0.08);
        height: 180px;
    }

    .partner-logo-box img {
        max-width: 80%;
        max-height: 80px;
        object-fit: contain;
    }

    .partner-card-body {
        padding: 2rem;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
    }

    .partner-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
        font-size: 0.65rem;
        font-weight: 900;
        letter-spacing: 0.05em;
    }

    .partner-status {
        color: #6f1616;
    }

    .partner-status.active {
        color: #6f1616;
    }

    .partner-established {
        color: #666;
    }

    .partner-title {
        font-size: 1.25rem;
        font-weight: 900;
        color: #202759;
        margin-bottom: 0.5rem;
    }

    .partner-category {
        font-size: 0.7rem;
        font-weight: 800;
        color: #666;
        margin-bottom: 1.5rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .partner-desc {
        font-size: 0.8rem;
        color: #666;
        line-height: 1.6;
        margin-bottom: 2rem;
        flex-grow: 1;
    }

    .partner-link {
        font-size: 0.7rem;
        font-weight: 900;
        color: #202759;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition: color 0.3s ease;
    }

    .partner-link:hover {
        color: #6f1616;
    }

    .load-more-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 2rem;
        background: #f0eef3;
        color: #202759;
        font-size: 0.75rem;
        font-weight: 900;
        border-radius: 999px;
        transition: background 0.3s ease;
    }

    .load-more-btn:hover {
        background: #e2e0e8;
    }

    .propose-section {
        text-align: center;
        padding: 5rem 0;
        border-top: 1px solid rgba(32, 39, 89, 0.1);
        max-width: 700px;
        margin: 0 auto;
    }

    .propose-icon {
        width: 32px;
        height: 32px;
        color: #6f1616;
        margin: 0 auto 1.5rem;
    }

    .propose-title {
        font-size: 1.5rem;
        font-weight: 900;
        color: #202759;
        margin-bottom: 1rem;
    }

    .propose-text {
        font-size: 0.9rem;
        color: #666;
        line-height: 1.6;
        margin-bottom: 2rem;
    }

    .propose-btn {
        display: inline-flex;
        padding: 0.75rem 2rem;
        border-bottom: 1px solid #202759;
        color: #202759;
        font-size: 0.75rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: all 0.3s ease;
    }

    .propose-btn:hover {
        border-color: #6f1616;
        color: #6f1616;
    }

    @media (max-width: 1024px) {
        .partner-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (max-width: 768px) {
        .partner-goals-grid {
            grid-template-columns: 1fr;
        }
        
        .filter-bar {
            flex-direction: column;
            align-items: flex-start;
        }

        .search-input-wrapper {
            width: 100%;
        }

        .partner-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<section x-cloak class="partnership-hero relative flex items-center justify-center overflow-hidden pt-28 font-hacen">
    <img :src="$store.aboutPage.partnerships.heroImage"
         alt="Partnerships Banner"
         class="absolute inset-0 h-full w-full object-cover">

    <div class="container relative z-10 mx-auto px-6 text-center text-white">
        <nav class="flex items-center justify-center gap-3 text-sm font-bold text-white/90 mb-4" aria-label="Breadcrumb">
            <a href="/" class="transition hover:text-white"
               x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.breadcrumbHomeAr : $store.aboutPage.partnerships.breadcrumbHomeEn"></a>
            <span aria-hidden="true">›</span>
            <a href="/about.html" class="transition hover:text-white"
               x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.breadcrumbParentAr : $store.aboutPage.partnerships.breadcrumbParentEn"></a>
            <span aria-hidden="true">›</span>
            <span x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.breadcrumbCurrentAr : $store.aboutPage.partnerships.breadcrumbCurrentEn"></span>
        </nav>
        
        <h1 class="text-4xl font-black leading-tight text-white md:text-5xl"
            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.titleAr : $store.aboutPage.partnerships.titleEn"></h1>
    </div>
</section>

<section id="partnership-section" x-cloak class="core-domains-section font-hacen">
    <div class="container mx-auto">
        
        <h2 class="core-domains-title reveal reveal-up"
            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.coreDomainsTitleAr : $store.aboutPage.partnerships.coreDomainsTitleEn"></h2>

        <div class="partner-goals-grid mb-20">
            <template x-for="(goal, index) in $store.aboutPage.partnerships.goals" :key="index">
                <article class="partner-goal-card reveal reveal-up" :class="`reveal-delay-${(index % 2) + 1}`">
                    <div class="partner-goal-icon">
                        <svg viewBox="0 0 24 24" x-html="`<path d='${goal.iconPath}'/>`"></svg>
                    </div>
                    <div class="partner-goal-content">
                        <h3 x-text="$store.app.currentLang === 'ar' ? goal.titleAr : goal.titleEn"></h3>
                        <p x-text="$store.app.currentLang === 'ar' ? goal.summaryAr : goal.summaryEn"></p>
                    </div>
                </article>
            </template>
        </div>

        <div class="filter-bar reveal reveal-up">
            <div class="filter-buttons">
                <button class="filter-btn active" x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.filters.allAr : $store.aboutPage.partnerships.filters.allEn"></button>
                <button class="filter-btn" x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.filters.academicAr : $store.aboutPage.partnerships.filters.academicEn"></button>
                <button class="filter-btn" x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.filters.researchAr : $store.aboutPage.partnerships.filters.researchEn"></button>
                <button class="filter-btn" x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.filters.clinicalAr : $store.aboutPage.partnerships.filters.clinicalEn"></button>
            </div>
            
            <div class="search-input-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" class="search-input" :placeholder="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.filters.searchAr : $store.aboutPage.partnerships.filters.searchEn">
            </div>
        </div>

        <div class="partner-grid">
            <template x-for="(partner, index) in $store.aboutPage.partnerships.list" :key="index">
                <div class="reveal reveal-up" :class="`reveal-delay-${(index % 3) + 1}`">
                    <div class="partner-card">
                        <div class="partner-logo-box">
                            <img :src="partner.logo" :alt="partner.nameEn">
                        </div>

                        <div class="partner-card-body">
                            <div class="partner-meta">
                                <span class="partner-status" :class="partner.statusEn === 'ACTIVE' ? 'active' : ''" x-text="$store.app.currentLang === 'ar' ? partner.statusAr : partner.statusEn"></span>
                                <span class="partner-established" x-text="$store.app.currentLang === 'ar' ? partner.establishedAr : partner.establishedEn"></span>
                            </div>
                            
                            <h3 class="partner-title" x-text="$store.app.currentLang === 'ar' ? partner.nameAr : partner.nameEn"></h3>
                            <p class="partner-category" x-text="$store.app.currentLang === 'ar' ? partner.categoryAr : partner.categoryEn"></p>
                            
                            <p class="partner-desc" x-text="$store.app.currentLang === 'ar' ? partner.descAr : partner.descEn"></p>

                            <a :href="partner.website" class="partner-link">
                                <span x-text="$store.app.currentLang === 'ar' ? 'عرض التفاصيل' : 'View Details'"></span>
                                <img src="/images/icon-arrow-right-outline.svg" alt="" class="h-3 w-3 rtl:rotate-180" aria-hidden="true">
                            </a>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <div class="text-center reveal reveal-up">
            <button class="load-more-btn">
                <span x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.loadMoreAr : $store.aboutPage.partnerships.loadMoreEn"></span>
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
        </div>

        <div class="propose-section reveal reveal-up">
            <svg class="propose-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            
            <h3 class="propose-title" x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.proposeTitleAr : $store.aboutPage.partnerships.proposeTitleEn"></h3>
            
            <p class="propose-text" x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.proposeTextAr : $store.aboutPage.partnerships.proposeTextEn"></p>
            
            <a href="#" class="propose-btn" x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.proposeBtnAr : $store.aboutPage.partnerships.proposeBtnEn"></a>
        </div>

    </div>
</section>
