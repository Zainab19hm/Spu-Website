<style>
    /* Partnership Design System */
    .partner-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 3rem;
    }

    .partner-card {
        background: white;
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 2.5rem;
        padding: 2rem;
        transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    .partner-card:hover {
        transform: translateY(-12px);
        box-shadow: 0 30px 60px -15px rgba(32, 39, 89, 0.12);
        border-color: rgba(111, 22, 22, 0.2);
    }

    .partner-logo-box {
        position: relative;
        height: 180px;
        background: #f8fafc;
        border-radius: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2rem;
        padding: 2.5rem;
        transition: all 0.5s ease;
        border: 1px solid transparent;
    }

    .partner-card:hover .partner-logo-box {
        background: white;
        border-color: rgba(111, 22, 22, 0.05);
    }

    .partner-logo-box img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        filter: grayscale(100%);
        opacity: 0.7;
        transition: all 0.5s ease;
    }

    .partner-card:hover .partner-logo-box img {
        filter: grayscale(0%);
        opacity: 1;
        transform: scale(1.05);
    }

    /* Badge for partnership type */
    .partner-badge {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        padding: 0.4rem 1rem;
        background: white;
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 900;
        color: #202759;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        z-index: 10;
    }

    [dir="rtl"] .partner-badge {
        right: auto;
        left: 1.5rem;
    }

    /* Action Links */
    .partner-actions {
        margin-top: auto;
        padding-top: 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid #f1f5f9;
    }

    .partner-link {
        font-size: 0.85rem;
        font-weight: 800;
        color: #6f1616;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.3s ease;
    }

    .partner-link:hover {
        gap: 0.8rem;
        color: #202759;
    }

    @media (max-width: 768px) {
        .partner-grid { grid-template-columns: 1fr; }
        .partner-logo-box { height: 140px; }
    }
</style>

<section id="partnership-section" x-cloak
         class="relative py-32 overflow-hidden bg-white font-hacen">
    
    <!-- Background Connectivity Pattern -->
    <div class="absolute inset-0 opacity-[0.03] pointer-events-none -z-10" 
         style="background-image: radial-gradient(#202759 1px, transparent 1px); background-size: 40px 40px;"></div>

    <!-- Header Section -->
    <div class="container relative z-10 mx-auto px-6 mb-24 text-center">
        <div class="reveal reveal-up inline-flex items-center gap-3 mb-6">
            <span class="h-px w-10 bg-spu-red"></span>
            <span class="text-spu-red font-black tracking-widest text-sm uppercase"
                x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.eyebrowAr : $store.aboutPage.partnerships.eyebrowEn"></span>
            <span class="h-px w-10 bg-spu-red"></span>
        </div>
        
        <h2 class="reveal reveal-up reveal-delay-1 text-5xl md:text-7xl font-black text-spu-blue tracking-tighter leading-tight"
            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.titleAr : $store.aboutPage.partnerships.titleEn"></h2>
        
        <p class="reveal reveal-up reveal-delay-2 mt-8 text-xl text-slate-500 max-w-3xl mx-auto leading-relaxed"
            x-html="$store.app.currentLang === 'ar' ? $store.aboutPage.partnerships.summaryAr : $store.aboutPage.partnerships.summaryEn"></p>
    </div>

    <!-- Partners Grid -->
    <div class="container mx-auto px-6 relative z-10">
        <div class="partner-grid">
            <template x-for="(partner, index) in $store.aboutPage.partnerships.list" :key="index">
                <div class="reveal reveal-up" :class="`reveal-delay-${(index % 3) + 1}`">
                    <div class="partner-card">
                        <!-- Badge -->
                        <div class="partner-badge" x-text="$store.app.currentLang === 'ar' ? 'شريك استراتيجي' : 'Strategic Partner'"></div>
                        
                        <!-- Logo Box -->
                        <div class="partner-logo-box">
                            <img :src="partner.logo" :alt="partner.nameEn">
                        </div>

                        <!-- Content -->
                        <div class="flex flex-col grow">
                            <h3 class="text-xl font-black text-spu-blue mb-4 leading-tight group-hover:text-spu-red transition-colors"
                                x-text="$store.app.currentLang === 'ar' ? partner.nameAr : partner.nameEn"></h3>
                            
                            <p class="text-slate-500 text-sm leading-relaxed mb-6"
                                x-text="$store.app.currentLang === 'ar' ? partner.descAr : partner.descEn"></p>
                            
                            <!-- Actions -->
                            <div class="partner-actions">
                                <a :href="partner.newsLink" class="partner-link">
                                    <span x-text="$store.app.currentLang === 'ar' ? 'التفاصيل' : 'Details'"></span>
                                    <i class="fa-solid fa-arrow-right rtl:rotate-180"></i>
                                </a>
                                
                                <a :href="partner.website" target="_blank" class="text-slate-400 hover:text-spu-blue transition-colors">
                                    <i class="fa-solid fa-globe"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Pagination/CTA -->
        <div class="reveal reveal-up reveal-delay-4 mt-24 text-center">
            <div class="inline-flex items-center gap-6 p-2 pl-6 bg-slate-50 rounded-2xl border border-slate-100">
                <span class="text-slate-500 font-bold text-sm" 
                      x-text="$store.app.currentLang === 'ar' ? 'هل تريد استكشاف المزيد من الأخبار؟' : 'Want to explore more news?'"></span>
                <a href="/news.html" class="px-6 py-3 bg-white border border-slate-200 text-spu-blue font-black rounded-xl hover:bg-spu-blue hover:text-white transition-all shadow-sm">
                    <span x-text="$store.app.currentLang === 'ar' ? 'جميع الأخبار' : 'All News'"></span>
                </a>
            </div>
        </div>

        <!-- Back Link -->
        <div class="reveal reveal-up reveal-delay-5 mt-20 text-center">
            <a href="/about.html" 
               class="inline-flex items-center gap-3 px-10 py-4 bg-spu-blue text-white font-black rounded-2xl hover:bg-spu-red transition-all shadow-xl hover:shadow-spu-red/20 group">
                <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform rtl:rotate-180"></i>
                <span x-text="$store.app.currentLang === 'ar' ? 'العودة إلى نظرة عامة' : 'Back to Overview'"></span>
            </a>
        </div>
    </div>

    <!-- Decorative Elements -->
    <div class="absolute top-0 right-0 w-1/3 h-1/3 bg-radial from-spu-blue/5 to-transparent -z-10 blur-3xl"></div>
    <div class="absolute bottom-0 left-0 w-1/4 h-1/4 bg-radial from-spu-red/5 to-transparent -z-10 blur-3xl"></div>
</section>
