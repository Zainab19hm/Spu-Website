<style>
    /* Directorate Detail Styling */
    .detail-hero {
        background: linear-gradient(135deg, #202759 0%, #6f1616 100%);
        padding: 8rem 0;
        position: relative;
        overflow: hidden;
    }

    .detail-hero::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        opacity: 0.3;
    }

    .service-item {
        background: white;
        border: 1px solid #f1f5f9;
        border-radius: 2rem;
        padding: 2rem;
        transition: all 0.4s ease;
    }

    .service-item:hover {
        border-color: #6f1616;
        box-shadow: 0 20px 40px rgba(111, 22, 22, 0.05);
        transform: translateY(-5px);
    }

    .icon-circle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(111, 22, 22, 0.1);
        color: #6f1616;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
    }

    [dir="rtl"] .service-item i {
        transform: scaleX(-1);
    }
</style>

<div x-data="{ 
    directorate: $store.aboutPage.directorates.items.find(d => d.slug === $el.closest('[data-slug]').dataset.slug) 
}">
    <!-- Hero Section -->
    <section class="detail-hero">
        <div class="container mx-auto px-6 relative z-10 text-center">
            <div class="reveal reveal-up inline-block px-6 py-2 bg-white/10 backdrop-blur-md rounded-full text-white text-xs font-black uppercase tracking-widest mb-8">
                <span x-text="$store.app.currentLang === 'ar' ? 'المديريات المركزية' : 'Central Directorates'"></span>
            </div>
            <h1 class="reveal reveal-up reveal-delay-1 text-4xl md:text-6xl font-black text-white leading-tight mb-8"
                x-text="$store.app.currentLang === 'ar' ? directorate.titleAr : directorate.titleEn"></h1>
            <div class="reveal reveal-up reveal-delay-2 h-1 w-24 bg-white/30 mx-auto rounded-full"></div>
        </div>
    </section>

    <!-- Content Section -->
    <section class="py-24 bg-white">
        <div class="container mx-auto px-6 max-w-5xl">
            <div class="grid lg:grid-cols-5 gap-16">
                <!-- Main Description -->
                <div class="lg:col-span-3">
                    <h2 class="reveal reveal-up text-3xl font-black text-spu-blue mb-8"
                        x-text="$store.app.currentLang === 'ar' ? 'نظرة عامة' : 'Overview'"></h2>
                    <p class="reveal reveal-up reveal-delay-1 text-xl text-slate-600 leading-relaxed mb-12"
                       x-text="$store.app.currentLang === 'ar' ? directorate.descriptionAr : directorate.descriptionEn"></p>
                    
                    <h2 class="reveal reveal-up text-3xl font-black text-spu-blue mb-8"
                        x-text="$store.app.currentLang === 'ar' ? 'الخدمات الرئيسية' : 'Key Services'"></h2>
                    
                    <div class="grid sm:grid-cols-2 gap-6">
                        <template x-for="(service, idx) in directorate.services" :key="idx">
                            <div class="reveal reveal-up" :class="`reveal-delay-${idx + 1}`">
                                <div class="service-item h-full">
                                    <div class="icon-circle">
                                        <img src="/images/icon-check-circle-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
                                    </div>
                                    <h4 class="font-bold text-spu-blue text-lg"
                                        x-text="$store.app.currentLang === 'ar' ? service.ar : service.en"></h4>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Sidebar Info -->
                <div class="lg:col-span-2">
                    <div class="reveal reveal-right p-10 bg-slate-50 rounded-[3rem] border border-slate-100 sticky top-32">
                        <div class="w-20 h-20 bg-white rounded-3xl flex items-center justify-center text-3xl text-spu-red shadow-sm mb-8">
                            <img :src="directorate.icon" alt="" class="h-6 w-6" aria-hidden="true">
                        </div>
                        
                        <h3 class="text-xl font-black text-spu-blue mb-6 border-b border-slate-200 pb-4"
                            x-text="$store.app.currentLang === 'ar' ? 'معلومات التواصل' : 'Contact Information'"></h3>
                        
                        <ul class="space-y-6">
                            <li class="flex items-start gap-4">
                                <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-spu-blue shrink-0 shadow-sm">
                                    <img src="/images/icon-envelope-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
                                </div>
                                <div>
                                    <p class="text-xs font-black text-spu-red uppercase tracking-widest mb-1"
                                       x-text="$store.app.currentLang === 'ar' ? 'البريد الإلكتروني' : 'Email Address'"></p>
                                    <p class="text-spu-blue font-bold truncate" x-text="directorate.slug + '@spu.edu.sy'"></p>
                                </div>
                            </li>
                            <li class="flex items-start gap-4">
                                <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-spu-blue shrink-0 shadow-sm">
                                    <img src="/images/icon-map-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
                                </div>
                                <div>
                                    <p class="text-xs font-black text-spu-red uppercase tracking-widest mb-1"
                                       x-text="$store.app.currentLang === 'ar' ? 'الموقع' : 'Location'"></p>
                                    <p class="text-spu-blue font-bold" 
                                       x-text="$store.app.currentLang === 'ar' ? 'المبنى الرئيسي - الطابق الثاني' : 'Main Building - 2nd Floor'"></p>
                                </div>
                            </li>
                        </ul>

                        <div class="mt-12">
                            <a href="/contact.html" 
                               class="w-full inline-flex items-center justify-center gap-3 px-8 py-4 bg-spu-blue text-white font-black rounded-2xl hover:bg-spu-red transition-all shadow-lg hover:shadow-spu-red/20 group">
                                <span x-text="$store.app.currentLang === 'ar' ? 'تواصل معنا' : 'Contact Us'"></span>
                                <img src="/images/icon-arrow-right-outline.svg" alt="" class="h-4 w-4 transition-transform group-hover:translate-x-1 rtl:rotate-180" aria-hidden="true">
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Navigation Back -->
            <div class="reveal reveal-up reveal-delay-4 mt-24 pt-12 border-t border-slate-100 text-center">
                <a href="/about/directorates.html" 
                   class="inline-flex items-center gap-3 text-spu-blue font-black hover:text-spu-red transition-colors group">
                    <img src="/images/icon-chevron-left-outline.svg" alt="" class="h-4 w-4 transition-transform group-hover:-translate-x-1 rtl:rotate-180" aria-hidden="true">
                    <span x-text="$store.app.currentLang === 'ar' ? 'العودة إلى جميع المديريات' : 'Back to All Directorates'"></span>
                </a>
            </div>
        </div>
    </section>
</div>
