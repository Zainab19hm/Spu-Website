<style>
    /* Directorates Design System */
    .directorate-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 3rem;
    }

    .directorate-card {
        background: white;
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 3rem;
        padding: 3rem 2.5rem;
        transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    .directorate-card:hover {
        transform: translateY(-12px);
        box-shadow: 0 40px 80px -20px rgba(32, 39, 89, 0.15);
        border-color: rgba(111, 22, 22, 0.2);
    }

    .directorate-icon-box {
        width: 80px;
        height: 80px;
        background: #f8fafc;
        border-radius: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2.5rem;
        font-size: 2rem;
        color: #202759;
        transition: all 0.5s ease;
    }

    .directorate-card:hover .directorate-icon-box {
        background: #6f1616;
        color: white;
        transform: rotate(-10deg) scale(1.1);
        box-shadow: 0 15px 30px rgba(111, 22, 22, 0.2);
    }

    .view-details-btn {
        margin-top: auto;
        padding-top: 2rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-weight: 800;
        font-size: 0.9rem;
        color: #6f1616;
        transition: all 0.3s ease;
    }

    .directorate-card:hover .view-details-btn {
        gap: 1.25rem;
        color: #202759;
    }

    /* Abstract background pattern for cards */
    .directorate-card::after {
        content: '';
        position: absolute;
        top: -50px;
        right: -50px;
        width: 150px;
        height: 150px;
        background: radial-gradient(circle, rgba(32, 39, 89, 0.02) 0%, transparent 70%);
        border-radius: 50%;
        z-index: 0;
    }

    @media (max-width: 768px) {
        .directorate-grid { grid-template-columns: 1fr; }
        .directorate-card { padding: 2rem; }
    }
</style>

<section id="directorates-section" x-cloak
         class="relative py-32 overflow-hidden bg-white font-hacen">
    
    <!-- Header Section -->
    <div class="container relative z-10 mx-auto px-6 mb-24 text-center">
        <div class="reveal reveal-up inline-flex items-center gap-3 mb-6">
            <span class="h-px w-10 bg-spu-red"></span>
            <span class="text-spu-red font-black tracking-widest text-sm uppercase"
                x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.directorates.eyebrowAr : $store.aboutPage.directorates.eyebrowEn"></span>
            <span class="h-px w-10 bg-spu-red"></span>
        </div>
        
        <h2 class="reveal reveal-up reveal-delay-1 text-5xl md:text-7xl font-black text-spu-blue tracking-tighter leading-tight"
            x-text="$store.app.currentLang === 'ar' ? $store.aboutPage.directorates.titleAr : $store.aboutPage.directorates.titleEn"></h2>
    </div>

    <!-- Directorates Grid -->
    <div class="container mx-auto px-6 relative z-10">
        <div class="directorate-grid">
            <template x-for="(item, index) in $store.aboutPage.directorates.items" :key="index">
                <div class="reveal reveal-up" :class="`reveal-delay-${(index % 4) + 1}`">
                    <a :href="`/about/directorates/${item.slug}.html`" class="directorate-card group">
                        <!-- Icon -->
                        <div class="directorate-icon-box">
                            <img :src="item.icon" alt="" class="h-6 w-6" aria-hidden="true">
                        </div>

                        <!-- Content -->
                        <h3 class="text-2xl font-black text-spu-blue mb-4 leading-tight group-hover:text-spu-red transition-colors"
                            x-text="$store.app.currentLang === 'ar' ? item.titleAr : item.titleEn"></h3>
                        
                        <p class="text-slate-500 leading-relaxed mb-8"
                            x-text="$store.app.currentLang === 'ar' ? item.summaryAr : item.summaryEn"></p>
                        
                        <!-- Action -->
                        <div class="view-details-btn">
                            <span x-text="$store.app.currentLang === 'ar' ? 'عرض التفاصيل' : 'View Details'"></span>
                            <img src="/images/icon-arrow-right-outline.svg" alt="" class="h-4 w-4 rtl:rotate-180" aria-hidden="true">
                        </div>
                    </a>
                </div>
            </template>
        </div>

        <!-- Back Link -->
        <div class="reveal reveal-up reveal-delay-5 mt-20 text-center">
            <a href="/about.html" 
               class="inline-flex items-center gap-3 px-10 py-4 bg-spu-blue text-white font-black rounded-2xl hover:bg-spu-red transition-all shadow-xl hover:shadow-spu-red/20 group">
                <img src="/images/icon-arrow-left-outline.svg" alt="" class="h-4 w-4 transition-transform group-hover:-translate-x-1 rtl:rotate-180" aria-hidden="true">
                <span x-text="$store.app.currentLang === 'ar' ? 'العودة إلى نظرة عامة' : 'Back to Overview'"></span>
            </a>
        </div>
    </div>

    <!-- Decorative Elements -->
    <div class="absolute top-0 left-0 w-1/3 h-1/3 bg-radial from-spu-red/5 to-transparent -z-10 blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-1/4 h-1/4 bg-radial from-spu-blue/5 to-transparent -z-10 blur-3xl"></div>
</section>
