<!-- About — Explore More navigation cards -->
<section id="about-navigation" class="relative bg-section py-20 font-hacen lg:py-28" x-data>
    <div class="container relative z-10">
        <div class="flex flex-col items-start gap-14 lg:flex-row lg:items-center lg:gap-20">

            <!-- Left: title -->
            <div class="w-full shrink-0 lg:w-[38%]">
                <p class="text-sm font-bold uppercase tracking-[0.2em] text-spu-blue/40"
                   x-text="$store.app.currentLang === 'ar' ? 'استكشف' : 'Discover'"></p>

                <h3 class="mt-4 text-4xl font-bold leading-tight text-spu-blue lg:text-5xl">
                    <template x-if="$store.app.currentLang === 'ar'">
                        <span>استكشف المزيد عن <span class="text-spu-red">الجامعة</span></span>
                    </template>
                    <template x-if="$store.app.currentLang !== 'ar'">
                        <span>Learn More About <span class="text-spu-red">SPU</span></span>
                    </template>
                </h3>

                <p class="mt-4 max-w-[400px] text-base leading-relaxed text-slate-400"
                   x-text="$store.app.currentLang === 'ar'
                       ? 'تعرّف على رؤيتنا ورسالتنا وتاريخنا وقيادتنا ومديرياتنا وشراكاتنا الأكاديمية.'
                       : 'Explore our vision, mission, history, leadership, directorates, and academic partnerships.'">
                </p>

                <div class="mt-6 h-[3px] w-16 rounded-full bg-spu-red/50"></div>
            </div>

            <!-- Right: 2×2 card grid -->
            <div class="w-full flex-1">
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">
                    <template x-for="(sub, idx) in $store.aboutPage.subPages" :key="sub.id">
                        <a :href="sub.link"
                           @click="$store.aboutPage.navigate($event, sub.id)"
                           class="group relative flex flex-col justify-between overflow-hidden rounded-2xl bg-white p-7 shadow-[0_4px_24px_rgba(0,0,0,0.05)] transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_16px_48px_rgba(0,0,0,0.1)]">

                            <!-- Top row: icon + arrow -->
                            <div class="flex items-start justify-between">
                                <!-- Icon circle -->
                                <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-spu-blue/5 transition-colors duration-300 group-hover:bg-spu-blue">
                                    <img :src="sub.id === 'vision-mission' ? '/images/icon-sitemap-outline.svg' : sub.id === 'history' ? '/images/icon-history-outline.svg' : sub.id === 'leadership' ? '/images/icon-users-outline.svg' : sub.id === 'directorates' ? '/images/icon-sitemap-outline.svg' : '/images/icon-handshake-outline.svg'" alt="" class="h-5 w-5 transition duration-300 group-hover:brightness-0 group-hover:invert" aria-hidden="true">
                                </div>
                                <!-- Arrow -->
                                <div class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-50 text-slate-300 transition-all duration-300 group-hover:bg-spu-red group-hover:text-white">
                                    <img src="/images/icon-arrow-right-outline.svg" alt="" class="h-3 w-3" :class="$store.app.currentLang === 'ar' ? 'rotate-180' : ''" aria-hidden="true">
                                </div>
                            </div>

                            <!-- Title -->
                            <h4 class="mt-6 text-xl font-bold text-spu-blue"
                                x-text="$store.app.currentLang === 'ar' ? sub.titleAr : sub.titleEn">
                            </h4>

                            <!-- Bottom accent line -->
                            <div class="mt-5 h-[2.5px] w-0 rounded-full bg-spu-red transition-all duration-500 group-hover:w-12"></div>
                        </a>
                    </template>
                </div>
            </div>

        </div>
    </div>
</section>
