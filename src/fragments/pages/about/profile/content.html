<section x-cloak
         x-data="{
            selectedId: '',
            init() {
                this.updateFromUrl();
                // Watch for URL changes (browser back/forward)
                window.addEventListener('popstate', () => this.updateFromUrl());
            },
            updateFromUrl() {
                const urlParams = new URLSearchParams(window.location.search);
                const newId = urlParams.get('slug') || urlParams.get('id') || 'rector';
                this.selectedId = newId;
                console.log('Profile loaded:', this.selectedId);
            },
            localize(item, key) {
                const suffix = $store.app.currentLang === 'ar' ? 'Ar' : 'En';
                return item?.[`${key}${suffix}`] || item?.[`${key}En`] || item?.[key] || '';
            },
            get profiles() {
                const leadership = $store.aboutPage.leadership || {};
                const items = [];
                if (leadership.rector) items.push({ ...leadership.rector, group: 'leadership', index: 0 });
                (leadership.vicePresidents || []).forEach((item, index) => items.push({ ...item, group: 'leadership', index: index + 1 }));
                (leadership.deans || []).forEach((item, index) => items.push({ ...item, group: 'leadership', index: index + 20 }));
                const staff = ($store.aboutPage.staffDirectory?.staff || []);
                staff.forEach((person, index) => items.push({ ...person, group: 'staff', index: index + 100 }));
                return items;
            },
            get profile() {
                return this.profiles.find((item) => item.slug === this.selectedId) || this.profiles[0] || {};
            },
            get pageTitle() { return this.localize(this.profile, 'name'); },
            get pageRole() { return this.localize(this.profile, 'role'); },
            get pageDepartment() {
                const faculty = this.profile.faculty || {};
                return this.localize(faculty, 'name') || this.localize(this.profile, 'department');
            },
            get pageOffice() {
                const office = this.profile.office || {};
                return this.isAr
                    ? (office.fullAddress || office.fullAddressEn || '')
                    : (office.fullAddressEn || office.fullAddress || '');
            },
            get biography() { 
                return this.isAr 
                    ? (this.profile.biography || [])
                    : (this.profile.biographyEn || this.profile.biography || []);
            },
            get education() { 
                return this.isAr 
                    ? (this.profile.education || [])
                    : (this.profile.educationEn || this.profile.education || []);
            },
            get researchStats() { return this.profile.researchStats || {}; },
            get courses() { return this.profile.courses || []; },
            get hasExtendedData() { 
                return (this.profile.biography && this.profile.biography.length > 0)
                    || (this.profile.biographyEn && this.profile.biographyEn.length > 0)
                    || (this.profile.education && this.profile.education.length > 0)
                    || (this.profile.courses && this.profile.courses.length > 0)
                    || this.profile.email
                    || this.profile.phone;
            },
            get isAr() { return $store.app.currentLang === 'ar'; },
            courseName(course) {
                return this.isAr ? (course.nameAr || course.nameEn) : (course.nameEn || course.nameAr);
            },
            courseHref(course) {
                const slug = this.profile.faculty?.slug;
                const validSlugs = ['medicine','dentistry','pharmacy','artificial-intelligence','business-administration','petroleum','building-construction-engineering'];
                if (!slug || !validSlugs.includes(slug)) return '#';
                const params = new URLSearchParams();
                params.set('department', course.departmentId || '');
                params.set('course', course.id || '');
                return `/facilities/${slug}/study-plan/course/?${params.toString()}`;
            }
         }"
         class="font-hacen">

                                            <span class="block text-[11px] font-bold uppercase tracking-[0.12em] text-slate-400"
                                                x-text="course.code"></span>
                                            <h4 class="text-[0.9375rem] font-bold text-spu-blue truncate mt-0.5" x-text="courseName(course)">
                                            </h4>
                                        </div>
                                        <div class="text-spu-blue/30 transition-all group-hover:text-spu-red">
                                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                                            </svg>
                                        </div>
                                    </a>
                                </template>
                            </div>
                        </div>
                   
                    </aside>

                    <!-- Main Content -->
                    <main class="flex flex-col gap-10">
                        <!-- Biography Section -->
                        <div class="bg-white rounded-2xl p-6 md:p-10 border border-spu-blue/[0.08] shadow-[0_4px_24px_rgba(32,39,89,0.06)]" x-show="biography.length > 0">
                            <h2 class="flex items-center justify-between flex-wrap gap-2 text-lg font-bold text-spu-blue mb-5 pb-3 border-b border-spu-blue/[0.08]" 
                                x-text="isAr ? 'نبذة مهنية' : 'Professional Biography'"></h2>
                            <div class="text-[0.9375rem] leading-[1.8] text-spu-blue/75 space-y-4">
                                <template x-for="(paragraph, index) in biography" :key="index">
                                    <p x-text="paragraph"></p>
                                </template>
                            </div>
                        </div>

                        <!-- Education Section -->
                        <div class="bg-white rounded-2xl p-6 md:p-10 border border-spu-blue/[0.08] shadow-[0_4px_24px_rgba(32,39,89,0.06)]" x-show="education.length > 0">
                            <h2 class="flex items-center justify-between flex-wrap gap-2 text-lg font-bold text-spu-blue mb-5 pb-3 border-b border-spu-blue/[0.08]" 
                                x-text="isAr ? 'الشهادات العلمية' : 'Education'"></h2>
                            <div class="flex flex-col gap-5">
                                <template x-for="(edu, index) in education" :key="index">
                                    <div class="flex gap-4 relative">
                                        <div class="w-2.5 h-2.5 rounded-full bg-spu-red mt-2 shrink-0"></div>
                                        <div class="flex-1">
                                            <h4 class="text-[0.9375rem] font-bold text-spu-blue mb-1" x-text="edu.degree"></h4>
                                            <p class="text-sm text-spu-blue/60 mb-1" x-text="edu.institution"></p>
                                            <span class="inline-flex items-center px-2 py-0.5 bg-spu-blue/[0.06] rounded text-xs font-semibold text-spu-blue" x-text="edu.year"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Research Section -->
                        <div class="bg-white rounded-2xl p-6 md:p-10 border border-spu-blue/[0.08] shadow-[0_4px_24px_rgba(32,39,89,0.06)]" x-show="profile.publications && profile.publications.length > 0">
                            <h2 class="flex items-center justify-between flex-wrap gap-2 text-lg font-bold text-spu-blue mb-5 pb-3 border-b border-spu-blue/[0.08]">
                                <span x-text="isAr ? 'الأبحاث المنشورة' : 'Published Researches'"></span>
                                <a :href="profile.scholarUrl" target="_blank" rel="noopener"
                                   class="inline-flex items-center gap-1.5 text-xs font-semibold text-spu-red hover:text-spu-blue transition-colors"
                                   x-show="profile.scholarUrl">
                                    <span x-text="isAr ? 'عرض الكل على Google Scholar' : 'View all on Google Scholar'"></span>
                                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                                </a>
                            </h2>
                            <div class="flex flex-col gap-5">
                                <template x-for="(pub, index) in profile.publications" :key="index">
                                    <div class="p-5 bg-spu-blue/[0.03] rounded-xl border border-spu-blue/[0.06] transition-all hover:bg-white hover:border-spu-blue/[0.15] hover:shadow-[0_8px_24px_rgba(32,39,89,0.1)] hover:-translate-y-0.5 group">
                                        <a :href="pub.links?.local || '#'" class="block mb-3">
                                            <div class="flex items-start justify-between gap-4 mb-2">
                                                <h4 class="text-[0.9375rem] font-semibold text-spu-blue leading-[1.5] flex-1 group-hover:text-spu-red transition-colors" x-text="pub.title"></h4>
                                                <span class="shrink-0 px-2 py-1 bg-spu-red text-white text-xs font-bold rounded" x-text="pub.year"></span>
                                            </div>
                                            <p class="text-sm text-spu-blue/60 italic" x-text="pub.journal"></p>
                                        </a>
                                        <div class="flex items-center gap-4">
                                            <a :href="pub.links?.local || '#'" class="inline-flex items-center gap-1.5 text-sm font-semibold text-spu-blue hover:text-spu-red transition-colors">
                                                <span x-text="isAr ? 'عرض التفاصيل' : 'View Details'"></span>
                                                <svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                            </a>
                                            <a :href="pub.links?.scholar || profile.scholarUrl" target="_blank" rel="noopener"
                                               class="inline-flex items-center gap-1.5 text-sm font-semibold text-[#4285f4] hover:text-[#3367d6] transition-colors"
                                               x-show="pub.links?.scholar || profile.scholarUrl">
                                                <svg class="h-3 w-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 24a7 7 0 1 1 0-14 7 7 0 0 1 0 14Zm0-24L0 9.5l4.838 3.94A8 8 0 0 1 12 9a8 8 0 0 1 7.162 4.44L24 9.5 12 0Z"/></svg>
                                                <span>Google Scholar</span>
                                            </a>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Courses Section -->
                        
                    </main>
                </div>
            </div>
        </div>
    </template>

  
</section>
