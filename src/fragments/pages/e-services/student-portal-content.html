<section id="e-services-student-portal" x-data class="bg-white py-20 font-hacen lg:py-24">
    <div class="container">
        <div class="max-w-3xl">
            <p class="text-sm font-bold uppercase tracking-[0.35em] text-spu-red/70"

            <h1 class="mt-5 text-3xl font-bold leading-tight text-spu-blue md:text-4xl"

            <article class="rounded-[30px] bg-spu-blue p-8 text-white shadow-[0_24px_70px_rgba(20,30,70,0.16)]">

                <a href="https://cms.spu.edu.sy" target="_blank" rel="noopener noreferrer"

                    <span x-text="$store.app.currentLang === 'ar' ? 'الدخول إلى البوابة' : 'Go to Student Gate'"></span>

                    <div class="flex gap-4 rounded-[20px] bg-section px-5 py-4">

                        <div>
                            <p class="text-[15px] font-medium text-slate-700"
                                x-text="$store.app.currentLang === 'ar' ? 'استلم رقمك الجامعي وكلمة المرور المؤقتة من شؤون الطلاب' : 'Receive your student ID and temporary password from Student Affairs'">
                            </p>
                        </div>
                    </div>
                    <div class="flex gap-4 rounded-[20px] bg-section px-5 py-4">
                        <span
                            class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-spu-blue text-sm font-bold text-white">2</span>
                        <div>
                            <p class="text-[15px] font-medium text-slate-700"
                                x-text="$store.app.currentLang === 'ar' ? 'سجّل الدخول باستخدام رقمك الجامعي وغيّر كلمة المرور فوراً' : 'Log in with your student ID and change your password immediately'">
                            </p>
                        </div>
                    </div>
                    <div class="flex gap-4 rounded-[20px] bg-section px-5 py-4">

                        <div>
                            <p class="text-[15px] font-medium text-slate-700"

                            </p>
                        </div>
                    </div>
                    <div class="flex gap-4 rounded-[20px] bg-section px-5 py-4">

                        <div>
                            <p class="text-[15px] font-medium text-slate-700"
                                x-text="$store.app.currentLang === 'ar' ? 'استعرض جدولك الزمني وعلاماتك ورسومك من لوحة القيادة' : 'View your schedule, grades, and fees from the dashboard'">
                            </p>
                        </div>
                    </div>
                </div>
            </article>
        </div>
