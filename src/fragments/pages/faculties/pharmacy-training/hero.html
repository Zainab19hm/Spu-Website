<section class="relative flex min-h-[330px] items-end overflow-hidden pt-28 font-hacen"
    x-data="{ get content() { return $store.pharmacyTrainingPage }, get isAr() { return $store.app.currentLang === 'ar' } }">
    <div class="absolute inset-0">
        <img :src="content.hero.image" alt="SPU pharmacy training campus" class="h-full w-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-spu-blue via-spu-blue/72 to-spu-blue/22"></div>
    </div>

    <div class="container  z-10 pb-10 text-center text-white">
        <nav class="mb-4 flex items-center justify-center gap-2 text-[11px] font-semibold text-white/75">
            <a href="/" class="transition-colors hover:text-white" x-text="isAr ? content.breadcrumb.homeAr : content.breadcrumb.homeEn"></a>
            <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2 w-2 rtl:rotate-180" aria-hidden="true">
            <a href="/facilities/" class="transition-colors hover:text-white"
                x-text="isAr ? content.breadcrumb.facilitiesAr : content.breadcrumb.facilitiesEn"></a>
            <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2 w-2 rtl:rotate-180" aria-hidden="true">
            <a href="/facilities/?id=pharmacy" class="transition-colors hover:text-white"
                x-text="isAr ? content.breadcrumb.pharmacyAr : content.breadcrumb.pharmacyEn"></a>
        </nav>

        <div class="mx-auto absolute z-50 bottom-[-50px] left-1/2 transform -translate-x-1/2 max-w-[620px] bg-spu-blue px-6 py-8 shadow-[0_18px_46px_rgba(0,0,0,0.18)] sm:px-10">
            <p class="text-[11px] font-bold uppercase tracking-[0.18em] text-white/70"
                x-text="isAr ? content.hero.eyebrowAr : content.hero.eyebrowEn"></p>
            <h1 class="mt-3 text-[28px] font-bold leading-tight md:text-[34px]"
                x-text="isAr ? content.hero.titleAr : content.hero.titleEn"></h1>
            <p class="mx-auto mt-4 max-w-[520px] text-[13px] font-semibold leading-6 text-white/78"
                x-text="isAr ? content.hero.summaryAr : content.hero.summaryEn"></p>
        </div>
    </div>
</section>
