<section class="bg-white pb-16 font-hacen"
    x-data="{ get partners() { return $store.pharmacyTrainingPage.partners }, get isAr() { return $store.app.currentLang === 'ar' } }">
    <div class="container">
        <div class="mb-7 flex items-center justify-between gap-4">
            <h2 class="text-[24px] font-bold text-spu-blue" x-text="isAr ? partners.titleAr : partners.titleEn"></h2>
            <a :href="partners.ctaUrl" class="inline-flex items-center gap-2 text-[12px] font-bold text-spu-blue transition-colors hover:text-spu-red">
                <span x-text="isAr ? partners.ctaAr : partners.ctaEn"></span>
                <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-3 w-3 rtl:rotate-180" aria-hidden="true">
            </a>
        </div>

        <div class="grid gap-5 md:grid-cols-2 lg:grid-cols-3">
            <template x-for="item in partners.items" :key="item.id">
                <a :href="item.href" class="group overflow-hidden border border-slate-200 bg-white shadow-[0_8px_26px_rgba(15,23,42,0.05)] transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_18px_44px_rgba(15,23,42,0.12)]">
                    <div class="h-[155px] overflow-hidden">
                        <img :src="item.image" :alt="isAr ? item.titleAr : item.titleEn" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
                    </div>
                    <div class="p-5">
                        <h3 class="text-[15px] font-bold text-spu-blue" x-text="isAr ? item.titleAr : item.titleEn"></h3>
                        <div class="mt-3 flex items-center gap-2 text-[11px] font-semibold text-slate-500">
                            <span class="h-1.5 w-1.5 rounded-full bg-spu-blue"></span>
                            <span x-text="isAr ? item.categoryAr : item.categoryEn"></span>
                        </div>
                        <p class="mt-3 text-[12px] font-semibold leading-5 text-slate-500" x-text="isAr ? item.descriptionAr : item.descriptionEn"></p>
                    </div>
                </a>
            </template>
        </div>
    </div>
</section>
