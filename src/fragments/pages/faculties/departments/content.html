<div class="font-hacen" x-data="{
    get copy() {
        return $store.facultiesPage.pageContent.departments;
    },
    get current() {
        const pages = $store.facultiesPage.pageContent.departmentPages || {};
        return pages[document.body?.dataset.page] || pages[this.copy.fallbackPage];
    },
    get isAr() {
        return $store.app.currentLang === 'ar';
    },
    get facultyName() {
        return this.isAr ? this.current.facultyAr : this.current.facultyEn;
    },
    get summary() {
        return this.isAr ? this.current.summaryAr : this.current.summaryEn;
    },
    localized(item, key) {
        return this.isAr ? (item?.[`${key}Ar`] || item?.[`${key}En`] || '') : (item?.[`${key}En`] || item?.[`${key}Ar`] || '');
    }
}">
    <section class="relative flex min-h-[330px] items-end overflow-hidden pt-28">
        <div class="absolute inset-0">
            <img :src="current.heroImage" alt="" class="h-full w-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-spu-blue/95 via-spu-blue/65 to-spu-blue/15"></div>
        </div>

        <div class="container relative z-10 pb-14 text-center text-white">
            <nav class="mb-3 flex items-center justify-center gap-2 text-[11px] font-semibold text-white/72">
                <a href="/" class="transition-colors hover:text-white" x-text="localized(copy, 'home')"></a>
                <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2 w-2 rtl:rotate-180" aria-hidden="true">
                <span x-text="facultyName"></span>
                <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2 w-2 rtl:rotate-180" aria-hidden="true">
                <span class="text-white" x-text="localized(copy, 'title')"></span>
            </nav>

            <h1 class="text-[34px] font-bold leading-tight md:text-[42px]" x-text="localized(copy, 'title')"></h1>
            <p class="mx-auto mt-4 max-w-[760px] text-sm font-semibold leading-7 text-white/82" x-text="summary"></p>
        </div>
    </section>

    <section class="bg-white py-16 lg:py-24">
        <div class="container">
            <div class="mx-auto grid max-w-[1080px] gap-4 sm:grid-cols-3">
                <template x-for="stat in current.stats" :key="stat.labelEn">
                    <div class="rounded-[8px] bg-section p-6 text-center">
                        <p class="text-3xl font-bold" :style="`color: ${current.accent}`" x-text="stat.value"></p>
                        <p class="mt-2 text-xs font-bold uppercase tracking-[0.16em] text-spu-blue/45"
                           x-text="localized(stat, 'label')"></p>
                    </div>
                </template>
            </div>

            <div class="mx-auto mt-12 max-w-[1080px] divide-y divide-slate-100 overflow-hidden rounded-[8px] border border-slate-100 bg-white shadow-[0_12px_40px_rgba(9,17,68,0.06)]">
                <template x-for="department in current.departments" :key="department.code">
                    <article class="grid gap-5 p-6 md:grid-cols-[80px_1fr_auto] md:items-center md:p-8">
                        <div class="text-[32px] font-bold leading-none text-spu-red/80" x-text="department.code"></div>

                        <div>
                            <div class="flex flex-wrap items-center gap-3">
                                <h2 class="text-xl font-bold text-spu-blue" x-text="localized(department, 'name')"></h2>
                                <span class="rounded-full bg-section px-3 py-1 text-[11px] font-bold uppercase tracking-[0.12em] text-spu-blue/55"
                                      x-text="localized(department, 'degrees')"></span>
                            </div>
                            <p class="mt-3 max-w-[720px] text-sm leading-7 text-slate-600"
                               x-text="localized(department, 'desc')"></p>
                            <div class="mt-4 flex flex-wrap gap-2">
                                <template x-for="tag in department.tags" :key="department.code + tag">
                                    <span class="rounded-full border border-slate-200 px-3 py-1 text-xs font-semibold text-slate-500" x-text="tag"></span>
                                </template>
                            </div>
                        </div>

                        <a :href="copy.admissionsHref"
                           class="inline-flex h-11 items-center justify-center rounded-[6px] px-5 text-sm font-bold text-white transition-all hover:-translate-y-0.5"
                           :style="`background-color: ${current.accent}`"
                           x-text="localized(copy, 'admissions')"></a>
                    </article>
                </template>
            </div>
        </div>
    </section>
</div>
