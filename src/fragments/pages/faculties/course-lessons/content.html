<section class="relative flex min-h-[330px] items-end justify-center overflow-hidden pt-28 font-hacen text-center"
         x-data="{ get page() { return $store.courseLessonsPage }, get course() { return this.page.course() }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="absolute inset-0">
    <img :src="page.current?.heroImage || '/images/uni-main-place.JPG'" alt="" class="h-full w-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-t from-spu-blue/95 via-spu-blue/72 to-spu-blue/18"></div>
  </div>

  <div class="container relative z-10 pb-14 text-white">
    <nav class="mb-4 flex flex-wrap items-center justify-center gap-2 text-[11px] font-semibold text-white/75">
      <a href="/" class="transition-colors hover:text-white" x-text="page.label('home')"></a>
      <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2 w-2 rtl:rotate-180" aria-hidden="true">
      <a href="/facilities/" class="transition-colors hover:text-white" x-text="page.label('faculties')"></a>
      <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2 w-2 rtl:rotate-180" aria-hidden="true">
      <a :href="page.studyPlanHref()" class="transition-colors hover:text-white" x-text="page.label('studyPlan')"></a>
      <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2 w-2 rtl:rotate-180" aria-hidden="true">
      <span x-text="course?.code || page.label('coursePage')"></span>
    </nav>

    <template x-if="course">
      <div class="mx-auto max-w-4xl">
        <p class="text-[12px] font-bold uppercase tracking-[0.16em] text-white/75"
           x-text="`${page.text(page.current, 'faculty')} / ${page.text(page.activeDepartment(), 'name')}`"></p>
        <h1 class="mt-3 text-[34px] font-bold leading-tight md:text-[46px]"
            x-text="page.text(course, 'title')"></h1>
        <p class="mt-4 max-w-[760px] mx-auto text-sm font-semibold leading-7 text-white/82"
           x-text="page.text(course, 'description')"></p>
      </div>
    </template>

    <template x-if="!course">
      <h1 class="text-[34px] font-bold leading-tight md:text-[46px]" x-text="page.label('notFound')"></h1>
    </template>
  </div>
</section>

<section class="bg-white py-14 font-hacen lg:py-20"
         x-data="{ get page() { return $store.courseLessonsPage }, get course() { return this.page.course() }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container">
    <template x-if="course">
      <div class="grid gap-8 lg:grid-cols-[0.78fr_1.22fr] lg:items-start">
        <aside class="rounded-[8px] border border-slate-200 bg-white p-6 shadow-[0_18px_44px_rgba(9,17,68,0.07)] lg:sticky lg:top-28">
          <a :href="page.studyPlanHref()"
             class="inline-flex items-center gap-2 text-[12px] font-bold text-spu-red transition hover:text-spu-blue">
            <img src="/images/icon-arrow-left-outline.svg" alt="" class="h-3 w-3 rtl:rotate-180" aria-hidden="true">
            <span x-text="page.label('backToPlan')"></span>
          </a>

          <div class="mt-6 rounded-[8px] bg-section p-5">
            <p class="text-[12px] font-bold uppercase tracking-[0.14em] text-slate-400" x-text="course.code"></p>
            <h2 class="mt-2 text-[24px] font-bold leading-tight text-spu-blue" x-text="page.text(course, 'title')"></h2>
          </div>

          <dl class="mt-5 grid grid-cols-2 gap-3 text-[11px] font-bold uppercase">
            <div class="rounded-[6px] border border-slate-100 bg-white p-3">
              <dt class="text-slate-400" x-text="page.label('credits')"></dt>
              <dd class="mt-1 text-lg text-spu-blue" x-text="course.credits"></dd>
            </div>
            <div class="rounded-[6px] border border-slate-100 bg-white p-3">
              <dt class="text-slate-400" x-text="page.label('courseType')"></dt>
              <dd class="mt-1 text-[13px] text-spu-blue" x-text="page.typeLabel(course)"></dd>
            </div>
            <div class="col-span-2 rounded-[6px] border border-slate-100 bg-white p-3">
              <dt class="text-slate-400" x-text="page.label('requiredStatus')"></dt>
              <dd class="mt-1 text-[13px] text-spu-blue" x-text="course.required ? page.label('required') : page.label('elective')"></dd>
            </div>
            <template x-if="course.instructor">
              <a :href="page.instructorHref(course)"
                 class="col-span-2 rounded-[6px] border border-slate-100 bg-white p-3 transition hover:border-spu-blue hover:bg-spu-blue/5">
                <dt class="text-slate-400" x-text="isAr ? 'المدرس' : 'Instructor'"></dt>
                <dd class="mt-1 flex items-center gap-2 text-[13px] font-bold text-spu-blue">
                  <img src="/images/icon-user-graduate-outline.svg" alt="" class="h-4 w-4" aria-hidden="true">
                  <span x-text="isAr ? course.instructor.nameAr : course.instructor.nameEn"></span>
                </dd>
              </a>
            </template>
          </dl>
        </aside>

        <div class="space-y-8">
          <section class="rounded-[8px] border border-slate-200 bg-white p-6 shadow-sm md:p-7">
            <div class="flex flex-col gap-5 md:flex-row md:items-start md:justify-between">
              <div>
                <h2 class="text-[24px] font-bold text-spu-blue" x-text="page.label('prerequisites')"></h2>
                <p class="mt-2 text-[13px] font-semibold leading-6 text-slate-500" x-text="page.label('opensAfter')"></p>
              </div>
            </div>

            <div class="mt-6 grid gap-4 md:grid-cols-2">
              <div>
                <h3 class="text-[13px] font-bold uppercase tracking-[0.12em] text-slate-400" x-text="page.label('prerequisites')"></h3>
                <div class="mt-3 grid gap-2">
                  <template x-for="item in page.prerequisites()" :key="item.id">
                    <a :href="page.courseHref(item.id)"
                       class="rounded-[6px] border border-slate-200 bg-section p-4 transition hover:border-spu-blue hover:bg-white">
                      <span class="block text-[11px] font-bold uppercase text-slate-400" x-text="item.code"></span>
                      <span class="mt-1 block text-[14px] font-bold text-spu-blue" x-text="page.text(item, 'title')"></span>
                    </a>
                  </template>
                  <p x-show="page.prerequisites().length === 0" class="text-[13px] font-semibold text-slate-500" x-text="page.label('emptyLinks')"></p>
                </div>
              </div>

              <div>
                <h3 class="text-[13px] font-bold uppercase tracking-[0.12em] text-slate-400" x-text="page.label('opensAfter')"></h3>
                <div class="mt-3 grid gap-2">
                  <template x-for="item in page.openedCourses()" :key="item.id">
                    <a :href="page.courseHref(item.id)"
                       class="rounded-[6px] border border-slate-200 bg-section p-4 transition hover:border-spu-blue hover:bg-white">
                      <span class="block text-[11px] font-bold uppercase text-slate-400" x-text="item.code"></span>
                      <span class="mt-1 block text-[14px] font-bold text-spu-blue" x-text="page.text(item, 'title')"></span>
                    </a>
                  </template>
                  <p x-show="page.openedCourses().length === 0" class="text-[13px] font-semibold text-slate-500" x-text="page.label('emptyLinks')"></p>
                </div>
              </div>
            </div>
          </section>

          <section class="rounded-[8px] border border-slate-200 bg-white p-6 shadow-sm md:p-7">
            <div class="mb-6 flex items-center justify-between">
              <h2 class="text-[24px] font-bold text-spu-blue" x-text="page.label('lessons')"></h2>
              <div class="flex flex-wrap gap-2">
                <template x-for="type in page.availableTypes()" :key="type.id">
                  <button type="button"
                          @click="page.selectedType = type.id"
                          class="rounded-full px-3 py-1 text-[11px] font-bold uppercase tracking-wide transition"
                          :class="page.selectedType === type.id ? 'bg-spu-blue text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'">
                    <span x-text="isAr ? type.labelAr : type.labelEn"></span>
                  </button>
                </template>
              </div>
            </div>

            <div class="space-y-4">
              <template x-for="lesson in page.filteredLessons()" :key="lesson.id">
                <div class="group rounded-[8px] border border-slate-200 bg-section p-5 transition hover:border-spu-blue/30 hover:bg-white">
                  <div class="flex items-start justify-between gap-4">
                    <div class="flex-1">
                      <div class="flex items-center gap-2">
                        <span class="rounded-full bg-spu-blue/10 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-spu-blue"
                              x-text="isAr ? page.lessonTypes[lesson.type]?.labelAr : page.lessonTypes[lesson.type]?.labelEn"></span>
                        <span class="text-[11px] font-semibold text-slate-400" x-text="`#${lesson.order}`"></span>
                      </div>
                      <h3 class="mt-2 text-[16px] font-bold text-spu-blue" x-text="isAr ? lesson.titleAr : lesson.titleEn"></h3>
                      <p class="mt-1 text-[13px] font-medium leading-6 text-slate-500" x-text="isAr ? lesson.descriptionAr : lesson.descriptionEn"></p>
                    </div>
                    <template x-if="lesson.pdfUrl">
                      <div class="flex flex-col gap-2">
                        <a :href="lesson.pdfUrl" target="_blank"
                           class="inline-flex items-center gap-1 rounded-[6px] bg-spu-blue px-3 py-1.5 text-[11px] font-bold text-white transition hover:bg-spu-blue/90">
                          <img src="/images/icon-file-text-outline.svg" alt="" class="h-3 w-3" aria-hidden="true">
                          <span x-text="page.label('viewPdf')"></span>
                        </a>
                        <a :href="lesson.pdfUrl" download
                           class="inline-flex items-center gap-1 rounded-[6px] bg-slate-200 px-3 py-1.5 text-[11px] font-bold text-slate-600 transition hover:bg-slate-300">
                          <img src="/images/icon-download-outline.svg" alt="" class="h-3 w-3" aria-hidden="true">
                          <span x-text="page.label('download')"></span>
                        </a>
                      </div>
                    </template>
                  </div>
                  <template x-if="!lesson.pdfUrl">
                    <p class="mt-3 text-[12px] font-semibold italic text-slate-400" x-text="page.label('noPdf')"></p>
                  </template>
                </div>
              </template>
            </div>
          </section>
        </div>
      </div>
    </template>

    <template x-if="!course">
      <div class="py-20 text-center">
        <img src="/images/icon-file-outline.svg" alt="" class="mx-auto h-16 w-16 text-slate-300" aria-hidden="true">
        <p class="mt-4 text-lg font-semibold text-slate-500" x-text="page.label('notFound')"></p>
        <a :href="page.studyPlanHref()"
           class="mt-6 inline-flex items-center gap-2 rounded-[6px] bg-spu-blue px-5 py-2.5 text-[13px] font-bold text-white transition hover:bg-spu-blue/90">
          <img src="/images/icon-arrow-left-outline.svg" alt="" class="h-3 w-3 rtl:rotate-180" aria-hidden="true">
          <span x-text="page.label('backToPlan')"></span>
        </a>
      </div>
    </template>
  </div>
</section>
