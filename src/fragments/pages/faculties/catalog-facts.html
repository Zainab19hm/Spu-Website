<!-- ═══════════════════════════════════════════════════════════════════
     Faculties Catalog — Facts/Stats Bar
     ═══════════════════════════════════════════════════════════════════ -->
<section x-show="$store.facultiesPage.catalogMode" x-cloak
         class="relative z-20 py-16 font-hacen" x-data="{
    facts: [
        { value: '24', labelEn: 'TOTAL PROGRAMS', labelAr: 'إجمالي البرامج' },
        { value: '7', labelEn: 'ACADEMIC DEPARTMENTS', labelAr: 'الأقسام الأكاديمية' },
        { value: '120', labelEn: 'FACULTY MEMBERS', labelAr: 'أعضاء هيئة التدريس' },
        { value: '5k+', labelEn: 'ENROLLED STUDENTS', labelAr: 'الطلاب المسجلين' }
    ]
}">
    <div class="container">
        <div class="relative mx-auto max-w-[1513px] overflow-hidden rounded-[4px] bg-spu-blue shadow-[0_20px_25px_-5px_rgba(0,0,0,0.1),0_8px_10px_-6px_rgba(0,0,0,0.1)]">
            <div class="grid grid-cols-2 lg:grid-cols-4">
                <template x-for="(fact, idx) in facts" :key="fact.labelEn">
                    <div class="relative flex flex-col items-center justify-center px-6 py-14 text-center">
                        <!-- Vertical divider -->
                        <div x-show="idx > 0"
                             class="absolute left-0 top-0 hidden h-full w-px bg-white/15 lg:block"
                             aria-hidden="true"></div>

                        <!-- Value -->
                        <span class="text-[64px] font-bold leading-[70px] tracking-[-1.28px] text-white"
                              :class="fact.value === '7' ? 'font-sans' : ''"
                              x-text="fact.value"></span>

                        <!-- Label -->
                        <div class="mt-2">
                            <span class="text-[12px] font-semibold uppercase leading-[12px] tracking-[0.6px] text-[#708AB5]"
                                  style="font-family: 'Inter', 'Public Sans', sans-serif;"
                                  x-text="$store.app.currentLang === 'ar' ? fact.labelAr : fact.labelEn"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</section>
