<section class="py-32 bg-slate-50 relative overflow-hidden" x-data>
    <div class="container mx-auto px-6 relative z-10">
        <div class="flex flex-col lg:flex-row gap-20 items-center">
            <div class="w-full lg:w-1/3">
                <h2 class="text-4xl font-bold text-spu-blue mb-6"
                    x-text="$store.app.currentLang === 'ar' ? 'مميزات الكلية' : 'Faculty Highlights'"></h2>
                <p class="text-lg text-slate-500 leading-relaxed"
                    x-text="$store.app.currentLang === 'ar' ? 'بيئة أكاديمية ديناميكية مصممة لدعم نمو الطلاب والتعلم العملي والنجاح المستقبلي.' : 'A dynamic academic environment designed to support student growth, practical learning, and future success.'">
                </p>
                <div class="mt-8 h-1 w-20 bg-spu-red rounded-full"></div>
            </div>

            <div class="w-full lg:w-2/3 grid grid-cols-1 md:grid-cols-2 gap-6">
                <template x-for="(item, index) in $store.facultiesPage.currentFaculty?.highlights" :key="index">
                    <div
                        class="group bg-white p-12 rounded-3xl shadow-[0_10px_40px_-15px_rgba(0,0,0,0.05)] border border-white hover:shadow-2xl hover:-translate-y-2 transition-all duration-500 flex items-center justify-center text-center">
                        <span class="text-xl font-bold text-spu-blue group-hover:text-spu-red transition-colors"
                            x-text="$store.app.currentLang === 'ar' ? item.ar : item.en"></span>
                    </div>
                </template>
            </div>
        </div>
    </div>
</section>
