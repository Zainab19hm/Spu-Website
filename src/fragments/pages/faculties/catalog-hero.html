<section x-show="$store.facultiesPage.catalogMode" x-cloak class="relative overflow-hidden bg-white font-hacen"
    :dir="$store.app.currentLang === 'ar' ? 'rtl' : 'ltr'"
    x-data="{
    catalogReady: false,
    get faculties() {
        const launchFacultyIds = ['medicine', 'dentistry', 'pharmacy', 'business', 'petroleum', 'ai-engineering', 'Construction'];
        const list = $store.faculties?.items?.list || [];
        return launchFacultyIds.map(id => list.find(f => f.id === id)).filter(Boolean);
    }
}" x-init="$nextTick(() => { setTimeout(() => catalogReady = true, 100) })">

    <div class="absolute inset-0">
        <!-- Left image panel with diagonal clip -->
        <div class="absolute inset-0" style="clip-path: polygon(0 0, 40% 0, 25% 100%, 0 100%);">
            <img src="/images/campus-feature-01.webp" alt="SPU Campus" class="h-full w-full object-cover">
            <div class="absolute inset-0 bg-spu-blue/70"></div>
        </div>

        <!-- Right white panel with diagonal clip -->
        <div class="absolute inset-0 bg-white" style="clip-path: polygon(40% 0, 100% 0, 100% 100%, 25% 100%);">
        </div>
    </div>

    <div class="container relative z-10 pt-20 lg:pt-28">
        <div class="flex flex-col lg:flex-row items-start gap-8 lg:gap-12">
            <!-- Left: Title + CTA -->
            <div class="w-full lg:w-[38%] pb-10 lg:pb-20" :class="$store.app.currentLang === 'ar' ? 'text-right' : 'text-left'">
                <h1 class="text-[clamp(2.5rem,5vw,3.8rem)] font-bold leading-[1.1] tracking-tight text-white"
                    x-text="$store.app.currentLang === 'ar' ? 'المرافق الأكاديمية' : 'Academic Facilities'">
                </h1>

                <div class="mt-10 flex flex-wrap items-center gap-4">
                    <a :href="'/admissions/how-to-apply.html'"
                        class="inline-flex h-[44px] items-center justify-center rounded-[6px] bg-spu-red px-7 text-[11px] font-bold uppercase tracking-[1.2px] text-white transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg">
                        <span x-text="$store.app.currentLang === 'ar' ? 'قدم الآن' : 'APPLY NOW'"></span>
                    </a>
                    <a href="javascript:void(0)"
                        @click="document.getElementById('faculties-overview')?.scrollIntoView({ behavior: 'smooth' })"
                        class="inline-flex h-[44px] items-center justify-center rounded-[4px] border border-white/50 bg-white/10 px-7 text-[13px] font-semibold text-white backdrop-blur-[6px] transition-all duration-300 hover:-translate-y-0.5 hover:border-white/70 hover:bg-white/15">
                        <span x-text="$store.app.currentLang === 'ar' ? 'استكشف خريطة الحرم' : 'Explore Campus Map'"></span>
                    </a>
                </div>
            </div>

            <!-- Right: Faculty cards -->
            <div class="w-full lg:w-[62%] hidden lg:block">
                <div class="flex flex-col gap-3">
                    <template x-for="(faculty, idx) in faculties" :key="faculty.id">
                        <a :href="'/facilities/?id=' + faculty.id"
                            class="group flex items-center rounded-[10px] bg-white p-5 shadow-[0_4px_20px_rgba(32,39,89,0.06)] transition-all duration-300 hover:-translate-y-0.5 hover:shadow-[0_8px_30px_rgba(32,39,89,0.1)]"
                            :style="`margin-${$store.app.currentLang === 'ar' ? 'right' : 'left'}: ${idx * 22}px`">

                            <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-spu-blue">
                                <span class="text-[22px] font-bold text-white" x-text="idx + 1"></span>
                            </div>

                            <div class="ms-5 me-4 flex-1 min-w-0" :class="$store.app.currentLang === 'ar' ? 'text-right' : 'text-left'">
                                <h3 class="text-xl font-bold leading-[1.3] text-spu-blue"
                                    x-text="$store.app.currentLang === 'ar' ? faculty.nameAr : faculty.nameEn">
                                </h3>
                                <p class="mt-1 text-[15px] leading-[1.5] text-[#46464F]"
                                    x-text="$store.app.currentLang === 'ar'
                                       ? (faculty.catalogDescAr || faculty.tabs?.[0]?.contentAr?.substring(0, 80) + '...')
                                       : (faculty.catalogDescEn || faculty.tabs?.[0]?.contentEn?.substring(0, 80) + '...')">
                                </p>
                            </div>

                            <span class="text-xl text-[#46464F] shrink-0 rtl:rotate-180">→</span>
                        </a>
                    </template>
                </div>
            </div>

            <!-- Mobile: Faculty cards -->
            <div class="w-full lg:hidden flex flex-col gap-3 pb-10">
                <template x-for="(faculty, idx) in faculties" :key="'m-' + faculty.id">
                    <a :href="'/facilities/?id=' + faculty.id"
                        class="flex items-center rounded-xl bg-white p-4 shadow-[0_4px_20px_rgba(32,39,89,0.06)] transition-all duration-300 hover:shadow-[0_8px_30px_rgba(32,39,89,0.1)]">
                        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-spu-blue"
                            :class="$store.app.currentLang === 'ar' ? 'ms-3' : 'me-3'">
                            <span class="text-lg font-bold text-white" x-text="idx + 1"></span>
                        </div>
                        <div class="flex-1 min-w-0" :class="$store.app.currentLang === 'ar' ? 'text-right' : 'text-left'">
                            <h3 class="text-base font-bold text-spu-blue truncate"
                                x-text="$store.app.currentLang === 'ar' ? faculty.nameAr : faculty.nameEn"></h3>
                            <p class="text-sm text-[#46464F] truncate mt-0.5"
                                x-text="$store.app.currentLang === 'ar'
                                   ? (faculty.catalogDescAr || faculty.tabs?.[0]?.contentAr?.substring(0, 50) + '...')
                                   : (faculty.catalogDescEn || faculty.tabs?.[0]?.contentEn?.substring(0, 50) + '...')">
                            </p>
                        </div>
                        <span class="text-xl text-[#46464F] rtl:rotate-180 ms-2">→</span>
                    </a>
                </template>
            </div>
        </div>
    </div>
</section>
