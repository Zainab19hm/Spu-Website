<section x-show="$store.facultiesPage.catalogMode" x-cloak
    class="relative z-20 bg-white py-14 font-hacen"
    :dir="$store.app.currentLang === 'ar' ? 'rtl' : 'ltr'"
    x-data="{
        get isAr() {
            return $store.app.currentLang === 'ar';
        },
        get facts() {
            return $store.facultiesPage.catalogPage?.facts || [];
        }
    }">
    <div class="container">
        <div class="mx-auto max-w-7xl overflow-hidden rounded-[4px] bg-spu-blue shadow-[0_18px_36px_rgba(9,17,68,0.18)]">
            <div class="grid grid-cols-2 lg:grid-cols-4">
                <template x-for="(fact, idx) in facts" :key="fact.labelEn">
                    <div class="relative flex min-h-[136px] flex-col items-center justify-center px-5 py-9 text-center sm:min-h-[168px]">
                        <div x-show="idx > 0"
                            class="absolute top-0 hidden h-full w-px bg-white/15 lg:block"
                            :class="isAr ? 'right-0' : 'left-0'"
                            aria-hidden="true"></div>

                        <span class="text-[clamp(2.5rem,6vw,4rem)] font-bold leading-none text-white">
                            <span x-text="fact.value.endsWith('+') ? fact.value.slice(0, -1) : fact.value"></span><span
                                x-show="fact.value.endsWith('+')"
                                class="text-spu-red">+</span>
                        </span>
                        <span class="mt-4 text-[11px] font-bold uppercase tracking-[0.16em] text-[#708AB5]"
                            x-text="isAr ? fact.labelAr : fact.labelEn"></span>
                    </div>
                </template>
            </div>
        </div>
    </div>
</section>
