<section x-show="$store.facultiesPage.catalogMode" x-cloak class="relative overflow-hidden bg-white font-hacen"
    :dir="$store.app.currentLang === 'ar' ? 'rtl' : 'ltr'" x-data="{
        get isAr() { return $store.app.currentLang === 'ar' },
        get content() { return $store.facultiesPage.catalogPage?.hero || {} },
        get faculties() {
            const list = $store.faculties?.items?.list || [];
            return (this.content.facultyOrder || [])
                .map(id => list.find(f => f.id === id))
                .filter(Boolean);
        },
        facultyTitle(f) {
            return this.isAr ? (f.catalogTitleAr || f.nameAr) : (f.catalogTitleEn || f.nameEn);
        },
        facultyDesc(f) {
            return this.isAr
                ? (f.catalogCardDescAr || f.catalogDescAr || f.tabs?.[0]?.contentAr || '')
                : (f.catalogCardDescEn || f.catalogDescEn || f.tabs?.[0]?.contentEn || '');
        },
        facultyColor(f) {
            const color = f.color || '202759';
            return color.startsWith('#') ? color : `#${color}`;
        },
        facultyCardStyle(f) {
            const color = this.facultyColor(f);
            const direction = this.isAr ? 'to left' : 'to right';
            return `background: linear-gradient(${direction}, #ffffff 0%, #ffffff 48%, ${color}24 100%); `;
        }
    }">

    <div class="absolute inset-0 hidden lg:block">
        <div class="absolute inset-y-0 bg-white"
            :class="isAr ? 'left-0 w-[65%]' : 'right-0 w-[65%]'"></div>

        <div class="absolute inset-y-0 overflow-hidden"
            :class="isAr ? 'right-0 w-[40%]' : 'left-0 w-[40%]'"
            :style="isAr
                ? 'width:45%;'
                : 'width:45%'">
            <img :src="content.image" alt="" class="h-full w-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-b from-spu-blue/45 via-spu-blue/30 to-black/45"></div>
        </div>
    </div>

    <div class="absolute inset-0 lg:hidden">
        <img :src="content.image" alt="" class="h-full w-full object-cover">
        <div class="absolute inset-0 bg-spu-blue/70"></div>
    </div>

    <!-- Content -->
    <div class="container relative z-10 grid min-h-[760px] gap-10 pb-5 pt-22 lg:items-center"
        dir="ltr"
        :class="isAr ? 'lg:grid-cols-[60%_40%]' : 'lg:grid-cols-[40%_60%]'">

        <!-- Image side title -->
        <div class="flex min-h-[360px] flex-col justify-end pb-12 text-white lg:min-h-[520px] lg:pb-40"
            :dir="isAr ? 'rtl' : 'ltr'"
            :class="isAr ? 'text-right lg:col-start-2 lg:row-start-1 lg:justify-self-end' : 'text-left '">

            <h1 class="max-w-[520px] text-[clamp(2.7rem,5vw,3rem)] font-bold leading-[1.05] text-white drop-shadow-[0_3px_14px_rgba(0,0,0,0.42)]"
                x-text="isAr ? content.titleAr : content.titleEn"></h1>

            <p x-show="isAr ? content.descAr : content.descEn"
                class="mt-6 max-w-md text-lg leading-8 text-white/90 drop-shadow"
                x-text="isAr ? content.descAr : content.descEn"></p>

            <div class="mt-8 flex flex-wrap gap-4" :class="isAr ? 'justify-start lg:justify-end' : ''">

                <a :href="content.applyHref"
                    class="inline-flex h-12 items-center justify-center rounded-[6px] bg-spu-red px-10 text-[12px] font-bold uppercase tracking-[1.2px] text-white shadow-lg shadow-spu-red/30 transition hover:-translate-y-0.5 hover:bg-[#a21d20]">
                    <span x-text="isAr ? content.applyLabelAr : content.applyLabelEn"></span>
                </a>

                <button type="button"
                    @click="document.getElementById('faculties-overview')?.scrollIntoView({ behavior: 'smooth' })"
                    class="inline-flex h-12 items-center justify-center rounded-[6px] border border-white/55 bg-white/10 px-10 text-[13px] font-semibold text-white backdrop-blur transition hover:-translate-y-0.5 hover:bg-white/20">
                    <span x-text="isAr ? content.campusMapLabelAr : content.campusMapLabelEn"></span>
                </button>
            </div>
        </div>

        <!-- Faculties gradient staircase -->
        <div class="relative flex flex-col gap-4 w-full lg:gap-5">

            <template x-for="(faculty, idx) in faculties" :key="faculty.id">
                <a :href="'/facilities/?id=' + faculty.id"
                    class="group grid min-h-[80px] w-full grid-cols-[auto_1fr_auto] items-center rounded-[10px] border border-white/70 bg-white px-6 py-4 text-spu-blue shadow-[0_12px_34px_rgba(32,39,89,0.10)] transition duration-300 hover:-translate-y-0.5 hover:shadow-[0_18px_44px_rgba(32,39,89,0.16)] sm:min-h-[90px] sm:px-8"
                    :style="facultyCardStyle(faculty)">

                    <div class="flex h-12 w-12 items-center justify-center rounded-full bg-spu-blue text-lg font-bold text-white sm:h-14 sm:w-14 sm:text-xl"
                        
                        x-text="idx + 1"></div>

                    <div class="min-w-0 px-5" :class="isAr ? ' text-right' : 'text-left'">
                        <h3 class="truncate text-lg font-bold leading-tight text-spu-blue sm:text-xl lg:text-2xl"
                            x-text="facultyTitle(faculty)"></h3>
                        <p class="mt-2 line-clamp-1 text-sm leading-6 text-[#46464F] sm:text-[15px]"
                            x-text="facultyDesc(faculty)"></p>
                    </div>

                    <span
                        class="text-2xl leading-none text-[#46464F] transition group-hover:translate-x-1 rtl:group-hover:-translate-x-1"
                        :class="isAr ? 'order-1 rotate-180' : ''">&rarr;</span>
                </a>
            </template>

        </div>

    </div>
</section>
