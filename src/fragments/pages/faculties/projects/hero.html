<section class="relative flex min-h-[315px] items-end overflow-hidden pt-28 font-hacen"
         x-data="{ get page() { return $store.facultyProjectsPage }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="absolute inset-0">
    <img :src="page.hero.image"
         alt="Syrian Private University campus"
         class="h-full w-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-t from-spu-blue/90 via-spu-blue/66 to-spu-blue/5"></div>
  </div>

  <div class="container relative z-10 pb-14 text-center text-white">
    <nav class="mb-3 flex items-center justify-center gap-2 text-[11px] font-semibold text-white/72">
      <a href="/" class="transition-colors hover:text-white"
         x-text="page.localized('labels', 'home')"></a>
      <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2 w-2 rtl:rotate-180" aria-hidden="true">
      <a href="/facilities/" class="transition-colors hover:text-white"
         x-text="page.localized('labels', 'faculty')"></a>
      <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-2 w-2 rtl:rotate-180" aria-hidden="true">
      <span x-text="page.currentText('faculty')"></span>
    </nav>

    <h1 class="text-[34px] font-bold leading-tight md:text-[42px]"
        x-text="isAr ? page.hero.titleAr : page.hero.titleEn"></h1>
  </div>
</section>
