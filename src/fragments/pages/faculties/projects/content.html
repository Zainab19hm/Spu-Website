<section class="bg-white py-16 font-hacen md:py-20"
         x-data="{ get page() { return $store.facultyProjectsPage }, get isAr() { return $store.app.currentLang === 'ar' } }">
  <div class="container">
    <div class="grid grid-cols-1 gap-7 md:grid-cols-2 xl:grid-cols-3">
      <template x-for="project in page.visibleProjects()" :key="project.id">
        <article :id="project.id"
                 class="overflow-hidden rounded-[6px] border border-slate-200 bg-white shadow-sm transition duration-300 hover:-translate-y-0.5 hover:shadow-md">
          <div class="relative aspect-[1.72] overflow-hidden bg-slate-100">
            <img :src="project.image"
                 :alt="isAr ? project.titleAr : project.titleEn"
                 class="h-full w-full object-cover transition duration-500 hover:scale-[1.03]">
            <span class="absolute left-3 top-3 rounded-[3px] bg-spu-red px-2 py-1 text-[10px] font-bold leading-none text-white rtl:left-auto rtl:right-3"
                  x-text="isAr ? project.tagAr : project.tagEn"></span>
          </div>

          <div class="p-6">
            <h2 class="min-h-[42px] text-[16px] font-bold leading-[21px] text-spu-blue"
                x-text="isAr ? project.titleAr : project.titleEn"></h2>
            <p class="mt-3 min-h-[44px] text-[13px] font-medium leading-[22px] text-slate-600"
               x-text="isAr ? project.summaryAr : project.summaryEn"></p>

            <div class="mt-6 border-t border-slate-100 pt-4">
              <dl class="space-y-3 text-[10px] font-bold uppercase tracking-[0.04em]">
                <div>
                  <dt class="text-slate-400" x-text="page.localized('labels', 'team')"></dt>
                  <dd class="mt-1 text-spu-blue" x-text="isAr ? project.teamAr : project.teamEn"></dd>
                </div>
                <div>
                  <dt class="text-slate-400" x-text="page.localized('labels', 'supervisor')"></dt>
                  <dd class="mt-1 text-spu-blue" x-text="isAr ? project.supervisorAr : project.supervisorEn"></dd>
                </div>
              </dl>

              <a :href="project.detailRoute"
                 class="mt-5 inline-flex items-center gap-2 text-[12px] font-bold text-spu-red transition hover:text-spu-blue">
                <span x-text="page.localized('labels', 'details')"></span>
                <img src="/images/icon-arrow-right-outline.svg" alt="" class="h-3 w-3 rtl:rotate-180" aria-hidden="true">
              </a>
            </div>
          </div>
        </article>
      </template>
    </div>

    <div class="mt-10 flex items-center justify-center gap-2">
      <button type="button"
              class="flex h-8 w-8 items-center justify-center rounded-[4px] border border-slate-200 text-spu-blue transition hover:border-spu-blue"
              :aria-label="page.localized('labels', 'previous')"
              @click="page.goToPage(page.currentPage - 1)">
        <img src="/images/icon-chevron-left-outline.svg" alt="" class="h-3 w-3 rtl:rotate-180" aria-hidden="true">
      </button>

      <template x-for="pageNumber in Array.from({ length: page.totalPages() }, (_, index) => index + 1)" :key="pageNumber">
        <button type="button"
                class="h-8 min-w-8 rounded-[4px] border px-3 text-[12px] font-bold transition"
                :class="page.currentPage === pageNumber ? 'border-spu-red bg-spu-red text-white' : 'border-slate-200 bg-white text-spu-blue hover:border-spu-blue'"
                @click="page.goToPage(pageNumber)"
                x-text="pageNumber"></button>
      </template>

      <button type="button"
              class="flex h-8 w-8 items-center justify-center rounded-[4px] border border-slate-200 text-spu-blue transition hover:border-spu-blue"
              :aria-label="page.localized('labels', 'next')"
              @click="page.goToPage(page.currentPage + 1)">
        <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-3 w-3 rtl:rotate-180" aria-hidden="true">
      </button>
    </div>
  </div>
</section>
