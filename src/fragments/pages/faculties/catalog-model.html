<!-- ═══════════════════════════════════════════════════════════════════
     Faculties Catalog — Academic Model Section
     "An Academic Model Built Around Practice and Research"
     ═══════════════════════════════════════════════════════════════════ -->
<section x-show="$store.facultiesPage.catalogMode" x-cloak
         id="faculties-overview" class="relative overflow-hidden py-24 font-hacen" style="background: rgba(234, 243, 255, 0.4);" x-data="{
    cards: [
        {
            titleEn: 'Clinical Learning',
            titleAr: 'التعلم السريري',
            descEn: 'Hands-on training supported by real academic, clinical, and professional environments.',
            descAr: 'تدريب عملي مدعوم ببيئات أكاديمية وسريرية ومهنية حقيقية.',
            featured: true,
            size: 'sm'
        },
        {
            titleEn: 'Applied Education',
            titleAr: 'التعليم التطبيقي',
            descEn: 'Programs designed to connect theoretical knowledge with practical skills and real-world problem solving.',
            descAr: 'برامج مصممة لربط المعرفة النظرية بالمهارات العملية وحل المشكلات الواقعية.',
            featured: false,
            size: 'sm'
        },
        {
            titleEn: 'Research-Led Teaching',
            titleAr: 'التدريس القائم على البحث',
            descEn: 'Learning shaped by academic inquiry, innovation, evidence-based knowledge, and research output.',
            descAr: 'تعلم يتشكل من خلال البحث الأكاديمي والابتكار والمعرفة القائمة على الأدلة.',
            featured: false,
            size: 'sm'
        },
        {
            titleEn: 'Professional Preparation',
            titleAr: 'الإعداد المهني',
            descEn: 'Academic pathways that prepare students for future careers, internships, advanced study, and professional practice.',
            descAr: 'مسارات أكاديمية تعد الطلاب للمهن المستقبلية والتدريب والدراسات المتقدمة والممارسة المهنية.',
            featured: false,
            size: 'lg'
        },
        {
            titleEn: 'Modern Learning Environments',
            titleAr: 'بيئات تعلم حديثة',
            descEn: 'Classrooms, laboratories, clinics, workshops, and digital spaces that support active learning.',
            descAr: 'فصول دراسية ومختبرات وعيادات وورش عمل ومساحات رقمية تدعم التعلم النشط.',
            featured: false,
            size: 'lg'
        }
    ]
}">
    <div class="container">
        <!-- Section heading -->
        <h2 class="mx-auto max-w-[864px] text-center text-[clamp(2rem,4vw,50px)] font-bold leading-[48px] text-[#091144]"
            x-text="$store.app.currentLang === 'ar'
                ? 'نموذج أكاديمي مبني على الممارسة والبحث'
                : 'An Academic Model Built Around Practice and Research'">
        </h2>

        <!-- Cards grid -->
        <div class="mx-auto mt-14 max-w-[1178px]">
            <!-- Top row: 3 small cards -->
            <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
                <template x-for="(card, idx) in cards.slice(0, 3)" :key="card.titleEn">
                    <div class="relative overflow-hidden rounded-[8px] p-10 text-center shadow-[0_4px_24px_rgba(32,39,89,0.06)] transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_12px_40px_rgba(32,39,89,0.1)]"
                         :class="card.featured
                             ? 'bg-spu-blue text-white lg:-mt-3'
                             : 'bg-white'">

                        <!-- Title -->
                        <h3 class="text-[28px] font-bold leading-[1.3]"
                            :class="card.featured ? 'text-white' : 'text-[#091144]'"
                            x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn">
                        </h3>

                        <!-- Description -->
                        <p class="mt-5 text-[18px] leading-[1.5]"
                           :class="card.featured ? 'text-white/90' : 'text-[#46464F]'"
                           x-text="$store.app.currentLang === 'ar' ? card.descAr : card.descEn">
                        </p>
                    </div>
                </template>
            </div>

            <!-- Bottom row: 2 wider cards -->
            <div class="mt-5 grid grid-cols-1 gap-5 lg:grid-cols-2">
                <template x-for="card in cards.slice(3)" :key="card.titleEn">
                    <div class="overflow-hidden rounded-[8px] bg-white p-10 text-center shadow-[0_4px_24px_rgba(32,39,89,0.06)] transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_12px_40px_rgba(32,39,89,0.1)]">

                        <!-- Title -->
                        <h3 class="text-[28px] font-bold leading-[1.3] text-[#091144]"
                            x-text="$store.app.currentLang === 'ar' ? card.titleAr : card.titleEn">
                        </h3>

                        <!-- Description -->
                        <p class="mt-5 text-[18px] leading-[1.5] text-[#46464F]"
                           x-text="$store.app.currentLang === 'ar' ? card.descAr : card.descEn">
                        </p>
                    </div>
                </template>
            </div>
        </div>
    </div>
</section>
