<section x-show="!$store.facultiesPage.catalogMode && $store.facultiesPage.currentFaculty?.highlights" x-cloak
         id="highlights"
         class="relative overflow-hidden bg-section py-20 font-hacen lg:py-28"
         x-data="{
             activeHighlight: 0,
             get items() {
                 return $store.facultiesPage.currentFaculty?.navigationCards || [];
             },
             get navigationCopy() {
                 return $store.facultiesPage.pageContent.navigation;
             },
             get slides() {
                 const groups = [];
                 for (let index = 0; index < this.items.length; index += 4) {
                     groups.push(this.items.slice(index, index + 4));
                 }
                 return groups;
             },
             get maxHighlight() {
                 return Math.max(this.slides.length - 1, 0);
             },
             nextHighlight() {
                 this.activeHighlight = this.activeHighlight >= this.maxHighlight ? 0 : this.activeHighlight + 1;
             },
             previousHighlight() {
                 this.activeHighlight = this.activeHighlight <= 0 ? this.maxHighlight : this.activeHighlight - 1;
             },
             localized(item, key) {
                 return $store.app.currentLang === 'ar' ? (item?.[`${key}Ar`] || item?.[`${key}En`] || '') : (item?.[`${key}En`] || item?.[`${key}Ar`] || '');
             },
             init() {
                 this.$watch('$store.facultiesPage.currentFaculty', () => {
                     this.activeHighlight = 0;
                 });
             }
         }">

    <div class="container relative z-10">
        <div class="flex flex-col items-start gap-12 lg:flex-row lg:items-center lg:gap-16">
            <div class="w-full shrink-0 lg:w-[38%]">
                <h3 class="text-[26px] font-bold leading-tight text-spu-blue md:text-[32px]"
                    x-text="$store.app.currentLang === 'ar'
                        ? $store.facultiesPage.currentFaculty?.highlights?.sectionTitleAr
                        : $store.facultiesPage.currentFaculty?.highlights?.sectionTitleEn">
                </h3>

                <p class="mt-5 max-w-[480px] text-[16px] leading-8 text-slate-600"
                   x-text="$store.app.currentLang === 'ar'
                       ? $store.facultiesPage.currentFaculty?.highlights?.sectionPAr
                       : $store.facultiesPage.currentFaculty?.highlights?.sectionPEn">
                </p>
            </div>

            <div class="w-full min-w-0 flex-1">
                <div class="overflow-hidden">
                    <div class="flex transition-transform duration-500 ease-out"
                         :style="`transform: translateX(${$store.app.currentLang === 'ar' ? activeHighlight * 100 : activeHighlight * -100}%);`">
                        <template x-for="(slide, slideIndex) in slides" :key="slideIndex">
                            <div class="grid w-full shrink-0 grid-cols-1 gap-4 sm:grid-cols-2">
                                <template x-for="item in slide" :key="item.id">
                                    <a :href="item.link"
                                       class="group relative flex h-[118px] flex-col items-center justify-center overflow-hidden rounded-[6px] border border-slate-200/70 bg-white p-6 text-center shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:bg-spu-blue hover:shadow-md"
                                       :aria-label="localized(item, 'title')">
                                        <h4 class="text-[17px] font-bold leading-tight text-spu-blue transition-colors duration-300 group-hover:text-white"
                                            x-text="localized(item, 'title')"></h4>
                                        <span class="mt-5 text-[8px] font-bold uppercase tracking-[0.22em] text-white opacity-0 transition-opacity duration-300 group-hover:opacity-100"
                                              x-text="localized(item, 'action') + ' ' + ($store.app.currentLang === 'ar' ? navigationCopy.suffixAr : navigationCopy.suffixEn)"></span>
                                    </a>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="mt-6 flex items-center justify-between gap-4">
                    <div class="flex items-center gap-2">
                        <template x-for="(_, idx) in Array.from({ length: maxHighlight + 1 })" :key="idx">
                            <button type="button"
                                    class="h-1.5 rounded-full transition-all duration-300"
                                    :class="activeHighlight === idx ? 'w-8 bg-spu-blue' : 'w-2 bg-spu-blue/20'"
                                    @click="activeHighlight = idx"
                                    :aria-label="($store.app.currentLang === 'ar' ? navigationCopy.ariaGroupAr : navigationCopy.ariaGroupEn) + ' ' + (idx + 1)"></button>
                        </template>
                    </div>

                    <div class="flex items-center gap-3">
                        <button type="button"
                                class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-white transition-colors hover:bg-slate-50"
                                @click="previousHighlight()"
                                :aria-label="$store.app.currentLang === 'ar' ? navigationCopy.previousAr : navigationCopy.previousEn">
                            <img src="/images/icon-chevron-left-outline.svg" alt="" class="h-3.5 w-3.5 rtl:rotate-180" aria-hidden="true">
                        </button>
                        <button type="button"
                                class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-white transition-colors hover:bg-slate-50"
                                @click="nextHighlight()"
                                :aria-label="$store.app.currentLang === 'ar' ? navigationCopy.nextAr : navigationCopy.nextEn">
                            <img src="/images/icon-chevron-right-outline.svg" alt="" class="h-3.5 w-3.5 rtl:rotate-180" aria-hidden="true">
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
