<section x-show="!$store.facultiesPage.catalogMode" x-cloak
         id="overview" class="bg-white py-16 font-hacen lg:py-24" x-data="{
        activeTab: 'overview',
        currentSlide: 0,
        slideInterval: null,
        isTransitioning: false,

        get facultyColor() {
            const color = $store.facultiesPage.currentFaculty?.color || '1e2652';
            return color.startsWith('#') ? color : '#' + color;
        },

        get galleryImages() {
            const f = $store.facultiesPage.currentFaculty;
            if (!f) return [];
            return f.sliderImages?.length ? f.sliderImages : [f.heroImage].filter(Boolean);
        },

        get overviewHref() {
            const slug = $store.facultiesPage.currentFaculty?.routeSlug;
            return slug ? `/facilities/${slug}/overview/` : '/facilities/';
        },

        init() {
            this.startAutoplay();
            this.$watch('$store.facultiesPage.currentFaculty', () => {
                this.currentSlide = 0;
                this.startAutoplay();
            });
        },

        startAutoplay() {
            if (this.slideInterval) clearInterval(this.slideInterval);
            this.slideInterval = setInterval(() => this.goTo((this.currentSlide + 1) % this.galleryImages.length), 5000);
        },

        goTo(idx) {
            if (idx === this.currentSlide || this.isTransitioning || this.galleryImages.length <= 1) return;
            this.isTransitioning = true;
            this.currentSlide = idx;
            setTimeout(() => { this.isTransitioning = false; }, 900);
            this.startAutoplay();
        }
    }">

    <div class="container">
        <div class="flex flex-col items-start gap-12 lg:flex-row lg:gap-20">

            <!-- ══════════════════════════════════════════════
                 Left: cinematic gallery
                 ══════════════════════════════════════════════ -->
            <div class="relative hidden w-full shrink-0 lg:block lg:w-[440px]"
                 @mouseenter="clearInterval(slideInterval)"
                 @mouseleave="startAutoplay()">

                <!-- Main viewport -->
                <div class="group relative aspect-[3/4] w-full overflow-hidden rounded-[20px]">

                    <!-- Image layers with clip-path wipe -->
                    <template x-for="(img, idx) in galleryImages" :key="img + idx">
                        <div class="absolute inset-0 transition-[clip-path] duration-[900ms] ease-[cubic-bezier(0.77,0,0.175,1)]"
                             :style="currentSlide === idx
                                 ? 'clip-path: inset(0 0 0 0); z-index: 2;'
                                 : (currentSlide > idx || (currentSlide === 0 && idx === galleryImages.length - 1 && idx !== 0))
                                     ? 'clip-path: inset(0 100% 0 0); z-index: 1;'
                                     : 'clip-path: inset(0 0 0 0); z-index: 0;'">
                            <img :src="img"
                                 alt="Faculty gallery"
                                 class="h-full w-full object-cover transition-transform duration-[5000ms] ease-out"
                                 :class="currentSlide === idx ? 'scale-105' : 'scale-100'">
                        </div>
                    </template>

                    <!-- Gradient overlay at bottom -->
                    <div class="pointer-events-none absolute inset-x-0 bottom-0 z-10 h-32 bg-gradient-to-t from-black/50 to-transparent"></div>

                    <!-- Counter (bottom-left) -->
                    <div class="absolute bottom-6 left-7 z-20 flex items-baseline gap-1.5">
                        <span class="text-[28px] font-bold leading-none text-white"
                              x-text="String(currentSlide + 1).padStart(2, '0')"></span>
                        <span class="text-xs font-bold text-white/40"
                              x-text="'/ ' + String(galleryImages.length).padStart(2, '0')"></span>
                    </div>

                    <!-- Vertical progress (right edge) -->
                    <div class="absolute bottom-6 right-5 top-6 z-20 flex w-[3px] flex-col justify-end overflow-hidden rounded-full bg-white/15">
                        <div class="w-full rounded-full bg-white transition-all duration-700 ease-out"
                             :style="`height: ${((currentSlide + 1) / galleryImages.length) * 100}%`"></div>
                    </div>
                </div>

                <!-- Horizontal thumbnail strip -->
                <div class="no-scrollbar mt-5 flex gap-3 overflow-x-auto pb-1">
                    <template x-for="(img, idx) in galleryImages" :key="'strip-' + idx">
                        <button @click="goTo(idx)"
                                class="relative h-[64px] w-[88px] shrink-0 overflow-hidden rounded-xl transition-all duration-500"
                                :class="currentSlide === idx
                                    ? 'ring-[2.5px] ring-offset-2 scale-100 opacity-100'
                                    : 'ring-0 ring-offset-0 scale-[0.96] opacity-40 hover:opacity-70'"
                                :style="currentSlide === idx ? `ring-color: ${facultyColor}` : ''"
                                :aria-label="'View image ' + (idx + 1)">
                            <img :src="img" alt="" class="h-full w-full object-cover">
                            <!-- Active indicator line -->
                            <div class="absolute inset-x-0 bottom-0 h-[3px] transition-all duration-500"
                                 :style="currentSlide === idx ? `background-color: ${facultyColor}; opacity: 1;` : 'opacity: 0;'"></div>
                        </button>
                    </template>
                </div>
            </div>

            <!-- ══════════════════════════════════════════════
                 Right: tabs + content
                 ══════════════════════════════════════════════ -->
            <div class="min-w-0 flex-1">

                <!-- Tab navigation — pill style -->
                <div class="flex flex-wrap gap-3">
                    <template x-for="tab in $store.facultiesPage.currentFaculty?.tabs" :key="tab.id">
                        <button @click="activeTab = tab.id"
                                class="relative rounded-full px-7 py-3 text-[15px] font-bold transition-all duration-300"
                                :style="activeTab === tab.id
                                    ? `background-color: ${facultyColor}; color: #fff; box-shadow: 0 4px 16px ${facultyColor}33;`
                                    : `background-color: transparent; color: ${facultyColor}; border: 1.5px solid #e2e8f0;`"
                                x-text="$store.app.currentLang === 'ar' ? tab.labelAr : tab.labelEn">
                        </button>
                    </template>
                </div>

                <!-- Content area -->
                <div class="mt-10">
                    <!-- Faculty name with accent line -->
                    <div class="flex items-center gap-4">
                        <div class="h-[3px] w-10 shrink-0 rounded-full"
                             :style="`background-color: ${facultyColor}`"></div>
                        <h2 class="text-[clamp(1.6rem,3.5vw,2.4rem)] font-bold leading-tight transition-colors duration-500"
                            :style="`color: ${facultyColor}`"
                            x-text="$store.app.currentLang === 'ar'
                                ? $store.facultiesPage.currentFaculty?.nameAr
                                : $store.facultiesPage.currentFaculty?.nameEn">
                        </h2>
                    </div>

                    <!-- Tab content with transition -->
                    <div class="mt-6 min-h-[140px]">
                        <template x-for="tab in $store.facultiesPage.currentFaculty?.tabs" :key="tab.id">
                            <div x-show="activeTab === tab.id"
                                 x-transition:enter="transition ease-out duration-300"
                                 x-transition:enter-start="opacity-0 translate-y-3"
                                 x-transition:enter-end="opacity-100 translate-y-0">
                                <p class="max-w-[680px] text-[20px] leading-[1.8] text-[#46464f]"
                                   x-text="$store.app.currentLang === 'ar' ? tab.contentAr : tab.contentEn">
                                </p>
                            </div>
                        </template>
                    </div>

                    <!-- CTA link -->
                    <div class="mt-8 border-t border-slate-100 pt-6">
                        <a :href="overviewHref" class="group inline-flex items-center gap-3 transition-all"
                           :style="`color: ${facultyColor}`">
                            <span class="text-base font-bold"
                                  x-text="$store.app.currentLang === 'ar' ? $store.facultiesPage.pageContent.hub.readMoreAr : $store.facultiesPage.pageContent.hub.readMoreEn"></span>
                            <img src="/images/icon-arrow-right-outline.svg" alt="" class="h-4 w-4 transition-transform duration-300 group-hover:translate-x-2"
                                 :class="$store.app.currentLang === 'ar' ? 'rotate-180 group-hover:-translate-x-2' : ''" aria-hidden="true">
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
