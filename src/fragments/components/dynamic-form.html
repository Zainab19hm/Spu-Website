<!-- Dynamic Form Component — reusable across the site -->
<!-- Supports both single-step and multi-step forms -->
<div x-data="{ get isAr() { return $store.app.currentLang === 'ar' } }">

    <!-- Success state -->
    <div x-show="$store.dynamicForm.submitted"
         x-transition:enter="transition duration-300 ease-out"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         class="rounded-2xl bg-green-50 p-8 text-center border border-green-200">
        <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-green-100">
            <svg class="h-8 w-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h3 class="text-xl font-bold text-green-800"
            x-text="isAr ? 'تم الإرسال بنجاح!' : 'Submitted Successfully!'"></h3>
        <p class="mt-2 text-sm text-green-600"
           x-text="isAr ? 'شكراً لك. تم استلام طلبك بنجاح.' : 'Thank you. Your application has been received successfully.'"></p>
        <button @click="$store.dynamicForm.close()"
                class="mt-6 inline-flex items-center gap-2 rounded-lg bg-green-600 px-6 py-2.5 text-sm font-bold text-white transition hover:bg-green-700"
                x-text="isAr ? 'إغلاق' : 'Close'"></button>
    </div>

    <!-- Multi-step form -->
    <div x-show="!$store.dynamicForm.submitted && $store.dynamicForm.isMultiStep">

        <!-- Progress bar -->
        <div class="mb-8">
            <div class="flex items-center justify-between">
                <template x-for="(step, idx) in $store.dynamicForm.schema?.steps || []" :key="idx">
                    <div class="flex flex-1 items-center"
                         :class="idx < ($store.dynamicForm.schema?.steps.length - 1) ? '' : ''">
                        <!-- Step circle -->
                        <button type="button"
                                @click="$store.dynamicForm.goToStep(idx)"
                                class="relative flex h-10 w-10 shrink-0 items-center justify-center rounded-full border-2 text-xs font-bold transition-all"
                                :class="idx === $store.dynamicForm.currentStep
                                    ? 'border-spu-red bg-spu-red text-white shadow-lg shadow-spu-red/30'
                                    : $store.dynamicForm.completedSteps.includes(idx)
                                        ? 'border-green-500 bg-green-500 text-white'
                                        : 'border-gray-300 bg-white text-gray-400'">
                            <!-- Check icon for completed -->
                            <template x-if="$store.dynamicForm.completedSteps.includes(idx) && idx !== $store.dynamicForm.currentStep">
                                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                                </svg>
                            </template>
                            <!-- Step number for current/pending -->
                            <template x-if="!$store.dynamicForm.completedSteps.includes(idx) || idx === $store.dynamicForm.currentStep">
                                <span x-text="idx + 1"></span>
                            </template>
                        </button>

                        <!-- Step label (hidden on mobile) -->
                        <span class="ms-2 hidden text-[11px] font-bold md:block"
                              :class="idx === $store.dynamicForm.currentStep ? 'text-spu-red' : $store.dynamicForm.completedSteps.includes(idx) ? 'text-green-600' : 'text-gray-400'"
                              x-text="isAr ? step.titleAr : step.titleEn"></span>

                        <!-- Connector line -->
                        <div x-show="idx < ($store.dynamicForm.schema?.steps.length - 1)"
                             class="mx-2 hidden h-0.5 flex-1 md:block"
                             :class="$store.dynamicForm.completedSteps.includes(idx) ? 'bg-green-500' : 'bg-gray-200'"></div>
                    </div>
                </template>
            </div>

            <!-- Step title (mobile) -->
            <div class="mt-4 text-center md:hidden">
                <p class="text-sm font-bold text-spu-blue"
                   x-text="isAr ? $store.dynamicForm.currentStepSchema?.titleAr : $store.dynamicForm.currentStepSchema?.titleEn"></p>
                <p class="mt-1 text-xs text-gray-500">
                    <span x-text="$store.dynamicForm.currentStep + 1"></span> / <span x-text="$store.dynamicForm.totalSteps"></span>
                </p>
            </div>
        </div>

        <!-- Current step header (desktop) -->
        <div class="mb-6 hidden md:block">
            <h3 class="text-lg font-bold text-spu-blue"
                x-text="isAr ? $store.dynamicForm.currentStepSchema?.titleAr : $store.dynamicForm.currentStepSchema?.titleEn"></h3>
            <p class="mt-1 text-xs text-gray-500" x-text="isAr ? 'الخطوة ' + ($store.dynamicForm.currentStep + 1) + ' من ' + $store.dynamicForm.totalSteps : 'Step ' + ($store.dynamicForm.currentStep + 1) + ' of ' + $store.dynamicForm.totalSteps"></p>
        </div>

        <!-- Step fields -->
        <form @submit.prevent="$store.dynamicForm.handleSubmit($event)" class="space-y-5">
            <div class="grid gap-5 sm:grid-cols-2">
                <template x-for="field in $store.dynamicForm.currentStepFields" :key="field.name">
                    <div :class="field.type === 'textarea' || field.type === 'checkbox' ? 'sm:col-span-2' : ''">

                        <!-- Text / Email / Tel / Number / Date inputs -->
                        <template x-if="['text', 'email', 'tel', 'number', 'date'].includes(field.type)">
                            <div>
                                <label class="text-xs font-bold uppercase tracking-wide text-gray-700">
                                    <span x-text="isAr ? field.labelAr : field.labelEn"></span>
                                    <span x-show="field.required" class="ms-0.5 text-spu-red">*</span>
                                </label>
                                <input :type="field.type"
                                       :value="$store.dynamicForm.formData[field.name]"
                                       @input="$store.dynamicForm.formData[field.name] = $event.target.value"
                                       :placeholder="isAr ? (field.placeholderAr || '') : (field.placeholderEn || '')"
                                       :class="$store.dynamicForm.errors[field.name] ? 'border-red-400 focus:border-red-500 focus:ring-red-100' : ''"
                                       class="w-full rounded-lg border border-gray-200 bg-white px-4 py-3 text-sm outline-none transition-all focus:border-spu-red focus:ring-2 focus:ring-spu-red/10">
                                <p x-show="$store.dynamicForm.errors[field.name]"
                                   class="mt-1 text-xs text-red-500"
                                   x-text="isAr ? 'هذا الحقل مطلوب' : 'This field is required'"></p>
                            </div>
                        </template>

                        <!-- File input -->
                        <template x-if="field.type === 'file'">
                            <div>
                                <label class="text-xs font-bold uppercase tracking-wide text-gray-700">
                                    <span x-text="isAr ? field.labelAr : field.labelEn"></span>
                                    <span x-show="field.required" class="ms-0.5 text-spu-red">*</span>
                                </label>
                                <div class="mt-1 flex items-center justify-center w-full">
                                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer transition-colors"
                                           :class="$store.dynamicForm.errors[field.name] ? 'border-red-400 bg-red-50' : 'border-gray-300 bg-gray-50 hover:border-spu-red hover:bg-spu-red/5'">
                                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                            <svg class="mb-2 h-8 w-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                                            </svg>
                                            <p class="mb-1 text-xs text-gray-500">
                                                <span x-text="isAr ? 'اضغط للرفع' : 'Click to upload'"></span>
                                            </p>
                                            <p class="text-[10px] text-gray-400" x-text="field.accept ? 'Allowed: ' + field.accept : 'PDF, DOC, DOCX'"></p>
                                        </div>
                                        <input type="file" class="hidden"
                                               :accept="field.accept || '.pdf,.doc,.docx'"
                                               @change="$store.dynamicForm.formData[field.name] = $event.target.files[0]?.name || ''">
                                    </label>
                                </div>
                                <p x-show="$store.dynamicForm.formData[field.name]"
                                   class="mt-2 flex items-center gap-1.5 text-xs text-green-600">
                                    <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                    <span x-text="$store.dynamicForm.formData[field.name]"></span>
                                </p>
                                <p x-show="$store.dynamicForm.errors[field.name]"
                                   class="mt-1 text-xs text-red-500"
                                   x-text="isAr ? 'هذا الحقل مطلوب' : 'This field is required'"></p>
                            </div>
                        </template>

                        <!-- Select -->
                        <template x-if="field.type === 'select'">
                            <div>
                                <label class="text-xs font-bold uppercase tracking-wide text-gray-700">
                                    <span x-text="isAr ? field.labelAr : field.labelEn"></span>
                                    <span x-show="field.required" class="ms-0.5 text-spu-red">*</span>
                                </label>
                                <select @change="$store.dynamicForm.formData[field.name] = $event.target.value"
                                        :class="$store.dynamicForm.errors[field.name] ? 'border-red-400 focus:border-red-500 focus:ring-red-100' : ''"
                                        class="w-full rounded-lg border border-gray-200 bg-white px-4 py-3 text-sm outline-none transition-all focus:border-spu-red focus:ring-2 focus:ring-spu-red/10">
                                    <template x-for="opt in field.options || []" :key="opt.value">
                                        <option :value="opt.value"
                                                :selected="$store.dynamicForm.formData[field.name] === opt.value"
                                                x-text="isAr ? opt.labelAr : opt.labelEn"></option>
                                    </template>
                                </select>
                                <p x-show="$store.dynamicForm.errors[field.name]"
                                   class="mt-1 text-xs text-red-500"
                                   x-text="isAr ? 'هذا الحقل مطلوب' : 'This field is required'"></p>
                            </div>
                        </template>

                        <!-- Textarea -->
                        <template x-if="field.type === 'textarea'">
                            <div>
                                <label class="text-xs font-bold uppercase tracking-wide text-gray-700">
                                    <span x-text="isAr ? field.labelAr : field.labelEn"></span>
                                    <span x-show="field.required" class="ms-0.5 text-spu-red">*</span>
                                </label>
                                <textarea :rows="field.rows || 4"
                                          :value="$store.dynamicForm.formData[field.name]"
                                          @input="$store.dynamicForm.formData[field.name] = $event.target.value"
                                          :placeholder="isAr ? (field.placeholderAr || '') : (field.placeholderEn || '')"
                                          :class="$store.dynamicForm.errors[field.name] ? 'border-red-400 focus:border-red-500 focus:ring-red-100' : ''"
                                          class="w-full resize-none rounded-lg border border-gray-200 bg-white px-4 py-3 text-sm outline-none transition-all focus:border-spu-red focus:ring-2 focus:ring-spu-red/10"></textarea>
                                <p x-show="$store.dynamicForm.errors[field.name]"
                                   class="mt-1 text-xs text-red-500"
                                   x-text="isAr ? 'هذا الحقل مطلوب' : 'This field is required'"></p>
                            </div>
                        </template>

                        <!-- Checkbox -->
                        <template x-if="field.type === 'checkbox'">
                            <div>
                                <label class="flex items-start gap-3 cursor-pointer">
                                    <input type="checkbox"
                                           :checked="$store.dynamicForm.formData[field.name]"
                                           @change="$store.dynamicForm.formData[field.name] = $event.target.checked"
                                           class="mt-0.5 h-4 w-4 rounded border-gray-300 text-spu-red focus:ring-spu-red/20">
                                    <span class="text-sm text-gray-700">
                                        <span x-text="isAr ? field.labelAr : field.labelEn"></span>
                                        <span x-show="field.required" class="ms-0.5 text-spu-red">*</span>
                                    </span>
                                </label>
                                <p x-show="$store.dynamicForm.errors[field.name]"
                                   class="mt-1 text-xs text-red-500"
                                   x-text="isAr ? 'هذا الحقل مطلوب' : 'This field is required'"></p>
                            </div>
                        </template>

                    </div>
                </template>
            </div>

            <!-- Navigation buttons -->
            <div class="flex items-center justify-between pt-4 border-t border-gray-100">
                <button type="button"
                        x-show="$store.dynamicForm.currentStep > 0"
                        @click="$store.dynamicForm.prevStep()"
                        class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-5 py-2.5 text-sm font-bold text-gray-700 transition hover:bg-gray-50">
                    <svg class="h-4 w-4 rtl:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    <span x-text="isAr ? 'السابق' : 'Previous'"></span>
                </button>
                <div x-show="$store.dynamicForm.currentStep === 0"></div>

                <button type="submit"
                        :disabled="$store.dynamicForm.submitting"
                        class="inline-flex items-center gap-2 rounded-lg bg-spu-red px-6 py-3 text-sm font-bold text-white transition-all hover:bg-spu-red/90 hover:shadow-lg active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed">
                    <span x-show="$store.dynamicForm.currentStep < $store.dynamicForm.totalSteps - 1 && !$store.dynamicForm.submitting">
                        <span x-text="isAr ? 'التالي' : 'Next'"></span>
                        <svg class="h-4 w-4 rtl:rotate-180 inline-block ms-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </span>
                    <span x-show="$store.dynamicForm.currentStep === $store.dynamicForm.totalSteps - 1 && !$store.dynamicForm.submitting"
                          x-text="isAr ? ($store.dynamicForm.schema?.submitLabelAr || 'إرسال') : ($store.dynamicForm.schema?.submitLabelEn || 'Submit')"></span>
                    <span x-show="$store.dynamicForm.submitting" class="inline-flex items-center gap-2">
                        <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        <span x-text="isAr ? 'جاري الإرسال...' : 'Submitting...'"></span>
                    </span>
                </button>
            </div>
        </form>
    </div>

    <!-- Single-step form (original) -->
    <div x-show="!$store.dynamicForm.submitted && !$store.dynamicForm.isMultiStep">
        <form @submit.prevent="$store.dynamicForm.handleSubmit($event)" class="space-y-5">
            <template x-for="field in $store.dynamicForm.schema?.fields || []" :key="field.name">
                <div class="space-y-2">

                    <!-- Text / Email / Tel / Number / Date inputs -->
                    <template x-if="['text', 'email', 'tel', 'number', 'date'].includes(field.type)">
                        <div>
                            <label class="text-xs font-bold uppercase tracking-wide text-gray-700">
                                <span x-text="isAr ? field.labelAr : field.labelEn"></span>
                                <span x-show="field.required" class="ms-0.5 text-spu-red">*</span>
                            </label>
                            <input :type="field.type"
                                   :value="$store.dynamicForm.formData[field.name]"
                                   @input="$store.dynamicForm.formData[field.name] = $event.target.value"
                                   :placeholder="isAr ? (field.placeholderAr || '') : (field.placeholderEn || '')"
                                   :class="$store.dynamicForm.errors[field.name] ? 'border-red-400 focus:border-red-500 focus:ring-red-100' : ''"
                                   class="w-full rounded-lg border border-gray-200 bg-white px-4 py-3 text-sm outline-none transition-all focus:border-spu-red focus:ring-2 focus:ring-spu-red/10">
                            <p x-show="$store.dynamicForm.errors[field.name]"
                               class="mt-1 text-xs text-red-500"
                               x-text="isAr ? 'هذا الحقل مطلوب' : 'This field is required'"></p>
                        </div>
                    </template>

                    <!-- Select -->
                    <template x-if="field.type === 'select'">
                        <div>
                            <label class="text-xs font-bold uppercase tracking-wide text-gray-700">
                                <span x-text="isAr ? field.labelAr : field.labelEn"></span>
                                <span x-show="field.required" class="ms-0.5 text-spu-red">*</span>
                            </label>
                            <select @change="$store.dynamicForm.formData[field.name] = $event.target.value"
                                    :class="$store.dynamicForm.errors[field.name] ? 'border-red-400 focus:border-red-500 focus:ring-red-100' : ''"
                                    class="w-full rounded-lg border border-gray-200 bg-white px-4 py-3 text-sm outline-none transition-all focus:border-spu-red focus:ring-2 focus:ring-spu-red/10">
                                <template x-for="opt in field.options || []" :key="opt.value">
                                    <option :value="opt.value"
                                            x-text="isAr ? opt.labelAr : opt.labelEn"></option>
                                </template>
                            </select>
                            <p x-show="$store.dynamicForm.errors[field.name]"
                               class="mt-1 text-xs text-red-500"
                               x-text="isAr ? 'هذا الحقل مطلوب' : 'This field is required'"></p>
                        </div>
                    </template>

                    <!-- Textarea -->
                    <template x-if="field.type === 'textarea'">
                        <div>
                            <label class="text-xs font-bold uppercase tracking-wide text-gray-700">
                                <span x-text="isAr ? field.labelAr : field.labelEn"></span>
                                <span x-show="field.required" class="ms-0.5 text-spu-red">*</span>
                            </label>
                            <textarea rows="4"
                                      :value="$store.dynamicForm.formData[field.name]"
                                      @input="$store.dynamicForm.formData[field.name] = $event.target.value"
                                      :placeholder="isAr ? (field.placeholderAr || '') : (field.placeholderEn || '')"
                                      :class="$store.dynamicForm.errors[field.name] ? 'border-red-400 focus:border-red-500 focus:ring-red-100' : ''"
                                      class="w-full resize-none rounded-lg border border-gray-200 bg-white px-4 py-3 text-sm outline-none transition-all focus:border-spu-red focus:ring-2 focus:ring-spu-red/10"></textarea>
                            <p x-show="$store.dynamicForm.errors[field.name]"
                               class="mt-1 text-xs text-red-500"
                               x-text="isAr ? 'هذا الحقل مطلوب' : 'This field is required'"></p>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Submit -->
            <button type="submit"
                    :disabled="$store.dynamicForm.submitting"
                    class="w-full rounded-lg bg-spu-red px-8 py-4 font-bold text-white transition-all hover:bg-spu-red/90 hover:shadow-lg active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed">
                <span x-show="!$store.dynamicForm.submitting"
                      x-text="isAr ? ($store.dynamicForm.schema?.submitLabelAr || 'إرسال') : ($store.dynamicForm.schema?.submitLabelEn || 'Submit')"></span>
                <span x-show="$store.dynamicForm.submitting" class="inline-flex items-center gap-2">
                    <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                    <span x-text="isAr ? 'جاري الإرسال...' : 'Submitting...'"></span>
                </span>
            </button>
        </form>
    </div>
</div>
